name: Thomson Reuters Vocabulary
description: >-
  Domain vocabulary for Thomson Reuters legal, tax, risk, and trade APIs
  covering Westlaw, Checkpoint, ONESOURCE, HighQ, Legal Tracker, and
  Risk and Fraud solutions.
version: '1.0'
created: '2026-05-03'
modified: '2026-05-03'
tags:
  - Legal
  - Tax
  - Risk
  - Compliance

terms:
  - term: Westlaw
    definition: >-
      Thomson Reuters' flagship legal research database providing access to
      case law, statutes, regulations, secondary sources, and litigation analytics.
    related:
      - Case Law
      - Litigation Analytics
      - Legal Research
    tags:
      - Legal
      - Research

  - term: Checkpoint
    definition: >-
      Thomson Reuters' tax and accounting research platform providing expert
      analysis, guidance, and primary source materials for tax professionals.
    related:
      - Tax Research
      - Accounting
    tags:
      - Tax
      - Accounting

  - term: ONESOURCE
    definition: >-
      Thomson Reuters' suite of tax compliance software covering corporate
      income tax, indirect tax, transfer pricing, and global trade management.
    related:
      - Tax Compliance
      - Transfer Pricing
      - Global Trade
    tags:
      - Tax
      - Compliance

  - term: HighQ
    definition: >-
      Thomson Reuters' legal collaboration and document management platform
      enabling document synchronization, client portals, and matter management.
    related:
      - Document Management
      - Legal Collaboration
    tags:
      - Legal
      - Document Management

  - term: Legal Tracker
    definition: >-
      Thomson Reuters' legal matter management and e-billing platform for
      corporate legal departments to manage outside counsel and legal spend.
    related:
      - Matter Management
      - E-billing
      - Legal Spend
    tags:
      - Legal
      - E-billing

  - term: KYC
    definition: >-
      Know Your Customer - the process of verifying a customer's identity to
      comply with anti-money laundering and regulatory requirements.
    related:
      - AML
      - Identity Verification
      - Compliance
    tags:
      - Risk
      - Compliance

  - term: AML
    definition: >-
      Anti-Money Laundering - regulations and procedures designed to prevent
      criminals from disguising illegally obtained funds as legitimate income.
    related:
      - KYC
      - Risk Assessment
      - Compliance
    tags:
      - Risk
      - Compliance

  - term: Adverse Media Screening
    definition: >-
      The process of searching news and media sources for negative information
      about individuals or entities as part of due diligence.
    related:
      - KYC
      - Risk Assessment
    tags:
      - Risk
      - Fraud

  - term: Litigation Analytics
    definition: >-
      Data-driven insights from court records analyzing judge behavior, attorney
      performance, and case outcomes to inform litigation strategy.
    related:
      - Westlaw
      - Case Law
    tags:
      - Legal
      - Analytics

  - term: Transfer Pricing
    definition: >-
      The rules governing pricing of transactions between related business
      entities in different tax jurisdictions to comply with arm's length standards.
    related:
      - ONESOURCE
      - Tax Compliance
    tags:
      - Tax
      - Compliance

  - term: Matter
    definition: >-
      A specific legal case or project tracked within Legal Tracker,
      encompassing all related invoices, budgets, and activities.
    related:
      - Legal Tracker
      - Invoice
    tags:
      - Legal
      - Matter Management
