components:
  schemas:
    RoutingSummary:
      type: object
      properties:
        responsibleField:
          type: string
          nullable: true
          default: ''
        value:
          type: string
          nullable: true
          default: ''
      additionalProperties: false
    Filing:
      type: object
      properties:
        workflowName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        statusName:
          type: string
          nullable: true
      additionalProperties: false
    DeletedWorkflowsRequest:
      type: object
      properties:
        drawerId:
          type: string
        deletedDates:
          type: string
        pageNumber:
          type: string
        pageSize:
          type: string
      additionalProperties: false
    RoutingHistoryByFilingIdsRequest:
      type: object
      properties:
        filingIds:
          type: array
          items:
            type: integer
            format: int32
          nullable: true
          default: []
      additionalProperties: false
    DeleteWorkflowResponse:
      type: object
      properties:
        isDeleted:
          type: boolean
        filingId:
          type: string
          nullable: true
      additionalProperties: false
    WorkflowDataV2:
      required:
      - filingId
      type: object
      properties:
        filingId:
          type: integer
          format: int32
          default: 0
        headers:
          $ref: '#/components/schemas/Header'
        deliverable:
          type: array
          items:
            $ref: '#/components/schemas/Deliverable'
        notes:
          $ref: '#/components/schemas/NoteRequest'
        filing:
          $ref: '#/components/schemas/Filing'
        informationFields:
          type: array
          items:
            $ref: '#/components/schemas/InformationFields'
        deliveryInstructions:
          $ref: '#/components/schemas/DeliveryInstruction'
        routingSummary:
          type: array
          items:
            $ref: '#/components/schemas/RoutingSummary'
        reIndexDocs:
          type: boolean
          default: false
          nullable: true
      additionalProperties: false
    WorkflowResponse:
      type: object
      properties:
        filingId:
          type: integer
          format: int32
        errorComment:
          type: string
          nullable: true
        status:
          type: boolean
        errorMessage:
          type: array
          items:
            $ref: '#/components/schemas/ErrorMessage'
          nullable: true
      additionalProperties: false
    ErrorMessage:
      type: object
      properties:
        name:
          type: string
          nullable: true
        status:
          type: boolean
          nullable: true
        errorComment:
          type: string
          nullable: true
      additionalProperties: false
    RoutingHistoryByFilingIdsResponse:
      type: object
      properties:
        filingId:
          type: integer
          format: int32
        routingHistory:
          type: array
          items:
            $ref: '#/components/schemas/RoutingDTO'
          nullable: true
          additionalProperties: false
        responseMessage:
          type: string
      additionalProperties: false
    AddWorkflowV2:
      required:
      - drawer
      - serviceType
      type: object
      properties:
        drawer:
          type: string
        serviceType:
          type: string
        folderId:
          type: string
          nullable: true
        headers:
          $ref: '#/components/schemas/Header'
        filing:
          $ref: '#/components/schemas/Filing'
        deliverable:
          type: array
          items:
            $ref: '#/components/schemas/Deliverable'
        informationFields:
          type: array
          items:
            $ref: '#/components/schemas/InformationFields'
        notes:
          $ref: '#/components/schemas/NoteRequest'
        deliveryInstructions:
          $ref: '#/components/schemas/DeliveryInstruction'
        routingSummary:
          type: array
          items:
            $ref: '#/components/schemas/RoutingSummary'
      additionalProperties: false
    DeliveryInstructionCriteria:
      required:
      - drawerName
      - pageNumber
      - pageSize
      - serviceType
      type: object
      properties:
        drawerName:
          type: string
          default: clients
        serviceType:
          type: string
          default: Tax
        pageNumber:
          type: integer
          format: int32
          default: 1
        pageSize:
          type: integer
          format: int32
          default: 10
      additionalProperties: false
    InformationFields:
      type: object
      properties:
        name:
          type: string
          nullable: true
          default: ''
        value:
          type: string
          nullable: true
          default: ''
      additionalProperties: false
    NoteRequest:
      type: object
      properties:
        action:
          type: string
          nullable: true
          default: add new note
        noteType:
          type: string
          nullable: true
          default: ''
        noteId:
          type: array
          items:
            type: integer
            format: int32
          nullable: true
          default: []
        note:
          type: string
          nullable: true
          default: ''
      additionalProperties: false
    RoutingDTO:
      type: object
      properties:
        workFlowName:
          type: string
          nullable: true
        step:
          type: string
          nullable: true
        assignedTo:
          type: string
          nullable: true
        assignedBy:
          type: string
          nullable: true
        assignedDateTime:
          type: string
          nullable: true
        completedDateTime:
          type: string
          nullable: true
      additionalProperties: false
    RoutingHistoryResponse:
      type: array
      items:
        $ref: '#/components/schemas/RoutingDTO'
      nullable: true
      additionalProperties: false
    Deliverable:
      type: object
      properties:
        action:
          type: string
          nullable: true
          default: ''
        currentDueDate:
          type: string
          nullable: true
          default: ''
        originalDueDate:
          type: string
          nullable: true
          default: ''
        form:
          type: string
          nullable: true
          default: ''
      additionalProperties: false
    DeleteWorkflowCritria:
      required:
      - filingId
      type: object
      properties:
        filingId:
          minLength: 1
          type: array
          items:
            type: integer
            format: int32
      additionalProperties: false
    DeliveryInstructions:
      type: object
      properties:
        filingId:
          type: integer
          format: int32
        delivery:
          type: string
          nullable: true
        destination:
          type: string
          nullable: true
        sourceDocument:
          type: boolean
          nullable: true
      additionalProperties: false
    DeletedWorkFlow:
      type: object
      properties:
        serviceTypeName:
          type: string
          nullable: true
        clientName:
          type: string
          nullable: true
        clientNumber:
          type: string
          nullable: true
        engagement:
          type: string
          nullable: true
        year:
          type: string
          nullable: true
        periodEnd:
          type: string
          nullable: true
        filingId:
          type: string
          nullable: true
        workFlow:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        deletedDate:
          type: string
          nullable: true
      additionalProperties: false
    WorkflowStepResponse:
      type: object
      properties:
        serviceName:
          type: string
        workFlow:
          type: string
        workFlowSteps:
          type: array
          items:
            type: string
      additionalProperties: false
    DeletedWorkFlowsResult:
      type: object
      properties:
        totalRecords:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        deletedWorkFlows:
          type: array
          items:
            $ref: '#/components/schemas/DeletedWorkFlow'
          nullable: true
      additionalProperties: false
    DeliveryInstruction:
      type: object
      properties:
        delivery:
          type: string
          nullable: true
          default: ''
        destination:
          type: string
          nullable: true
          default: ''
        sourceDocument:
          type: string
          nullable: true
          default: 'true'
      additionalProperties: false
    DeletedDeliverableWorkFlow:
      type: object
      properties:
        filingId:
          type: string
          nullable: true
        deliverableName:
          type: string
          nullable: true
        serviceTypeName:
          type: string
          nullable: true
        clientName:
          type: string
          nullable: true
        clientNumber:
          type: string
          nullable: true
        engagement:
          type: string
          nullable: true
        year:
          type: string
          nullable: true
        periodEnd:
          type: string
          nullable: true
        workFlow:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        deletedDate:
          type: string
          nullable: true
      additionalProperties: false
    WorkflowData:
      required:
      - filingId
      type: object
      properties:
        filingId:
          type: integer
          format: int32
