openapi: 3.2.0
info:
  title: Thomson Reuters Workflow API
  version: v1
  description: 'Operations tagged Workflow across 3 of this provider''s published API definitions: thomson-reuters-firmflow-web-api-services-v1-openapi.json, thomson-reuters-firmflow-web-api-services-openapi.yml, thomson-reuters-firmflow-web-api-services-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.thomsonreuters.com/gofileroom
tags:
- name: Workflow
paths:
  /firmflow/api/V1/Workflow/CreateWorkflow:
    post:
      security:
      - ApiKeyAuth: []
      tags:
      - Workflow
      summary: Create a new workflow
      description: Creates a new workflow based on the provided criteria.
      parameters:
      - name: X-TR-API-APP-ID
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkflow'
          text/json:
            schema:
              $ref: '#/components/schemas/AddWorkflow'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AddWorkflow'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
      operationId: postFirmflowApiV1WorkflowCreateWorkflow
      x-operation-id-source: derived
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /firmflow/api/V1/Workflow/DeleteWorkflow:
    delete:
      security:
      - ApiKeyAuth: []
      tags:
      - Workflow
      summary: Delete a workflow
      description: Deletes a workflow based on the provided filing ID.
      parameters:
      - name: X-TR-API-APP-ID
        in: header
        required: true
        schema:
          type: string
      - name: filingId
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowResponse'
      operationId: deleteFirmflowApiV1WorkflowDeleteWorkflow
      x-operation-id-source: derived
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /firmflow/api/V1/Workflow/DeleteWorkflows:
    post:
      security:
      - ApiKeyAuth: []
      tags:
      - Workflow
      summary: Delete multiple workflows
      description: Deletes multiple workflows based on the provided criteria.
      parameters:
      - name: X-TR-API-APP-ID
        in: header
        required: true
        schema:
          type: string
      requestBody:
