            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowResponse'
      operationId: postFirmflowApiV1WorkflowDeleteWorkflows
      x-operation-id-source: derived
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /firmflow/api/V1/Workflow/EditWorkflow:
    post:
      security:
      - ApiKeyAuth: []
      tags:
