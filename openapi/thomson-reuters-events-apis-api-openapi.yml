info:
  title: Thomson Reuters Events APIs API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Events APIs across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Events APIs
paths:
  /{version}/event:
    post:
      tags:
      - Events APIs
      summary: Add Event
      description: 'Method to Add Event

        This method is supported in version 5 of the API and above'
      operationId: addEvent
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '5'
      - name: siteid
        in: query
        description: site id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event Added successfully
        '201':
          description: Event Added successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Event'
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Problem with parameters in add event
        '401':
          description: Unauthorised in add event
        '403':
          description: Validation failed | Forbidden in add event
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while adding event
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Event'
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
    servers:
    - url: /monumentuat/api
  /{version}/event/create:
    post:
      tags:
      - Events APIs
      summary: Create Event
      description: 'Method to Create Event

        This method is supported in version 1 of the API and above'
      operationId: createEvent
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: siteid
        in: query
        description: site id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event created successfully
        '201':
          description: Event Created successfully
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResponseDBO'
        '400':
          description: Problem with parameters in create event
        '401':
          description: Unauthorised in create event
        '403':
          description: Validation failed | Forbidden in create event
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while creating event
