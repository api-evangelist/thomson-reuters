info:
  title: Thomson Reuters Jurisdictions-📦 Version 2 Endpoints API
  version: '2.0'
  description: 'Operations tagged Jurisdictions-📦 Version 2 Endpoints across 2 of this provider''s published API definitions: thomson-reuters-api-documentation-for-jurisdictions-services-2-0-openapi.json, thomson-reuters-api-documentation-for-jurisdictions-services-2-0-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/administration
  description: All V1 endpoints will be removed by Q2 2026. Please use V2
security:
- Authorization: []
tags:
- name: Jurisdictions-📦 Version 2 Endpoints
paths:
  /v2/jurisdictions/{id}:
    put:
      tags:
      - Jurisdictions-📦 Version 2 Endpoints
      summary: Update Jurisdiction records of an account
      description: Use this operation to update a record by its ID. It allows modifying the associated application (related apps), alternate name, or both in a single request.
      operationId: jurisdictionUpdateRequest
      parameters:
      - name: X-LoneStar-AccountId
        in: header
        description: AccountId you want to access if you are a support user
        schema:
          type: string
      - name: id
        in: path
        description: jurisdiction_id of the record
        required: true
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        schema:
          type: string
          enum:
          - application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JurisdictionCustomerDataRequestV3'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
        '204':
          description: No Content
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '403':
          description: Forbidden
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
            text/csv:
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '500':
          description: Failure
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV2'
    servers:
    - url: https://api.onesourcetax.com/administration
      description: All V1 endpoints will be removed by Q2 2026. Please use V2
  /v2/jurisdictions:
    get:
      tags:
      - Jurisdictions-📦 Version 2 Endpoints
      summary: Retrieve a list of Jurisdictions
      description: Use this operation to fetch a standard paginated list of jurisdictions in ONESOURCE
      operationId: getJurisdictions
      parameters:
      - name: X-LoneStar-AccountId
        in: header
        description: AccountId you want to access if you are a support user
        schema:
          type: string
      - name: effective_from
        in: query
        required: false
        description: results to include only records that are effective from  this date
        schema:
          type: string
      - name: effective_to
        in: query
        required: false
        description: results to include only records that are effective to  this date
        schema:
          type: string
      - name: filter
        in: query
        description: 'Criteria used to narrow down the results based on specific conditions. supports eq,contains,in eg: id in (1,2)'
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Defines the order in which results are returned. format +/-{{attribute}}, + denotes asc and - denotes desc eg:+id
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: The index of the item to return. A non negative integer. Default value is 0.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        description: The maximum number of records to return in the response.Default value is 200. Max value is 500
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        required: false
        schema:
          type: string
          default: application/json
          enum:
          - text/csv
      responses:
        '200':
          description: Success
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionViewItemV3'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionViewItemV3'
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionViewItemV3'
        '204':
          description: No Content
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '403':
          description: Forbidden
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
            text/csv:
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '500':
          description: Failure
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV2'
    servers:
    - url: https://api.onesourcetax.com/administration
      description: All V1 endpoints will be removed by Q2 2026. Please use V2
