components:
  schemas:
    TccChartRepresentation:
      type: object
      properties:
        year:
          type: integer
          description: Tax year.
          format: int32
        chartId:
          type: string
          description: System-generated unique identifier for a chart.
        chartName:
          type: string
          description: User-defined unique chart name.
        isReadOnly:
          type: boolean
          description: Indicates whether the chart can be edited.
        isDefault:
          type: boolean
        taxReturnType:
          type: string
          description: IRS-defined type of tax return.
        priorYearChartId:
          type: string
          description: Chart ID that the existing chart was rolled from.
        priorYearChartName:
          type: string
          description: Chart name from the prior year.
        taxReturnTypeDescription:
          type: string
        isAvailableForRollover:
          type: boolean
          description: Indicates whether the chart is available for rollover.
        trcs:
          $ref: '#/components/schemas/TrcItemsRepresentation'
    ProblemRepresentation:
      type: object
      properties:
        type:
          type: object
          format: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        fieldName:
          type: string
        messages:
          type: array
          items:
            type: string
        errorCode:
          type: integer
          format: int32
    TccItemRepresentation:
      type: object
      properties:
        tccId:
          type: string
          description: System-generated ID code used to combine accounts into subcategories within a single TRC.
        trcCategoryId:
          type: integer
          description: System-generated ID for TRC.
          format: int32
        trcNumber:
          type: integer
          description: System-defined number for a TRC.
          format: int32
        tccNumber:
          type: string
          description: User-defined code used to combine accounts into subcategories within a single TRC.
        tccDescription:
          type: string
          description: System-defined description for a TRC.
    TccChartsRepresentation:
      type: object
      properties:
        resourceList:
          type: array
          items:
            $ref: '#/components/schemas/TccChartRepresentation'
    TrcItemsRepresentation:
      type: object
      properties:
        trcs:
          type: array
          items:
            $ref: '#/components/schemas/TrcItem'
    TccItemsRepresentation:
      type: object
      properties:
        resourceList:
          type: array
          items:
            $ref: '#/components/schemas/TccItemRepresentation'
    TrcItem:
      type: object
      properties:
        trcCategoryId:
          type: integer
          description: System-generated ID for TRC.
          format: int32
        trcNumber:
          type: integer
          description: System-defined number for a TRC.
          format: int32
        trcFormattedNumber:
          type: string
          description: System-defined number for a TRC.
        trcDescription:
          type: string
          description: System-defined description for a TRC.
        applicableTaxReturnTypes:
          type: string
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
