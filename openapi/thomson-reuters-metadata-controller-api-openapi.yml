info:
  title: Thomson Reuters Metadata Controller API
  version: '1.0'
  description: 'Operations tagged metadata-controller across 2 of this provider''s published API definitions: thomson-reuters-eap-uat-trri-api-research-openapi.json, thomson-reuters-eap-uat-trri-api-research-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.thomsonreuters.com/regulatory-intelligence
tags:
- name: metadata-controller
  description: Metadata Controller
paths:
  /v1/document-metadata-view:
    post:
      tags:
      - metadata-controller
      summary: Returns metadata for a list of documents
      operationId: getDocumentsMetadataUsingPOST
      requestBody:
        description: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentListRequestDto'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListDocumentMetadataDto'
        '201':
          description: Created
          content: {}
        '400':
          description: Requested documents list should be > 0 && <= 100
          content: {}
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Failed to get metadata from Novus
          content: {}
      x-codegen-request-body-name: request
    servers:
    - url: https://api.thomsonreuters.com/regulatory-intelligence
  /v2/documents/{documentId}/rulebook-location:
    get:
      tags:
      - metadata-controller
      summary: Returns TOC tree starting with the root node with all the immediate children…
      operationId: getDocumentTocTreeUsingGET
      parameters:
      - name: documentId
        in: path
        description: The unique document identifier
        required: true
        schema:
          type: string
        example: IC5A20E7DDE1C454EA14C5AEAA856E7DC
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RulebookResponseDto'
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Requested document are forbidden to user
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Failed to get TOC tree from Novus
          content: {}
    servers:
    - url: https://api.thomsonreuters.com/regulatory-intelligence
  /v2/documents/{guid}/breadcrumb:
    get:
      tags:
      - metadata-controller
      summary: Returns a document breadcrumb
      operationId: getDocumentBreadcrumbUsingGET
      parameters:
      - name: guid
        in: path
        description: ID of document to return breadcrumb
        required: true
        schema:
          type: string
        example: N3A3B9450230211E8A98DBFE07F88253F
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
