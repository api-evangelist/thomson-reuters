          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Failed to get breadcrumb from Novus
          content: {}
    servers:
    - url: https://api.thomsonreuters.com/regulatory-intelligence
  /v1/documents/{guid}/metadata:
    get:
      tags:
      - metadata-controller
      summary: Returns a document metadata
      operationId: getDocumentMetadataUsingGET
      parameters:
      - name: guid
        in: path
        description: ID of document to return metadata
        required: true
        schema:
          type: string
        example: IC5A20E7DDE1C454EA14C5AEAA856E7DC
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DocumentMetadataDto'
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Requested document are forbidden to user
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Failed to get metadata from Novus
          content: {}
    servers:
    - url: https://api.thomsonreuters.com/regulatory-intelligence
  /v1/documents/{guid}/series:
    get:
      tags:
      - metadata-controller
      summary: Returns a series of related documents
      operationId: getDocumentSeriesUsingGET
      parameters:
      - name: guid
        in: path
        description: ID of document to requested series
        required: true
        schema:
          type: string
        example: I91F08B2089E811EA9211B4C038C89754
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListDocumentSeriesDto'
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Requested document are forbidden to user
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Failed to get document series
          content: {}
    servers:
    - url: https://api.thomsonreuters.com/regulatory-intelligence
  /v2/mandates-view:
    post:
      tags:
      - metadata-controller
      summary: Return a document mandate
      operationId: getDocumentsMandatesUsingPOST
      requestBody:
        description: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentListRequestDto'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListMandatesResponseDto'
        '201':
          description: Created
          content: {}
        '400':
          description: Requested documents list should be > 0 && <= 100
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Failed to get mandate from Novus
          content: {}
      x-codegen-request-body-name: request
    servers:
    - url: https://api.thomsonreuters.com/regulatory-intelligence
