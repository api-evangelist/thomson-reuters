    get:
      tags:
      - Report filter definitions
      summary: Retrieve the list of parameters with possible values that can be used for the…
      description: Each filter has it's own list of parameters. This endpoint allows to retrieve the list of parameters with possible values that can be used for the particular filter.
      operationId: Report_GetFilter
      parameters:
      - name: id
        in: path
        required: true
        description: Full path to the filter
        examples:
          Path for filter Matter -> Short Name:
            summary: Path for filter Matter -> Short Name
            value: Matter.Name
          'Path for filter Matter -> Org. Unit: Select from list':
            summary: 'Path for filter Matter -> Org. Unit: Select from list'
            value: Matter.OrgUnit.TreePicklist
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: The list of parameters that can be used for the filter with possible values.
