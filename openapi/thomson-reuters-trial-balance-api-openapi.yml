  /external/v1/trialbalance/grouping-schedule/{engagementId}:
    get:
      tags:
      - Trial Balance
      summary: Retrieve account groupings schedule for a specific engagement
      description: '## Purpose

        Retrieves a complete list of account grouping schedules configured for a specific engagement (binder). Account grouping schedules define how trial balance accounts are organized and classified for financial statement presentation and reporting purposes.


        ## Why Use This Endpoint

        - Retrieve all configured account grouping schedules for an engagement

        - Understand how accounts are organized for financial reporting

        - Get grouping schedule keys needed for other operations

        - View account classification and grouping structures

        - Prepare data for financial statement generation

        - Audit account grouping configurations


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get Account Grouping Schedules

        - **Endpoint:** `GET /trialbalance/grouping-schedule/{engagementId}` (this endpoint)

        - **Use:** The `engagementId` from Step 2 in the URL path

        - **Returns:** All account grouping schedules for that engagement


        ## Request Details

        - **Route Parameter:** `engagementId` (required integer in URL path)

        - **Format:** `/trialbalance/grouping-schedule/{engagementId}`

        - This is a URL route parameter, not a query string or request body parameter


        ## Common Use Cases

        1. **Financial Statement Prep:** Load grouping schedules to prepare financial statements

        2. **Account Organization:** View how accounts are classified and organized

        3. **Report Generation:** Use grouping schedules for custom report generation

        4. **Data Export:** Export account grouping structures for external analysis

        5. **Audit Documentation:** Document account classification for audit trails

        6. **Configuration Review:** Review and verify account grouping configurations


        ## Important Notes

        - Each engagement can have multiple account grouping schedules

        - GroupingScheduleKey values are used in other endpoints to load specific grouping details

        - Empty list is returned if no grouping schedules are configured for the engagement

        - The engagementId must correspond to a valid engagement that the authenticated user has access to'
      operationId: EmMainEndPointsExternalAfGroupingScheduleGetBinderLevelExternalEndPoint
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      responses:
        '200':
          description: Successfully retrieved account groupings schedule engagement level data.
          content:
