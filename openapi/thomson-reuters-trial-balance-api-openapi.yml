  /external/v1/trialbalance/periods/{engagementId}:
    get:
      tags:
      - Trial Balance
      summary: Retrieve trial balance periods for a specific engagement
      description: '## Purpose

        Retrieves all configured trial balance periods for a specific engagement, including the current period and any prior comparative periods. This endpoint provides the temporal structure used to organize account balances across different time periods within the engagement.


        ## Why Use This Endpoint

        - Get all available time periods configured for an engagement''s trial balance

        - Understand the fiscal year structure and comparative periods

        - Access period identifiers needed for other trial balance operations

        - Display period selection options in user interfaces

        - Validate period references before querying trial balance data

        - Set up period-specific reporting and analysis


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get Trial Balance Periods

        - **Endpoint:** `GET /trialbalance/periods/{engagementId}` (this endpoint)

        - **Use:** The `engagementId` from Step 2 in the URL path

        - **Returns:** All trial balance periods configured for that engagement


        ## Request Details

        - **Route Parameter:** `engagementId` (required integer in URL path)

        - **Format:** `/trialbalance/periods/{engagementId}`

        - This is a URL route parameter, not a query string or request body parameter


        ## Common Use Cases

        1. **Period Selection:** Populate dropdown lists for period selection in trial balance views

        2. **Comparative Analysis:** Identify current and prior periods for side-by-side comparisons

        3. **Data Validation:** Verify period references before saving or updating trial balance data

        4. **Report Configuration:** Configure which periods to include in financial reports

        5. **Date Range Queries:** Use period start/end dates for filtering transactions

        6. **Fiscal Year Navigation:** Navigate between different fiscal years and periods


        ## Important Notes

        - Returns all periods (current and prior) configured for the engagement

        - The engagement must have at least one period configured

        - Empty list is returned if no periods are configured

        - Period keys are required for most other trial balance operations

        - Periods are typically ordered by fiscal year and display order

        - The `engagementId` must correspond to a valid engagement that the authenticated user has access to'
      operationId: EmMainEndPointsExternalTBPeriodGetTBPriorPeriodExternalEndpoint
