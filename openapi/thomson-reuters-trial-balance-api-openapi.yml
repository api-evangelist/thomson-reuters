  /external/v1/trialbalance/account/export:
    post:
      tags:
      - Trial Balance
      summary: Export trial balance account data
      description: '## Purpose

        Exports trial balance account data for a specific engagement and view configuration to Excel (XLSX) format. This endpoint generates downloadable files containing account information, balances, and classifications formatted according to the specified view configuration.


        ## Why Use This Endpoint

        - Export trial balance data for external analysis

        - Generate Excel spreadsheets for offline review

        - Archive trial balance data at specific points in time

        - Share account information with clients or team members

        - Import trial balance data into other accounting systems


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the `viewName`

        - **Endpoint:** `GET /trialbalance/views/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** List of views with their ViewName values

        - **Example:** `viewName: "Standard View"`


        **Step 4:** Export the Data

        - **Endpoint:** `POST /trialbalance/account/export` (this endpoint)

        - **Use:** The `engagementId` and `viewName` in the request body


        ## Request Details

        - **Method:** POST

        - **Content-Type:** application/json

        - **Request Body Parameters:**

        - `EngagementId` (int, required) - The engagement identifier

        - `ViewName` (string, required) - The view name from `/trialbalance/views/{engagementId}`


        ## Common Use Cases

        1. **Data Analysis:** Export to Excel for pivot tables and analysis

        2. **Client Deliverables:** Share trial balance with clients

        3. **Backup and Archive:** Create point-in-time snapshots of trial balance

        4. **Reporting:** Use exported data for custom report generation

        5. **Audit Documentation:** Archive trial balance for audit trails


        ## Important Notes

        - Export format is determined by the view configuration columns

        - Excel exports preserve formatting and column widths from the view

        - Large trial balances may take longer to export

        - Exported files include all accounts visible in the specified view

        - Filters applied in the view configuration are respected in the export

        - File names are automatically generated with engagement and date information

        - Exported data reflects the current state at the time of export

        - Balance values are formatted according to engagement currency settings'
      operationId: EmMainEndPointsExternalAccountAccountsExportExternalEndpoint
      parameters:
