  /external/v1/trialbalance/grid-data:
    post:
      tags:
      - Trial Balance
      summary: Retrieve paginated trial balance account data for a specific view
      description: '## Purpose

        Retrieves paginated trial balance account data for a specific engagement and view configuration. This is the primary endpoint for accessing actual account balances, details, and associated financial data in the trial balance. Supports pagination, filtering, and sorting based on the specified view configuration.


        ## Why Use This Endpoint

        - Retrieve actual trial balance account data with balances and details

        - Access account information formatted according to a specific view configuration

        - Implement paginated data loading for large trial balances

        - Apply filters and sorting to trial balance data

        - Export trial balance data for analysis or reporting

        - Display account details in custom user interfaces


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the `viewConfigKey`

        - **Endpoint:** `GET /trialbalance/views/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** List of available views with their ViewConfigKey values

        - **Example:** `viewConfigKey: 123`


        **Step 4:** Retrieve Trial Balance Grid Data

        - **Endpoint:** `POST /trialbalance/grid-data` (this endpoint)

        - **Use:** The `engagementId` and `viewConfigKey` from previous steps in the request body

        - **Returns:** Paginated trial balance account data


        ## Request Details

        - **Method:** POST

        - **Content-Type:** application/json

        - **Request Body Parameters:**

        - `EngagementId` (int, required) - The engagement identifier

        - `ViewConfigKey` (int, required) - The view configuration identifier from `/trialbalance/views/{engagementId}`

        - `PageIndex` (int, optional) - Zero-based page index for pagination (default: 0)

        - `PageSize` (int, optional) - Number of records per page (default: 1000, max recommended: 1000)

        - `Filters` (object, optional) - Additional filter criteria to apply

        - `SortColumn` (string, optional) - Column name to sort by

        - `SortDirection` (string, optional) - Sort direction ("asc" or "desc")


        ## Common Use Cases

        1. **Data Grid Display:** Load account data for display in data grids with pagination

        2. **Financial Analysis:** Retrieve balance data for analysis and calculations

        3. **Report Generation:** Extract account data for financial report generation

        4. **Data Export:** Retrieve account information for export to Excel or other formats

        5. **Balance Verification:** Access account balances for verification and reconciliation

        6. **Account Searching:** Use filters to search for specific accounts

        7. **Custom Dashboards:** Build custom dashboards with trial balance data


        ## Important Notes

        - Both `engagementId` and `viewConfigKey` are required parameters

        - The `viewConfigKey` determines which columns and data are returned

        - Use pagination (PageIndex, PageSize) for large trial balances to improve performance

        - Default page size is 1000; adjust based on your needs

        - Filters are applied based on the view configuration settings

        - Account keys returned can be used in update and delete operations

        - The view configuration controls data formatting and available columns'
      operationId: EmMainEndPointsExternalTbGridGetFilteredPagedTrialBalanceDataExternalEndpoint
      parameters:
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      requestBody:
