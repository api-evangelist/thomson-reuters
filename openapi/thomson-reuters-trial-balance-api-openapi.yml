  /external/v1/trialbalance/get-taxcode-with-binder/{engagementId}:
    get:
      tags:
      - Trial Balance
      summary: Retrieve tax code configurations for a specific engagement
      description: '## Purpose

        Retrieves all configured tax codes and subcodes for a specific engagement. Tax codes are used to classify accounts according to tax reporting requirements, enabling proper categorization for tax return preparation, tax schedules, and regulatory compliance. This endpoint provides the tax code structure needed for account classification and tax-related reporting.


        ## Why Use This Endpoint

        - Get all available tax codes configured for an engagement

        - Access tax code and subcode combinations for account assignments

        - Validate tax code references before creating or updating accounts

        - Populate tax code dropdown lists in user interfaces

        - Understand the tax classification structure for the engagement

        - Reference M3 codes and subcodes for tax reporting


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get Tax Codes

        - **Endpoint:** `GET /trialbalance/get-taxcode-with-binder/{engagementId}` (this endpoint)

        - **Use:** The `engagementId` from Step 2 in the URL path

        - **Returns:** All tax codes and subcodes configured for that engagement


        ## Request Details

        - **Route Parameter:** `engagementId` (required integer in URL path)

        - **Format:** `/trialbalance/get-taxcode-with-binder/{engagementId}`

        - This is a URL route parameter, not a query string or request body parameter


        ## Common Use Cases

        1. **Account Creation:** Select valid tax codes when creating new trial balance accounts

        2. **Account Updates:** Assign or change tax codes on existing accounts

        3. **Tax Code Validation:** Verify tax code references are valid before saving

        4. **Dropdown Population:** Fill tax code selection dropdowns in user interfaces

        5. **Tax Reporting:** Understand tax classification structure for generating tax reports

        6. **M3 Mapping:** Map accounts to M3 codes for specific tax form requirements

        7. **Compliance Verification:** Ensure all accounts have appropriate tax code assignments


        ## Important Notes

        - Tax codes are engagement-specific and may vary between engagements

        - Some tax codes may have subcodes for more granular classification

        - M3 codes are used for specific tax return schedules and forms

        - Only active tax codes should be used for new account assignments

        - Tax code structure depends on the engagement''s entity type and tax jurisdiction

        - The `engagementId` must correspond to a valid engagement that the authenticated user has access to

        - Returns empty list if no tax codes are configured for the engagement

        - Tax codes and subcodes returned by this endpoint are used in `/trialbalance/account/add` and `/trialbalance/account/update` operations'
      operationId: EmMainEndPointsExternalTaxCodeGetTaxCodeWithBinderExternalEndpoint
