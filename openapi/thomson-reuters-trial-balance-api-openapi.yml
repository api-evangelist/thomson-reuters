  /external/v1/trialbalance/accountgrouping/load-codesubcode/{groupingschedulekey}:
    get:
      tags:
      - Trial Balance
      summary: Retrieve detailed grouping codes and subcodes for a specific grouping schedule
      description: '## Purpose

        Retrieves the complete hierarchical structure of grouping codes and subcodes for a specific grouping schedule. This endpoint provides the detailed classification framework used to organize trial balance accounts into financial statement categories and reporting structures. Each grouping schedule contains multiple codes, and each code may contain multiple subcodes for granular account classification.


        ## Why Use This Endpoint

        - Get the detailed code and subcode structure for a specific grouping schedule

        - Access code and subcode identifiers needed for account creation and updates

        - Understand the hierarchical account classification structure

        - Populate dropdown lists for grouping code and subcode selection

        - Validate grouping code/subcode references before saving accounts

        - Display the complete grouping structure in user interfaces

        - Prepare data for updating grouping code structures


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the `groupingScheduleKey`

        - **Endpoint:** `GET /trialbalance/grouping-schedule/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** List of grouping schedules with their GroupingScheduleKey values

        - **Example:** `groupingScheduleKey: 6016689`


        **Step 4:** Get Grouping Codes and Subcodes

        - **Endpoint:** `GET /trialbalance/accountgrouping/load-codesubcode/{groupingschedulekey}` (this endpoint)

        - **Use:** The `groupingScheduleKey` from Step 3 in the URL path

        - **Returns:** Detailed grouping codes and subcodes for that schedule


        ## Request Details

        - **Route Parameter:** `groupingschedulekey` (required integer in URL path)

        - **Format:** `/trialbalance/accountgrouping/load-codesubcode/{groupingschedulekey}`

        - This is a URL route parameter, not a query string or request body parameter

        - The parameter value must be greater than zero


        ## Common Use Cases

        1. **Account Creation:** Select valid grouping codes and subcodes when creating new accounts

        2. **Account Updates:** Assign or change grouping classifications on existing accounts

        3. **Dropdown Population:** Populate cascading dropdowns (Code → Subcode) in user interfaces

        4. **Data Validation:** Verify grouping code/subcode references before saving

        5. **Structure Management:** View and modify the grouping code structure using `/trialbalance/create-or-update-groupingcodes-or-subcodes`

        6. **Financial Statement Mapping:** Understand how accounts map to financial statement line items

        7. **Reporting Configuration:** Configure custom reports based on grouping structure


        ## Important Notes

        - The groupingScheduleKey parameter must be obtained from `/trialbalance/grouping-schedule/{engagementId}`

        - Returns the complete hierarchical structure with codes and their nested subcodes

        - Grouping codes and subcodes are used in `/trialbalance/account/add` and `/trialbalance/account/update` operations

        - The response from this endpoint can be modified and sent to `/trialbalance/create-or-update-groupingcodes-or-subcodes` to update the structure

        - Some codes may not have subcodes (Subcodes array will be empty)

        - DisplayIndex determines the order codes and subcodes appear in user interfaces

        - Editable flag indicates whether the code structure can be modified'
