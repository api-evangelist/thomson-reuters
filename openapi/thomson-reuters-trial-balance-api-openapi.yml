        codeKey:
          type: integer
          description: The unique identifier for the grouping code.
          format: int32
          example: 12345
        subcodeKey:
          type: integer
          description: The unique identifier for the grouping subcode.
          format: int32
          example: 67890
        codeDescription:
          type: string
          description: The description of the grouping code (e.g., "Assets", "Liabilities", "Equity").
          example: Assets
        subcodeDescription:
          type: string
          description: The description of the grouping subcode (e.g., "Current Assets", "Non-Current Assets").
          example: Current Assets
        bindingName:
          type: string
          description: The binding name used to map this grouping to a specific column in the view.
          example: gsch_63946_GroupingSubcode
        value:
          type: string
          description: The combined value representing the code and subcode assignment (e.g., "A-CA" for Assets - Current Assets).
          example: '1936552'
    EMMainDataTransferObjectsModelsTrialBalancePeriod:
