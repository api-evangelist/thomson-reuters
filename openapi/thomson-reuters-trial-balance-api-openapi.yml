    EMMainDataTransferObjectsModelsExternalTBUpdateAccountBaseExternalDto:
      required:
      - accountKey
      allOf:
      - $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBAccountBaseExternalDto'
      - type: object
        description: Request model for updating an existing trial balance account, including all account properties, classifications, and balances. Inherits base account properties from AccountBaseExternalDto.
        additionalProperties: false
        properties:
          viewConfigId:
            type: integer
            description: The view configuration key used for this update operation. Obtain from GET /external/v1/trialbalance/views/{engagementId}.
            format: int32
            example: 123
            exclusiveMinimum: 0
          accountKey:
            type: integer
            description: The unique identifier (AccountKey) of the account to update. Obtain from POST /external/v1/trialbalance/grid-data.
            format: int32
