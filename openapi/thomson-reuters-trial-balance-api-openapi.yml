  /external/v1/trialbalance/views/{engagementId}:
    get:
      tags:
      - Trial Balance
      summary: Retrieve trial balance view configurations for a specific engagement
      description: '## Purpose

        Retrieves all configured trial balance view definitions for a specific engagement. Views define different perspectives and layouts for displaying trial balance data, including column configurations, filters, and display settings. Each view represents a distinct way to organize and present account information.


        ## Why Use This Endpoint

        - Get all available trial balance view configurations for an engagement

        - Access view configuration keys needed for retrieving trial balance grid data

        - Understand available view layouts and their configurations

        - Populate view selection dropdowns in user interfaces

        - Validate view references before querying trial balance data

        - Configure data export options based on available views


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get Trial Balance Views

        - **Endpoint:** `GET /trialbalance/views/{engagementId}` (this endpoint)

        - **Use:** The `engagementId` from Step 2 in the URL path

        - **Returns:** All trial balance view configurations for that engagement


        ## Common Use Cases

        1. **View Selection:** Populate dropdown lists for view selection before loading trial balance data

        2. **Data Retrieval:** Get ViewConfigKey values required for the `/trialbalance/grid-data` endpoint

        3. **UI Configuration:** Configure grid layouts based on view column settings

        4. **Export Configuration:** Select appropriate views for data export operations

        5. **Default View Loading:** Identify the default view to load when opening trial balance

        6. **Custom View Management:** Understand available custom views configured for the engagement


        ## Important Notes

        - ViewConfigKey is required as a parameter for the `/trialbalance/grid-data` endpoint

        - Each engagement can have multiple view configurations

        - At least one view must be configured for the engagement

        - The default view (IsDefault = true) is typically loaded initially

        - View configurations control which columns and data are visible in the trial balance grid

        - The `engagementId` must correspond to a valid engagement that the authenticated user has access to

        - Returns empty list if no views are configured (though this is uncommon)'
