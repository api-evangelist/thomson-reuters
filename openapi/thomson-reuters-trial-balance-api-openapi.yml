  /external/v1/trialbalance/tax-entity-definitions:
    get:
      tags:
      - Trial Balance
      summary: Retrieve available tax entity definitions
      description: '## Purpose

        Retrieves a complete list of supported tax entity type definitions used for trial balance tax code configurations. This endpoint provides the available combinations of tax vendors and entity types that can be applied to engagement accounts.


        ## Why Use This Endpoint

        - Get all available tax entity definitions for system configuration

        - Understand which tax entity types are supported

        - Reference valid entity type combinations for tax code setup

        - Populate dropdown lists or configuration UIs with valid tax entity options

        - Validate tax entity selections before creating or updating tax codes


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Request Details

        - **Method:** GET

        - **No parameters required** - Returns all available tax entity definitions


        ## Common Use Cases

        1. **Tax Code Setup:** Load available entity types when configuring tax codes for an engagement

        2. **Validation:** Verify that selected entity types are valid before saving tax configurations

        3. **UI Population:** Populate dropdown lists with valid entity type options

        4. **Documentation:** Reference available tax entity types for user guides and documentation

        5. **Integration Setup:** Understand supported tax entity types when integrating with external systems


        ## Important Notes

        - This is a reference data endpoint that returns system-wide configuration

        - The response is not engagement-specific - it returns all available definitions

        - Entity types are typically configured at the system level and change infrequently

        - Only active entity type definitions should be used for new configurations

        - This endpoint is often called once during initialization and cached'
      operationId: EmMainEndPointsExternalTaxCodeGetTaxEntityDefinitionsExternalEndpoint
      parameters:
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      responses:
        '200':
          description: Successfully retrieved tax entity definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBTaxVendorEntityTypeCombinationExternalResponse'
        '400':
          description: Bad Request
