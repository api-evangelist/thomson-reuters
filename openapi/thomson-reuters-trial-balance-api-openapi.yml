components:
  schemas:
    EMMainDataTransferObjectsModelsExternalTBTaxCodeGroupingExternal:
      type: object
      description: Represents a tax code grouping category within a tax vendor and entity type combination. Groupings organize tax codes into logical categories (e.g., Income, Deductions, Credits).
      additionalProperties: false
      properties:
        taxCodeGroupingKey:
          type: integer
          description: The unique identifier for this tax code grouping.
          format: int32
          example: 12345
        description:
          type: string
          description: The description of the tax code grouping category (e.g., "Income", "Deductions", "Adjustments").
          example: Income
        entityType:
          type: integer
          description: The entity type identifier associated with this grouping (e.g., individual, partnership, corporation).
          format: int32
          example: 1
        m3Grouping:
          type: boolean
          description: Indicates whether this is an M3 grouping. M3 groupings are used for Schedule M-3 tax reconciliation reporting.
          example: false
        displayIndex:
          type:
          - integer
          - 'null'
          description: Optional display order index for sorting groupings in UI elements. Lower numbers appear first.
          format: int32
          example: 10
    EMMainDataTransferObjectsModelsExportResponse:
      type: object
      description: Response model containing binary file data for trial balance exports in Excel or XML format.
      additionalProperties: false
      properties:
        fileName:
          type: string
          description: The suggested filename for the exported file, including extension (e.g., "TrialBalance_2024_01_15.xlsx").
          example: TrialBalance_Engagement94_2024.xlsx
        format:
          type: string
          description: 'The export format type. Supported values: "EXCELXLSX" for Excel files, "XML" for XML files.'
          example: EXCELXLSX
        bytes:
          type:
          - string
          - 'null'
          description: The binary content of the exported file. This data should be written to a file or sent as a download response.
          format: byte
    EMMainDataTransferObjectsModelsTaxSubcodeExternal:
      type: object
      description: Represents a tax subcode providing finer classification within a parent tax code. Subcodes allow for more granular categorization of account tax treatments.
      additionalProperties: false
      properties:
        taxCodeKey:
          type: integer
          description: The unique identifier of the parent tax code that this subcode belongs to.
          format: int32
          example: 67890
        taxCodeSubcodeKey:
          type: integer
          description: The unique identifier for this tax subcode.
          format: int32
          example: 11223
        code:
          type: string
          description: The short code representing this tax subcode (e.g., "a", "b", "1").
          example: a
        description:
          type: string
          description: The description of what this tax subcode represents, providing additional detail beyond the parent tax code.
          example: Cash method
    EMMainDataTransferObjectsModelsTaxCodeResponseExternal:
      type: object
      description: Response model containing tax code information including codes, subcodes, vendor details, and entity type associations. Used for assigning tax classifications to trial balance accounts.
      additionalProperties: false
      properties:
        taxCodeGroupingKey:
          type: integer
          description: The unique identifier for the tax code grouping that this tax code belongs to.
          format: int32
          example: 12345
        taxCodeKey:
          type: integer
          description: The unique identifier for this tax code.
          format: int32
          example: 67890
        code:
          type: string
          description: The short code representing this tax code (e.g., "1", "2a", "10").
          example: '1'
        m3Type:
          type: boolean
          description: Indicates whether this is an M3 type tax code. M3 codes are used for Schedule M-3 tax reconciliation.
          example: false
        description:
          type: string
          description: The description of what this tax code represents (e.g., "Gross receipts or sales", "Cost of goods sold").
          example: Gross receipts or sales
        vendorId:
          type: integer
          description: The vendor identifier (e.g., 1040, 1065, 1120) indicating which tax form this code applies to.
          format: int32
          example: 1040
        entityTypeId:
          type: integer
          description: The entity type identifier (e.g., 1 for Individual, 2 for Partnership, 3 for Corporation).
          format: int32
          example: 1
        taxYear:
          type: string
          description: The tax year that this code configuration applies to.
          format: date-time
          example: '2024-01-01T00:00:00Z'
        subCodes:
          type: array
          description: List of subcodes available under this tax code. Subcodes provide finer classification within a tax code.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsTaxSubcodeExternal'
    EMMainDataTransferObjectsModelsAccountAccountDeleteExternalDto:
      type: object
      description: Request model for deleting one or more trial balance accounts from an engagement.
      additionalProperties: false
      required:
      - accountIds
      properties:
        engagementId:
          type: integer
          description: The unique identifier for the engagement containing the accounts to delete. Obtain from GET /external/v1/engagements/{clientId}.
          format: int32
          example: 94
        accountIds:
          type: array
          description: List of account identifiers (AccountKey values) to permanently delete. Obtain AccountKey values from the POST /external/v1/trialbalance/grid-data endpoint. All deletions are permanent and cannot be undone.
          minLength: 1
          items:
            type: integer
            format: int32
    EMMainDataTransferObjectsModelsExternalTBTbTabColumnExternalDto:
      type: object
      description: Defines a single column in a trial balance view configuration, including its binding name, display name, type, and associated grouping schedule.
      additionalProperties: false
      properties:
        bindingName:
          type: string
          description: The internal binding name used to map this column to data properties (e.g., "AccountNumber", "Description", "Balance1").
          example: AccountNumber
        columnType:
          description: The type of data this column contains (e.g., Text, Number, Date, Balance, GroupingCode).
          oneOf:
          - $ref: '#/components/schemas/EmMainExtensionsEnumerationsTbFieldType'
        columnName:
          type: string
          description: The display name for this column as shown to users (e.g., "Account Number", "Description", "Current Year Balance").
          example: Account Number
        groupingScheduleKey:
          type: integer
          description: The grouping schedule key associated with this column if the column represents grouping codes. Zero if not applicable.
          format: int32
          example: 6016689
    EMMainDataTransferObjectsModelsExternalGroupingCodeExternal:
      type: object
      description: Represents a top-level grouping code within a classification schedule. Codes organize accounts into major categories (e.g., Assets, Liabilities, Equity) and can contain subcodes for finer classification.
      additionalProperties: false
      properties:
        code:
          type:
          - string
          - 'null'
          description: The short code identifier (e.g., "A" for Assets, "L" for Liabilities, "E" for Equity). Maximum 15 characters.
          example: A
        groupingCodeKey:
          type:
          - integer
          - 'null'
          description: The unique identifier for this grouping code. Omit when creating new codes; include when updating existing codes.
          format: int32
          example: 12345
        description:
          type:
          - string
          - 'null'
          description: The description of this grouping code (e.g., "Assets", "Liabilities", "Equity", "Revenue", "Expenses").
          example: Assets
        displayIndex:
          type: integer
          description: Display order index for sorting codes in UI elements and reports. Lower numbers appear first.
          format: int32
          example: 10
        subcodes:
          type:
          - array
          - 'null'
          description: List of subcodes under this code providing finer classification categories (e.g., "Current Assets", "Non-Current Assets" under "Assets").
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalGroupingSubcodeExternal'
    EmMainExtensionsUtilityErrorExtensions:
      type: object
      description: 'Provides extended metadata and diagnostic information for error responses.

        Includes status codes, error codes, timestamps, and distributed tracing identifiers.'
      additionalProperties: false
      properties:
        statusCode:
          type: integer
          description: HTTP status code (e.g., 400, 401, 403, 500)
          format: int32
          example: 401
        code:
          type: string
          description: Application-specific error code for programmatic handling
          example: ERR_AUTH_4010
        errorId:
          type: string
          description: Unique identifier (GUID) for this error occurrence. Use this when reporting issues to support.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        dateTime:
          type: string
          description: ISO 8601 timestamp (UTC) when the error occurred
          example: '2024-03-15T14:30:00Z'
        traceId:
          type: string
          description: Distributed trace ID for correlating requests across microservices (W3C Trace Context format)
          example: a1b2c3d4e5f67890abcdef1234567890
        spanId:
          type: string
          description: Span ID for this specific operation within the distributed trace (W3C Trace Context format)
          example: 358611c48f91f940
    EmMainExtensionsEnumerationsTaxCodeVendor:
      type: integer
      description: ''
      x-enumNames:
      - None
      - GoSystem
      - ProSystem
      - UltraTax
      - Lacerte
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
    EMMainDataTransferObjectsModelsGroupingSubcode:
      type: object
      additionalProperties: false
      required:
      - code
      - description
      properties:
        groupingCodeKey:
          type:
          - integer
          - 'null'
          format: int32
        groupingSubcodeKey:
          type:
          - integer
          - 'null'
          format: int32
        code:
          title: Subcode
          type: string
          maxLength: 15
          minLength: 1
        description:
          title: Description
          type: string
          maxLength: 50
          minLength: 1
        displayIndex:
          type:
          - integer
          - 'null'
          format: int32
        editable:
          type:
          - boolean
          - 'null'
        groupingScheduleSubcodeguid:
          type:
          - string
          - 'null'
        accountType:
          type:
          - string
          - 'null'
    EmMainExtensionsUtilityErrorDetail:
      type: object
      description: Represents detailed information about a specific error that occurred during API request processing.
      additionalProperties: false
      properties:
        message:
          type: string
          description: Gets or sets the human-readable error message describing what went wrong.
          example: '"Unauthorized access."

            "Bad request due to invalid input."

            "Resource not found."

            "An unexpected error occurred."'
        extensions:
          description: Gets or sets the extended error metadata containing additional diagnostic information.
          oneOf:
          - $ref: '#/components/schemas/EmMainExtensionsUtilityErrorExtensions'
    EMMainDataTransferObjectsModelsExternalTBTbTabConfigExternalDto:
      type: object
      description: Response model representing a trial balance view configuration with its column definitions. Views define which columns appear when retrieving trial balance data.
      additionalProperties: false
      properties:
        viewName:
          type: string
          description: The name of the view configuration (e.g., "Standard View", "Tax View", "Custom View 1").
          example: Standard View
        columnInfo:
          type: array
          description: List of column definitions that specify which columns are included in this view and their configuration details.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBTbTabColumnExternalDto'
        viewConfigKey:
          type: integer
          description: The unique identifier for this view configuration. Use this value when requesting trial balance grid data.
          format: int32
          example: 123
    EMMainDataTransferObjectsModelsExternalTBGroupingCodeSubcodesExternalDto:
      type: object
      description: Represents a grouping code and subcode assignment for classifying an account within a specific grouping schedule. Used when creating or updating accounts to specify their financial statement classification.
      additionalProperties: false
      properties:
        groupingScheduleKey:
          type: integer
          description: The grouping schedule key that this code/subcode belongs to. Obtain from GET /external/v1/trialbalance/grouping-schedule/{engagementId}.
          format: int32
          example: 6016689
        codeText:
          type: string
          description: The grouping code text (e.g., "A" for Assets, "L" for Liabilities, "E" for Equity).
          example: A
        subcodeText:
          type: string
          description: The grouping subcode text for finer classification within the code (e.g., "CA" for Current Assets, "NCA" for Non-Current Assets).
          example: CA
    EMMainDataTransferObjectsModelsExternalTBFilteredJeDetailResultExternalDto:
      type: object
      description: Represents a journal entry (JE) distribution detail associated with trial balance accounts. Contains complete information about a single JE line item including debits, credits, account details, and tax classifications.
      additionalProperties: false
      properties:
        jeDistributionKey:
          type: integer
          description: The unique identifier for this journal entry distribution line.
          format: int32
          example: 11111
        accountKey:
          type: integer
          description: The account key that this JE distribution affects.
          format: int32
          example: 456
        debit:
          type: number
          description: The debit amount for this distribution line. Zero if this is a credit entry.
          format: decimal
          example: 5000
        credit:
          type: number
          description: The credit amount for this distribution line. Zero if this is a debit entry.
          format: decimal
          example: 0
        accountType:
          type: string
          description: The type of account this distribution affects (e.g., "Asset", "Liability", "Expense").
          example: Expense
        jeKey:
          type: integer
          description: The unique identifier for the parent journal entry.
          format: int32
          example: 22222
        trialBalanceKey:
          type: integer
          description: The trial balance key this JE belongs to.
          format: int32
          example: 33333
        tbPeriodKey:
          type: integer
          description: The trial balance period key for the period this JE is recorded in.
          format: int32
          example: 789
        jeType:
          type: string
          description: The type of journal entry (e.g., "Adjusting", "Reclassifying", "Standard").
          example: Adjusting
        description:
          type: string
          description: Description or explanation of this journal entry line.
          example: Accrued expenses adjustment
        reference:
          type: string
          description: Reference number or code for this journal entry.
          example: JE-2024-001
        account:
          type: string
          description: The account number this distribution affects.
          example: '5100'
        accountDescription:
          type: string
          description: The description of the account this distribution affects.
          example: Office Supplies Expense
        wpReference:
          type: string
          description: Workpaper reference associated with this JE distribution.
          example: A-5
        workpaperKey:
          type:
          - integer
          - 'null'
          description: The workpaper key if this JE is linked to a workpaper.
          format: int32
          example: 44444
        diffType:
          type: string
          description: The type of difference or adjustment this JE represents.
          example: Timing
        propertyCode:
          type: string
          description: Property code for multi-property engagements.
          example: PROP001
        taxCode:
          type: string
          description: Tax code assignment for this JE distribution.
          example: '1'
        taxSubCode:
          type: string
          description: Tax subcode for finer tax classification.
          example: a
        m3Code:
          type: string
          description: M3 code assignment for Schedule M-3 reconciliation.
          example: '1'
        m3Subcode:
          type: string
          description: M3 subcode for finer M3 classification.
          example: a
        misstatementType:
          type: string
          description: Type of misstatement this JE corrects (if applicable).
          example: Immaterial
    EMMainDataTransferObjectsModelsExternalTBAccountBalanceExDto:
      type: object
      description: Represents account balance information for a specific trial balance period, including the amount, balance type, and period details.
      additionalProperties: false
      properties:
        amount:
          type: number
          description: The balance amount for this period. Can be positive (debit) or negative (credit) depending on account type and balance nature.
          format: decimal
          example: 125000.5
        bindingName:
          type: string
          description: The binding name used to map this balance to a specific column in the view (e.g., "Balance1", "Balance2", "PriorBalance").
          example: Balance1
        balanceType:
          type: string
          description: The type of balance (e.g., "Current", "Prior", "Adjusted", "Unadjusted").
          example: Current
        periodEndDate:
          type:
          - string
          - 'null'
          description: The end date of the period this balance applies to.
          format: date-time
          example: '2024-12-31T00:00:00Z'
    EMMainDataTransferObjectsModelsExternalTBPageQueryResultsCollectionExternalDtoOfAccountExternalDto:
      type: object
      description: Generic paginated collection wrapper for trial balance data queries. Contains the paginated items plus additional trial balance-specific information including balance totals, net income totals, and associated journal entries.
      additionalProperties: false
      properties:
        pageSize:
          type: integer
          description: The number of records per page. Matches the PageSize from the request.
          format: int32
          example: 1000
        pageIndex:
          type: integer
          description: Zero-based page index. Matches the PageIndex from the request.
          format: int32
          example: 0
        totalRecords:
          type: integer
          description: The total number of records available across all pages. Use this with PageSize to calculate total pages.
          format: int32
          example: 2500
        items:
          type: array
          description: The collection of items for this page. For trial balance queries, this is typically a list of AccountExternalDto objects.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBAccountExternalDto'
        unfilteredRecordsExist:
          type: boolean
          description: Indicates whether there are records that were filtered out from the result set. True if filters are hiding some records.
          example: false
        balanceTotals:
          type: array
          description: List of balance totals across all accounts for each period/balance column. Used to show total debits, credits, or net balances.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBAccountBalanceExDto'
        netIncomeTotals:
          type: array
          description: List of net income totals calculated from revenue and expense accounts for each period. Shows the calculated profit/loss.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBAccountBalanceExDto'
        jes:
          type: array
          description: List of journal entry distributions associated with the accounts in this result set. Provides detail on adjusting entries affecting these accounts.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBFilteredJeDetailResultExternalDto'
        trialBalanceKey:
          type: integer
          description: The trial balance key for the engagement. Identifies the specific trial balance these results belong to.
          format: int32
          example: 33333
    EMMainDataTransferObjectsModelsExternalTBTaxVendorEntityTypeCombinationExternalResponse:
      type: object
