        taxGroupings:
          type: array
          description: List of tax code groupings available for this vendor and entity type combination. Each grouping represents a category of tax codes.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBTaxCodeGroupingExternal'
    EMMainDataTransferObjectsModelsExternalTBGroupingCodeSubcodeExDto:
      type: object
