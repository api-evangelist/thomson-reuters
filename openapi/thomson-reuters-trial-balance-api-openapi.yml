  /external/v1/trialbalance/account/update:
    put:
      tags:
      - Trial Balance
      summary: Update an existing trial balance account
      description: '## Purpose

        Updates an existing account in the trial balance with new values for any account properties including description, classification codes, balances, and metadata. This endpoint allows modification of all account attributes while preserving the account''s identity and history. ## Why Use This Endpoint

        - Modify account descriptions, numbers, or classifications

        - Update grouping code or tax code assignments

        - Change account metadata (workpaper refs, property codes, tick marks)

        - Update account balances for specific periods

        - Reclassify accounts within the trial balance structure

        - Correct account information errors


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the `viewConfigKey`

        - **Endpoint:** `GET /trialbalance/views/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** List of available views

        - **Example:** `viewConfigKey: 123`


        **Step 4:** Get the `accountKey`

        - **Endpoint:** `POST /trialbalance/grid-data`

        - **Use:** The `engagementId` and `viewConfigKey` from previous steps

        - **Returns:** Account data including AccountKey values

        - **Example:** `accountKey: 456`


        **Step 5:** Get reference data (if updating classifications)

        - **Grouping Schedule:** `GET /trialbalance/grouping-schedule/{engagementId}`

        - **Grouping Codes:** `GET /trialbalance/accountgrouping/load-codesubcode/{groupingschedulekey}`

        - **Tax Codes:** `GET /trialbalance/get-taxcode-with-binder/{engagementId}`


        **Step 6:** Update the Account

        - **Endpoint:** `PUT /trialbalance/account/update` (this endpoint)

        - **Use:** All values in the request body including the AccountKey


        ## Request Details

        - **Method:** PUT

        - **Content-Type:** application/json

        - **Request Body Parameters:**

        - `EngagementId` (int, required) - The engagement identifier

        - `AccountKey` (int, required) - The unique account identifier from grid-data

        - `ViewConfigKey` (int, required) - The view configuration identifier

        - `AccountNumber` (string, required) - Account number

        - `Description` (string, required) - Account description

        - `AccountType` (string, optional) - Type of account

        - `Balances` (array, optional) - Account balance information for periods

        - `GroupingScheduleKey` (int, optional) - Grouping schedule identifier

        - `GroupingScheduleCode` (string, optional) - Grouping code

        - `GroupingScheduleSubcode` (string, optional) - Grouping subcode

        - `TaxCode` (string, optional) - Tax code assignment

        - `TaxCodeSubcode` (string, optional) - Tax subcode

        - `M3Code` (string, optional) - M3 classification code

        - `M3Subcode` (string, optional) - M3 subcode

        - `WPRef` (string, optional) - Workpaper reference

        - `PropertyCode` (string, optional) - Property code

        - `TickMark` (string, optional) - Tick mark description


        ## Common Use Cases

        1. **Reclassification:** Change grouping codes to reclassify accounts

        2. **Description Updates:** Correct or clarify account descriptions

        3. **Tax Code Changes:** Update tax code assignments

        4. **Balance Adjustments:** Modify account balances

        5. **Metadata Updates:** Update workpaper references, property codes, or tick marks

        6.'
      operationId: EmMainEndPointsExternalAccountUpdateAccountExternalEndpoint
      parameters:
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
