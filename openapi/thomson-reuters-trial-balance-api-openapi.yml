    EMMainDataTransferObjectsModelsExternalTBTrialBalanceResponseExternalDto:
      type: object
      description: Response model containing paginated trial balance account data for a specific view configuration.
      additionalProperties: false
      properties:
        pagedAccountItems:
          description: Paginated collection of trial balance accounts with complete account details, balances, and classifications.
          oneOf:
          - $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBPageQueryResultsCollectionExternalDtoOfAccountExternalDto'
        viewKey:
          type: integer
          description: The view configuration key that was used to retrieve this data. Matches the ViewConfigKey from the request.
          format: int32
          example: 123
    EMMainDataTransferObjectsModelsExternalGroupingSubcodeExternal:
      type: object
      description: Represents a subcode within a parent grouping code, providing finer classification within a major category. Subcodes allow for detailed account organization (e.g., "Current Assets" and "Non-Current Assets" within "Assets").
      additionalProperties: false
      properties:
        groupingCodeKey:
          type:
          - integer
          - 'null'
          description: The unique identifier of the parent grouping code that this subcode belongs to.
          format: int32
          example: 12345
        groupingSubcodeKey:
          type:
          - integer
          - 'null'
          description: The unique identifier for this subcode. Omit when creating new subcodes; include when updating existing subcodes.
          format: int32
          example: 67890
        code:
          type:
          - string
          - 'null'
          description: The short subcode identifier (e.g., "CA" for Current Assets, "NCA" for Non-Current Assets).
          example: CA
        description:
          type:
          - string
          - 'null'
          description: The description of this subcode (e.g., "Current Assets", "Non-Current Assets", "Current Liabilities").
          example: Current Assets
        accountType:
          type:
          - string
          - 'null'
          description: Optional account type filter for this subcode (e.g., "Asset", "Liability"). Restricts which account types can be assigned to this subcode.
          example: Asset
        displayIndex:
          type: integer
          description: Display order index for sorting subcodes within the parent code. Lower numbers appear first.
          format: int32
          example: 20
    EMMainDataTransferObjectsModelsExternalTBAccountExternalDto:
      type: object
      description: Comprehensive trial balance account model containing all account properties, balances, classifications, tax codes, and fund information. This is the primary response model when retrieving trial balance account data.
      additionalProperties: false
      properties:
        accountDbKey:
          type: integer
          description: The unique database identifier for this account (AccountKey). Use this value for update and delete operations.
          format: int32
          example: 456
        accountNumber:
          type: string
          description: The account number, which is unique within the engagement. This is the primary identifier users see for the account.
          example: '1000'
        description:
          type: string
          description: The account description or name (e.g., "Cash - Operating Account", "Accounts Receivable").
          example: Cash - Operating Account
        propertyCode:
          type: string
          description: Property code for multi-property engagements. Identifies which property this account belongs to.
          example: PROP001
        tickMark:
          type: integer
          description: Tick mark identifier for audit trail. Links to a tick mark definition indicating review or verification performed.
          format: int32
          example: 1
        tickMarkImage:
          type: array
          description: Tick mark image data as an array of integers. Contains the visual representation of the tick mark.
          items:
            type: integer
            format: int32
        taxCode:
          type: string
          description: The tax code assigned to this account for tax reporting.
          example: '1'
        taxSubCode:
          type: string
          description: The tax subcode for finer tax classification.
          example: a
        m3Code:
          type: string
          description: The M3 code assignment for Schedule M-3 tax reconciliation.
          example: '1'
        m3Subcode:
          type: string
          description: The M3 subcode for finer M3 classification.
          example: a
        accountType:
          type: string
          description: The account type classification (e.g., "Asset", "Liability", "Equity", "Revenue", "Expense").
          example: Asset
        tbPerKey:
          type: integer
          description: The trial balance period key this account data is associated with.
          format: int32
          example: 789
        tickMarkUserId:
          type: integer
          description: The user ID of the user who last updated the tick mark for this account.
          format: int32
          example: 12345
        tickMarkUserName:
          type: string
          description: The name of the user who last updated the tick mark for this account.
          example: John Doe
        taxCodeKey:
          type: integer
          description: The unique identifier for the tax code assigned to this account.
          format: int32
          example: 67890
        taxSubcodeKey:
          type: integer
          description: The unique identifier for the tax subcode assigned to this account.
          format: int32
          example: 11223
        m3CodeKey:
          type: integer
          description: The unique identifier for the M3 code assigned to this account.
          format: int32
          example: 22334
        m3SubcodeKey:
          type: integer
          description: The unique identifier for the M3 subcode assigned to this account.
          format: int32
          example: 33445
        wPRef:
          type: string
          description: Workpaper reference linking this account to supporting workpapers or documentation. JSON property name is "wPRef".
          example: A-1
        wpKey:
          type: integer
          description: The workpaper key if this account is linked to a specific workpaper.
          format: int32
          example: 44556
        wpFileSystemDocumentId:
          type: string
          description: The file system document identifier for the linked workpaper.
          example: doc_12345
        balances:
          type: array
          description: List of balance amounts for this account across different periods and balance types. Each entry contains an amount, binding name, balance type, and period information.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBAccountBalanceExDto'
        grpCodeSubcodes:
          type: array
          description: List of grouping code and subcode assignments for this account. Shows how this account is classified for financial statement preparation.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalTBGroupingCodeSubcodeExDto'
        priorBalanceChanged:
          type: boolean
          description: Indicates whether the prior period balance for this account has been modified. True if prior balance was changed.
          example: false
        accountDivisionKey:
          type: integer
          description: The division key for this account in divisional accounting structures.
          format: int32
          example: 55667
        fundGroupCategoryKey:
          type: integer
          description: The fund group category key for fund accounting. Used in governmental and nonprofit fund structures.
          format: int32
          example: 66778
        fundGroupTypeKey:
          type: integer
          description: The fund group type key for fund accounting.
          format: int32
          example: 77889
        fundGroupCodeKey:
          type: integer
          description: The fund group code key for fund accounting.
          format: int32
          example: 88990
        fundGroupSubcodeKey:
          type: integer
          description: The fund group subcode key for finer fund classification.
          format: int32
          example: 99001
        fundCategoryDescription:
          type: string
          description: Description of the fund category this account belongs to (e.g., "General Fund", "Special Revenue Fund").
          example: General Fund
        fundTypeDescription:
          type: string
          description: Description of the fund type (e.g., "Governmental", "Proprietary", "Fiduciary").
          example: Governmental
        fundCodeDescription:
          type: string
          description: Description of the specific fund code.
          example: General Operating
        fundSubCodeDescription:
          type: string
          description: Description of the fund subcode for finer fund classification.
          example: Unrestricted
        fundCode:
          type: string
          description: The short fund code identifier.
          example: GF
        fundSubCode:
          type: string
          description: The short fund subcode identifier.
          example: UR
    EMMainDataTransferObjectsModelsGroupingCode:
      type: object
      description: Represents a grouping code within an account grouping schedule, defining a classification category for trial balance accounts (e.g., "Assets", "Liabilities", "Revenue").
      additionalProperties: false
      required:
      - code
      - description
      properties:
        groupingScheduleKey:
          type:
          - integer
          - 'null'
          description: Reference to the parent grouping schedule that contains this code.
          format: int32
          example: 6016689
        groupingCodeKey:
          type:
          - integer
          - 'null'
          description: Unique identifier for this specific grouping code within the schedule.
          format: int32
          example: 123456
        code:
          title: Code
          type: string
          description: Short alphanumeric code identifying this grouping category (e.g., "A" for Assets, "L" for Liabilities). Maximum 15 characters.
          maxLength: 15
          minLength: 1
          example: A
        description:
          title: Description
          type: string
          description: Human-readable description of this grouping code's purpose and meaning. Maximum 50 characters.
          maxLength: 50
          minLength: 1
          example: Assets
        displayIndex:
          type:
          - integer
          - 'null'
          description: Display order for presenting this grouping code in user interfaces. Lower numbers appear first.
          format: int32
          example: 1
        editable:
          type:
          - boolean
          - 'null'
          description: Flag indicating whether users can edit or modify this grouping code and its subcodes.
          example: true
        subcodes:
          type:
          - array
          - 'null'
          description: 'Collection of subcodes that provide further classification within this grouping code (e.g., under "Assets": "Current Assets", "Fixed Assets").'
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsGroupingSubcode'
        bindingName:
          type: string
          description: Internal binding name used for UI data binding and display purposes.
          example: Assets
        groupingScheduleCodeguid:
          type:
          - string
          - 'null'
          description: Globally unique identifier (GUID) for this grouping schedule code, used for tracking and synchronization across systems.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    EMMainDataTransferObjectsModelsAccountSaveAccountResponse:
      type: object
      description: Response model returned after successfully creating a new trial balance account.
      additionalProperties: false
      properties:
        accountId:
          type: integer
          description: The unique identifier (AccountKey) assigned to the newly created account. Use this value for subsequent update or delete operations.
          format: int32
          example: 456
    EMMainDataTransferObjectsModelsExternalTBGroupingScheduleExternal:
      type: object
      description: Represents an account grouping schedule configuration for organizing trial balance accounts into financial statement categories and reporting structures.
      additionalProperties: false
      properties:
        groupingScheduleKey:
          type: integer
          description: Unique identifier for the grouping schedule. Use this key to load specific grouping codes and subcodes via other endpoints.
          format: int32
          example: 6016689
        displayIndex:
          type:
          - integer
          - 'null'
          description: Display order for presenting this grouping schedule in user interfaces. Lower numbers appear first.
          format: int32
          example: 1
        firmLevel:
          type:
          - boolean
          - 'null'
          description: Indicates whether this is a firm-level schedule (true) shared across all engagements, or engagement-specific (false).
          example: false
        description:
          type: string
          description: Human-readable description explaining the purpose of this grouping schedule (e.g., "Balance Sheet", "Income Statement", "Tax Return").
          example: Balance Sheet
        disabled:
          type: boolean
          description: Flag indicating whether this grouping schedule is currently disabled and should not be used.
          example: false
        editable:
          type: boolean
          description: Flag indicating whether users can edit the grouping codes and structure within this schedule.
          example: true
        accountGroupingIndex:
          type:
          - integer
          - 'null'
          description: Optional index for account grouping display order within the schedule structure.
          format: int32
          example: 1
        codes:
          type: array
          description: Collection of grouping codes that define the classification structure for accounts within this schedule.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsGroupingCode'
    EMMainDataTransferObjectsModelsExternalTBUpdateAccountBalanceExDto:
      type: object
      description: Represents a balance update for a specific trial balance period. Used when updating account balances to specify the period, amount, and balance type.
      additionalProperties: false
      properties:
        tbPerKey:
          type:
          - integer
          - 'null'
          description: The trial balance period key identifying which period this balance applies to. Obtain from GET /external/v1/trialbalance/periods/{engagementId}.
          format: int32
          example: 789
        amount:
          type: number
          description: The balance amount. Positive values typically represent debits for asset and expense accounts, credits for liability, equity, and revenue accounts.
          format: decimal
          example: 125000.5
        balanceType:
          type: string
          description: The type of balance (e.g., "Current", "Prior", "Adjusted", "Unadjusted").
          example: Current
