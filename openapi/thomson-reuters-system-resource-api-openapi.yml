info:
  title: Thomson Reuters System Resource API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged System Resource across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: System Resource
paths:
  /{version}/configuration/filetypefunctions:
    get:
      tags:
      - System Resource
      summary: Check filetype functions
      description: 'API method to check if the file type is supported for a specific functionality. For example if a file type is supported by online viewer or not. The client will send a single file extension in query string for which it wants to find the available functions, and in response Collaborate will respond with available functions for that filetype.


        Confirmations and assumptions

        Access rights of this API has been given a value of "ACCESS_ALL", which means everyone with a valid account can access this method.


        Filetype parameter is a required parameter.

        If blank filetype query parameter is supplied then an error message will be returned.

        A error message is displayed If filetype query param contains any of the following characters \ / ? : * " > < | .

        If the filetype is not present in the Collaborate system and the filetype is controlled in Collaborate using a block list. If the requested filetype is not present in the black list then default values will be returned for this filetype.

        An error message is returned if the requested filetype parameter has a length greater than 50 characters.


        "allowed" tag in the response XML determines if file of that type can be added to the system or not. A value of 0 means that a file with the specific extension cannot be inserted in the system and 1 means it can be inserted into the system.'
      operationId: getSupportedFileTypeInfoByFileType
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: filetype
        in: query
        description: Provide the file extension for which the details are required
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/configuration'
            application/json:
              schema:
                $ref: '#/components/schemas/configuration'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occured while gettting filetypes
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
