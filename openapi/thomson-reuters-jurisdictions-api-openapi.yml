tags:
- name: Jurisdictions
paths:
  /jurisdictions:
    get:
      tags:
      - Jurisdictions
      summary: Retrieve a list of Jurisdictions
      description: 'Use this operation to fetch a standard list of jurisdictions in ONESOURCE. Warning: This API call may return large set of records, depending on your filter settings. Enter the type of jurisdiction to further filter the list'
      operationId: RetrieveAListOfJurisdictions
      parameters:
      - name: Accept-Language
        in: header
        description: Accept Language
        required: false
        schema:
          type: string
      - name: X-LoneStar-AccountId
        in: header
        description: AccountId you want to access if you are a support user
        required: false
        schema:
          type: string
      - name: clientId
        in: header
        description: Client Id of the tenant
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: The Jurisdiction type that will be searched.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionSearchResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
        '500':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV1'
      security:
      - Authorization: []
      x-operation-id-source: normalized
      x-operation-id-original: Retrieve a list of Jurisdictions
    put:
      tags:
      - Jurisdictions
      summary: Update jurisdiction records of an account
      description: Use this operation to update the jurisdiction records of an account
      operationId: UpdateJurisdictionRecordsOfAnAccount
      requestBody:
        description: jurisdictions
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UpdateJurisdictions'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateJurisdictions'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
        '500':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - Authorization: []
      x-operation-id-source: normalized
      x-operation-id-original: Update jurisdiction records of an account
    servers:
    - url: https://api.onesourcetax.com/administration/v1
  /master-data/jurisdictions:
    get:
      tags:
      - Jurisdictions
      summary: This endpoint fetches the details of all Jurisdictions supported in the system
      operationId: Jurisdictions_GetJurisdictions
      parameters:
      - name: Authorization
        in: header
        description: The authorization token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Jurisdictions.JurisdictionListModelApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Jurisdictions.JurisdictionListModelApiResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Jurisdictions.JurisdictionListModelApiResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Jurisdictions.JurisdictionListModelApiResponse'
    servers:
    - url: https://api-emea.onesourcetax.com/indirect-tax-compliance/v2
