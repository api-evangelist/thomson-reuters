tags:
- name: StateProvision
  description: Retrieves state tax provision broken out by states.
paths:
  /odata/v1/StateProvision:
    get:
      tags:
      - StateProvision
      description: Retrieves all state provisions based on the provided OData query options.
      summary: Gets all state provisions
      parameters:
      - name: $top
        in: query
        description: The max number of records.
        required: false
        schema:
          type: integer
      - name: $skip
        in: query
        description: The number of records to skip.
        required: false
        schema:
          type: string
      - name: $filter
        in: query
        description: A function that must evaluate to true for a record to be returned.
        required: false
        schema:
          type: string
      - name: $select
        in: query
        description: Specifies a subset of properties to return. Use a comma separated list.
        required: false
        schema:
          type: string
      - name: $orderby
        in: query
        description: Determines what values are used to order a collection of records.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the list of state provisions.
          content:
            application/json;odata.metadata=minimal;odata.streaming=true:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateProvision'
        '401':
          description: Unauthorized access due to invalid token or credentials.
        '500':
          description: Internal server error while fetching state provisions.
      operationId: getOdataV1StateProvision
      x-operation-id-source: derived
