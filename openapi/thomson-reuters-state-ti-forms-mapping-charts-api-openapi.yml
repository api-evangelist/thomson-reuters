      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves State Ti Forms Mapping Charts By Jurisdiction code and return type
  /v1/state-ti-forms-mapping-charts/{year}/tax-lines:
    get:
      tags:
      - State Ti Forms Mapping Charts
      summary: Returns the matching Tax Return Lines of corresponding Forms Mapping Charts…
      operationId: RetrievesMatchingTaxReturnLinesForTheRequestedFormsMappingCharts
      parameters:
      - name: year
        in: path
        required: true
        schema:
          type: string
      - name: chartIds
        in: query
        description: Multiple Chart IDs delimited by comma (,) either as inclusion or exclusion list.
        required: false
        schema:
          type: string
      - name: includeAll
        in: query
        description: Set to true to include all charts.
        required: false
        schema:
          type: string
          default: ''
          enum:
          - true
          - false
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateTiFormsMappingChartTaxlines'
              examples:
                state-ti-forms-mapping-charts-taxlines:
