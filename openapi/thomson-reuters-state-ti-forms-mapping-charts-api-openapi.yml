openapi: 3.2.0
info:
  title: ONESOURCE Income Tax Charts State Ti Forms Mapping Charts…
  description: 'Charts are used to identify Tax Return Code (TRC) and Tax Combination Code (TCC) accounts and adjustments for multiple entities and binders. Use REST APIs to automatically manipulate basic chart functions.


    The charts are related by using elements from other charts to create a set of charts. Each set of charts is then assigned to an entity to use for TRC/TCCs, accounts, and adjustments. Chart assignments are either Common or Separate.'
  termsOfService: ''
  version: v1
servers:
- url: https://api.onesourcetax.com/income-tax/charts
security:
- Authorization: []
tags:
- name: State Ti Forms Mapping Charts
paths:
  /v1/state-ti-forms-mapping-charts/{year}:
    get:
      tags:
      - State Ti Forms Mapping Charts
      summary: Returns the list of State Ti Forms Mapping Charts based on year.
      operationId: RetrievesStateTiFormsMappingCharts
      parameters:
      - name: year
        in: path
        required: true
        schema:
          type: string
      - name: returnType
        in: query
        description: Tax Return Type
        required: false
        schema:
          type: string
      - name: companyType
        in: query
        description: Company Type
        required: false
        schema:
          type: string
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateTiChartsRepresentation'
              examples:
                state-ti-forms-mapping-charts:
                  $ref: '#/components/examples/state-ti-forms-mapping-charts'
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves State Ti Forms Mapping Charts
    patch:
      tags:
      - State Ti Forms Mapping Charts
      summary: Maps or unmaps tax form lines to state TI chart.
      operationId: mapOrUnmapMultipleStateTiFormMappingCharts
      parameters:
      - name: year
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      - name: Content-Type
        in: header
        description: Indicates the response content media type to return.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonPatchDocumentStateTiFormsLineMappingRepresentation'
            examples:
              state-ti-forms-line-mapping-parent-category-map:
                $ref: '#/components/examples/state-ti-forms-line-mapping-parent-category-map'
              state-ti-forms-line-mapping-parent-category-unmap:
                $ref: '#/components/examples/state-ti-forms-line-mapping-parent-category-unmap'
              state-ti-forms-line-mapping-child-category-map:
                $ref: '#/components/examples/state-ti-forms-line-mapping-child-category-map'
              state-ti-forms-line-mapping-child-category-unmap:
                $ref: '#/components/examples/state-ti-forms-line-mapping-child-category-unmap'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateTiFormsLineMappingMultipleResponseRepresentations'
              examples:
                state-ti-forms-mapping-charts-success-responses:
                  $ref: '#/components/examples/state-ti-forms-mapping-charts-success-responses'
        '207':
          description: One or more operations failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateTiFormsLineMappingMultipleResponseRepresentations'
              examples:
                state-ti-forms-mapping-charts-multiple-responses:
                  $ref: '#/components/examples/state-ti-forms-mapping-charts-multiple-responses'
        '400':
          description: Request failed. This is usually due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemRepresentation'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
          content: {}
        '500':
          description: Unexpected error encountered. Contact ONESOURCE Technical Support.
          content: {}
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: map or unmap Multiple State Ti Form Mapping Charts
  /v1/state-ti-forms-mapping-charts/{year}/jurisdictions/{jurisdictionCode}/return-types/{returnType}:
    get:
      tags:
      - State Ti Forms Mapping Charts
      summary: Returns the list of State Ti Forms Mapping Charts based on year, jurisdiction…
      operationId: RetrievesStateTiFormsMappingChartsByJurisdictionCodeAndReturnType
      parameters:
      - name: year
        in: path
        required: true
        schema:
          type: string
      - name: jurisdictionCode
        in: path
        description: Jurisdiction Code
        required: true
        schema:
          type: string
      - name: returnType
        in: path
        description: Tax Return Type
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
