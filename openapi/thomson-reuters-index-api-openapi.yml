          text/xml:
            schema:
              $ref: '#/components/schemas/IndexAddRequestV1'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IndexAddRequestV1'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexValidationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/IndexValidationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/IndexValidationResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/IndexValidationResponse'
      security:
      - ApiKeyAuth: []
      x-codegen-request-body-name: request
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/indexes/{indexId}/dynamicrules:
    get:
      tags:
      - Index
      summary: Get dynamic rules
      description: Gets the list of dynamic rules configured for the specified index.
      operationId: Index_GetDynamicRulesForIndex
      parameters:
      - name: indexId
        in: path
        description: The index identifier.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DynamicRule'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DynamicRule'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DynamicRule'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DynamicRule'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/indexes/{indexId}/lookuplist:
    post:
      tags:
      - Index
      summary: Loads a list of values for a lookup list index, filtered by the specified index…
      description: This method is designed for use with autocomplete fields. A separate method should be created for getting a full, paginated list for the document index.
      operationId: Index_LookupListFind
      parameters:
      - name: indexId
        in: path
        description: The index identifier.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The request object for search for lookup list values.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupListSearchV1'
          text/json:
            schema:
              $ref: '#/components/schemas/LookupListSearchV1'
          application/xml:
            schema:
              $ref: '#/components/schemas/LookupListSearchV1'
          text/xml:
            schema:
              $ref: '#/components/schemas/LookupListSearchV1'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LookupListSearchV1'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupListItemV1'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupListItemV1'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupListItemV1'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupListItemV1'
      security:
      - ApiKeyAuth: []
      x-codegen-request-body-name: lookuplistSearch
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
components:
  schemas:
    LookupListItemV1:
      type: object
      properties:
        Index:
          $ref: '#/components/schemas/DocumentIndexValueV1'
        LinkedIndexes:
          type: array
          description: The indexes that are linked to the parent index. Provides their index IDs, values, and lookup link ID.
          items:
            $ref: '#/components/schemas/DocumentIndexValueV1'
      description: Represents an item in a lookup list. Represents the value in the list that's being searched on along with a list of linked lookup list values.
    DocumentIndexValueV1:
      type: object
      properties:
        IndexId:
          type: string
          description: Gets or sets the index identifier. This is a required field for document filtering.
        IndexValue:
          type: string
          description: Gets or sets the index value. This is a required field for document filtering.
      description: Represents an index to add to a document.
    IndexValidationError:
      type: object
      properties:
        IndexId:
          type: string
          description: Gets or sets the index identifier.
        IndexItemException:
          type: string
          description: Gets or sets the index item exception.
      description: Represents an error during the index validation process. Contains information about the index the error occurred on and details about the error to be relayed to the user.
    DynamicRule:
      type: object
      properties:
        DynamicRuleId:
          type: string
          description: Gets or sets the dynamic rule identifier.
        Value:
          type: string
          description: The value being compared to for the dynamic rule.
        DependentIndexId:
          type: string
          description: The index ID that becomes required based on this dynamic rule.
        Condition:
          type: string
          description: The comparison condition to evaluate this rule on.
          enum:
          - EqualTo
          - NotEqualTo
          - GreaterThan
          - LessThan
          - GreaterThanOrEqualTo
          - LessThanOrEqualTo
          - Empty
          - NotEmpty
      description: A class representing a dynamic rule.
    DocumentIndexV1:
      type: object
      properties:
        IndexId:
          type: string
          description: Gets or sets the index identifier. This is a required field for document filtering.
        IndexName:
          type: string
          description: Gets or sets the name of the index.
        IndexType:
          type: string
          description: Gets or sets the index type identifier. This is a required field for document filtering.
          enum:
          - String
          - Integer
          - Date
          - Currency
          - Float
          - DateTime
          - List
        Length:
          type: integer
          description: Gets or sets the length of the field.
          format: int32
        Required:
          type: boolean
          description: Gets or sets a value indicating whether this index is required. All required indexes must be specified to index a document.
        ListId:
          type: integer
          description: Gets of sets list ID value.
          format: int32
        LookupAutoUpdate:
          type: boolean
        ChildIndexId:
          type: string
      description: Represents an index on a document.
    IndexAddRequestV1:
      type: object
      properties:
        DrawerId:
          type: string
          description: Gets or sets the drawer identifier.
        Indexes:
          type: array
          description: Gets or sets the list of indexes.
          items:
            $ref: '#/components/schemas/DocumentIndexValueV1'
      description: Represents a request to validate a set of indexes.
    MultivalueListItem:
      type: object
      properties:
        ListId:
          type: integer
          description: The list that this item belongs to.
          format: int32
        HasChildren:
          type: boolean
          description: Whether this list item has children.
        ChildListId:
          type: integer
          description: If the list item has children, the list ID of its child list.
          format: int32
        ListEntryId:
          type: integer
          description: The list entry ID of this item.
          format: int32
        Value:
          type: string
          description: The contents of this list item.
        ChildIndexId:
          type: string
          description: The index ID whose list is a child of this list. The full contents of the child list can be accessed using a combination of this and the ChildListId.
      description: Represents an item in a multivalue list.
    IndexValidationResponse:
      type: object
      properties:
        IsValid:
          type: boolean
          description: Whether the validation was successful.
        Errors:
          type: array
          description: The list of errors as associated with their index.
          items:
            $ref: '#/components/schemas/IndexValidationError'
        ErrorMessage:
          type: string
          description: An overall error message, not associated with a particular index. More general information for the user.
      description: A class containing information about the index validation attempt. Returns if valid and, if invalid, returns a list of errors associated with indexes and a general error message.
