info:
  title: Thomson Reuters Index API
  version: v1
  description: 'Operations tagged Index across 3 of this provider''s published API definitions: thomson-reuters-gofileroom-web-api-v1-v1-openapi.json, thomson-reuters-gofileroom-web-api-v1-openapi.yml, thomson-reuters-gofileroom-web-api-v1-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.thomsonreuters.com/gofileroom
tags:
- name: Index
  description: Index
paths:
  /api/v1/drawers/{drawerId}/indexes:
    get:
      tags:
      - Index
      summary: Get drawer indexes
      description: An endpoint used that can be used to retrieve a list of document indexes that are set up for the drawer.
      operationId: Index_GetDocumentIndexesForDrawerV1
      parameters:
      - name: drawerId
        in: path
        description: The drawer ID.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentIndexV1'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentIndexV1'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentIndexV1'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentIndexV1'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/indexes/{indexId}/values:
    get:
      tags:
      - Index
      summary: Get a list for an index
      description: An endpoint that provides all the entries for a list type index.
      operationId: Index_GetAllListTypeIndexData
      parameters:
      - name: indexId
        in: path
        description: The index identifier.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: listId
        in: query
        description: The list to use for this index. If not specified, the default list is used for the index.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultivalueListItem'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultivalueListItem'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultivalueListItem'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultivalueListItem'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/indexes/{indexId}/values/childindexlist/{childListId}:
    get:
      tags:
      - Index
      summary: Get the child values of an index
      description: An endpoint that returns a list of child index values based on the list ID, which is provided when the parent list value is selected.
      operationId: Index_GetDocumentChildIndexesForDrawer
      parameters:
      - name: indexId
        in: path
        description: The index we're searching on.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: childListId
        in: path
        description: The list identifier of the specific list we want to load.
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int32
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultivalueListItem'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultivalueListItem'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultivalueListItem'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MultivalueListItem'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/indexes/validate:
    post:
      tags:
      - Index
      summary: Check index validity
      description: An endpoint used to check whether the indexes provided are valid.
      operationId: Index_ValidateIndexesV1
      parameters:
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexAddRequestV1'
          text/json:
            schema:
              $ref: '#/components/schemas/IndexAddRequestV1'
