paths:
  /matters/{matterId}/firms/{firmId}/taskcodealerts:
    get:
      tags:
      - TaskCodeAlerts
      summary: Gets Task Code Alerts for specific matter
      operationId: Matters_GetTaskCodeAlerts
      parameters:
      - name: matterId
        in: path
        description: Matter identifier.
        required: true
        schema:
          type: integer
          format: int32
      - name: firmId
        in: path
        description: Firm identifier. Input to target Additional Firms/Vendors.
        required: true
        schema:
          type: integer
          format: int32
      - name: If-None-Match
        in: header
        description: Executes a request only if the passed ETag doesn't equal the current resource ETag (i.e. resource has changed).
        schema:
          type: string
      responses:
        '200':
          description: Returns Task Code Alerts for specific firm in a matter.
          headers:
            ETag:
              description: Entity tag is part of HTTP provided for web cache validation problem, but also used for optimistic concurrency control.
              schema:
                type: string
                description: Entity tag is part of HTTP provided for web cache validation problem, but also used for optimistic concurrency control.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCodeAlertsView'
        '304':
          description: Returns a not modified response with empty body.
        '400':
          description: 'Identifier: matterId or firmId is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Current user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Current user is not authorized to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Matter or firm was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - TaskCodeAlerts
      summary: Patches Task Code Alerts for specific firm in a matter
      operationId: Matters_PatchTaskCodeAlerts
      parameters:
      - name: matterId
        in: path
        description: Matter identifier.
        required: true
        schema:
          type: integer
          format: int32
      - name: firmId
        in: path
        description: Firm identifier. Input '0' to target Additional Firms/Vendors.
        required: true
        schema:
          type: integer
          format: int32
      - name: If-Match
        in: header
        description: Executes a request only if the passed ETag equals the current resource ETag (i.e. resource hasn't changed).
        schema:
          type: string
