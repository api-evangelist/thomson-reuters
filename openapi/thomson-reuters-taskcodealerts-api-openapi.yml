      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            target:
              type: string
            details:
              type: array
              items:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  target:
                    type: string
            innererror:
              type: object
              description: The structure of this object is service-specific.
    TaskCodeAlertsPhase:
      required:
      - phase
      type: object
      properties:
        phase:
          type: string
          description: Alphanumeric representation of the Phase.
          example: PA3
        shortName:
          type:
          - string
          - 'null'
          description: Gets or Sets ShortName
          readOnly: true
          example: Domestic Preparation
        amountTotalPerMatter:
          type:
          - number
          - 'null'
          description: Gets or Sets Total AmountPerMatter
          format: double
        amountSpentPerMatter:
          type:
          - number
          - 'null'
          description: Gets or Sets Spent AmountPerMatter
          format: double
          readOnly: true
        taskCodes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TaskCodeAlertsTaskCode'
          description: Gets or Sets TaskCodes
      additionalProperties: false
    TaskCodeAlertsView:
      title: TaskCodeAlertsModel
      type: object
      properties:
        updateDate:
          type:
          - string
          - 'null'
          description: Update Date
        comment:
          type:
          - string
          - 'null'
          description: Revision comment.
        priorComment:
          type:
          - string
          - 'null'
          description: Previous revision comment.
        approvalStatus:
          $ref: '#/components/schemas/ApprovalStatus'
        isLocked:
          type:
          - boolean
          - 'null'
          description: Specifies whether the task code alerts for the firm is locked or not.
          example: false
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TaskCodeAlertsCodeSet'
          description: Gets or Sets Value
      additionalProperties: false
    PatchTaskCodeAlertsModel:
      title: UpdateTaskCodeAlertsModel
      required:
      - comment
      type: object
      properties:
        comment:
          type: string
          description: Revision comment.
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TaskCodeAlertsCodeSet'
          description: Gets or Sets Value
      additionalProperties: false
    ApprovalStatus:
      enum:
      - PendingCo
      - Acknowledged
      - Approved
      - Rejected
      - Modified
      - PendingFirm
      - PreAcknowledged
      type: string
      description: The approval status of the task code alerts.
    TaskCodeAlertsCodeSet:
      required:
      - codeSet
      type: object
      properties:
        codeSet:
          type: string
          description: Alphabetic representation of the Code Set.
          example: PA
        shortName:
          type:
          - string
          - 'null'
          description: Gets or Sets ShortName
          readOnly: true
          example: Patent
        amountTotalPerMatter:
          type:
          - number
          - 'null'
          description: Gets or Sets Total AmountPerMatter
          format: double
        amountSpentPerMatter:
          type:
          - number
          - 'null'
          description: Gets or Sets Spent AmountPerMatter
          format: double
          readOnly: true
        phases:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TaskCodeAlertsPhase'
          description: Gets or Sets Phases
      additionalProperties: false
    TaskCodeAlertsTaskCode:
      required:
      - taskCode
      type: object
      properties:
        taskCode:
          type: string
          description: Alphanumeric representation of the Task Code.
          example: PA310
        shortName:
          type:
          - string
          - 'null'
          description: Gets or Sets ShortName
          readOnly: true
          example: Provisional Application Prep.-Domestic
        amountPerMatter:
          type:
          - number
          - 'null'
          description: Gets or Sets AmountPerMatter
          format: double
        amountPerLine:
          type:
          - number
          - 'null'
          description: Gets or Sets AmountPerLine
          format: double
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.thomsonreuters.com/onepass/oauth2/token?grant_type=client_credentials
          scopes:
            access: Grants access to Tracker APIs
    Token:
      type: http
      description: Access token (TR Account)
      scheme: bearer
