          * return=minimal: The response will not include the entity in the response. A successful request would result in a status of 204 to be returned.'
        schema:
          type: string
        example: return=representation
      requestBody:
        description: The model containing Task Code Alerts to be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTaskCodeAlertsModel'
      responses:
        '200':
          description: Returns Patched Task Code Alerts for specific firm in a matter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCodeAlertsView'
        '204':
          description: Task Code Alerts got patched but will not be provided in the response body.
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
