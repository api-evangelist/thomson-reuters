openapi: 3.2.0
info:
  title: Thomson Reuters Private Message API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Private Message across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Private Message
paths:
  /{version}/conversations:
    get:
      tags:
      - Private Message
      summary: Get Conversations
      description: 'Method to obtain messages

        This method is supported in version 4 of the API and above'
      operationId: getConversations
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: searchtext
        in: query
        description: search input
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: "ACTIVE (default)\n UNREAD\n ARCHIVED"
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: The integer value of the last message conversation fetched
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: 'No of message conversations to return in one request. Default is 6 and the maximum value is 25<br>If a value of 0 or less is provided in the request then 6 message conversations will be returned.<br>If a value of more than 25 is provided then 25 message conversations are returned. '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Conversations returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting conversations
      security:
      - OAuth: []
    post:
      tags:
      - Private Message
      summary: New conversation
      description: Add new message API
      operationId: newConversation
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      responses:
        '200':
          description: Conversation created successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ConversationDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ConversationDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while creating new conversation
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/ConversationDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/ConversationDBO'
    servers:
    - url: /monumentuat/api
  /{version}/conversations/users:
    get:
      tags:
      - Private Message
      summary: Get
      description: 'Method to obtain message recipients

        This method is supported in version 8 of the API and above'
      operationId: getUsers
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '8'
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Conversationusers returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/users'
            application/json:
              schema:
                $ref: '#/components/schemas/users'
            text/xml:
              schema:
                $ref: '#/components/schemas/users'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting conversation messages
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/conversations/{conversationid}/messages:
    get:
      tags:
      - Private Message
      summary: Get Conversation Messages
      description: 'Method to obtain message conversation

        This method is supported in version 4 of the API and above'
      operationId: getConversationMessages
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: lastContentId
        in: query
        description: The integer value of the last message fetched.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'No of messages to return in one request. Default is 20  and the maximum value is 100

          If a value of 0 or less is provided in the request then 20 message will be returned.

          If a value of more than 100 is provided then 100 messages are returned.'
        required: false
        schema:
          type: string
      - name: conversationid
        in: path
        description: Conversation ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Conversation messages returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting conversation messages
      security:
      - OAuth: []
    post:
      tags:
      - Private Message
      summary: Reply on Message Conversation
      description: Reply on message conversation API
      operationId: replyConversation
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: conversationid
        in: path
        description: Conversation ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Conversation replied successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ConversationDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ConversationDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while replying conversation
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/MessageDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/MessageDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/MessageDBO'
    servers:
    - url: /monumentuat/api
  /{version}/conversations/{conversationid}/messages/{messageid}:
    get:
      tags:
      - Private Message
      summary: Get Conversation Messages
      description: 'Method to obtain message conversation

        This method is supported in version 8 of the API and above'
      operationId: getConversationMessage
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '8'
      - name: conversationid
        in: path
        description: Conversation ID
        required: true
        schema:
          type: string
      - name: messageid
        in: path
        description: Message ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Conversation messages returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting conversation messages
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/conversations/{conversationid}:
    put:
      tags:
      - Private Message
      summary: Update Message Conversation
      description: Update message conversation API
      operationId: updateConversation
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: conversationid
        in: path
        description: Conversation ID
        required: true
        schema:
          type: string
      - name: action
        in: query
        description: "Actions\n        MARK_AS_READ\n        MARK_AS_UNREAD\n        MARK_AS_ARCHIVE\n        DELETE"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Conversation updated successfully
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while updating conversation
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
