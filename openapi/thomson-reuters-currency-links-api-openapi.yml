              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidParameter:
                  summary: Example invalid level category error
                  value:
                    statusCode: 400
                    message: Level 1 category structure must be provided
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
