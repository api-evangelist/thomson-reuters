tags:
- name: Currency-Links
  description: Retrieve all currency links within a specified financial period.
paths:
  /{entity-id}/financial-periods/{financial-period-id}/currency-links:
    get:
      tags:
      - Currency-Links
      description: Use this operation to obtain a list of all currency links associated with a particular financial period.
      operationId: GetCurrencyLinks
      summary: Get Currency Links
      parameters:
      - name: entity-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The entity id in which the financial period is created. To obtain a reporting entity ID, refer to the [Get Reporting Entities API](#tag/reporting-entities/get/) documentation. For guidance on obtaining a template entity ID, see the [Get Template Entities API](#tag/template-entities/get/) documentation.
        example: 92abcd47-4e56-4961-b9b6-b30e00f46ba8
      - name: financial-period-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The identifier of the financial period from which account assignment details are retrieved. Obtain this ID using the [Get Financial Periods API](#tag/financial-periods/get{entity-id}/financial-periods).
        example: a5d4f2f3-5250-494d-b773-b30e00f46d48
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrencyLink'
              example:
              - id: c1d2e3f4-a5b6-7890-1234-567890fedcba
                entityId: a1b2c3d4-e5f6-7890-1234-567890abcdef
                entityCode: ENTITY001
                currencyId: CURR001
                conversionAccountId: CONVACC001
              - id: d2e3f4g5-b6c7-8901-2345-67890abcdef0
                entityId: a1b2c3d4-e5f6-7890-1234-567890abcdef
                entityCode: ENTITY001
                currencyId: CURR002
                conversionAccountId: CONVACC002
