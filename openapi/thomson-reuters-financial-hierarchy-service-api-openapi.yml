  /nodes:
    get:
      tags:
      - Financial Hierarchy Service
      summary: Get the financial hierarchy Nodes
      description: Use this operation to get list of financial hierarchy Nodes
      operationId: getAllNodes
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: include_trc_mappings
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
