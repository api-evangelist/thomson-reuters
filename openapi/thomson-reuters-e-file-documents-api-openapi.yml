tags:
- name: E-file Documents
paths:
  /v1/binders/{binderId}/e-files:
    get:
      tags:
      - E-file Documents
      summary: Use to retrieve a list of E-file for a given binder
      operationId: RetrieveAListOfE-file
      parameters:
      - name: binderId
        in: path
        description: 16 Character Binder ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eFileDocumentCategories'
              examples:
                E-Files List:
                  $ref: '#/components/examples/Efile_List'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights
        '404':
          description: Not Found
        '500':
          description: Unexpected Error Encountered. Contact ONESOURCE Technical Support.
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Retrieve a list of E-file
    servers:
    - url: https://api.onesourcetax.com/income-tax/e-file
  /v1/binders/{binderId}/e-files/{eFileId}:
    get:
      tags:
      - E-file Documents
      summary: Use to retrieve an E-file document for a given binder
      operationId: RetrieveAnE-fileDocument
      parameters:
      - name: binderId
        in: path
        description: Binder Id
        required: true
        schema:
          type: string
      - name: eFileId
        in: path
        description: eFileId in format of C000AU92.XML
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/xml: {}
            application/pdf: {}
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights
        '404':
          description: Not Found
        '500':
          description: Unexpected Error Encountered. Contact ONESOURCE Technical Support.
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Retrieve an E-file document
    servers:
    - url: https://api.onesourcetax.com/income-tax/e-file
