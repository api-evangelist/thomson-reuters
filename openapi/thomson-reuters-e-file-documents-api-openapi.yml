  version: v1
  termsOfService: None
  description: 'Operations tagged E-file Documents across 2 of this provider''s published API definitions: thomson-reuters-onesource-income-tax-e-file-api-v1-openapi.json, thomson-reuters-onesource-income-tax-e-file-api-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
