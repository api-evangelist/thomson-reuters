components:
  schemas:
    EMMainDataTransferObjectsModelsClientCreateClientResponseDto:
      type: object
      additionalProperties: false
      properties:
        isCreated:
          type: boolean
          description: Boolean flag indicating whether the client was successfully created. Returns true if the client was created, false if the client already exists.
          example: true
        message:
          type: string
          description: System-generated message about the operation result. When IsCreated is true, contains the GFR Record ID (e.g., "2595"). When IsCreated is false, contains "The client already exists".
          example: '2595'
    EMMainDataTransferObjectsModelsEMFilterCriteriaDto:
      type: object
      additionalProperties: false
      properties:
        clientNumber:
          type: string
          description: Client number filter. Supports wildcards (*) for partial matching. Use "*" to return all clients.
          example: CLI-2024-*
        clientName:
          type: string
          description: Client name filter. Supports wildcards (*) for partial matching. Use "*" to return all clients.
          example: ABC Corporation
    EmMainExtensionsUtilityErrorExtensions:
      type: object
      description: 'Provides extended metadata and diagnostic information for error responses.

        Includes status codes, error codes, timestamps, and distributed tracing identifiers.'
      additionalProperties: false
      properties:
        statusCode:
          type: integer
          description: HTTP status code (e.g., 400, 401, 403, 500)
          format: int32
          example: 401
        code:
          type: string
          description: Application-specific error code for programmatic handling
          example: ERR_AUTH_4010
        errorId:
          type: string
          description: Unique identifier (GUID) for this error occurrence. Use this when reporting issues to support.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        dateTime:
          type: string
          description: ISO 8601 timestamp (UTC) when the error occurred
          example: '2024-03-15T14:30:00Z'
        traceId:
          type: string
          description: Distributed trace ID for correlating requests across microservices (W3C Trace Context format)
          example: a1b2c3d4e5f67890abcdef1234567890
        spanId:
          type: string
          description: Span ID for this specific operation within the distributed trace (W3C Trace Context format)
          example: 358611c48f91f940
    EMMainDataTransferObjectsModelsEMClientRequestDto:
      type: object
      additionalProperties: false
      properties:
        filters:
          description: Filter criteria for searching clients by name or number. Use wildcards (*) to match any characters.
          example:
            clientName: '*'
            clientNumber: '*'
          oneOf:
          - $ref: '#/components/schemas/EMMainDataTransferObjectsModelsEMFilterCriteriaDto'
        pagination:
          description: Pagination settings to control the number of results and page navigation.
          example:
            pageNumber: 1
            size: 10
          oneOf:
          - $ref: '#/components/schemas/EMMainDataTransferObjectsModelsEMPaginationDto'
        showAllClients:
          type: boolean
          description: Determines the source of client data. When true, retrieves all clients from GoFileRoom (GFR). When false, retrieves only clients that have associated engagements/binders in the system.
          example: false
    EMMainDataTransferObjectsModelsEMPagedDataExternalResponseOfEngagementClientExternalDto:
      type: object
      additionalProperties: false
      properties:
        clients:
          type: array
          description: Collection of clients for the current page based on the pagination settings.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsEMEngagementClientExternalDto'
        totalNumberOfClients:
          type: integer
          description: Total count of all clients matching the filter criteria across all pages. Use this for pagination controls.
          format: int32
          example: 127
    EmMainExtensionsUtilityErrorDetail:
      type: object
      description: Represents detailed information about a specific error that occurred during API request processing.
      additionalProperties: false
      properties:
        message:
          type: string
          description: Gets or sets the human-readable error message describing what went wrong.
          example: '"Unauthorized access."

            "Bad request due to invalid input."

            "Resource not found."

            "An unexpected error occurred."'
        extensions:
          description: Gets or sets the extended error metadata containing additional diagnostic information.
          oneOf:
          - $ref: '#/components/schemas/EmMainExtensionsUtilityErrorExtensions'
    EMMainDataTransferObjectsModelsEMPaginationDto:
      type: object
      additionalProperties: false
      properties:
        pageNumber:
          type: integer
          description: The page number to retrieve (1-based indexing). First page is 1.
          format: int32
          example: 1
          exclusiveMinimum: 0
        size:
          type: integer
          description: 'Number of results per page. Must be one of the following values: 12, 15, 20, 50, 150, 500, 1000, 10000.

            These values correspond to the GfrPageSizeType enum values (XExtraSmall, ExtraSmall, Small, Medium, Large, ExtraLarge, XExtraLarge, XXExtraLarge).'
          format: int32
          example: 20
    EmMainExtensionsUtilityErrorResponse:
      type: object
      description: 'Represents a standardized error response structure for API errors.

        Contains a collection of detailed error information.'
      example:
        errors:
        - message: Unauthorized access.
          extensions:
            statusCode: 401
            code: ERR_AUTH_4010
            errorId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
            dateTime: '2024-03-15T14:30:00Z'
            traceId: a1b2c3d4e5f67890abcdef1234567890
            spanId: 358611c48f91f940
