  /external/v1/clients/{clientId}:
    get:
      tags:
      - Clients
      summary: Retrieve client details by ID
      description: '## Purpose

        This endpoint retrieves detailed information for a specific client using their unique client ID.


        ## Why Use This Endpoint

        - Get complete details for a specific client

        - Retrieve client information for display in your application

        - Verify client existence before performing operations


        ## How to Get Client ID

        First, use the `/clients/load-clients` endpoint to retrieve the list of clients and obtain the `clientId` value.


        ## Path Parameter

        - `clientId` (required): The unique identifier of the client. Must be a positive integer greater than 0.


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Data Source

        This endpoint retrieves client information from Advance Flow clients (clients with engagements), not from all GoFileRoom clients.


        ## Common Use Cases

        1. **Client Detail View:** Display complete client information in your application

        2. **Client Validation:** Verify a client exists before creating engagements or performing operations

        3. **Client Lookup:** Quick lookup of client details by ID


        ## Error Responses

        - `400 Bad Request`: Invalid client ID (must be greater than 0)

        - `401 Unauthorized`: Invalid or expired token

        - `404 Not Found`: Client ID does not exist or client has no engagements

        - `500 Internal Server Error`: Server or database errors'
      operationId: EmMainEndPointsExternalClientGetClientByIdEndpoint
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      responses:
        '200':
