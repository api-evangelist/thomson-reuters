paths:
  /v2/domains/{id}:
    put:
      tags:
      - Domains-📦 Version 2 Endpoints
      summary: Update domain records of an account
      description: Use this operation to update a record by its ID. It allows modifying the associated application (related apps), alternate name, or both in a single request.
      operationId: domainUpdateRequest
      parameters:
      - name: X-LoneStar-AccountId
        in: header
        description: AccountId you want to access if you are a support user
        schema:
          type: string
      - name: id
        in: path
        description: domain_id
        required: true
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        schema:
          type: string
          enum:
          - application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCustomerDataRequestV3'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionDomainCustomerDataResponseV3'
        '204':
          description: No Content
