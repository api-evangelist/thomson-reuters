    get:
      tags:
      - Domains-📦 Version 2 Endpoints
      summary: Retrieve a list of Domains
      description: Use this operation to fetch a standard paginated list of domains in ONESOURCE
      operationId: fetchAllDomainsV3
      parameters:
      - name: X-LoneStar-AccountId
        in: header
        description: AccountId you want to access if you are a support user
        schema:
          type: string
      - name: sort
        in: query
