components:
  schemas:
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
    Contact:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
      additionalProperties: false
    NewAlert:
      required:
      - description
      - firmId
      type: object
      properties:
        firmId:
          type: integer
          format: int32
        description:
          maxLength: 150
          type: string
        linkUrl:
          type:
          - string
          - 'null'
      additionalProperties: false
    Alert:
      type: object
      properties:
        id:
          type: integer
          format: int32
        firmId:
          type: integer
          format: int32
        description:
          type:
          - string
          - 'null'
        linkUrl:
          type:
          - string
          - 'null'
        createdDateTime:
          type:
          - string
          - 'null'
          format: date-time
        createdByUser:
          $ref: '#/components/schemas/Contact'
        lastModifiedDateTime:
          type:
          - string
          - 'null'
          format: date-time
        lastModifiedByUser:
          $ref: '#/components/schemas/Contact'
      additionalProperties: false
    AlertCollection:
      type: object
      properties:
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Alert'
      additionalProperties: false
    Error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              target:
                type: string
        innerError:
          required:
          - code
          - message
          type: object
          properties:
            code:
              type: string
            message:
              type: string
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.thomsonreuters.com/onepass/oauth2/token?grant_type=client_credentials
          scopes: {}
    Token:
      type: http
      description: Access token (TR Account)
      scheme: bearer
