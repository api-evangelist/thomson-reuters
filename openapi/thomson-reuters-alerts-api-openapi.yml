        schema:
          uniqueItems: true
          type: array
          items:
            enum:
            - id
            - firmId
            - description
            - linkUrl
            - createdDateTime
            - createdByUser
            - lastModifiedDateTime
            - lastModifiedByUser
            type: string
      - name: $orderby
        in: query
        description: Order items by property values, see [Sorting](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionorderby)
