      responses:
        '200':
          description: Success
          content:
            application/vnd.tri.onesource.ce.def.v1+json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Failure
      security:
      - Authorization:
        - global
      x-operation-id-source: normalized
      x-operation-id-original: Retrieve specific version of an existing entity with all its attributes
    put:
      tags:
      - Entities
      summary: Update an existing version for a particular entity
      description: Use this operation to update an existing entity version with its attributes. Enter the version Id in the URL
      operationId: UpdateAnExistingVersionForAParticularEntity
      parameters:
      - name: Accept
        in: header
        description: Content type
        required: false
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.tri.onesource.ce.def.v1+json
          default: application/json
      - name: Accept-Language
        in: header
        description: Accept Language
        required: false
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      - name: versionId
        in: path
        description: The Version attributes that will be modified
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityBaseDTO'
        description: The details about the version attributes will be updated.
      responses:
        '200':
          description: Success
          content:
            application/vnd.tri.onesource.ce.def.v1+json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Failure
      security:
      - Authorization:
        - global
      x-operation-id-source: normalized
      x-operation-id-original: Update an existing version for a particular entity
    servers:
    - url: https://api-uat.onesourcetax.com
      description: UAT
    - url: https://api.onesourcetax.com
      description: PROD
