openapi: 3.2.0
info:
  title: Thomson Reuters Entities API
  version: '1.0'
  description: 'Operations tagged Entities across 3 of this provider''s published API definitions: thomson-reuters-common-entities-service-openapi.json, thomson-reuters-onesource-indirect-tax-compliance-configuration-api-openapi.json, thomson-reuters-common-entities-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-uat.onesourcetax.com
  description: UAT
- url: https://api.onesourcetax.com
  description: PROD
- url: https://api-emea.onesourcetax.com/indirect-tax-compliance/v2
tags:
- name: Entities
paths:
  /administration/v1/entities:
    get:
      tags:
      - Entities
      summary: Retrieves a list of existing entities
      description: 'Use this operation to return a list of entities with all its attributes. Warning: This API call may return large set of records, depending on your filter settings'
      operationId: RetrievesAListOfExistingEntities
      parameters:
      - name: Accept
        in: header
        description: Content type
        required: false
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.tri.onesource.ce.def.v1+json
          default: application/json
      - name: Accept-Language
        in: header
        description: Accept Language
        required: false
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: The page of data to return (0 = first page).
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: The number of entities per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: sort
        in: query
        description: The sort string of the form [+/-]?{fieldName}
        required: false
        schema:
          type: string
          default: id
      - name: Fields
        in: query
        description: This returns all the attributes for a given Entity.
        required: false
        schema:
          type: string
      - name: include_disabled
        in: query
        description: This is to return DISABLED entities along with ACTIVE entities.
        required: false
        schema:
          type: boolean
          enum:
          - true
          - false
      responses:
        '200':
          description: Success
          content:
            application/vnd.tri.onesource.ce.def.v1+json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Failure
      security:
      - Authorization:
        - global
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves a list of existing entities
    post:
      tags:
      - Entities
      summary: Create a new entity
      description: Use this operation to create a new entity with its attributes
      operationId: CreateANewEntity
      parameters:
      - name: Accept
        in: header
        description: Content type
        required: false
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.tri.onesource.ce.def.v1+json
          default: application/json
      - name: Accept-Language
        in: header
        description: Accept Language
        required: false
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EntityBaseDTO'
        description: The details about the entities that will be added.
      responses:
        '200':
          description: Created
          content:
            application/vnd.tri.onesource.ce.def.v1+json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Failure
      security:
      - Authorization:
        - global
      x-operation-id-source: normalized
      x-operation-id-original: Create a new entity
    patch:
      tags:
      - Entities
      summary: Updates a list of existing entities
      description: Use this operation to partially update attributes for a given list of entities. This operation can be used to associate a list of entities with ONESOURCE applications to leverage the same entities across various applications
      operationId: UpdatesAListOfExistingEntities
      parameters:
      - name: Accept
        in: header
        description: Content type
        required: false
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.tri.onesource.ce.def.v1+json
          default: application/json
      - name: Accept-Language
        in: header
        description: Accept Language
        required: false
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UnitJsonPatchDTO'
        description: The input object for performing bulk update.
      responses:
        '200':
          description: Success
          content:
            application/vnd.tri.onesource.ce.def.v1+json:
              schema:
                $ref: '#/components/schemas/EntityUpdateDTOResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityUpdateDTOResponse'
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Failure
      security:
      - Authorization:
        - global
      x-operation-id-source: normalized
      x-operation-id-original: Updates a list of existing entities
    servers:
    - url: https://api-uat.onesourcetax.com
      description: UAT
    - url: https://api.onesourcetax.com
      description: PROD
