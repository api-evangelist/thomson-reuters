      - Authorization:
        - global
      x-operation-id-source: normalized
      x-operation-id-original: Retrieve latest version of an existing entity with all its attributes
    patch:
      tags:
      - Entities
      summary: Updates status of existing entity from ACTIVE to DISABLED
      description: Use this operation to update status of existing entity.
      operationId: UpdatesStatusOfExistingEntity
      parameters:
      - name: Accept
        in: header
        description: Content type
        required: false
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.tri.onesource.ce.def.v1+json
          default: application/json
      - name: Accept-Language
        in: header
