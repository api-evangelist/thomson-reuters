      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      - name: entityId
        in: path
        description: The Entity instance that will be modified
        required: true
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
