            application/json:
              schema:
                $ref: '#/components/schemas/EntityUpdateDTOResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Failure
      security:
      - Authorization:
        - global
      x-operation-id-source: normalized
      x-operation-id-original: Updates status of existing entity
    put:
      tags:
      - Entities
      summary: Update latest version of an existing entity
      description: Use this operation to update latest version of an existing entity and its attributes. Enter the entity Id in the URL
      operationId: UpdateLatestVersionOfAnExistingEntity
      parameters:
      - name: Accept
        in: header
        description: Content type
        required: false
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.tri.onesource.ce.def.v1+json
          default: application/json
      - name: Accept-Language
        in: header
        description: Accept Language
        required: false
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      - name: entityId
        in: path
        description: The Entity instance that will be modified
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityBaseDTO'
        description: The details about the Entity whose attributes will be updated.
      responses:
        '200':
          description: Success
          content:
            application/vnd.tri.onesource.ce.def.v1+json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Failure
      security:
      - Authorization:
        - global
      x-operation-id-source: normalized
      x-operation-id-original: Update latest version of an existing entity
    delete:
      tags:
      - Entities
      summary: Delete an existing entity
      description: 'Use this operation to soft delete an existing entity with all its attributes and versions. Enter the entity Id in the URL. Warning: Though this operation is soft delete, we currently do not support the “Undo” API to recover the deleted entity'
      operationId: DeleteAnExistingEntity
      parameters:
      - name: Accept
        in: header
        description: Content type
        required: false
        schema:
          type: string
          enum:
          - application/json
          - application/vnd.tri.onesource.ce.def.v1+json
          default: application/json
      - name: Accept-Language
        in: header
        description: Accept Language
        required: false
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      - name: entityId
        in: path
        description: The Entity ID associated to all other versions that will be deleted.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/vnd.tri.onesource.ce.def.v1+json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Failure
      security:
      - Authorization:
        - global
      x-operation-id-source: normalized
      x-operation-id-original: Delete an existing entity
    servers:
    - url: https://api-uat.onesourcetax.com
      description: UAT
    - url: https://api.onesourcetax.com
      description: PROD
