openapi: 3.2.0
info:
  title: Thomson Reuters Activity API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Activity across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Activity
paths:
  /{version}/comments:
    get:
      tags:
      - Activity
      summary: Get Comment List
      description: Method to obtain comments on a particular content. This method is supported in version 2 of the API and above
      operationId: getCommentList
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: contentid
        in: query
        description: This the content id of the required content. <br/>e.g. blogid for contenttype=blog, taskid for contenttype=tasks
        required: true
        schema:
          type: string
      - name: contenttype
        in: query
        description: 'content types <br/><i>e.g. /api/1/comments?contenttype=files</i>

          - Microblogs

          - Files

          - Wiki

          - Blog

          - Tasks

          - Events'
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: The integer value of the last comment fetched.
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: 'No of comments to return in one request. Default is 20  and the maximum value is 100

          If a value of 0 or less is provided in the request then 20 comments will be returned.

          If a value of more than 100 is provided then 100 comments are returned.'
        required: false
        schema:
          type: string
      - name: siteid
        in: query
        description: "Provide site id of the required site, the parameter only accepts one site in the current implementation. <br/>e.g. <i>/api/1/comments?siteid=<siteid></i> \nFor global contents like microblogs please provide 0 as the siteid "
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Comments returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Comments'
            application/json:
              schema:
                $ref: '#/components/schemas/Comments'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: ' Internal error occurred while returning comments'
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/microblog:
    post:
      tags:
      - Activity
      summary: Post Microblog
      description: API method to post a Microblog
      operationId: addMicroBlog
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: groupsupport
        in: query
        description: groupsupport flag for mention group & share with group
        required: false
        schema:
          type: string
          default: '0'
      responses:
        '200':
          description: Activity returned successfully
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while posting microblog
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Microblog'
          application/json:
            schema:
              $ref: '#/components/schemas/Microblog'
    servers:
    - url: /monumentuat/api
  /{version}/microblog/{microblogid}:
    delete:
      tags:
      - Activity
      summary: Delete Microblog
      description: API method to delete a microblog
      operationId: deleteMicroblog
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '6'
      - name: microblogid
        in: path
        description: ID of the microblog
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Microblog deleted successfully
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while deleting microlbog
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/activities/{activityid}:
    get:
      tags:
      - Activity
      summary: Get Activity
      description: To get the individual activity - currently only the microblog is supported
      operationId: getRecentActivity
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: groupsupport
        in: query
        description: groupsupport flag for share with group
        required: false
        schema:
          type: string
          default: '0'
      - name: activityid
        in: path
        description: The activity id of requested activity
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Activity returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Activity'
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting activity
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/microblog/sharewith:
    get:
      tags:
      - Activity
      summary: Get sharewith options for microblog
      description: API to get list of sharewith option for post microblog
      operationId: getSharewithOptions
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '8'
      - name: q
        in: query
        description: Text that will be searched against Org name, Site name and Group to filter out.
        required: true
        schema:
          type: string
      - name: siteid
        in: query
        description: Site id of the site in which microblog is being posted
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Sharewith options returned successfully
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting sharewith options for microblog
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/activities/activityfilter:
    get:
      tags:
      - Activity
      summary: Get Activity Filters
      description: This API method can be used to obtain the list of filters available for the activity API, please note that this API only provide the filters relevant to a specific activity list and does not return the content activity.
      operationId: getRecentActivityFilterList
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: site
        in: query
        description: This is an optional parameter if the parameter is not supplied or an "ALL" value is provided then filters relevant to the activity for all sites is returned. <br/>Provide a list of comma separated site ID's if activity filters for specific sites are required. <br/>e.g. site = 10,11,12
        required: false
        schema:
          type: string
          default: all
      - name: contenttype
        in: query
        description: If a limited set of filters are required then provide a comma separated list of content types <br/>e.g. contenttype = files, blog, wiki <br/>otherwise, do not use this parameter or provide a value of "ALL" for this parameter.
        required: false
        schema:
          type: string
          default: all
      - name: activitytype
        in: query
        description: all/post/activity
        required: false
        schema:
          type: string
          default: all
      - name: searchtext
        in: query
        description: Search Text
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: The integer value of the last record fetched.
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: 'No of records to return in one request. Default is 20  and the maximum value is 100

          If a value of 0 or less is provided in the request then 20 records will be returned.

          If a value of more than 100 is provided then 100 records are returned.'
        required: false
        schema:
          type: string
      - name: filtertype
        in: query
        description: Provide filter type if the parameter is not supplied all filters will be returned. <br/>e.g. filtertype = content_site_filter, content_type_filter, content_user_filter <br/>
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ActivityFilter'
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityFilter'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while gettting activity filter list
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/getImageForLinkPreview:
    get:
      tags:
      - Activity
      summary: Get Image for Link Preview
      description: API method to get image for Link Preview in Microblog
      operationId: getImageForLinkPreview
      parameters:
      - name: imgURL
        in: query
        description: image URL
        required: true
        schema:
          type: string
      - name: width
        in: query
        description: width for image
        required: true
        schema:
          type: string
      - name: height
        in: query
        description: height for image
        required: true
        schema:
          type: string
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while gettting image file
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/comments/{commentid}:
    get:
      tags:
      - Activity
      summary: Get Comment
      description: Method to obtain a comment on a particular content. This method is supported in version 6 of the API and above
      operationId: getCommentByCommentID
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '6'
      - name: commentid
        in: path
        description: Comment id to get single comment's details
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Comment returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Comments'
            application/json:
              schema:
                $ref: '#/components/schemas/Comments'
            text/xml:
              schema:
                $ref: '#/components/schemas/Comments'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: ' Internal error occurred while returning comment'
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/activities:
    get:
      tags:
      - Activity
      summary: Get Activity List
      description: 'This API method can be used to obtain a collection of activity items. The activity is based on a specific filter.


        By default the activity of the authenticated OAuth token are used to provide the activity, however if the OAuth token user has got administrative rights they are able to obtain activity on behalf of other users.


        The type of activity returned can be altered by the filter parameters.


        Each activity has an Actor, Verb and Object:


        Actor: A person that performs the activity (user object)


        Verb : The activities verb, which indicates what action was performed


        Object: The object of the activity


        e.g. Mark posted a comment on the wiki page "Welcome to the show"


        In the above activity description, "Mark" is the actor, "posted" is the verb and "wiki page" is the object.


        <noofcomments> <nooflikes> <comments> <images> tags are only included in the returned xml when there are values available for those items.


        The activity ID is only returned for microblog items and not for the any other activity.'
      operationId: getRecentActivityList
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: site
        in: query
        description: 'If siteid is provided, the parameter for sitescope is ignored, sitescope parameter is only considered when no siteid is given.

          <p>For System Admin (scope can be all or it can be the sites they are a member of)<br/></p>'
        required: false
        schema:
          type: string
      - name: sitescope
        in: query
        description: "If site id is provided , the parameter for site scope is ignore, site scope parameter is only considered when no site id is given.\n <br>For System admin (scope can be all or it can be the sites they are a member of)<br><i>/api/1/activities?sitescope={all / memberoff /favourite}</i>"
        required: false
        schema:
          type: string
          enum:
          - all
          - memberoff
          - favourite
      - name: people
        in: query
        description: '<ul><li>Default scope is <strong>All</strong>. At one time only, one option is sent. </li>

          <li><strong>Author</strong> [supports only one author at this time] (As on the person&rsquo;s personal profile page)<br/>e.g Imran is the OAuth user, now Imran wants the activity for Keyur, then the call will be <br />/api/1/activities?<br />people=author&amp;authoremail=keyur@highq.com</li>

          <li><strong>Following</strong><br />/api/1/activities?people=following</li>

          <li><strong>Followers</strong><br />/api/1/activities?people=followers</li>

          <li><strong>MyOrganisation</strong> (People in my organisation)</li>

          <li><strong>MentionsMe</strong></li></ul>'
        required: false
        schema:
          type: string
      - name: authoremail
        in: query
        description: The author email address
        required: false
        schema:
          type: string
      - name: contenttype
        in: query
        description: "The type of content to filter by. Default is All, however you can filter by all content types available in the activity stream such as:\n<br><i>/api/1/activities?contenttype=files</i>\nThe possible values for content types are:\n- Microblogs\n- Files\n- Wiki\n- Blog\n- Tasks\n- Events\n- Comments \n<p><span>The API supports filtering by multiple content types from Collaborate 4.1.4 onwards.</span></p>\n<p>for example, to get activity by three content types use the following syntax.</p>\n<p><em>contenttype=files,events,tasks</em></p>"
        required: false
        schema:
          type: string
      - name: groupsupport
        in: query
        description: groupsupport flag for share with groups.
        required: false
        schema:
          type: string
          default: '0'
      - name: offset
        in: query
        description: The no of the last activity fetched
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: No of items to return. Default is 20 (Max is 100 , Activity up to a maximum of 3 months can be provided)
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Activity returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Activities'
            application/json:
              schema:
                $ref: '#/components/schemas/Activities'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting activity list
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
