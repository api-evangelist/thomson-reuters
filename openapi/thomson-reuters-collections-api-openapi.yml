openapi: 3.2.0
info:
  title: Thomson Reuters Collections API
  version: '1.0'
  description: 'Operations tagged Collections across 3 of this provider''s published API definitions: thomson-reuters-collection-service-1-0-openapi.json, thomson-reuters-collection-service-1-0-openapi.yml, thomson-reuters-collection-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/data-hub/v1
security:
- bearerAuth: []
tags:
- name: Collections
paths:
  /collections:
    get:
      tags:
      - Collections
      summary: Get a paginated list of Collections
      description: 'Returns a list of Collections with their metadata.


        Potential values for published status:


        id name


        1 UNPUBLISHED


        2 PUBLISHING


        3 PUBLISHED


        4 UNPUBLISHING


        5 ERROR


        Potential values for Blueprint type:


        id name


        1 Generic


        2 Trial Balance


        3 Apportionment


        ... ...'
      operationId: getCollections
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Number of records in a collection to skip before starting the response set.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of records to return in the result set.
        required: false
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CollectionResponseDTO'
      security:
      - bearerAuth: []
    post:
      tags:
      - Collections
      summary: Create a new Collection
      description: Adds Collection with name, blueprint metadata and collection description which is an optional field.
      operationId: createCollection
      parameters:
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdDTO'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /{collectionId}/versions/{versionNumber}/download/task/{taskId}:
    get:
      tags:
      - Collections
      summary: Get download URL for a completed task
      description: Returns the download URL for a completed task.
      operationId: getCollectionDownloadTaskNewVersion
      parameters:
      - name: collectionId
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: versionNumber
        in: path
        description: The modification number for the resource.
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: taskId
        in: path
        description: Task ID of the download job.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdResponseString'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /{collectionId}/versions/{versionNumber}/download/task:
    post:
      tags:
      - Collections
      summary: Initiate a download of the Collection by ID and Version
      description: Returns a download task ID for the specified Collection by ID and Version.
      operationId: getCollectionDownloadTask_NewVersion
      parameters:
      - name: collectionId
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: versionNumber
        in: path
        description: The modification number for the resource.
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: content_type
        in: query
        description: 'Type of the file.<br /><br />Potential values for File format: <br />------------------------------- <br />&nbsp;&nbsp;&nbsp;id &nbsp;&nbsp; | &nbsp;&nbsp; name <br />------------------------------- <br />&nbsp;&nbsp;&nbsp;&nbsp;1 &nbsp;&nbsp; | &nbsp;&nbsp; csv <br />&nbsp;&nbsp;&nbsp;&nbsp;2 &nbsp;&nbsp; | &nbsp;&nbsp; xlsx'
        required: false
        schema:
          type: string
          default: csv
        example: csv
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRecordsColumnDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdResponseString'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /collections/{id}:
    get:
      tags:
      - Collections
      summary: Return a Collection by ID
      description: 'Returns Collection metadata for the specified Collection ID.


        Potential values for published status:


        id name


        1 UNPUBLISHED


        2 PUBLISHING


        3 PUBLISHED


        4 UNPUBLISHING


        5 ERROR


        Potential values for Blueprint type:


        id name


        1 Generic


        2 Trial Balance


        3 Apportionment


        ... ...


        Potential values for ontology:


        id name


        1 financial-hierarchy-position


        2 chart of accounts


        3 entity


        4 account


        5 balance'
      operationId: getCollection
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SingleCollectionDTO'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Collections
      summary: Update Collection by ID
      description: Updates is_hidden attribute, description for the specified Collection ID.
      operationId: updateCollection
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPatchRequestDTO'
      responses:
        '204':
          description: default response
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /collections/{id}/columns:
    get:
      tags:
      - Collections
      summary: Return Collection columns by ID
      description: Returns Collection columns for the specified Collection ID.
      operationId: getCollectionColumns
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        description: Number of columns in a collection to skip before starting the response set.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of columns to return in the result set.
        required: false
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionCollectionColumnDTO'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /collections/{id}/records:
    get:
      tags:
      - Collections
      summary: Get a paginated list of records in the latest version of the Collection
      description: Returns a paginated list of records in the latest version of the Collection as structured in the Blueprints. Can filter down by 'topic_id' property.
      operationId: getRecords
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        description: Number of records in a collection to skip before starting the response set.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of records to return in the result set.
        required: false
        schema:
          type: integer
          format: int32
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RecordsResponse'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /collections/{id}/publish:
    post:
      tags:
      - Collections
      summary: Publish a Collection by ID
      description: 'Publish a Collection. Publishing a collection makes it visible to data consumers through the Query endpoint. It also executes any aggregations that need to be done, as determined by the Blueprint type.

        Email recipients can be provided in the request body, if specified then an email notification is sent to the recipients post publishing the collection. Note: Email recipients in the request body is optional.


        Potential values for published status:


        id name


        1 UNPUBLISHED


        2 PUBLISHING


        3 PUBLISHED


        4 UNPUBLISHING


        5 ERROR


        Potential values for Blueprint type:


        id name


        1 Generic


        2 Trial Balance


        3 Apportionment


        ... ...'
      operationId: publish
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPublishRequest'
      responses:
        '204':
          description: Published Successfully
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /collections/{id}/unpublish:
    post:
      tags:
      - Collections
      summary: Unpublish a Collection by ID
      description: 'Unpublish a Collection for the specified Collection ID.


        Potential values for published status:


        id name


        1 UNPUBLISHED


        2 PUBLISHING


        3 PUBLISHED


        4 UNPUBLISHING


        5 ERROR


        Potential values for Blueprint type:


        id name


        1 Generic


        2 Trial Balance


        3 Apportionment


        ... ...'
      operationId: unpublish
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '201':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/VersionDTO'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /collections/{id}/versions/{number}/columns:
    patch:
      tags:
      - Collections
      summary: Update the sort order of column
      description: 'Update sort order.


        Potential values for item status:


        Potential values for item status:


        id name


        1 Pending


        2 Processing


        3 Complete


        4 Removing


        5 Error'
      operationId: updateCollectionColumnSortOder
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: number
        in: path
        description: The modification number for the resource.
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionColumnRequest'
        required: true
      responses:
        '200':
          description: OK
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /collections/{collectionId}/versions/{versionNumber}/download:
    get:
      tags:
      - Collections
      summary: Initiate a download of the Collection by ID and Version
      description: Returns a download url for the specified Collection by ID and Version.
      operationId: getCollectionDownloadUrl
      parameters:
      - name: collectionId
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: versionNumber
        in: path
        description: The modification number for the resource.
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: content_type
        in: query
        description: 'Type of the file.<br /><br />Potential values for File format: <br />------------------------------- <br />&nbsp;&nbsp;&nbsp;id &nbsp;&nbsp; | &nbsp;&nbsp; name <br />------------------------------- <br />&nbsp;&nbsp;&nbsp;&nbsp;1 &nbsp;&nbsp; | &nbsp;&nbsp; csv <br />&nbsp;&nbsp;&nbsp;&nbsp;2 &nbsp;&nbsp; | &nbsp;&nbsp; xlsx'
        required: false
        schema:
          type: string
          default: csv
        example: csv
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DownloadUrlDTO'
      security:
      - bearerAuth: []
    post:
      tags:
      - Collections
      summary: Initiate a download of the Collection by ID and Version
      description: Returns a download url for the specified Collection by ID and Version.
      operationId: getCollectionRecordsDownloadUrl
      parameters:
      - name: collectionId
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: versionNumber
        in: path
        description: The modification number for the resource.
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: content_type
        in: query
        description: 'Type of the file.<br /><br />Potential values for File format: <br />------------------------------- <br />&nbsp;&nbsp;&nbsp;id &nbsp;&nbsp; | &nbsp;&nbsp; name <br />------------------------------- <br />&nbsp;&nbsp;&nbsp;&nbsp;1 &nbsp;&nbsp; | &nbsp;&nbsp; csv <br />&nbsp;&nbsp;&nbsp;&nbsp;2 &nbsp;&nbsp; | &nbsp;&nbsp; xlsx'
        required: false
        schema:
          type: string
          default: csv
        example: csv
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRecordsColumnDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DownloadUrlDTO'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
components:
  schemas:
    BlueprintDTO:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the Blueprint.
          format: int32
          example: 46
        version:
          type: integer
          description: Version of the Blueprint.
          format: int32
          example: 5
        type_id:
          type: integer
          description: Unique identifier of the Blueprint type.
          format: int32
          example: 2
    CollectionDTO:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the Collection.
          format: int32
          example: 6
        name:
          type: string
          description: Label of the Collection.
          example: My Collection Name
        version:
          type: integer
          description: Version of the Collection.
          format: int32
          example: 3
        status:
          type: string
          description: State of the published status.
          enum:
          - UNPUBLISHED
          - PUBLISHING
          - PUBLISHED
          - UNPUBLISHING
          - ERROR
        blueprint:
          $ref: '#/components/schemas/BlueprintDTO'
        year:
          type: integer
          description: Relevant year of importance for the file data.
          format: int32
          example: 2019
        period:
          type: integer
          description: Numeric period of no specific precision.
          format: int32
          example: 12
        is_hidden:
          type: boolean
          description: Visibility of the Collection.
          example: false
        recordset_count:
          type: integer
          format: int32
        created_date:
          type: string
          description: Version created date and time.
          format: date-time
          example: '2020-06-19T21:06:22.453Z'
    IdResponseString:
      type: object
      properties:
        id:
          type: string
    CollectionColumnDTO:
      type: object
      properties:
        name:
          type: string
          description: Label of the column.
          example: My Column Name
        type:
          type: string
          description: Expected data type of the column values.
          enum:
          - currency
          - date
          - number
          - string
        index:
          type: boolean
        ontology_id:
          type: integer
          description: Unique identifier of the ontology this column represents.
          format: int32
          example: 1
        is_required:
          type: boolean
          description: Requires templates to map this column.
          example: true
        is_system:
          type: boolean
          description: Checks for system generated column.
          example: true
    SingleCollectionDTO:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the Collection.
          format: int32
          example: 6
        name:
          type: string
          description: Label of the Collection.
          example: My Collection Name
        version:
          type: integer
          description: Version of the Collection.
          format: int32
          example: 3
        records_count:
          type: integer
          description: Total records exist in collection.
          format: int64
          example: 100
        status:
          type: string
          description: State of the published status.
          enum:
          - UNPUBLISHED
          - PUBLISHING
          - PUBLISHED
          - UNPUBLISHING
          - ERROR
        blueprint:
          $ref: '#/components/schemas/BlueprintDTO'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/CollectionColumnDTO'
        year:
          type: integer
          description: Relevant year of importance for the file data.
          format: int32
          example: 2019
        period:
          type: integer
          description: Numeric period of no specific precision.
          format: int32
          example: 12
        is_hidden:
          type: boolean
          description: Visibility of the Collection.
          example: false
        created_date:
          type: string
          description: Version created at time.
          format: date-time
          example: '2020-06-19T21:06:22.453Z'
    CollectionRecordsColumnDTO:
      type: object
      properties:
        columns:
          type: array
          description: List of the column Name's.
          example:
          - onesource_account_code
          - onesource_entity_code
          - beginning_balance
          - onesource_financial_hierarchy_code
          - ending_balance
          items:
            type: string
            description: List of the column Name's.
            example: '["onesource_account_code","onesource_entity_code","beginning_balance","onesource_financial_hierarchy_code","ending_balance"]'
    CollectionColumnSortOrderDTO:
      required:
      - name
      - sort_order
      type: object
      properties:
        name:
          type: string
          description: Name of the column.
          example: account_code
        sort_order:
          type: integer
          description: Unique sort_order to update.
          format: int32
          example: 1
    ApiCollectionCollectionColumnDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionColumnDTO'
        _meta:
          $ref: '#/components/schemas/ApiMeta'
    CreateCollectionRequest:
      type: object
      properties:
        name:
          type: string
          description: Label of the Collection.
          example: My Collection Name
        year:
          type: integer
          description: Relevant year of importance for the file data.
          format: int32
          example: 2019
        period:
          type: integer
          description: Numeric period of no specific precision.
          format: int32
          example: 12
        blueprint:
          $ref: '#/components/schemas/PublishCollectionBlueprintDTO'
        description:
          type: string
          example: This is a collection of data
    Meta:
      type: object
      properties:
        offset:
          type: integer
          format: int32
          example: 0
        limit:
          type: integer
          format: int32
          example: 200
    UpdateCollectionColumnRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionColumnSortOrderDTO'
    RecordsResponse:
      type: object
      properties:
        items:
          type: array
          example:
          - topic_id: 5f7334cc18938b15ed9efb50
            blueprint_column_1_name: example value A
            blueprint_column_2_name: example value 1
            blueprint_column_3_name: 242.8
          - topic_id: 602d86494510417ca1d9ccb9
            blueprint_column_1_name: example value B
            blueprint_column_2_name: example value 2
            blueprint_column_3_name: 3389.45
          items:
            type: object
            additionalProperties:
              type: object
              example:
              - topic_id: 5f7334cc18938b15ed9efb50
                blueprint_column_1_name: example value A
                blueprint_column_2_name: example value 1
                blueprint_column_3_name: 242.8
              - topic_id: 602d86494510417ca1d9ccb9
                blueprint_column_1_name: example value B
                blueprint_column_2_name: example value 2
                blueprint_column_3_name: 3389.45
        _meta:
          $ref: '#/components/schemas/ApiMeta'
    CollectionPatchRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: New Label of the Collection.
          example: My Collection Name
        year:
          type: integer
          description: Relevant year of importance for the file data.
          format: int32
          example: 2019
        period:
          type: integer
          description: Numeric period of no specific precision.
          format: int32
          example: 12
        is_hidden:
          type: boolean
          description: Visibility of the Collection.
          example: false
        description:
          type: string
          description: The Description of the Collection.
          example: This is a collection of data
    ApiMeta:
      type: object
      properties:
        count:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        sort:
          type: string
        filter:
          type: string
        extra:
          type: object
          additionalProperties:
            type: object
          writeOnly: true
    CollectionPublishRequest:
      type: object
      properties:
        email_recipients:
          uniqueItems: true
          type: array
          items:
            type: string
            description: List of email recipients.
          example:
          - user1@thomsonreuters.com
          - user2@thomsonreuters.com
    CollectionResponseDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionDTO'
        _meta:
          $ref: '#/components/schemas/Meta'
    VersionDTO:
      type: object
      properties:
        version:
          type: integer
          description: Version of the Collection.
          format: int32
          example: 3
    IdDTO:
