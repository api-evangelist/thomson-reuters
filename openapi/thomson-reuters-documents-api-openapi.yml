openapi: 3.2.0
info:
  title: Thomson Reuters Documents API
  version: '1.0'
  description: 'Operations tagged Documents across 5 of this provider''s published API definitions: thomson-reuters-document-management-api-1-4-openapi.json, thomson-reuters-gofileroom-web-api-v1-v1-openapi.json, thomson-reuters-document-management-api-1-4-openapi.yml, thomson-reuters-gofileroom-web-api-v1-openapi.yml, thomson-reuters-gofileroom-web-api-v1-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.thomsonreuters.com/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.co.uk/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.ca/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.com.au/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.de/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.ae/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.com/gofileroom
tags:
- name: Documents
  description: Use the Documents endpoint to get and manage document details.
paths:
  /documents:
    get:
      tags:
      - Documents
      summary: Retrieve all company documents
      operationId: Documents_GetAll
      parameters:
      - name: $top
        in: query
        description: Show only the first n items, see [Paging - Top](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptiontop)
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          default: 50
        example: 50
      - name: $skip
        in: query
        description: Skip the first n items, see [Paging - Skip](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionskip)
        schema:
          minimum: 0
          type: integer
          default: 0
        example: 0
      - name: $filter
        in: query
        description: Filter items by property values, see [Filtering](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionfilter)<br /><br /><i>Available operations:</i> eq, ne, gt, ge, lt, le, in, and, or, not<br /><i>Available functions:</i> contains, startswith, endswith, indexof<br /><i>Available properties:</i> id, name, documentType, accessType, userId, createdAtDateTime, modifiedAtDateTime, description, url, folderId, relatedEntityType, relatedEntityId, author
        schema:
          type:
          - string
          - 'null'
        example: id eq 111222
      - name: $select
        in: query
        description: Select properties to be returned, see [Select](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionselect)
        schema:
          uniqueItems: true
          type: array
          items:
            enum:
            - id
            - name
            - documentType
            - accessType
            - userId
            - createdAtDateTime
            - modifiedAtDateTime
            - description
            - url
            - folderId
            - relatedEntityType
            - relatedEntityId
            - author
            type: string
      - name: $orderby
        in: query
        description: Order items by property values, see [Sorting](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionorderby)
        schema:
          uniqueItems: true
          type: array
          items:
            enum:
            - id
            - name
            - documentType
            - accessType
            - userId
            - createdAtDateTime
            - modifiedAtDateTime
            - description
            - url
            - folderId
            - relatedEntityType
            - relatedEntityId
            - author
            - id desc
            - name desc
            - documentType desc
            - accessType desc
            - userId desc
            - createdAtDateTime desc
            - modifiedAtDateTime desc
            - description desc
            - url desc
            - folderId desc
            - relatedEntityType desc
            - relatedEntityId desc
            - author desc
            type: string
      - name: $count
        in: query
        description: Include count of items, see [Count](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptioncount)
        schema:
          type: integer
      responses:
        '200':
          description: Returns all company documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCollection'
        '400':
          description: If the OData filter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: If the user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: If the current user is not authorized to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: If a server error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
      - Token: []
    post:
      tags:
      - Documents
      summary: Create a document with the provided parameters.
      operationId: Documents_Create
      parameters:
      - name: Prefer
        in: header
        description: '* return=representation: This is the default. The server includes an entity representing the current state of the resource. In response to a successful request a status of 201 would be returned.

          * return=minimal: The response will not include the entity in the response. A successful request would result in a status of 204 to be returned.'
        schema:
          type: string
        example: return=representation
      requestBody:
        description: The model containing the document to be created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentModel'
      responses:
        '201':
          description: Returns the document that was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentModel'
        '204':
          description: Document was created but will not be provided in response.
        '400':
          description: If the request parameters were invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: If the user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: If the current user is not authorized to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: If a server error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
      - Token: []
    servers:
    - url: https://api.thomsonreuters.com/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.co.uk/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.ca/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.com.au/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.de/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.ae/legal-tracker/documents-api/v1
  /documents/{id}:
    get:
      tags:
      - Documents
      summary: Look up and retrieve a document by the provided identifier
      operationId: Documents_GetOne
      parameters:
      - name: id
        in: path
        description: Represents an identifier of a document.
        required: true
        schema:
          type: integer
          format: int32
      - name: If-None-Match
        in: header
        description: Executes a request only if the passed ETag doesn't equal the current resource ETag (i.e. resource hasn't changed).
        schema:
          type: string
      responses:
        '200':
          description: Returns a document with the specified identifier.
          headers:
            ETag:
              description: Entity tag is part of HTTP provided for web cache validation problem, but also used for optimistic concurrency control.
              schema:
                type: string
                description: Entity tag is part of HTTP provided for web cache validation problem, but also used for optimistic concurrency control.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentModel'
        '304':
          description: Returns a not modified response with empty body.
        '400':
          description: If an identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: If the user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: If the current user is not authorized to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: If a document is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: If a server error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
      - Token: []
    patch:
      tags:
      - Documents
      summary: Update the document with the provided identifier
      operationId: Documents_Update
      parameters:
      - name: id
        in: path
        description: The unique identifier of the document to be updated.
        required: true
        schema:
          type: integer
          format: int32
      - name: Prefer
        in: header
        description: '* return=representation: This is the default. The server includes an entity representing the current state of the resource. In response to a successful request a status of 200 would be returned.

          * return=minimal: The response will not include the entity in the response. A successful request would result in a status of 204 to be returned.'
        schema:
          type: string
        example: return=representation
      requestBody:
        description: The model containing the document to be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentModel'
      responses:
        '200':
          description: Returns the document that was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentModel'
        '204':
          description: Document was updated but will not be provided in response.
        '400':
          description: If the request parameters were invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: If the user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: If the current user is not authorized to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: If a server error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
      - Token: []
    delete:
      tags:
      - Documents
      summary: Delete the document with the provided identifier
      operationId: Documents_Delete
      parameters:
      - name: id
        in: path
        description: The unique identifier of the document to be deleted.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: If the document was deleted.
        '400':
          description: If an identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: If the user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: If the current user is not authorized to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: If the document does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: If a server error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
      - Token: []
    servers:
    - url: https://api.thomsonreuters.com/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.co.uk/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.ca/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.com.au/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.de/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.ae/legal-tracker/documents-api/v1
  /api/v1/documents/MultiDocExport:
    post:
      tags:
      - Documents
      summary: Export multiple documents
      description: An endpoint that provides the ability to export multiple documents.
      operationId: Documents_multipleDocumentExport
      parameters:
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DocumentCrudRequest'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DocumentCrudRequest'
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DocumentCrudRequest'
          text/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DocumentCrudRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DocumentCrudRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
      security:
      - ApiKeyAuth: []
      x-codegen-request-body-name: objDocsList
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/documents/convert_to_pdf:
    post:
      tags:
      - Documents
      summary: Convert documents to PDF
      description: An endpoint used to convert GoFileRoom documents to a viewable PDF.
      operationId: Documents_ConvertToPdf
      parameters:
      - name: documentId
        in: query
        description: The document ID we want to convert.
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: drawerId
        in: query
        description: The drawer the document is in.
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: version
        in: query
        description: The version of the document.
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/documents/search:
    post:
      tags:
      - Documents
      summary: Search documents
      description: An endpoint used to return a list of documents the GoFileRoom user has access to in the specified drawer.
      operationId: Documents_DocumentSearch
      parameters:
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: Object of type DocumentQuery containing properties like user, drawer ID, number of rows, page number, etc.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentQueryV1'
          text/json:
            schema:
              $ref: '#/components/schemas/DocumentQueryV1'
          application/xml:
            schema:
              $ref: '#/components/schemas/DocumentQueryV1'
          text/xml:
            schema:
              $ref: '#/components/schemas/DocumentQueryV1'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentQueryV1'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentQueryResponseV1'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentQueryResponseV1'
            application/xml:
              schema:
                $ref: '#/components/schemas/DocumentQueryResponseV1'
            text/xml:
              schema:
                $ref: '#/components/schemas/DocumentQueryResponseV1'
      security:
      - ApiKeyAuth: []
      x-codegen-request-body-name: arguments
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/documents/Exportlist:
    post:
      tags:
      - Documents
      summary: Export a list of documents
      description: An endpoint that returns a list of all the documents returned by a user query as a comma-separated string that can be saved as a .csv file.
      operationId: Documents_DocumentsExportList
      parameters:
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: The query.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentQueryV4'
          text/json:
            schema:
              $ref: '#/components/schemas/DocumentQueryV4'
          application/xml:
            schema:
              $ref: '#/components/schemas/DocumentQueryV4'
          text/xml:
            schema:
              $ref: '#/components/schemas/DocumentQueryV4'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentQueryV4'
        required: true
      responses:
