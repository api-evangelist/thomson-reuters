        LocalFile:
          type: string
          description: Gets or sets the local file.
        LastModified:
          type: string
          description: Gets or sets the last modified string.
        LastModifiedUserId:
          type: string
          description: Gets or sets the user ID of the last user to modify the document.
        LastModifiedDate:
          type: string
          description: Gets or sets the last modified date.
        VersionApproved:
          type: string
          description: Gets or sets the version approved.
        VersionDescription:
          type: string
          description: Gets or sets the version description.
        FileType:
          type: string
          description: Gets or sets the type of the file.
        CheckedOutUserId:
          type: string
          description: Gets or sets the user ID of the user who has this document checked out.
        CheckedOut:
          type: string
          description: Gets or sets the checked out string with the user name and date.
        NoEdit:
          type: boolean
          description: Gets or sets a value indicating whether no edit.
        ReviewedUserId:
          type: string
          description: Gets or sets the user ID who reviewed the document.
        ReviewedBy:
          type: string
          description: Gets or sets the user name who reviewed the document.
        ReviewDate:
          type: string
          description: Gets or sets the review date of the document.
        Reviewed:
          type: boolean
          description: Gets or sets a value indicating whether the document has been reviewed.
        DocumentApproved:
          type: boolean
          description: Gets or sets a value indicating whether the document has been approved.
        AutoRedacted:
          type: boolean
          description: Gets or sets a value indicating whether the document has been auto redacted.
        Encrypted:
          type: boolean
          description: Gets or sets a value indicating whether the document has been encrypted.
        IsInRedactionQueue:
          type: boolean
