components:
  schemas:
    DocumentModel:
      required:
      - id
      type: object
      properties:
        id:
          type: integer
          description: The identifier for the Document record.
          format: int32
        name:
          type:
          - string
          - 'null'
          description: The name of the Document record.
        documentType:
          $ref: '#/components/schemas/DocumentType'
        accessType:
          $ref: '#/components/schemas/AccessType'
        userId:
          type: integer
          description: The user identifier for the owner of the Document record.
          format: int32
        createdAtDateTime:
          type: string
          description: The date when the Document record was created.
          format: date-time
        modifiedAtDateTime:
          type: string
          description: The date when the Document record was modified.
          format: date-time
        description:
          type:
          - string
          - 'null'
          description: The description of the Document record.
        url:
          type:
          - string
          - 'null'
          description: The network location for file retrieval of the Document record.
        folderId:
          type:
          - integer
          - 'null'
          description: The folder identifier (if any) of the Document record.
          format: int32
        relatedEntityType:
          $ref: '#/components/schemas/RelatedEntityType'
        relatedEntityId:
          type:
          - integer
          - 'null'
          description: The identifier for the related entity of the Document record.
          format: int32
        author:
          type:
          - string
          - 'null'
          description: The name of the author of the document.
      additionalProperties: false
    RelatedEntityType:
      enum:
      - Matter
      type: string
      description: The type of entity that the Document record is related to (e.g. Matter).
    DocumentType:
      enum:
      - 'Null'
      - Document
      - Contract
      - Secondary
      - Sop
      - Email
      type: string
      description: The type of the Document record.
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
    UpdateDocumentModel:
      type: object
      properties:
        id:
          type: integer
          description: The id of the document
          format: int32
        name:
          maxLength: 200
          type:
          - string
          - 'null'
          description: The name of the Document record.
        accessModifier:
          $ref: '#/components/schemas/AccessType'
        description:
          maxLength: 4000
          type:
          - string
          - 'null'
          description: The description of the Document record.
        folderId:
          type:
          - integer
          - 'null'
          description: The folder identifier of the Document record.
          format: int32
        author:
          maxLength: 100
          type:
          - string
          - 'null'
          description: The name of the author of the document.
      additionalProperties: false
    AccessType:
      enum:
      - 'Null'
      - Public
      - RestrictedFirm
      - RestrictedLead
      - Private
      type: string
      description: The level of access that determines how other users can interact with this document.
    DocumentCollection:
      type: object
      properties:
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DocumentModel'
      additionalProperties: false
    Error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              target:
                type: string
        innerError:
          required:
          - code
          - message
          type: object
          properties:
            code:
              type: string
            message:
              type: string
      additionalProperties: false
    CreateDocumentModel:
      required:
      - accessModifier
      - documentType
      - folderId
      - name
      - relatedEntityId
      - relatedEntityType
      - userId
      type: object
      properties:
        name:
          maxLength: 200
          type: string
          description: The name of the Document record.
        documentType:
          $ref: '#/components/schemas/DocumentType'
        accessModifier:
          $ref: '#/components/schemas/AccessType'
        userId:
          type: integer
          description: The user identifier for the owner of the Document record.
          format: int32
        description:
          maxLength: 4000
          type:
          - string
          - 'null'
          description: The description of the Document record.
        eFileKey:
          type:
          - string
          - 'null'
          description: The eFile upload key (if applicable) for the Document record.
        url:
          maxLength: 255
          type:
          - string
          - 'null'
          description: The network location (if applicable) for the Document record.
        folderId:
          type: integer
          description: The folder identifier of the Document record.
          format: int32
        relatedEntityType:
          $ref: '#/components/schemas/RelatedEntityType'
        relatedEntityId:
          type: integer
          description: The identifier for the related entity of the Document record (e.g. Matter ID.
          format: int32
        author:
          maxLength: 100
          type:
          - string
          - 'null'
          description: The name of the author of the document.
      additionalProperties: false
    MergeDocHistory:
      type: object
      properties:
        DocId:
          type: string
          description: Gets or sets the name of the merge document ID.
        DisplayOrder:
          type: integer
          description: Gets or sets the document order.
