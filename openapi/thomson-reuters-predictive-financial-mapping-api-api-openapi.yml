openapi: 3.2.0
info:
  title: Thomson Reuters Predictive Financial Mapping API
  version: '1.0'
  description: 'Operations tagged Predictive Financial Mapping API across 2 of this provider''s published API definitions: thomson-reuters-predictive-mapping-service-openapi.json, thomson-reuters-predictive-mapping-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/data-intelligence/financial-hierarchies
security:
- bearerAuth: []
tags:
- name: Predictive Financial Mapping API
  description: API for predicting financial hierarchy
paths:
  /predict-mapping/v1/:
    post:
      tags:
      - Predictive Financial Mapping API
      summary: Predict financial hierarchy mappings
      description: Use this operation to request financial hierarchy predictions
      operationId: createFinancialHierarchyPrediction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictiveMappingRequest'
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PredictiveMappingResponseFinancialHierarchyDto'
    servers:
    - url: https://api.onesourcetax.com/data-intelligence/financial-hierarchies
  /predict-mapping/v1/feedback:
    post:
      tags:
      - Predictive Financial Mapping API
      summary: Give feedback on mapping predictions
      description: Use this operation to give feedback on mapping predictions
      operationId: storeFeedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictiveFeedbackRequest'
      responses:
        '204':
          description: default response
          content:
            '*/*':
              schema:
                type: object
    servers:
    - url: https://api.onesourcetax.com/data-intelligence/financial-hierarchies
components:
  schemas:
    FinancialHierarchyNodeDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    FinancialHierarchyDto:
      type: object
      properties:
        confidence:
          type: number
          format: double
        level_1:
          $ref: '#/components/schemas/FinancialHierarchyNodeDto'
        level_2:
          $ref: '#/components/schemas/FinancialHierarchyNodeDto'
        level_3:
          $ref: '#/components/schemas/FinancialHierarchyNodeDto'
    PredictiveMappingRequest:
      type: object
      properties:
        data:
          type: array
          description: Input data to create predictions for.
          items:
            type: string
            description: Input data to create predictions for.
        predictions:
          type: integer
          description: Maximum number of predictions that will be created for data
          format: int32
        minimum_confidence:
          type: number
          description: Threshold for minimum confidence for given predictions (0-1)
          format: double
    PredictiveMappingResponseFinancialHierarchyDto:
      type: object
      properties:
        _meta:
          $ref: '#/components/schemas/PredictionMetaData'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PredictionResultCollectionFinancialHierarchyDto'
    PredictiveFeedbackRequest:
      type: object
      properties:
        input:
          type: string
        prediction_type:
          type: string
          enum:
          - FINANCIAL_HIERARCHY
        value:
          type: string
    PredictionResultCollectionFinancialHierarchyDto:
      type: object
      properties:
        input:
          type: string
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/FinancialHierarchyDto'
    PredictionMetaData:
      type: object
      properties:
        predictions:
          type: integer
          format: int32
        minimum_confidence:
          type: number
          format: double
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
