servers:
- url: https://api.thomsonreuters.com/regulatory-intelligence
tags:
- name: research-controller
  description: Research Controller
paths:
  /v1/documents/{guid}:
    get:
      tags:
      - research-controller
      summary: Returns document from Novus by GUID
      operationId: getDocumentTextUsingGET
      parameters:
      - name: guid
        in: path
        description: ID of document to return
        required: true
        schema:
          type: string
        example: IC5A20E7DDE1C454EA14C5AEAA856E7DC
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Requested document are forbidden to user
          content: {}
        '404':
          description: DocumentVersionDto not found by GUID
          content: {}
        '500':
          description: Failed to get document from Novus
          content: {}
    servers:
    - url: https://api.thomsonreuters.com/regulatory-intelligence
