components:
  schemas:
    ErrorDBO:
      type: object
      properties:
        summary:
          type: string
        ref:
          type: string
        link:
          type: string
      xml:
        name: error
    Partner:
      type: object
      properties:
        orgpartnerid:
          type: string
        userid:
          type: string
        status:
          type: string
        orderid:
          type: string
      xml:
        name: keycontact
    department:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        orgid:
          type: string
        link:
          type: string
          example: http://example.com/context/api/5/organisations/departments/3
          description: used in response
    ContactDBO:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        typeid:
          type: string
        contacttier:
          type: string
        orgcontactid:
          type: string
      xml:
        name: contact
    PartnersDBO:
      type: object
      properties:
        keycontact:
          type: array
          items:
            $ref: '#/components/schemas/Partner'
      xml:
        name: keycontacts
    departments:
      type: object
      properties:
        department:
          type: array
          items:
            $ref: '#/components/schemas/department'
      xml:
        name: departments
    organisation:
      type: object
      required:
