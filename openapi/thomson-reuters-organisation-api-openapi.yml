info:
  title: Thomson Reuters Organisation API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Organisation across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Organisation
paths:
  /{version}/organisations:
    get:
      tags:
      - Organisation
      summary: Get Organisation List
      description: 'Get a list of organisations. This API call is used to retrieve a list of organisations from the system.


        Error Codes


        Summary

        Ref Code (V4)

        Ref Code (before V4)


        The industry is invalid


        293

        N/A


        The category is invalid


        294

        N/A


        The status is invalid.


        295

        N/A


        The limit value is invalid.


        291

        N/A


        The offset value is invalid.


        292

        N/A


        The ordertype is invalid.


        289

        N/A


        The orderby value is invalid. Please use either asc or desc


        290

        N/A


        JIRA Ticket : https://dev.highq.com/jira/browse/COL-62789'
      operationId: getOrganisations
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: searchTxt
        in: query
        description: Will search across all organisation fields for a matching string. This should be the same search
        required: false
        schema:
          type: string
      - name: domain
        in: query
        description: Domain to search for. Domain name must be a single value. We will not support CSV for this field
        required: false
        schema:
          type: string
      - name: industry
        in: query
        description: The ID of the organisation industry
        required: false
        schema:
          type: string
      - name: category
        in: query
        description: The ID of the organisation category
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: 'Status: active | archive | pending'
        required: false
        schema:
          type: string
      - name: ordertype
        in: query
        description: Domain to search for. Domain name must be a single value. We will not support CSV for this field
        required: false
        schema:
          type: string
      - name: orderby
        in: query
        description: 'Allow ascending and descending sorting of a single field.<br>GET /api/4/organisations?orderby=desc<br>possible fields: asc,desc'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'Limits the number of organisations returned. e.g.<br>GET /api/4/organisations?offset=10&limit=5Default: 100'
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: 'Allows paging of organisations. e.g.<br>GET /api/4/organisations?offset=10&limit=5<br>Default: 0'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organisations'
            text/plain:
              schema:
                $ref: '#/components/schemas/Organisations'
            application/json:
              schema:
                $ref: '#/components/schemas/Organisations'
        '400':
          description: 4xx Fail transaction(Client Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: 5xx Fail transaction(Server Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    post:
