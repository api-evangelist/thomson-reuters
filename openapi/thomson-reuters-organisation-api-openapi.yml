      description: 'This API call is used to get a list of departments in an organisation object in the system.


        Error Codes


        Summary

        Ref Code (V4)

        Ref Code (before V4)


        The ordertype is invalid. name and ID are supported ordertype


        351


        The orderby value is invalid. asc and desc are supported orderby values.


        147


        The Organisation ID is invalid


        260


        You do not have access to the given organisation ID


        318


        JIRA Ticket : https://dev.highq.com/jira/browse/COL-65701'
      operationId: getOrgDepartmentList
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '5'
      - name: orgid
        in: query
        description: The ID of the organisation of which the departments to be listed
        required: true
        schema:
          type: string
      - name: search
        in: query
        description: The field on which searching will be done. Only supported field is departmentname
        required: false
        schema:
          type: string
      - name: ordertype
        in: query
        description: Field on which sorting will be applied. It has to be ID or the name of the department.
        required: false
        schema:
          type: string
      - name: orderby
        in: query
        description: The sorting order, either asc or desc.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/departments'
            text/plain:
