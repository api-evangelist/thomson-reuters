      x-operation-id-original: Retrieve an Asset for a PAN and AssetId
    servers:
    - url: https://api.onesourcetax.com/trust-tax
  /v1/pans/{pan}/assets:
    get:
      tags:
      - Asset
      summary: Allows an authenticated user to retrieve a paginated list of assets for a…
      description: Allows an authenticated user to retrieve a paginated list of assets for a specific PAN, in the current tax year and up to four prior tax years.
      operationId: RetrieveAnAssetListForAPAN
      parameters:
      - name: pan
        in: path
        description: Filters the response based on Product Access Number.
        required: true
        schema:
          type:
          - string
          - 'null'
          description: Filters the response based on Product Access Number.
      - name: top
        in: query
        description: The number of items to return per page in the response. The value must be a positive number. A value of blank returns the default number of items.
        schema:
          type: integer
          description: The number of items to return per page in the response. The value must be a positive number. A value of blank returns the default number of items.
          format: int32
      - name: skip
        in: query
        description: The number of items to skip. The value must be a positive number.
        schema:
          type: integer
          description: The number of items to skip. The value must be a positive number.
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
