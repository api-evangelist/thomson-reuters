        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-operation-id-source: normalized
      x-operation-id-original: Retrieve an Asset List for a PAN
    servers:
    - url: https://api.onesourcetax.com/trust-tax
  /v1/assets/operations/{id}:
    get:
      tags:
