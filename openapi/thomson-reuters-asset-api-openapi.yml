      - Asset
      summary: Allows an authenticated user to update existing asset for designated PAN/Trust…
      description: Updates existing Assets Entity data
      operationId: UpdatesExistingAssetsEntityData
      parameters:
      - name: pan
        in: path
        required: true
        schema:
          type: string
      - name: assetid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AssetModel'
              description: Asset Model
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AssetModel'
              description: Asset Model
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AssetModel'
              description: Asset Model
          application/*+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AssetModel'
              description: Asset Model
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
