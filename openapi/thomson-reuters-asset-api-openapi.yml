      x-operation-id-source: normalized
      x-operation-id-original: Updates existing Assets Entity data
    get:
      tags:
      - Asset
      summary: Allows an authenticated user to retrieve an asset for a specific PAN and AssetId
      description: Allows an authenticated user to retrieve an asset for a specific PAN and AssetId.
      operationId: RetrieveAnAssetForAPANAndAssetId
      parameters:
      - name: pan
        in: path
        description: Filters the response based on Product Access Number.
        required: true
        schema:
          type:
          - string
          - 'null'
          description: Filters the response based on Product Access Number.
      - name: assetid
        in: path
        description: Filters the response based on Asset Id.
        required: true
        schema:
          type:
