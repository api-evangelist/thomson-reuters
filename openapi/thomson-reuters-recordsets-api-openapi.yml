info:
  title: Thomson Reuters Recordsets API
  version: '1.0'
  description: 'Operations tagged Recordsets across 3 of this provider''s published API definitions: thomson-reuters-collection-service-1-0-openapi.json, thomson-reuters-collection-service-1-0-openapi.yml, thomson-reuters-collection-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/data-hub/v1
security:
- bearerAuth: []
tags:
- name: Recordsets
paths:
  /collections/{id}/recordsets:
    get:
      tags:
      - Recordsets
      summary: Get a paginated list of Recordsets by Collection ID
      description: 'Returns a list of Recordset IDs for the specified Collection ID.


        Potential values for item status:


        id name


        1 Pending


        2 Processing


        3 Complete


        4 Removing


        5 Error'
      operationId: getRecordsetsInCollection
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RecordsetsResponseDTO'
      security:
      - bearerAuth: []
    post:
      tags:
      - Recordsets
      summary: Initiate adding a Recordset by Collection ID
      description: Creates an asynchronous task to add a Recordset for the specified Collection ID.
      operationId: addRecordsetToCollection
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordsetRequest'
      responses:
        '201':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RecordsetIdResponseDTO'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /collections/{id}/recordsets/{recordsetId}:
    patch:
      tags:
      - Recordsets
      summary: Update a collection item
      description: 'Updates a collection item name.


        Potential values for item status:


        id name


        1 Pending


        2 Processing


        3 Complete


        4 Removing


        5 Error'
      operationId: updateCollectionRecordset
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: recordsetId
        in: path
        description: Item Recordset ID in the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecordsetsItemRequest'
      responses:
        '200':
          description: default response
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /collections/{id}/recordsets/{recordset_id}:
    delete:
      tags:
      - Recordsets
      summary: Remove a Recordset by Collection ID
      description: Remove a Recordset ID for the specified Collection ID.
      operationId: deleteRecordset
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: recordset_id
        in: path
        description: Unique identifier of the Recordset.
        required: true
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Deleted Successfully
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
