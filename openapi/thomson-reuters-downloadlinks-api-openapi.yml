components:
  schemas:
    DocumentModel:
      required:
      - id
      type: object
      properties:
        id:
          type: integer
          description: The identifier for the Document record.
          format: int32
        name:
          type:
          - string
          - 'null'
          description: The name of the Document record.
        documentType:
          $ref: '#/components/schemas/DocumentType'
        accessType:
          $ref: '#/components/schemas/AccessType'
        userId:
          type: integer
          description: The user identifier for the owner of the Document record.
          format: int32
        createdAtDateTime:
          type: string
          description: The date when the Document record was created.
          format: date-time
        modifiedAtDateTime:
          type: string
          description: The date when the Document record was modified.
          format: date-time
        description:
          type:
          - string
          - 'null'
          description: The description of the Document record.
        url:
          type:
          - string
          - 'null'
          description: The network location for file retrieval of the Document record.
        folderId:
          type:
          - integer
          - 'null'
          description: The folder identifier (if any) of the Document record.
          format: int32
        relatedEntityType:
          $ref: '#/components/schemas/RelatedEntityType'
        relatedEntityId:
          type:
          - integer
          - 'null'
          description: The identifier for the related entity of the Document record.
          format: int32
        author:
          type:
          - string
          - 'null'
          description: The name of the author of the document.
      additionalProperties: false
    RelatedEntityType:
      enum:
      - Matter
      type: string
      description: The type of entity that the Document record is related to (e.g. Matter).
    DocumentType:
      enum:
      - 'Null'
      - Document
      - Contract
      - Secondary
      - Sop
      - Email
      type: string
      description: The type of the Document record.
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
    AccessType:
      enum:
      - 'Null'
      - Public
      - RestrictedFirm
      - RestrictedLead
      - Private
      type: string
      description: The level of access that determines how other users can interact with this document.
    DownloadLinkPostModel:
      required:
      - id
      type: object
      properties:
        id:
          type: integer
          description: The identifier for the Document record.
          format: int32
      additionalProperties: false
    DownloadLinkModel:
      required:
      - link
      type: object
      properties:
        link:
          type: string
          description: The URL to the document.
        fileSizeInBytes:
          type: integer
          description: The size of the document in bytes.
          format: int32
        mD5Hash:
          type:
          - string
          - 'null'
          description: The MD5 Hash of the document.
        documentModel:
          $ref: '#/components/schemas/DocumentModel'
      additionalProperties: false
    Error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            required:
