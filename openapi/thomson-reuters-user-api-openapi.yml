  /{version}/users/activities:
    get:
      tags:
      - User
      summary: Get User Activities
      description: 'Get User Activities API

        There are three key activity areas in Collaborate.

        1. Dashboard activity

        2. Site Activity

        3. User Activity


        The purpose of this API method is to provide the user activity. The user activity API has been separated from the activity API, due to multiple reasons listed below:

        - The user activity should include activity from MySite which does not exist in Dashboard activity and hence in Activity API

        - The user activity includes personal actions like viewing documents, which can flood the dashboard activity feed

        - The folder views do not need to be included in the activity stream, however creation of folder should be included in the user activity stream.

        - When the document is download from the server using the API, a download audit should be recorded for that activity

        - Once the document is download and is cached on the client, any view action should be recorded as an additional activity, and should be posted to the server. ( e.g on iOS device, if the local cache of the document does not send a download call on each click in the activity stream, then we should register it as a view option on each view on the iOS device )

        - The activity should have the site filter to get user activity specific to a site

        - The activity API should have a content filter to filter the activity based on a specific content.


        Technical Considerations:

        - The download and view activity of documents is not displayed in the desktop activity, however we need to display it for the mobile interface, which means we need to treat it differently.

        - The activity stream needs to include MySites activity.


        The Activities are:

        - Add

        - Update ( Add version)

        - View

        - Download

        - File saved from Microsoft Office

        - File opened in Microsoft Office'
      operationId: getUserSpecificActivity
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: site
        in: query
        description: "- Site \n<br>e.g. /users/activities?site=<siteid>\nIf site id is provided , the parameter for sitescope is ignored, sitescope parameter is only considered when no site id is given. \n \n- Predefined grouping of sites\n<br> e.g./user/activities?sitescope={all / memberoff /favourite}  (The all parameter only applies to a user who is a system admin)"
        required: false
        schema:
          type: string
      - name: contenttype
        in: query
        description: 'The type of content to filter by.<br><br>Default is Files, however you can filter by all content types available in the activitiy stream like

          e.g. /users/activities?contenttype=files

          - Files'
        required: false
        schema:
          type: string
          default: files
      - name: limit
        in: query
        description: No of items to return. Default is 20 (Max is 100 , Activity to a maximum of 3 months can be provided)
        required: false
        schema:
          type: string
      - name: lastactivityid
        in: query
        description: The no of last activity fetched.
        required: false
        schema:
          type: string
      - name: sitescope
        in: query
        description: 'Predefined grouping of sites

          <br> e.g./user/activities?sitescope={all / memberoff /favourite}  (The all parameter only applies to a user who is a system admin)'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: User activities returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Activities'
            application/json:
              schema:
                $ref: '#/components/schemas/Activities'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting user activities
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
