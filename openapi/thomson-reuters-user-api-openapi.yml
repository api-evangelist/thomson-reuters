openapi: 3.2.0
info:
  title: Thomson Reuters User API
  version: '1.0'
  description: 'Operations tagged User across 8 of this provider''s published API definitions: thomson-reuters-firmflow-web-api-services-v1-openapi.json, thomson-reuters-gofileroom-web-api-v1-v1-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-firmflow-web-api-services-openapi.yml, thomson-reuters-firmflow-web-api-services-v1-openapi.yml, thomson-reuters-gofileroom-web-api-v1-openapi.yml, thomson-reuters-gofileroom-web-api-v1-v1-openapi.yml, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.thomsonreuters.com/gofileroom
- url: /monumentuat/api
tags:
- name: User
paths:
  /api/v1/user/login:
    post:
      tags:
      - User
      summary: Logs a user into the application
      operationId: User_LoginAsyncV1
      parameters:
      - name: X-TR-API-APP-ID
        in: header
        required: true
        schema:
          type: string
      requestBody:
        description: Authentication of a user.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAuthentication'
          text/json:
            schema:
              $ref: '#/components/schemas/UserAuthentication'
          application/xml:
            schema:
              $ref: '#/components/schemas/UserAuthentication'
          text/xml:
            schema:
              $ref: '#/components/schemas/UserAuthentication'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserAuthentication'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/AuthResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      x-codegen-request-body-name: userAuthentication
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/user/validate:
    get:
      security:
      - ApiKeyAuth: []
      tags:
      - User
      summary: Validate the Security Token
      operationId: User_ValidateTokenV1
      parameters:
      - name: X-TR-API-APP-ID
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/user/logout:
    get:
      security:
      - ApiKeyAuth: []
      tags:
      - User
      summary: Logs out the currently authenticated user
      description: Logs out the currently authenticated user and invalidates their session.
      operationId: User_LogoutV1
      parameters:
      - name: X-TR-API-APP-ID
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsLogoutSuccessful'
            text/json:
              schema:
                $ref: '#/components/schemas/IsLogoutSuccessful'
            application/xml:
              schema:
                $ref: '#/components/schemas/IsLogoutSuccessful'
            text/xml:
              schema:
                $ref: '#/components/schemas/IsLogoutSuccessful'
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /api/v1/user/validatesession:
    post:
      tags:
      - User
      summary: Validate the session of a user
      description: An endpoint used to validate a GoFileRoom user session.
      operationId: User_ValidateSession
      parameters:
      - name: firmID
        in: query
        description: firmID of the user.
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: loginName
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: sessionID
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: X-TR-API-APP-ID
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStatus'
            text/json:
              schema:
                $ref: '#/components/schemas/LoginStatus'
            application/xml:
              schema:
                $ref: '#/components/schemas/LoginStatus'
            text/xml:
              schema:
                $ref: '#/components/schemas/LoginStatus'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.thomsonreuters.com/gofileroom
  /{version}/users/{id}/avatar:
    get:
      tags:
      - User
      summary: Get user avatar
      description: 'This is an API method to get the user avatar.

        Response

        The API response is a multipart stream of data. If the avatar has not been uploaded then a place holder default system avatar is returned. In the case of an error, an error object is returned with the appropriate error message.


        JIRA Ticket : https://dev.highq.com/jira/browse/COL-62788'
      operationId: getUserAvatar
      parameters:
      - name: id
        in: path
        description: 'id parameter is the User id of the user, whose avatar is to be obtained. '
        required: true
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: 'Size of the avatar.Following are supported <br> '
        required: true
        schema:
          type: integer
          format: int32
          enum:
          - 16
          - 32
          - 48
          - 64
          - 96
          - 128
          - 256
          - 512
          - 330
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      responses:
        '200':
          description: 'Avatar was returned successfully '
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: 'Validation failed/ Forbidden '
        '404':
          description: Avatar does not exist in the system
        '405':
          description: 'Method not allowed (calling API with the wrong method) '
        '500':
          description: Internal error occurred
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/users/experiences:
    get:
      tags:
      - User
      summary: User experience list
      description: 'This API call is used to get list of experience.


