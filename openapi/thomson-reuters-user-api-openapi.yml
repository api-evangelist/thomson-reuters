        110


        The given action cannot be performed on the anonymised user(s).


        325


        JIRA Ticket : https://dev.highq.com/jira/browse/COL-66714'
      operationId: getUserExperienceList
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '5'
      - name: userid
        in: query
