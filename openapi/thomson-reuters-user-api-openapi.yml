          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
