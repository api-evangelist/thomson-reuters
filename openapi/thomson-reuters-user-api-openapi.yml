        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/experiences'
            application/json:
              schema:
                $ref: '#/components/schemas/experiences'
        '400':
          description: 4xx Fail transaction(Client Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: 5xx Fail transaction(Server Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    post:
      tags:
      - User
      summary: Add user experience
      description: 'This API call is used to add a new experience object in the system.


        Error Codes


        Summary

        Ref Code (V4)

        Ref Code (before V4)


        User id is not in proper format


        113


