                  code:
                    type: string
                  message:
                    type: string
                  target:
                    type: string
            innererror:
              type: object
              description: The structure of this object is service-specific.
    APDataExchangeFileRequest:
      type: object
      additionalProperties: false
      required:
      - fileType
      - fileFormat
      - includeSupportingDocuments
      properties:
        fileType:
          $ref: '#/components/schemas/APDataFileType'
        fileFormat:
