info:
  title: Thomson Reuters AP Batch Files API
  version: '1.0'
  description: 'Operations tagged AP Batch Files across 2 of this provider''s published API definitions: thomson-reuters-ap-exchange-api-1-0-openapi.json, thomson-reuters-ap-exchange-api-1-0-openapi.yml. Each path carries the servers of the definition it was published in.'
