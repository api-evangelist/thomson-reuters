tags:
- name: AP Batch Files
  description: Use the AP Batch Files AP Exchange API to view summaries and supporting files for batch runs.
paths:
  /routes/{routeId}/batches/{batchId}/files:
    post:
      tags:
      - AP Batch Files
      summary: Returns summaries and supporting files of a given batch run
      operationId: APBatch_Files
      parameters:
      - name: routeId
        in: path
        required: true
        description: AP route ID (Sequence Number)
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: batchId
        in: path
        required: true
        description: AP batch ID
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      requestBody:
        x-name: request
        description: AP batch file request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APDataExchangeFileRequest'
        x-position: 3
      responses:
        '200':
          description: APDataExchangeFileModel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APDataExchangeFileModel'
        '400':
          description: One or more validation errors in the request were encountered while processing the initial request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The requested resource requires authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Access is denied:
                  value:
                    error:
                      code: Unauthorized
                      message: The requested resource requires authentication.
        '403':
          description: The web service account has insufficient permissions to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with that identifier could be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
      - Token: []
    servers:
    - url: https://api.thomsonreuters.com/legal-tracker/ap-exchange-api/v1
    - url: https://api.thomsonreuters.co.uk/legal-tracker/ap-exchange-api/v1
    - url: https://api.thomsonreuters.ca/legal-tracker/ap-exchange-api/v1
    - url: https://api.thomsonreuters.com.au/legal-tracker/ap-exchange-api/v1
    - url: https://api.thomsonreuters.de/legal-tracker/ap-exchange-api/v1
    - url: https://api.thomsonreuters.ae/legal-tracker/ap-exchange-api/v1
  /routes/{routeId}/batches/{batchId}/spreadsheet:
    get:
      tags:
      - AP Batch Files
      summary: Returns spreadsheet of a given batch run
      operationId: APBatch_Spreadsheet
      parameters:
      - name: routeId
        in: path
        required: true
        description: AP route ID (Sequence Number)
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: batchId
        in: path
        required: true
        description: AP batch ID
        schema:
          type:
          - string
          - 'null'
        x-position: 2
      responses:
        '200':
          description: APDataExchangeFileModel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APDataExchangeFileModel'
        '400':
          description: One or more validation errors in the request were encountered while processing the initial request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The requested resource requires authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Access is denied:
                  value:
                    error:
                      code: Unauthorized
                      message: The requested resource requires authentication.
        '403':
