openapi: 3.2.0
info:
  title: Thomson Reuters Schedule K1 API
  version: '2.0'
  description: 'Operations tagged ScheduleK1 across 4 of this provider''s published API definitions: thomson-reuters-onesource-trust-tax-services-v1-openapi.json, thomson-reuters-onesource-trust-tax-services-v2-openapi.json, thomson-reuters-onesource-trust-tax-services-v1-openapi.yml, thomson-reuters-onesource-trust-tax-services-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/trust-tax
security:
- bearerAuth: []
tags:
- name: ScheduleK1
paths:
  /v1/s-corp-schedule-k1s:
    post:
      tags:
      - ScheduleK1
      summary: Allows an authenticated user to import Scorp K1 amounts for each of the…
      description: Submit Scorp Schedule-K1 for import
      operationId: SubmitScorpSchedule-K1ForImport
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ScorpK1'
          application/json:
            schema:
              $ref: '#/components/schemas/ScorpK1'
          text/json:
            schema:
              $ref: '#/components/schemas/ScorpK1'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ScorpK1'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-operation-id-source: normalized
      x-operation-id-original: Submit Scorp Schedule-K1 for import
    servers:
    - url: https://api.onesourcetax.com/trust-tax
  /v1/s-corp-schedule-k1s/operations/{id}:
    get:
      tags:
      - ScheduleK1
      summary: Allows an authenticated user to retrieve the import status
      description: Retrieves Scorp Schedule-K1 Import status
      operationId: RetrievesScorpSchedule-K1ImportStatus
      parameters:
      - name: id
        in: path
        description: Scorp K1 import operation identifier
        required: true
        schema:
          type: string
          description: Scorp K1 import operation identifier
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves Scorp Schedule-K1 Import status
    servers:
    - url: https://api.onesourcetax.com/trust-tax
  /v2/partnership-schedule-k1s/operations/{id}:
    get:
      tags:
      - ScheduleK1
      summary: Retrieve the import status
      description: Retrieves Partnership Schedule-K1 Import status.
      operationId: RetrievesPartnershipSchedule-K1ImportStatus
      parameters:
      - name: id
        in: path
        description: Partnership K1 import operation identifier.
        required: true
        schema:
          type: string
          description: Partnership K1 import operation identifier.
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves Partnership Schedule-K1 Import status
    servers:
    - url: https://api.onesourcetax.com/trust-tax
  /v2/partnership-schedule-k1s:
    post:
      tags:
      - ScheduleK1
      summary: Import Partnership K1 amounts for each participant account
      description: Allows an authenticated user to import Partnership K1 amounts for each of the participants accounts. This data will be displayed on the ONESOURCE Trust Tax Software K1 Input screens and will feed to the 1041 tax return and will be used in estimate calculations. Year 2019.
      operationId: SubmitPartnershipSchedule-K1ForImport
      parameters: []
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PartnershipK1'
          application/json:
            schema:
              $ref: '#/components/schemas/PartnershipK1'
          text/json:
            schema:
              $ref: '#/components/schemas/PartnershipK1'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PartnershipK1'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-operation-id-source: normalized
      x-operation-id-original: Submit Partnership Schedule-K1 for import
    servers:
    - url: https://api.onesourcetax.com/trust-tax
