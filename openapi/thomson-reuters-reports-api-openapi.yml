openapi: 3.2.0
info:
  title: Thomson Reuters Reports API
  version: '1.0'
  description: 'Operations tagged Reports across 6 of this provider''s published API definitions: thomson-reuters-onesource-indirect-tax-compliance-reports-api-openapi.json, thomson-reuters-reports-api-2-0-openapi.json, thomson-reuters-reports-api-2-0-openapi.yml, thomson-reuters-reports-api-2-openapi.yml, thomson-reuters-reports-api-v1-openapi.yml, thomson-reuters-reports-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-emea.onesourcetax.com/indirect-tax-compliance/v2/reports
- url: https://api.thomsonreuters.com/legal-tracker/reports-api/v2
- url: https://api.thomsonreuters.co.uk/legal-tracker/reports-api/v2
- url: https://api.thomsonreuters.ca/legal-tracker/reports-api/v2
- url: https://api.thomsonreuters.com.au/legal-tracker/reports-api/v2
- url: https://api.thomsonreuters.de/legal-tracker/reports-api/v2
- url: https://api.thomsonreuters.ae/legal-tracker/reports-api/v2
- url: https://api-uat.onesourcetax.com/corporate-tax/v1/reports
  description: UAT server for corporate tax datasets
- url: https://api-emea.onesourcetax.com/corporate-tax/v1/reports
  description: EMEA server for corporate tax datasets
- url: https://api-apac.onesourcetax.com/corporate-tax/v1/reports
  description: APAC server for corporate tax datasets
- url: https://api-emea.onesourcetax.com/indirect-tax-compliance/v1/reports
tags:
- name: Reports
paths:
  /definitions:
    get:
      tags:
      - Reports
      summary: Reports
      description: This endpoint is used to retrieve the list of all Reports available in the system (Both Standard and Custom).
      operationId: Reports_GetReports
      parameters:
      - name: Authorization
        in: header
        description: The authorization token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportListResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportListResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportListResponse'
    servers:
    - url: https://api-emea.onesourcetax.com/indirect-tax-compliance/v2/reports
  /definitions/{id}:
    get:
      tags:
      - Reports
      summary: Report Metadata
      description: This endpoint fetches the parameters required to run a specific Report along with the list of fields in the report output. Report output fields are the output columns which this particular report will fetch and display.
      operationId: Reports_GetReportMetdata
      parameters:
      - name: id
        in: path
        description: Report-definition-header id
        required: true
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: The authorization token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportMetadata'
            text/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportMetadata'
            application/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportMetadata'
            text/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportMetadata'
    servers:
    - url: https://api-emea.onesourcetax.com/indirect-tax-compliance/v2/reports
  /:
    post:
      tags:
      - Reports
      summary: Run Report
      description: This endpoint is used to Queue reports for execution, based on the input parameters. The input parameters required are retrieved by calling the 'Report MetaData' endpoint first. Once obtained, these values are passed as input to execute 'Run Report'.
      operationId: Reports_GetData
      parameters:
      - name: Authorization
        in: header
        description: The authorization token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportInput'
          text/json:
            schema:
              $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportInput'
          text/xml:
            schema:
              $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportInput'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
              example:
                id: 7421
                name: Transaction details - transactional information with returns
                runId: 8f62c4cd-03aa-482c-a971-fa54e23c19f6
                parameters:
                - name: Entity
                  value: 296172cf-182d-4d31-b74c-ce10f1b7346a
                status: InProgress
                items: []
                count: 0
            text/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
            application/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
            text/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
              example:
                id: 12345
                name: TaxClassificationBoxMapping
                runId: 00000000-0000-0000-0000-000000000000
                parameters:
                - name: Jurisdiction Id
                  value: PL
                status: Failed
                items: []
                count: 0
                reason: Error queueing request. Try again after some time.
            text/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
            application/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
            text/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
      x-codegen-request-body-name: input
    servers:
    - url: https://api-emea.onesourcetax.com/indirect-tax-compliance/v2/reports
  /operations/{id}:
    get:
      tags:
      - Reports
      summary: Get Report Status
      description: This endpoint is used to get the latest status of a report that has been queued using the 'Run Report' endpoint. When you queue a report using 'Run Report', you receive a 'run-id' in the response. Pass that 'run-id' as the id parameter in this endpoint's URL to retrieve the report status.
      operationId: Reports_GetOperationStatusFromCache
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: The authorization token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Common.OpertaionsResponse'
              example:
                status: Ready
                resourceLocation: https://api-emea.onesourcetax.com/indirect-tax-compliance/beta/reports/8f62c4cd-03aa-482c-a971-fa54e23c19f6
            text/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Common.OpertaionsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Common.OpertaionsResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Common.OpertaionsResponse'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System.Web.Http.Results.NotFoundResult'
            text/json:
              schema:
                $ref: '#/components/schemas/System.Web.Http.Results.NotFoundResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/System.Web.Http.Results.NotFoundResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/System.Web.Http.Results.NotFoundResult'
    servers:
    - url: https://api-emea.onesourcetax.com/indirect-tax-compliance/v2/reports
  /{id}:
    get:
      tags:
      - Reports
      summary: Get Report Data
      description: This endpoint is used to fetch the data in Json array format which was requested or queued from 'Run Report' endpoint. 'run-id' generated from the 'Run Report' should be passed as the 'id' parameter in the URL in order to retrive the data.
      operationId: Reports_GetDataFromCache
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offset
        description: Specifies the starting position in the result set. With offset=1, you're skipping the first record and starting from the second one.
        in: query
        schema:
          type: integer
          format: int32
      - name: limit
        description: Specifies the maximum number of records to return in a single response. With limit=20, you're requesting up to 20 records in this call
        in: query
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: The authorization token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
              example:
                id: 7421
                name: Transaction details - transactional information with returns
                runId: 8f62c4cd-03aa-482c-a971-fa54e23c19f6
                parameters:
                - name: Entity
                  value: 296172cf-182d-4d31-b74c-ce10f1b7346a
                - name: Start date
                  value: '2020-04-01'
                - name: End date
                  value: '2020-04-30'
                status: Ready
                items:
                - EntityReportingID: 296172cf-182d-4d31-b74c-ce10f1b7346a
                  ReportingDate: 4/13/2020 12:00:00 AM
                  TransactionType: AP
                  InvoiceType: '1'
                  AmountNet: '5431430'
                  AmountTax: '0'
                  AmountGross: '5431430'
                  TaxClassificationCode: APEUSUPSRVIS
                  TaxClassification: AP_EUSUPSRV_I_S
                  InvoiceDate: 7/15/2021 12:00:00 AM
                  InvoiceID: '12345671'
                  FileName: distinctInvoice -Dummy123.csv
                  Dataset: Sample Dataset 1
                  Return: Sample Return Q1 2023
                  SupplierName: CFC Ltd
                  SupplierVATNumber: GB987654321
                  SupplierAddress: Stamford Bridge, Fulham
                  CustomerName: ABC Ltd
                  CustomerVATNumber: GB123456789
                  CustomerAddress: 5 Canada Square, London
                count: 1
            text/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
            application/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
            text/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportOutput'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System.Web.Http.Results.NotFoundResult'
            text/json:
              schema:
                $ref: '#/components/schemas/System.Web.Http.Results.NotFoundResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/System.Web.Http.Results.NotFoundResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/System.Web.Http.Results.NotFoundResult'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Api.Models.V4.Reports.ReportConflictResponse'
              example:
                Message: Unable to download report.
                ErrorCode: OIC-API-4009
                MessageDetail: Report cannot be downloaded as it is currently being generated. Please wait for the report to reach 'Ready' status before downloading it.
            text/json:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Api.Models.V4.Reports.ReportConflictResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Api.Models.V4.Reports.ReportConflictResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/TRTA.Athena.Api.Models.V4.Reports.ReportConflictResponse'
    servers:
    - url: https://api-emea.onesourcetax.com/indirect-tax-compliance/v2/reports
  /reports:
    post:
      tags:
      - Reports
      summary: Generate a report by ID with option to modify the report filters on the fly
      description: Generate a report by ID with option to modify the report filters on the fly.
      operationId: Report_Post
      requestBody:
        x-name: reportOptions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportOptionsWithFiltersModel'
        x-position: 1
      responses:
        '200':
          description: Expected format of report file
          content:
            text/csv:
              schema:
                type: string
                description: Report in CSV format
                format: binary
            application/xml:
              schema:
                type: string
                description: Report in XML format
                format: binary
            application/pdf:
              schema:
                type: string
                description: Report in PDF format
                format: binary
            application/vnd.ms-excel:
              schema:
                type: string
                description: Report in Excel format
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                description: Report in Excelx format
                format: binary
        '400':
          description: One or more validation errors in the request were encountered while processing the initial request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with that identifier could be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The web service account has insufficient permissions to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Report cannot be returned in any of the specified formats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The requested resource requires authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Access is denied:
                  value:
                    error:
                      code: Unauthorized
                      message: The requested resource requires authentication.
      security:
      - OAuth2: []
    servers:
    - url: https://api.thomsonreuters.com/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.co.uk/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.ca/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.com.au/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.de/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.ae/legal-tracker/reports-api/v2
  /reports/{id}/exports:
    post:
      tags:
      - Reports
      summary: Create a request to generate a report in asynchronous mode.
      operationId: Report_ExportTo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        x-position: 1
      requestBody:
        x-name: exportOptions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportOptionsExportModel'
        x-position: 2
      responses:
        '200':
          description: Request to export the report was created.
          headers:
            Location:
              description: The value of the header is a URL that can be used to retrieve or update the resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedExport'
        '400':
          description: One or more validation errors in the request were encountered while processing the initial request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with that identifier could be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The web service account has insufficient permissions to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The requested resource requires authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Access is denied:
                  value:
                    error:
                      code: Unauthorized
                      message: The requested resource requires authentication.
      security:
      - OAuth2: []
    servers:
    - url: https://api.thomsonreuters.com/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.co.uk/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.ca/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.com.au/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.de/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.ae/legal-tracker/reports-api/v2
  /reports/{reportId}/exports/{exportId}:
    get:
      tags:
      - Reports
      summary: Returns the status of the Export to file job
      operationId: Report_GetExport
      parameters:
      - name: reportId
        in: path
        required: true
        description: Id of the report.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: exportId
        in: path
        required: true
        description: Id of the export.
        schema:
          type: integer
          format: int32
        x-position: 2
      responses:
        '200':
          description: The actual status of report export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '400':
          description: One or more validation errors in the request were encountered while processing the initial request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with that identifier could be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The web service account has insufficient permissions to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The requested resource requires authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Access is denied:
                  value:
                    error:
                      code: Unauthorized
                      message: The requested resource requires authentication.
      security:
      - OAuth2: []
    servers:
    - url: https://api.thomsonreuters.com/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.co.uk/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.ca/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.com.au/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.de/legal-tracker/reports-api/v2
    - url: https://api.thomsonreuters.ae/legal-tracker/reports-api/v2
components:
  schemas:
    TRTA.Athena.Models.Api.V4.Reports.ReportMetadata:
      type: object
      properties:
        id:
          type: integer
          description: Report Id
          format: int32
          example: 7421
        name:
          type: string
          description: Report name
          example: Transaction details - transactional information with returns
        parameters:
          type: array
          description: Input Parameters
          items:
            $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportParameter'
        resultFields:
          type: array
          description: Result columns
          items:
            $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportField'
    TRTA.Athena.Models.Api.V4.Reports.ReportOutput:
      type: object
      properties:
        id:
          type: integer
          description: Report Id
          format: int32
        name:
          type: string
          description: Report Name
        runId:
          type: string
          description: Runid of report.
          format: uuid
        parameters:
          type: array
          description: Parameter supplied as input for the report
          items:
            $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportParameterInput'
        status:
          type: string
          description: Status of report (In-Progress/Ready/Invalid)
        items:
          type: array
          description: Report data, It will only have data when status is Ready.
          items:
            type: object
        count:
          type: integer
          format: int32
    System.Web.Http.Results.NotFoundResult:
      type: object
    TRTA.Athena.Models.Api.V4.Reports.Report:
      type: object
      title: Report
      description: Report object containing report details
      properties:
        id:
          type: integer
          description: Report id value
          format: int32
          example: 7421
        name:
          type: string
          description: Name of the Report
          example: Transaction details – transactional information with returns
        description:
          type: string
          description: Detailed description of report
          example: Transaction details transactional information with returns
    TRTA.Athena.Models.Api.V4.Common.OpertaionsResponse:
      type: object
      properties:
        status:
          type: string
        resourceLocation:
          type: string
    TRTA.Athena.Api.Models.V4.Reports.ReportConflictResponse:
      type: object
      properties:
        Message:
          type: string
        ErrorCode:
          type: string
        MessageDetail:
          type: string
    TRTA.Athena.Models.Api.V4.Reports.ReportField:
      type: object
      properties:
        Name:
          type: string
          description: Name of the column
          example: EntityReportingID
        Caption:
          type: string
          description: Display property of the column
          example: Entity
        DataType:
          type: string
          description: Datatype of the column
          example: string
    TRTA.Athena.Models.Api.V4.Reports.ReportListResponse:
      type: object
      properties:
        items:
          type: array
          description: Reports
          items:
            $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.Report'
    TRTA.Athena.Models.Api.V4.Reports.ReportParameter:
      type: object
      properties:
        name:
          type: string
          description: Name of parameter
          example: Start date
        description:
          type: string
          description: Detailed description of parameter
          example: Start date
        dataType:
          type: string
          description: 'Datatype of parameter(ex: string, date)'
          example: date
        format:
          type: string
          description: 'Format of value (ex: for date it is yyyy-mm-dd)'
          example: yyyy-mm-dd
        acceptMultiple:
          type: boolean
          description: Indicate that value of parameter accepts multiple values to be passed together.
          example: false
    TRTA.Athena.Models.Api.V4.Reports.ReportParameterInput:
      type: object
      properties:
        name:
          type: string
          description: Name of parameter
        value:
          type: string
          description: Value of parameter
      example:
        items:
          name: Entity
          value: 296172cf-182d-4d31-b74c-ce10f1b7346a
    TRTA.Athena.Models.Api.V4.Reports.ReportInput:
      type: object
      properties:
        id:
          type: integer
          description: Report-definition id
          format: int32
          example: 7421
        parameters:
          type: array
          description: Report parameter
          items:
            $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Reports.ReportParameterInput'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            target:
              type: string
            details:
              type: array
              items:
                type: object
