    get:
      tags:
      - Job Service
      summary: Get a paginated list of available Jobs
      description: Returns a list of Jobs with their metadata
      operationId: getJobs
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionJobResponse'
      security:
      - bearerAuth: []
    post:
      tags:
      - Job Service
      summary: Create a new Job
      description: Adds Job with any fields and default 'STAGED' status. To start a Job right away, include all of the parameters with the status 'STARTED'.
      operationId: createJob
      parameters:
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateJobRequest'
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdResponseString'
      security:
      - bearerAuth: []
      x-tr-jtp-reference:
        name: default
    servers:
    - url: https://api.onesourcetax.com/general-ledger-manager/v1
  /jobs/{id}:
    get:
      tags:
      - Job Service
      summary: Get Job by ID
      description: Returns Job metadata for the specified Job ID
      operationId: getJob
      parameters:
      - name: id
        in: path
        description: Description
        required: true
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/JobResponse'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Job Service
      summary: Updates an existing Job
      description: Updates values about a Job. The job must be in 'STAGED' status.
      operationId: updateJob
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateJobRequest'
      responses:
        '200':
          description: default response
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/general-ledger-manager/v1
