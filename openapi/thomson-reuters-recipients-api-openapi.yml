          - number
          - 'null'
          description: State Tax
          format: double
        tax_letter_fee:
          type:
          - number
          - 'null'
          description: Tax Letter Fee
          format: double
        phone_number:
          maxLength: 14
          type:
          - string
          - 'null'
          description: Phone Number
        tav_recipient_number:
          maxLength: 12
          type:
          - string
          - 'null'
          description: TAV Recipient Number
        1099_recipient_type:
          $ref: '#/components/schemas/A1099RecipientType'
        clifford_crummey:
          $ref: '#/components/schemas/CliffordCrummey'
        w9_date:
          pattern: yyyy-MM-dd
          type:
          - string
          - 'null'
          description: W-9 Date
        w9_sent_indicator:
          type:
          - boolean
          - 'null'
          description: W-9 Sent
        generation_skip_person:
          $ref: '#/components/schemas/GenerationSkipPerson'
        prior_year_undistributed_resident_state_municipal_income_5227:
          type:
          - number
          - 'null'
          description: Prior year undistributed resident state municipal income (5227 accounts)
          format: double
        for_wsc_mlp_processing_use_this_recipient_address:
          type:
          - boolean
          - 'null'
          description: For WSC MLP processing use this recipient address
        type_of_entity_of_beneficiary:
          $ref: '#/components/schemas/TypeOfEntityOfBeneficiary'
        type_of_beneficiary_for_990:
          $ref: '#/components/schemas/TypeOfBeneficiaryFor990'
        do_not_send_to_mail_service:
          type:
          - boolean
          - 'null'
          description: Do Not Send to Mail Service
        tax_payer_id_lock:
          $ref: '#/components/schemas/OnOff'
        1099_recipient_type_lock:
          $ref: '#/components/schemas/OnOff'
        address_lock:
          $ref: '#/components/schemas/OnOff'
        date_of_birth_lock:
          $ref: '#/components/schemas/OnOff'
        name_lock:
          $ref: '#/components/schemas/OnOff'
        resident_state_lock:
          $ref: '#/components/schemas/OnOff'
        yrseq:
          type: integer
          description: Tax Year Sequence, use accounts api to get appropriate account and year sequence
          format: int32
