          pattern: yyyy-MM-dd
          type:
          - string
          - 'null'
          description: Data of Birth
        date_of_death:
          pattern: yyyy-MM-dd
          type:
          - string
          - 'null'
          description: Date of Death
        address1:
          maxLength: 40
          type:
          - string
          - 'null'
          description: Address 1
        address2:
          maxLength: 40
          type:
          - string
          - 'null'
          description: Address 2
        address3:
          maxLength: 40
          type:
          - string
          - 'null'
          description: Address 3
        city:
          maxLength: 25
          type:
          - string
          - 'null'
          description: City
        country:
          $ref: '#/components/schemas/Country'
        state:
          $ref: '#/components/schemas/State'
        zip:
          maxLength: 10
          minLength: 5
          type:
          - string
          - 'null'
          description: US Zip code
        canadian_province:
          $ref: '#/components/schemas/CanadaProvince'
        foreign_province:
          maxLength: 40
          type:
          - string
          - 'null'
          description: Foreign Province
        foreign_postal_code:
          maxLength: 15
          type:
          - string
          - 'null'
          description: Foreign Postal Code
        resident_state:
          $ref: '#/components/schemas/ResState'
        state_tax:
