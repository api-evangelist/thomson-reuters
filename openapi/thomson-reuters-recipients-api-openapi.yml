      type: object
      properties:
        request_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OperationsStatus'
        location:
          type:
          - string
          - 'null'
        created_date_time:
          type: string
          format: date-time
        last_action_date_time:
          type: string
          format: date-time
      additionalProperties: false
    RecipientDetail:
      required:
      - name1
      - tax_payer_id
      type: object
      properties:
        tax_payer_id:
          pattern: 111-11-1111 (SSN) or 11-1111111 (TIN)
          type: string
          description: An Individual Taxpayer Identification Number (or ITIN) is nine-digit number issued by the IRS to individuals who must have an identifying number but who are not eligible for a Social Security Number or an Employer ID Number
        name1:
          maxLength: 45
          type: string
          description: We have parsed the beneficiary name into First, Middle and Last name which are used for some state e-filing purposes. You should review the Beneficiary List register for the parsed names and make any appropriate changes. Updating the Beneficiary List register will not change the beneficiary name on the recipient detail screen. If you make any change to the Bene Name on the recipient detail screen you should review the Beneficiary List register.
        name2:
          maxLength: 40
          type:
          - string
          - 'null'
          description: We have parsed the beneficiary name into First, Middle and Last name which are used for some state e-filing purposes. You should review the Beneficiary List register for the parsed names and make any appropriate changes. Updating the Beneficiary List register will not change the beneficiary name on the recipient detail screen. If you make any change to the Bene Name on the recipient detail screen you should review the Beneficiary List register.
