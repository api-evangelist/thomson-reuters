openapi: 3.2.0
info:
  title: Thomson Reuters Recipients API
  version: '2.0'
  description: 'Operations tagged Recipients across 2 of this provider''s published API definitions: thomson-reuters-onesource-trust-tax-services-v1-openapi.json, thomson-reuters-onesource-trust-tax-services-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/trust-tax
security:
- bearerAuth: []
tags:
- name: Recipients
paths:
  /v1/recipients/operations/{id}:
    get:
      tags:
      - Recipients
      summary: Allows an authenticated user to retrieve the recipients operation status
      description: Retrieves the Recipients status
      operationId: RetrievesTheRecipientsStatus
      parameters:
      - name: id
        in: path
        description: Operation request identifier
        required: true
        schema:
          type: string
          description: Operation request identifier
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves the Recipients status
    servers:
    - url: https://api.onesourcetax.com/trust-tax
  /v1/pans/{pan}/accounts/{acctNo}/recipients:
    put:
      tags:
      - Recipients
      summary: Allows an authenticated user to update existing recipient for designated…
      description: Updates existing Recipients information
      operationId: UpdatesExistingRecipientsInformation
      parameters:
      - name: pan
        in: path
        required: true
        schema:
          type: string
      - name: acctNo
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/RecipientModel'
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientModel'
          text/json:
            schema:
              $ref: '#/components/schemas/RecipientModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RecipientModel'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-operation-id-source: normalized
      x-operation-id-original: Updates existing Recipients information
    post:
      tags:
      - Recipients
      summary: Allows an authenticated user to add new recipient for designated PAN/Trust…
      description: Creates a new Recipient for designated PAN/Trust Account
      operationId: CreatesANewRecipientForDesignatedPAN/TrustAccount
      parameters:
      - name: pan
        in: path
        required: true
        schema:
          type: string
      - name: acctNo
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/RecipientModel'
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientModel'
          text/json:
            schema:
              $ref: '#/components/schemas/RecipientModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RecipientModel'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
      x-operation-id-source: normalized
      x-operation-id-original: Creates a new Recipient for designated PAN/Trust Account
    servers:
    - url: https://api.onesourcetax.com/trust-tax
