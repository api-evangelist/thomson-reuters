      required:
      - sourceTaxCode
      - targetTaxCode
      type: object
      properties:
        id:
          format: int32
          description: Id
          type: integer
        description:
          description: TaxCodeDescription
          type: string
        sourceTaxCode:
          description: SourceTaxCode
          type: string
        targetTaxCode:
          description: TargetTaxCode
          type: string
        adjustInvoices:
          description: AdjustInvoices
          type: boolean
        adjustCreditNotes:
          description: AdjustCreditNotes
          type: boolean
        reverseSign:
          description: ReverseSign
          type: boolean
    TRTA.Athena.Models.Api.V4.TaxClassification.TargetTaxCodeModel:
      description: Target Tax Code
      type: object
      properties:
        id:
          description: id
          type: string
        description:
          description: Description
          type: string
        taxCodeKey:
          description: Tax code key
          type: string
        taxCodeValue:
          description: Tax code value
          type: string
        createdDate:
          format: date-time
          description: Created Date
          type: string
        updatedDate:
          format: date-time
          description: Last Updated Date
          type: string
        childTaxCodes:
          description: List of child tax codes
          type: array
          items:
            $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.TaxClassification.TargetTaxCodeModel'
    TRTA.Athena.Models.Api.V4.TaxClassification.TaxCodeMappingRequestModel:
