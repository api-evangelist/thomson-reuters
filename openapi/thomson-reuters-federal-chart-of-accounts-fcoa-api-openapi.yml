components:
  schemas:
    FederalAccountsRepresentation:
      type: object
      properties:
        xlsxFile:
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          type: string
          format: byte
        resourceList:
          type: array
          items:
            $ref: '#/components/schemas/FederalAccountRepresentation'
    ProblemRepresentation:
      type: object
      properties:
        type:
          type: object
          format: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FederalChartOfAccountsOptionRepresentation:
      type: object
      properties:
        chartId:
          type: string
        closeBooksToRetainedEarningsAccount:
          $ref: '#/components/schemas/FederalAccountSummaryRepresentation'
        postRoundingDifferenceToBalanceSheetAccount:
          $ref: '#/components/schemas/FederalAccountSummaryRepresentation'
        postTranslationGainLossToRetainedEarningsAccount:
          $ref: '#/components/schemas/FederalAccountSummaryRepresentation'
        transferTcc001Detail:
          type: boolean
          description: Indicates whether to transfer TCC 001 description.
        roundingAmount:
          type: number
          description: Amount of tolerance for out-of-balance conditions.
          format: double
    FederalAccountSummaryRepresentation:
      type: object
      properties:
        accountId:
          type: integer
          description: System-generated ID for an account number in the chart of accounts.
          format: int32
        accountCode:
          type: string
          description: Account number in the chart of accounts.
        accountDescription:
          type: string
          description: Account description in the chart of accounts.
        accountType:
          type: string
          description: Account code associated with either income or balance sheet (mutually exclusive).
        tccId:
          type: integer
          description: System-generated ID code used to combine accounts into subcategories within a single TRC.
          format: int32
        trcCategoryId:
          type: integer
          description: System-generated ID for TRC.
          format: int32
        trcNumber:
          type: integer
          description: System-defined number for a TRC.
          format: int32
        trcDescription:
          type: string
          description: System-defined description for a TRC.
        tccNumber:
          type: string
          description: User-defined code used to combine accounts into subcategories within a single TRC.
        tccDescription:
          type: string
          description: User-defined description used to combine accounts into subcategories within a single TRC (tax return code).
        trcFormattedNumber:
          type: string
          description: System-defined number for a TRC.
    FieldError:
      type: object
      properties:
        fieldName:
          type: string
        messages:
          type: array
          items:
            type: string
        errorCode:
          type: integer
          format: int32
    FederalChartOfAccountsRepresentation:
      type: object
      properties:
        year:
          type: integer
          description: Tax year.
          format: int32
        chartId:
          type: string
          description: System-generated unique identifier for a chart.
        tccChartId:
          type: string
          description: System-generated ID for a TCC chart.
        tccChartName:
          type: string
          description: User-defined TCC chart name.
        chartName:
          type: string
          description: User-defined unique chart name.
        chartDescription:
          type: string
          description: Chart description.
        isIncomeTax:
          type: boolean
          description: Indicates whether this is a master income tax chart.
        isProvision:
          type: boolean
          description: Indicates whether this is a master provision chart.
        isReadOnly:
          type: boolean
          description: Indicates whether the chart can be deleted.
        priorYearChartId:
          type: string
          description: Chart ID that the existing chart was rolled from.
        priorYearChartName:
          type: string
          description: Chart name from the prior year.
        taxReturnType:
          type: string
          description: IRS-defined type of tax return.
        taxReturnTypeDescription:
          type: string
        isAvailableForRollover:
          type: boolean
          description: Indicates whether the chart is available for rollover.
        applicableAdjustments:
          type: array
          description: Adjustments that can be applied to a particular adjustment chart type.
          items:
            type: string
        option:
          $ref: '#/components/schemas/FederalChartOfAccountsOptionRepresentation'
        federalAccountRepresentationList:
          type: array
          items:
            $ref: '#/components/schemas/FederalAccountRepresentation'
        rolloverStatus:
          $ref: '#/components/schemas/RolloverStatus'
        tccRolloverStatus:
          $ref: '#/components/schemas/RolloverStatus'
    ChartClosingRoundingOptions:
      type: object
      properties:
        closingAccountId:
          type: integer
          description: Unique ID for a close books to retained earnings account.
          format: int32
        closingAccountNumber:
          type: string
          description: Account number for a close books to retained earnings account.
        closingAccountDescription:
          type: string
          description: Account name for a close books to retained earnings account.
        roundingAccountId:
          type: integer
          description: Unique ID for a post rounding difference to balance sheet account.
          format: int32
        roundingAccountNumber:
          type: string
          description: Account number for a post rounding difference to balance sheet account.
        roundingAccountDescription:
          type: string
          description: Account name for a post rounding difference to balance sheet account.
        gainLossAccountNumber:
          type: string
          description: Account number for a post translation gain/loss to retained earnings account not used in any other adjustment or preliminary balance.
        gainLossAccountDescription:
          type: string
          description: Account name for a post translation gain/loss to retained earnings account not used in any other adjustment or preliminary balance.
        gainLossAccountId:
          type: integer
          description: Unique ID for a post translation gain/loss to retained earnings account not used in any other adjustment or preliminary balance.
          format: int32
        roundUpAmount:
          type: integer
          description: Value to round up the amount.
        enableTransferTcc001Detail:
          type: boolean
          description: Indicates whether to transfer TCC 001 detail.
    FederalChartOfAccountsListRepresentation:
      type: object
      properties:
        resourceList:
          type: array
          items:
            $ref: '#/components/schemas/FederalChartOfAccountsRepresentation'
    ChartClosingRoundingOptionsUpdateRepresentation:
      type: object
      properties:
        closingAccountNumber:
          type: string
          description: Account number for a close books to retained earnings account.
        roundingAccountNumber:
          type: string
          description: Account number for a post rounding difference to balance sheet account.
        gainLossAccountNumber:
          type: string
          description: Account number for a post translation gain/loss to retained earnings account not used in any other adjustment or preliminary balance.
        roundUpAmount:
          type: integer
          description: Value to round up the amount.
        enableTransferTcc001Detail:
          type: boolean
          description: Indicates whether to transfer TCC 001 detail.
    FederalAccountRepresentation:
      type: object
      properties:
        accountId:
          type: integer
          description: System-generated ID for an account number in the chart of accounts.
          format: int32
        accountCode:
          type: string
          description: Account number in the chart of accounts.
        accountDescription:
          type: string
          description: Account description in the chart of accounts.
        accountType:
          type: string
          description: Account code associated with either income or balance sheet (mutually exclusive).
