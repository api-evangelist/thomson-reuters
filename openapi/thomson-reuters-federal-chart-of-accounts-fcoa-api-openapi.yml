openapi: 3.2.0
info:
  title: ONESOURCE Income Tax Charts Federal Chart of Accounts…
  description: 'Charts are used to identify Tax Return Code (TRC) and Tax Combination Code (TCC) accounts and adjustments for multiple entities and binders. Use REST APIs to automatically manipulate basic chart functions.


    The charts are related by using elements from other charts to create a set of charts. Each set of charts is then assigned to an entity to use for TRC/TCCs, accounts, and adjustments. Chart assignments are either Common or Separate.'
  termsOfService: ''
  version: v1
servers:
- url: https://api.onesourcetax.com/income-tax/charts
security:
- Authorization: []
tags:
- name: Federal Chart of Accounts (FCOA)
paths:
  /v1/fcoa:
    get:
      tags:
      - Federal Chart of Accounts (FCOA)
      summary: Returns a list of all Federal Charts of Accounts
      operationId: RetrievesAFederalChartOfAccountsList
      parameters:
      - name: tccChartId
        in: query
        description: A 16-character Chart of TCC ID associated with the Federal Chart of Accounts.
        schema:
          type: string
      - name: year
        in: query
        description: Four-digit year.
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederalChartOfAccountsListRepresentation'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
          content: {}
        '500':
          description: An unexpected error was encountered. Contact ONESOURCE Technical Support.
          content: {}
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves a Federal Chart of Accounts List
    post:
      tags:
      - Federal Chart of Accounts (FCOA)
      summary: Creates a new Federal Chart of Accounts (FCOA)
      description: Create charts that contain general ledger accounts at a reporting level to support their tax return and provision filings. Assign a TRC/TCC code and description to each account in their Chart of Accounts (COA).
      operationId: CreatesNewFederalChartOfAccounts
      parameters:
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      - name: Content-Type
        in: header
        description: Indicates the request content media type.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      requestBody:
        description: Federal Chart of Accounts (FCOA).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederalChartOfAccountsRepresentation'
            examples:
              Add_FCOA:
                $ref: '#/components/examples/Add_FCOA'
        required: false
      responses:
        '201':
          description: Created.
          content: {}
        '400':
          description: The request failed. This failure is usually due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemRepresentation'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found. Check the URL.
          content: {}
        '500':
          description: An unexpected error was encountered. Contact ONESOURCE Technical Support.
          content: {}
