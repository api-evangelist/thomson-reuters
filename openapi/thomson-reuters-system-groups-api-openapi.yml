    post:
      tags:
      - System Groups
      summary: Add user to a system group
      description: 'This API call is used to add users in a system group.

        Error Codes


        Summary

        Ref Code (before V4)

        Ref Code (V4)


        The following users do not exist within the system:


        110

        110


        The group does not exist within the system


        126

        126


        The Group id is not in the proper format


        124

        124


        A User id is required


        109

        109


        Archived user(s) cannot be added to the system group:


        N/A

        394


        A user cannot be added to an auto-created group


        N/A

        299


        JIRA Ticket : https://dev.highq.com/jira/browse/COL-65908'
      operationId: addUserInSystemGroup
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: groupid
        in: path
        description: The ID of the system group
        required: true
        schema:
          type: string
      responses:
        '201':
          description: OK
        '400':
