          type: string
          default: '1'
      - name: id
        in: path
        description: The ID of the system group
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: 4xx Fail transaction(Client Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
