          application/json:
            schema:
              $ref: '#/components/schemas/UserIDListDBO'
          application/xml:
            schema:
              $ref: '#/components/schemas/UserIDListDBO'
    servers:
    - url: /monumentuat/api
  /{version}/groups:
    get:
      tags:
      - System Groups
      summary: System group list
      description: 'This API call is used to get a list of system groups.Note:

        The following changes have been made to this API endpoint

        Introduced sorting

        Added following additional items to the return object createddate, totalcount, total, nooforganisation


        Error Codes


        Summary

        Ref Code (before V4)

        Ref Code (V4)


        Invalid value provided in type, valid values are org, system or synced


        146

        146


        The ordertype is invalid. createddate is supported ordertype


        150

        150


        The orderby value is invalid. asc and desc are supported orderby values.


        151

        151


        JIRA Ticket : https://dev.highq.com/jira/browse/COL-65896


        Parameters

        Description


        type


        org (Organisation Auto created groups)


        synced (Groups imported from an external system like Active Directory)


        system (System groups)


        sort


        Allow ascending and descending sorting of a single field.


        GET /api/3/groups?ordertype=createddate


        This returns a list of groups sorted by createddate in ascending order.


        possible fields: createddate


        order by


        Allow ascending and descending sorting of a single field.


        GET /api/3/groups?orderby=desc


        possible fields: asc,desc'
      operationId: getAllGroup
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: type
        in: header
        description: type
        required: false
        schema:
          type: string
          enum:
          - org
          - synced
          - system
      - name: sort
        in: header
        description: sort
        required: false
        x-example: 'Allow ascending and descending sorting of a single field.<br>GET /api/3/groups?ordertype=createddate<br>This returns a list of groups sorted by createddate in ascending order.<br>possible fields: createddate'
        schema:
          type: string
      - name: order by
        in: header
        description: order by
        required: false
        x-example: 'Allow ascending and descending sorting of a single field.<br>GET /api/3/groups?orderby=desc<br>possible fields: asc,desc'
        schema:
          type: string
      responses:
        '200':
          description: OK [<br> Where "total" represents the total no of system groups in the system and "totalcount" is the no of groups returned in the response based on the filter criteria.]
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/IntegrationResponseGroupsObject'
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponseGroupsObject'
        '400':
          description: 4xx Fail transaction(Client Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: 5xx Fail transaction(Server Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    post:
      tags:
      - System Groups
      summary: add system group
      description: 'This API call is used to add a new system group object in the system.


        Error Codes


        Summary


        Ref code (before v4)


        Ref code (v4)


        System group name required


        N/A


        258


        Invalid input. Please remove ''>'' OR ''<'' from given input : name


        N/A


        390


        Invalid input. Please remove ''>'' OR ''<'' from given input : description


        N/A


        391


        Invalid input for sourcetype. Valid values are Active Directory or System.


        N/A


        359


        The group name cannot be empty


        121


        121


        The system group name ''Highq'' already exists within the system


        122


        122


        JIRA Ticket : https://dev.highq.com/jira/browse/COL-67587'
      operationId: createSystemGroup
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      responses:
        '201':
          description: OK [groupID,link are used in response]
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/group'
            application/json:
              schema:
                $ref: '#/components/schemas/group'
        '400':
          description: 4xx Fail transaction(Client Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: 5xx Fail transaction(Server Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/group'
          application/json:
            schema:
              $ref: '#/components/schemas/group'
          application/xml:
            schema:
              $ref: '#/components/schemas/group'
    servers:
    - url: /monumentuat/api
  /{version}/groups/{groupid}:
    delete:
      tags:
      - System Groups
      summary: Delete system group
      description: 'This API call is used to delete a system group.

        NOTE : This API now can be used to delete system as well as active directory groups.


        Error Codes


        Summary

        Ref Code (before V4)

        Ref Code (V4)


        Group id must be required


        125

        125


        Group id is not in proper format


        124

        124


        An auto-created group cannot be deleted


        N/A

        311


        The group does not exist within the system


        126

        126


        This system group name is associated with one or more sites


        N/A

        310


        JIRA Ticket : https://dev.highq.com/jira/browse/COL-65905'
