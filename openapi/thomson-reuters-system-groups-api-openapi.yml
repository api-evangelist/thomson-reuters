openapi: 3.2.0
info:
  title: Thomson Reuters System Groups API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged System Groups across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: System Groups
paths:
  /{version}/groups/{id_Name}:
    get:
      tags:
      - System Groups
      summary: Get system group
      description: 'This API call is used to get a system group object in the system.


        Error Codes


        Summary

        Ref Code (before V4)

        Ref Code (V4)


        Group id is required


        125

        125


        Group id is not in proper format


        124

        124


        The group does not exist within the system


        126

        126


        JIRA Ticket : https://dev.highq.com/jira/browse/COL-65839'
      operationId: getGroup
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: id_Name
        in: path
        description: The ID of the system group
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/group'
            application/json:
              schema:
                $ref: '#/components/schemas/group'
        '400':
          description: 4xx Fail transaction(Client Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: 5xx Fail transaction(Server Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/groups/{groupid}/users/{userid}:
    get:
      tags:
      - System Groups
      summary: Get users of a group
      description: API method to get users from a group. Please note that this method only gets users of an AD group, and not the system groups.
      operationId: getUser
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: groupid
        in: path
        description: group id
        required: true
        schema:
          type: string
      - name: userid
        in: path
        description: user id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/IntegrationResponseUsersObject'
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponseUsersObject'
        '400':
          description: 4xx Fail transaction(Client Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: 5xx Fail transaction(Server Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    delete:
      tags:
      - System Groups
      summary: Remove user from system group
      description: 'This API call is used to remove multiple users in a system group.

        Error Codes


        Summary

        Ref Code (before V4)

        Ref Code (V4)


        The following users do not exist within the system:


        110

        110


        The group does not exist within the system


        126

        126


        Group id is not in proper format


        124

        124


        The User ids are not in a given group:


        N/A

        259


        Users cannot be removed from an auto-created group


        N/A

        306


        User id is not in proper format


        113

        113


        The User''s id length cannot exceeds 50 characters


        N/A

        304


        JIRA Ticket : https://dev.highq.com/jira/browse/COL-66707'
      operationId: removeUserFromSystemGroup
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: groupid
        in: path
        description: The ID of the system group
        required: true
        schema:
          type: string
      - name: userid
        in: path
        description: The IDs of the users to be removed from system group.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: 4xx Fail transaction(Client Side)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: 5xx Fail transaction(Server Side)
          content:
