    get:
      tags:
      - ISheet Admin API
      summary: To get the list of iSheet column
      description: 'Method to Get columns of an existing iSheet.

        This method is supported in version 3 of the API and above.'
      operationId: getIsheetColumns
      parameters:
      - name: isheetid
        in: path
