  /{version}/isheets/admin/sortisheets:
    get:
      tags:
      - ISheet Admin API
      summary: To get the list of the iSheets sorted based on the position in ascending order
      description: 'This method is used to get the iSheets sorted based on the position in ascending order.


        GET /api/3/isheets/admin/sortisheets?siteid=${siteid}


        Parameter Name


        Parameter Value


        Description


        siteid


        number


        The id of the site


        Note : As seen in the UI, the response will display the iSheets in their correct sequence.'
      operationId: getSortIsheets
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: siteid
        in: query
        description: Id of the site
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: API will return the list of iSheets sorted based on the position in ascending order
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ISheetsDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ISheetsDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ISheetsDBO'
        '401':
          description: Unauthorised
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal error occurred
      security:
      - OAuth: []
    put:
      tags:
      - ISheet Admin API
      summary: To update iSheets in order
      description: 'This method is used to update iSheets into a sort order


        PUT /api/3/isheets/admin/sortisheets?siteid=${siteid}


        Parameter Name


        Parameter Value


        Description


        siteid


        number


        The id of the site for isheet sorts


        Note : Need to manage sequences in the request xml. We will refer this sequence for update. First iSheet will be set as first and second will be set for second iSheet.'
      operationId: updateSortIsheets
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: siteid
        in: query
        description: Id of the site
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The API will return the 200 response code without any message
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal error occurred
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/ISheetsDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/ISheetsDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/ISheetsDBO'
    servers:
    - url: /monumentuat/api
  /{version}/isheets/admin/doctemplate:
    get:
      tags:
      - ISheet Admin API
      summary: To get the iSheet document template
      description: 'This API call is used to get a list of iSheet document templates.

        This method is supported in version 3 of the API and above.'
      operationId: getDocTemplates
      parameters:
      - name: siteid
        in: query
        description: Id of the site
        required: true
        schema:
          type: integer
          format: int32
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      responses:
        '200':
          description: List of iSheet document template
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ISheetDocTemplatesDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ISheetDocTemplatesDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ISheetDocTemplatesDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal server error
      security:
      - OAuth: []
    post:
      tags:
      - ISheet Admin API
      summary: To add an iSheet document report
      description: 'This method shows you how to add a new iSheet document report


        POST /api/{version}/isheets/admin/doctemplate?siteid=${siteid}


        Parameter Name


        Parameter Value


        Description


        siteid


        A numeric value representing the site id


        The id of the site for iSheet document templates.'
      operationId: insertSheetDocReport
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: siteid
        in: query
        description: Id of the site for which the template are to be obtained
        required: true
        schema:
          type: string
      responses:
        '200':
          description: API will return the details of newly created iSheet document report.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ISheetDocTemplateDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ISheetDocTemplateDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ISheetDocTemplateDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal server error
      security:
      - OAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                reportfile:
                  type: string
                  description: Parameter name should be called reportfile and the value for it is the file to be uploaded
                  format: binary
                templatename:
                  type: string
                  description: Template name
                templatetype:
                  type: string
                  enum:
                  - SITE_WIDE
                  - SINGLE_RECORD
                  description: Template type
                linkedisheet:
                  type: string
                  description: Id of iSheet - only applicable for templatetype=SINGLE_RECORD
                linkedviewtype:
                  type: string
                  enum:
                  - '0'
                  - '1'
                  description: Linked view type - only applicable for templatetype=SINGLE_RECORD
                linkedviewid:
                  type: string
                  description: 'CSV of isheet view id (multiple view id with '','' separated ). Only applicable for templatetype=SINGLE_RECORD and 0 : All isheet views'
                generatedocument:
                  type: string
                  enum:
                  - WORD
                  - PDF
                  description: Generate document
                downloaddocument:
                  type: string
                  enum:
                  - '0'
                  - '1'
                  description: Download document
                savetofolder:
                  type: string
                  enum:
                  - '0'
                  - '1'
                  description: Save to folder
                savetospecificfolder:
                  type: string
                  description: Id of the folder
                savetospecificisheetcolumn:
                  type: string
                  description: Id of the column. This field only applicable for templatetype=SINGLE_RECORD
              required:
              - reportfile
              - templatename
    servers:
    - url: /monumentuat/api
