    servers:
    - url: /monumentuat/api
  /{version}/isheets/admin/{isheetid}:
    put:
      tags:
      - ISheet Admin API
      summary: To update the iSheet
      description: API method to edit an existing iSheet.
      operationId: updateIsheet
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: isheetid
        in: path
        description: Id of the iSheet which is being edited
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The API will return the 200 response code without any message
        '401':
          description: Unauthorised
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal error occurred
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/isheetDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/isheetDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/isheetDBO'
    delete:
      tags:
      - ISheet Admin API
      summary: To delete the iSheet
      description: 'This API will delete the existing iSheet.


        To delete an iSheet call API: DELETE /api/{version}/isheets/admin/{isheetid}


        Parameters:


        NameTypeDescription


        isheetIdnumberId of the iSheet for which the column is to be deleted


        To get the status of an iSheet columns based on a progressive key, call API POST /api/3/progressivekeystatus/{progressive_key}


        e.g. POST /api/{version}/progressivekeystatus/{progressive_key}


        NameTypeDescription


        progressive_keyStringThis key is returned when a long-running operation is called and can be used to find the final status of the operation


        If the operation is successful, the API returns a progressive key resource object. The possible status values are "INPROGRESS", "DONE" or "FAIL".

        In the case of a failure, an error object is returned with the appropriate error code.

        This method is supported in version 3 of the API and above.'
      operationId: deleteIsheet
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: isheetid
        in: path
        description: Id of the iSheet which is to be deleted
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '201':
          description: This key is returned when a long-running operation is called and can be used to find the final status of the operation
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal server error
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
