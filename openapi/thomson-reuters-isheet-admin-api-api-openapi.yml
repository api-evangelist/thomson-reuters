        Name


        Type


        Description


        progressive_key


        String


        You can use this key to check the status of your progress. When the first request is sent, a progressive key is returned in response.


        If the operation is successful, the API returns a progressive key resource object with status of either ''INPROGRESS'', ''DONE'', or ''FAIL''. If there is a failure, an error object is returned with the appropriate error code.


        Note: templateid is the id of the templates imported into the site from system admin'
