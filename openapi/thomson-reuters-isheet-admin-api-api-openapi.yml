openapi: 3.2.0
info:
  title: Thomson Reuters ISheet Admin API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged ISheet Admin API across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: ISheet Admin API
paths:
  /{version}/isheets/admin:
    get:
      tags:
      - ISheet Admin API
      summary: To get the list of iSheets
      description: 'This API call is used to get a list of iSheet of the site.


        This method includes the iSheet structure as seen in the iSheet admin interface. Please note that this method is only available to site and content admins.'
      operationId: getISheets
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: siteid
        in: query
        description: Id of the iSheet site for which the iSheets are to be obtained
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: Type parameter is not mandatory. Blank or Null will return all iSheets including metadata iSheets. Other values are documentmetadata, foldermetadata, taskmetadata, normal
        required: false
        schema:
          type: string
      responses:
        '200':
          description: API will return the list of iSheets of the site
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ISheetDocTemplatesDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ISheetDocTemplatesDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ISheetDocTemplatesDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal server error
      security:
      - OAuth: []
    post:
      tags:
      - ISheet Admin API
      summary: To create an iSheet
      description: 'Method to add a new iSheet to the site.

        The method only allows you to define the details of an iSheet, and does not provide the capability to add columns to the iSheet.

        Add columns to iSheet record method should be used to add columns to the iSheet.


        To Add an iSheet call API: POST : /api/3/isheets/admin?siteid={siteid}


        Parameters:


        NameTypeDescription


        siteidnumberThe of the site to create the iSheet in


        If successful, the API returns the 200 http message If the operation fails, the API will return one of the following error codes.


        CodeMeaning


        200iSheet created successfully


        401Unauthorised


        403Validation failed/ Forbidden


        405Method not allowed (calling api with wrong method)


        500Internal error occurred


        This method is supported in version 3 of the API and above.'
      operationId: createIsheet
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: siteid
        in: query
        description: Id of the site for which iSheet is to be created
        required: true
        schema:
          type: string
      responses:
        '200':
          description: API will return the details about the newly created iSheet.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/isheetDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/isheetDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/isheetDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal server error
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/isheetDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/isheetDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/isheetDBO'
    servers:
    - url: /monumentuat/api
  /{version}/isheets/admin/{isheetid}/sections:
    get:
      tags:
      - ISheet Admin API
      summary: To get the list of iSheet sections
      description: 'This API call is used to get list of sections for an iSheet of the site.

        This method is supported in version 3 of the API and above.'
      operationId: getISheetSection
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: isheetid
        in: path
        description: Id of the iSheet for which the sections are to be obtained
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: API will return the list of iSheet sections
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ISheetSectionsDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ISheetSectionsDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ISheetSectionsDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal server error
      security:
      - OAuth: []
    post:
      tags:
      - ISheet Admin API
      summary: To create an iSheet section
      description: 'This API will add a new section to the iSheet.

        This method is supported in version 3 of the API and above.'
      operationId: addIsheetSection
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: isheetid
        in: path
        description: Id of the iSheet for which the section is to be add
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: API will return the details about the newly created iSheet section.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ISheetSectionsDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ISheetSectionsDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ISheetSectionsDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal server error
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/ISheetSectionDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/ISheetSectionDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/ISheetSectionDBO'
    servers:
    - url: /monumentuat/api
