openapi: 3.2.0
info:
  title: Thomson Reuters Blueprints API
  version: '1.0'
  description: 'Operations tagged Blueprints across 2 of this provider''s published API definitions: thomson-reuters-blueprint-service-openapi.json, thomson-reuters-blueprint-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/data-hub/v1
security:
- bearerAuth: []
tags:
- name: Blueprints
paths:
  /blueprints:
    get:
      tags:
      - Blueprints
      summary: Get a paginated list of available Blueprints
      description: Returns a list of Blueprints with their metadata
      operationId: getBlueprints
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionBlueprintMeta'
      security:
      - bearerAuth: []
    post:
      tags:
      - Blueprints
      summary: Create a new Blueprint
      description: 'Adds Blueprint with required minimum criteria of name and can have additional information around type & columns definition (ontology, name, type, required, validate)


        Potential values for ontology:


        id name


        1 financial-hierarchy-position


        2 chart of accounts


        3 entity


        4 account


        5 balance'
      operationId: createBlueprint
      requestBody:
        description: Initial attributes for a new Blueprint
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataMinimalDTO'
        required: true
      responses:
        '201':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BlueprintId'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /blueprints/{id}:
    get:
      tags:
      - Blueprints
      summary: Get Blueprint by ID
      description: 'Returns Blueprint metadata for the specified Blueprint ID


        Potential values for ontology:


        id name


        1 financial-hierarchy-position


        2 chart of accounts


        3 entity


        4 account


        5 balance'
      operationId: getBlueprint
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Blueprint
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MetadataDTO'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Blueprints
      summary: Update blueprint name
      description: Update existing blueprint name and return no content response
      operationId: patchBluueprintName
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Blueprint
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBluePrintNameDTO'
      responses:
        '204':
          description: default response
          content:
            '*/*':
              schema:
                type: string
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /blueprints/{blueprintId}/columns/{name}:
    patch:
      tags:
      - Blueprints
      summary: Update blueprint column name
      description: Update existing blueprint name and return no content response
      operationId: updateBlueprintDisplayname
      parameters:
      - name: blueprintId
        in: path
        description: Unique identifier of the Blueprint
        required: true
        schema:
          type: integer
          format: int32
      - name: name
        in: path
        description: Unique identifier of the Blueprint Column name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBluePrintColumnDTO'
        required: true
      responses:
        '204':
          description: No Content
          content:
            '*/*':
              schema:
                type: string
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
components:
  schemas:
    BlueprintId:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the Blueprint
          format: int32
          example: 46
        version:
          type: integer
          description: Version of the Blueprint
          format: int32
          example: 5
    MetadataMinimalDTO:
      required:
      - columns
      - name
      type: object
      properties:
        name:
          type: string
          description: Label of the Blueprint
          example: My Blueprint Name
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnDTO'
        type_id:
          type: integer
          description: Unique identifier of the Blueprint type
          format: int32
          example: 2
    PatchBluePrintNameDTO:
      type: object
      properties:
        name:
          type: string
          description: A new name for the Blueprint
        is_hidden:
          type: boolean
          description: Visibility of the Template
          example: false
    ApiCollectionBlueprintMeta:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintMeta'
        _meta:
          $ref: '#/components/schemas/ApiMeta'
    UpdateBluePrintColumnDTO:
      type: object
      properties:
        display_name:
          type: string
          description: Blueprint Column display_name
    MetadataDTO:
      required:
      - columns
      - name
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the Blueprint
          format: int32
          example: 46
        version:
          type: integer
          description: Version of the Blueprint
          format: int32
          example: 5
        name:
          type: string
          description: Label of the Blueprint
          example: My Blueprint Name
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnDTO'
        type_id:
          type: integer
          description: Unique identifier of the Blueprint type
          format: int32
          example: 2
        is_hidden:
          type: boolean
          description: Visibility of the Blueprint
          example: false
    BlueprintMeta:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the Blueprint
          format: int32
          example: 46
        version:
          type: integer
          description: Version of the Blueprint
          format: int32
          example: 5
        name:
          type: string
          description: Label of the Blueprint
          example: My Blueprint Name
        type_id:
          type: integer
          description: Unique identifier of the Blueprint type
          format: int32
          example: 2
        is_hidden:
          type: boolean
          description: Visibility of the Blueprint
          example: false
    ColumnDTO:
      type: object
      properties:
        name:
          type: string
          description: Label of the column
          example: My Column Name
        type:
          type: string
          description: Expected data type of the column values
          example: number
          enum:
          - currency
          - date
          - number
          - string
        required:
          type: boolean
          description: Requires templates to map this column
          example: true
        index:
          type: boolean
        ontology_id:
          type: integer
          description: Unique identifier of the ontology this column represents
          format: int32
          example: 1
    ApiMeta:
      type: object
      properties:
        count:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        sort:
          type: string
        filter:
          type: string
        extra:
          type: object
          additionalProperties:
            type: object
          writeOnly: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
