openapi: 3.2.0
info:
  title: Thomson Reuters Sitetemplates API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Sitetemplates across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Sitetemplates
paths:
  /{version}/sitetemplates:
    get:
      tags:
      - Sitetemplates
      summary: Get site templates
      description: API method to obtain site templates
      operationId: getSiteTemplates
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: filterby
        in: query
        description: 'Possible values are {recent|favourite|category|all} Default for this field is ''recent''<br>By default any filter will send back the first 20 sites if pagination is false '
        required: false
        schema:
          type: string
          enum:
          - recent
          - favourite
          - category
          - all
      - name: returncount
        in: query
        description: The no of site templates returned. Default is 20. This option does not apply if filterBy property is set to all
        required: false
        schema:
          type: string
      - name: categoryid
        in: query
        description: This parameter is used to get the site template list based on the site category ID, please provide site template categoryid in addition to setting the filterby property to category. <br>example = /api/1/sitetemplates?filterby=category&categoryid=1
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: 'This parameter is used to search site template by name. The site template is included in the search result if the string appears  in the title of the site (The results are returned in ascending order)<br>example: Retrieve sites having "HighQ" word in their name : /api/1/sitetemplates?name=''HighQ''<br>This will return all sites having "HighQ" word in their site template name.'
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: One of the two site template status available in the system<br>{archived|preparation}<br>Default -> {preparation}<br>if filterBy={all}  is set then all status become applicable.
        required: false
        schema:
          type: string
      - name: includefolderpermission
        in: query
        description: '{true|false} default is false'
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/sitetemplates'
            application/json:
              schema:
                $ref: '#/components/schemas/sitetemplates'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/sites/templates:
    get:
      tags:
      - Sitetemplates
      summary: Get template list
      description: API method to obtain site templates
      operationId: getSiteTemplates_1
      parameters:
      - name: version
