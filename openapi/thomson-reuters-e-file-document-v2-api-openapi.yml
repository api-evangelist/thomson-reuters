openapi: 3.2.0
info:
  version: v1/v2
  title: GoSystem E-file E-file Document V2 API
  description: A RESTful API to provide access to the GoSystem E-file functionality.
servers:
- url: https://api.thomsonreuters.com/gosystem/e-files
security:
- Authorization: []
tags:
- name: E-file Document V2
paths:
  ? /v2/years/{year}/tax-return-types/{taxReturnType}/tax-returns/{taxReturnId}/jurisdictions/{jurisdiction}/e-file-request-types/{eFileRequestType}/e-files
  : get:
      tags:
      - E-file Document V2
      summary: Download generated e-file in PDF
      description: This endpoint downloads the generated e-file in PDF format for a tax return, jurisdiction, and efileRequestType.
      operationId: ReturnsGeneratedE-fileInPDFV2
      parameters:
      - name: year
        in: path
        required: true
        description: The tax year for which the e-file is being processed. Must be a valid 4-digit year (e.g., 2024).
        schema:
          type: integer
          format: int32
      - name: taxReturnType
        in: path
        required: true
        description: Specifies the type of tax return being filed. 1040, 1041, 1065, 1120, 990, 5500, 709.
        schema:
          type:
          - string
          - 'null'
      - name: taxReturnId
        in: path
        required: true
        description: A 6-digit unique alphanumeric identifier for the specific tax return. This is also referred to as the Locator ID.
        schema:
          type: string
      - name: jurisdiction
        in: path
        required: true
        description: 'The state or local jurisdiction code where the tax is being filed. Example: AL for Alabama. Use the /v1/e-file-jurisdictions endpoint to retrieve valid codes.'
        schema:
          type: string
      - name: eFileRequestType
        in: path
        required: true
        schema:
          type: string
          enum:
          - REG
          - REG2
          - REG3
          - REG4
          - REG5
