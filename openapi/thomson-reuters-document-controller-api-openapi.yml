openapi: 3.2.0
info:
  title: Thomson Reuters Document Controller API
  version: '1.0'
  description: 'Operations tagged document-controller across 2 of this provider''s published API definitions: thomson-reuters-eap-uat-trri-api-research-openapi.json, thomson-reuters-eap-uat-trri-api-research-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.thomsonreuters.com/regulatory-intelligence
tags:
- name: document-controller
  description: Document Controller
paths:
  /v1/documents:
    get:
      tags:
      - document-controller
      summary: return list of documents by type with requested limit
      operationId: getDocumentsUsingGET
      parameters:
      - name: limit
        in: query
        description: number of results
        required: true
        schema:
          type: integer
          format: int32
        example: 15
      - name: offset
        in: query
        description: the offset of the results
        schema:
          type: integer
          format: int32
          default: 0
        example: 15
      - name: type
        in: query
        description: type of document
        required: true
        schema:
          type: string
        example: analysis-and-insight
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListDocumentsDTO'
        '400':
          description: 'invalid parameter or missing [parameter name = value] '
          content: {}
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Failed to get document from Novus
          content: {}
    servers:
    - url: https://api.thomsonreuters.com/regulatory-intelligence
components:
  schemas:
    ListDocumentsDTO:
      title: ListDocumentsDTO
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDTO'
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    DocumentDTO:
      title: DocumentDTO
      type: object
      properties:
        artifactId:
          type: string
        author:
          type: string
        guid:
          type: string
        imageId:
          type: string
        modifiedDate:
          type: string
          format: date-time
        publicationDate:
          type: string
          format: date-time
        text:
          type: string
        title:
          type: string
        versionId:
          type: string
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: To generate Access Token, please use the steps described in <a href='/regulatory-intelligence/swagger_openapi_document/eap-trri-api-access-token/100?from=api&id=9296' rel='noopener noreferrer' target='_blank'>TRRI API Access Token</a> section, ex. 'Bearer {access_token}'.
