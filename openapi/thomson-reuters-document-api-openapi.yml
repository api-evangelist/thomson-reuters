openapi: 3.2.0
info:
  title: Thomson Reuters Document API
  version: 1.8.0
  description: 'Operations tagged Document across 2 of this provider''s published API definitions: thomson-reuters-onesource-e-invoicing-consolidated-apis-openapi.json, thomson-reuters-onesource-e-invoicing-consolidated-apis-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-emea.onesourcetax.com/einvoicing/document/v1
- url: https://api-emea.onesourcetax.com/einvoicing/company/v1
tags:
- name: Document
  description: Perform an action on a document.
paths:
  /documents/{id}/action:
    post:
      tags:
      - Document
      summary: Perform an action on a document
      description: Perform an action on a `Document`. Use this endpoint to handle documents in `Error` state.
      parameters:
      - name: id
        in: path
        description: Id of `Document`
        required: true
        schema:
          type: string
          example: 1f504527-9b0b-4ba2-a28d-08701d8829f0
      requestBody:
        description: The action to perform on the `Document`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentAction'
        required: true
      responses:
        '200':
          description: Successful response
        '400':
          $ref: '#/components/responses/BadRequestActionApi'
        '401':
          $ref: '#/components/responses/UnauthorizedActionApi'
        '403':
          $ref: '#/components/responses/ForbiddenActionApi'
        '404':
          $ref: '#/components/responses/NotFoundActionApi'
        '500':
          $ref: '#/components/responses/InternalServerErrorActionApi'
      operationId: postDocumentsByIdAction
      x-operation-id-source: derived
    servers:
    - url: https://api-emea.onesourcetax.com/einvoicing/document/v1
    - url: https://api-emea.onesourcetax.com/einvoicing/company/v1
  /documents/external-status:
    post:
      summary: Set external status on one or more documents
      tags:
      - Document
      description: Set external status on one or more documents.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - companyId
              - externalStatuses
              properties:
                companyId:
                  type: string
                  description: Id of the company sending or receiving the document. For sent documents, the company id of the sender. For received document, the company id of the receiver.
                externalStatuses:
                  type: array
                  items:
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        description: The document ids to update the status for.
                      status:
                        type: string
                        example: Failure
                        description: "The external status to set. Available value are:\n\nAvailable values are:\n  * **Success** - Document has been successfully processed by the external system.\n  * **Failure** - Document has failed to be processed by the external system.\n\nIt's completely up to the external system to define the \"success\" and \"failure\" conditions"
                      message:
                        type: string
                        description: A message related to the external status.
                        example: Document could not be processed since it exceeds the maximum file size.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Document id.
                    success:
                      type: string
                      description: Whether the operation was a success for the document id.
                    error:
                      type: string
                      description: Error message, in case `success` is false.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: postDocumentsExternalStatus
      x-operation-id-source: derived
    servers:
    - url: https://api-emea.onesourcetax.com/einvoicing/document/v1
    - url: https://api-emea.onesourcetax.com/einvoicing/company/v1
  /documents/{id}:
    get:
      tags:
      - Document
      summary: Get a Document
      description: Get a Document.
      parameters:
      - name: id
        in: path
        description: Id of the `Document`.
        required: true
        schema:
          type: string
          example: ae9a667b-955a-4d3b-9bf2-d672c8432256
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getDocumentsById
      x-operation-id-source: derived
    servers:
    - url: https://api-emea.onesourcetax.com/einvoicing/document/v1
    - url: https://api-emea.onesourcetax.com/einvoicing/company/v1
  /documents:
    get:
      tags:
      - Document
      summary: Get documents
      description: Get `Documents`. Documents will be sorted by `modifiedTime` in descending order by default.
      parameters:
      - name: sendStatus
        in: query
        description: 'The send-status of a document. Available values are:

          * **Done** - Documents that have been successfully delivered

          * **Processing** - Documents that are being processed

          * **Error** - Documents that have failed with some error

          * **Cancelled** - Documents that have been cancelled


          Received documents will always have the send-status `Done`.'
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: Done
      - name: companyId
        in: query
        description: 'Id of the company to get documents for. This parameter is required.


          An external company id can also be used if a previous setup has been made where the external id has been connected to the company.'
        required: true
        style: form
        explode: true
        schema:
          type: string
        example: 41a98840-16a3-47f1-90b4-b364c1c828ed
      - name: direction
        in: query
        description: The direction of the document.
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: Sent
          enum:
          - Sent
          - Received
      - name: documentType
        in: query
        description: 'The document type of the document. Available document types are listed [here](https://pagero.github.io/partners/apis/document-types).


          Currently, the following document types are supported:

          * ApplicationResponse

          * Invoice

          * ItalianInvoiceReport

          * TaxDataReport

          * Order

          * ReportNotification            '
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: Invoice
      - name: documentSubtype
        in: query
        description: The document subtype of the document. Available document subtypes are listed [here](https://pagero.github.io/partners/apis/document-types).
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: Debit
      - name: externalStatus
        in: query
        description: "Fetch only documents with this external status.\nAvailable values:\n  * **Success** - Document has been successfully processed by the external system.\n  * **Failure** - Document has failed to be processed by the external system."
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: searchTerm
        in: query
        description: 'A generic search parameter that can be used to search on the following document values: document identifier, sender name, receiver name.'
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: INV454665
      - name: createTimeFrom
        in: query
        description: Exclude documents created earlier than this date and time. Date and time should be expressed in ISO 8601 format.
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
          example: '2024-09-27T08:30:00.000Z'
      - name: createTimeTo
        in: query
        description: Exclude documents created later than this date and time. Date and time should be expressed in ISO 8601 format.
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
          example: '2024-09-27T09:00:00.000Z'
      - name: modifiedTimeFrom
        in: query
        description: Exclude documents modified earlier than this date and time. Date and time should be expressed in ISO 8601 format.
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
          example: '2024-09-27T08:30:00.000Z'
      - name: modifiedTimeTo
        in: query
        description: Exclude documents modified later than this date and time. Date and time should be expressed in ISO 8601 format.
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
          example: '2024-09-27T09:00:00.000Z'
      - name: pageIndex
        in: query
        description: The index of the page to fetch. The first page has index 0.
        required: false
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: pageSize
        in: query
        description: The page size. This controls the maximum number of items in the collection resource response. In combination with `pageIndex`, it also affects how many entries to skip before collecting the result set.
        required: false
        style: form
        explode: true
        schema:
          maximum: 1000
          minimum: 0
          type: integer
          default: 10
      - name: sort
        in: query
        description: 'Property to sort on. The default sorting order is ascending. To sort in descending order, prepend the property with a minus (''-'') sign. Sortable properties are:

          * createTime

          * modifiedTime'
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          ascending:
            summary: Sort on property `createTime` in ascending order.
            value: createTime
          descending:
            summary: Sort on property `modifiedTime` in descending order.
            value: -modifiedTime
      - name: senderReference
        in: query
        description: The sender reference, as provided by the sender upon sending the document.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getDocuments
      x-operation-id-source: derived
    post:
      tags:
      - Document
      summary: Send a document
      description: Send a document. The request should be a multipart request containing the actual document data along with other properties. The `Content-Type` of the request should be `multipart/form-data`.
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - documentType
              - payload
              - senderReference
              - sendingCompanyId
              - systemName
              - systemType
              type: object
              properties:
                payload:
                  type: string
                  description: The document to send.
                  format: binary
                documentType:
                  type: string
                  description: 'The document type of the document. Available document types are listed [here](https://pagero.github.io/partners/apis/document-types).


                    Currently, the following document types are supported:

                    * ApplicationResponse

                    * Invoice

                    * ItalianInvoiceReport

                    * TaxDataReport

                    * Order

                    * ReportNotification            '
                  enum:
                  - ApplicationResponse
                  - Invoice
                  - ItalianInvoiceReport
                  - TaxDataReport
                  - Order
                  - ReportNotification
                  example: Invoice
                senderReference:
                  type: string
                  description: The sender's document reference. Must be unique for the sending company. Sending a document with the same `senderReference` twice will result in a `409 Conflict` error.
                  example: 305c099a-d9ee-4723-9808-732127393085
                sendingCompanyId:
                  type: string
                  description: The id of the sending company. An external company id can also be used if a previous setup has been made where the external id has been connected to the company.
                  example: 8839abe6-5277-4145-a44f-dcca99ac13e5
                documentIdentifier:
                  type: string
                  description: The document identifier, such as invoice number or order number. If provided, it will make the document searchable on document indentifier, even if the document can not be processed and ends up in `Error` state.
                  example: INV4335465
                systemName:
                  $ref: '#/components/schemas/SystemName'
                systemType:
                  $ref: '#/components/schemas/SystemType'
                relationshipType:
                  type: string
                  description: "The type of relationship to the receiver, as provided by the sender. \n\nAvailable values:\n  * **B2B** - Business to business\n  * **B2C** - Business to consumer\n  * **B2G** - Business to government"
                  example: B2B
        required: true
      responses:
        '201':
          description: Document successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The id of the sent document. Can be used to reference  the document in other API requests.
                    example: 21df3bfe-3a58-4619-a114-29f6663df748
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: postDocuments
      x-operation-id-source: derived
    servers:
    - url: https://api-emea.onesourcetax.com/einvoicing/document/v1
    - url: https://api-emea.onesourcetax.com/einvoicing/company/v1
  /documents/{id}/presentation:
    get:
      tags:
      - Document
      summary: Get document presentation
      description: Get presentation for a `Document`, if available. A presentation will always be available if document `status`is `Done`. It may also be available for documents with `status` `Error` depending on what the error is.
      parameters:
      - name: id
        in: path
        description: Id of `Document`
        required: true
        schema:
          type: string
          example: 56ce666b-5409-4a8d-813d-5882e90276a5
      responses:
        '200':
          description: Successful response
          content:
            application/pdf:
              schema:
                type: string
                format: byte
            image/tiff:
              schema:
                type: string
                format: byte
            application/octet-stream:
              schema:
                type: string
                format: byte
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getDocumentsByIdPresentation
      x-operation-id-source: derived
    servers:
    - url: https://api-emea.onesourcetax.com/einvoicing/document/v1
    - url: https://api-emea.onesourcetax.com/einvoicing/company/v1
  /documents/{id}/source-document:
    get:
      tags:
      - Document
      summary: Get source document
      description: Get source document for `Document`. This should always be available.
      parameters:
      - name: id
        in: path
        description: Id of `Document`
        required: true
        schema:
          type: string
          example: 0f57671d-5487-40be-8bfc-2a6ec62e8d53
      responses:
        '200':
          description: Successful response
          content:
            text/xml:
              schema:
                type: string
                format: byte
            text/plain:
              schema:
                type: string
                format: byte
            application/pdf:
              schema:
                type: string
                format: byte
            application/json:
              schema:
                type: string
                format: byte
            application/octet-stream:
              schema:
                type: string
                format: byte
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getDocumentsByIdSourceDocument
      x-operation-id-source: derived
    servers:
    - url: https://api-emea.onesourcetax.com/einvoicing/document/v1
    - url: https://api-emea.onesourcetax.com/einvoicing/company/v1
  /documents/{id}/target-document:
    get:
      tags:
      - Document
      summary: Get target document
      description: Get target document for `Document`, if available. A target document will only be available if document `status` is `Done`.
      parameters:
      - name: id
        in: path
        description: Id of `Document`
        required: true
        schema:
          type: string
          example: d6912b66-5f21-4a73-ac76-95cb3c8a2a81
      responses:
        '200':
          description: Successful response
          content:
            text/xml:
              schema:
                type: string
                format: byte
            text/plain:
              schema:
                type: string
                format: byte
            application/pdf:
              schema:
                type: string
                format: byte
            application/json:
              schema:
                type: string
                format: byte
            application/octet-stream:
              schema:
                type: string
                format: byte
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getDocumentsByIdTargetDocument
      x-operation-id-source: derived
    servers:
    - url: https://api-emea.onesourcetax.com/einvoicing/document/v1
    - url: https://api-emea.onesourcetax.com/einvoicing/company/v1
components:
  schemas:
    Document:
      required:
      - createTime
      - direction
      - distribution
      - documentType
      - id
      - isFetched
      - modifiedTime
      - sendStatus
      type: object
      properties:
        id:
          type: string
          description: The document id
          example: 6168900e-6971-4190-9ef3-edb7203bda5d
        sendStatus:
          type: string
          description: 'The send-status of a document. Available values are:

            * **Done** - Documents that have been successfully delivered

            * **Processing** - Documents that are being processed

            * **Error** - Documents that have failed with some error

            * **Canceled** - Documents that have been cancelled


            Received documents will always have the send-status `Done`.'
          example: Done
        documentType:
          type: string
          description: The document type. Available document types are listed [here](https://pagero.github.io/partners/apis/document-types).
          example: Invoice
        documentSubtype:
          type: string
          description: Document subtype. Available document subtypes are listed [here](https://pagero.github.io/partners/apis/document-types).
          example: Debit
        externalStatus:
          type: string
          description: "External status. This is set by the client through the `POST /documents/external-status` endpoint.\n\nAvailable values:\n  * **Success** - Document has been successfully processed by the external system.\n  * **Failure** - Document has failed to be processed by the external system."
          example: Success
        externalStatusMessage:
          type: string
          description: A message related to the `externalStatus`. Can be used to provide an error message if `externalStatus` is `Failure`.
          example: Document could not be processed since it exceeds the maximum file size.
        createTime:
          type: string
          description: Creation time of the document in the system, expressed in ISO 8601 format.
          format: date-time
          example: '2024-09-25T12:14:06Z'
        modifiedTime:
          type: string
          description: Modified time of the document in the system, expressed in ISO 8601 format.
          format: date-time
          example: '2024-09-25T12:14:06Z'
        companyId:
          type: string
          description: Id of the company sending or receiving the document. For sent documents, the company id of the sender. For received document, the company id of the receiver.
          example: 350e20c7-c804-4991-a41e-a1c1e21ecd85
        senderReference:
          type: string
          description: The sender reference, as provided by the sender upon sending the document.
          example: 305c099a-d9ee-4723-9808-732127393085
        documentInfo:
          $ref: '#/components/schemas/DocumentInfo'
        documentReferences:
          type: array
          description: Document references. Includes references to all documents related to this document.
          items:
            $ref: '#/components/schemas/DocumentReference'
        businessStatus:
          $ref: '#/components/schemas/BusinessStatus'
        businessStatusHistory:
          type: array
          description: Business status history.
          items:
            $ref: '#/components/schemas/BusinessStatus'
        clearanceStatus:
          $ref: '#/components/schemas/ClearanceStatus'
        clearanceStatusHistory:
          type: array
          description: Clearance status history
          items:
            $ref: '#/components/schemas/ClearanceStatus'
        errorMessage:
          type: string
          description: If `sendStatus` is `Error`, this property contains an error message.
          example: The document payload is invalid.
    CollectionMetadata_GetDocuments:
      required:
      - pageIndex
      - pageSize
      - total
      type: object
      properties:
        pageIndex:
          minimum: 1
          type: integer
          description: The index of the fetched page. The first page has index 0.
          example: 1
        pageSize:
          minimum: 0
          type: integer
          description: The page size.
          example: 10
        total:
          minimum: 0
          type: integer
          description: The total number of items in the collection.
          example: 826
    DocumentReference:
      type: object
      description: Document reference
      required:
      - direction
      - documentId
      - documentType
      properties:
        documentId:
          type: string
          description: Id of the referenced document
          example: 4911b83e-be25-4a17-99ec-1aef7079c5f5
        documentType:
          type: string
          description: The document type. Available document types are listed [here](https://pagero.github.io/partners/apis/document-types).
          example: Order
        documentSubType:
          type: string
          description: Document subtype. Available document subtypes are listed [here](https://pagero.github.io/partners/apis/document-types).
          example: Purchase
        documentIdentifier:
          type: string
          description: Document identifier
          example: AB4565756
        direction:
          type: string
          description: Whether the referenced document was sent or received
          enum:
          - Sent
          - Received
    BusinessStatus:
      type: object
      description: The business level status of a document. Currently this is only available for invoices. The business status of the invoice will be decided by related application responses.
      required:
      - status
      - createTime
      properties:
        status:
          type: string
          description: 'The current business status of the document. Available values:

            * **InProcess**

            * **UnderQuery**

            * **OnHold**

            * **ConditionallyAccepted**

            * **Accepted**

            * **Rejected**

            * **ResponseExpected**

            * **PaymentApproved**

            * **PaymentInitiated**

            * **PaymentRejected**

            * **Paid**


            Please note that more statuses may be added in the future.'
          example: Accepted
        createTime:
          type: string
          format: date-time
          description: Creation time of the business status expressed in ISO 8601 format. This is primarily taken from the related document where the business status is communicated if a timestamp exists there. If not, it will be the time when the related document was processed.
          example: '2024-09-26T09:45:54Z'
        messages:
          type: array
          items:
            type: object
            properties:
              messageCode:
                type: string
                description: Code specified by the counterpart to further specify the business status.
                example: TBD
              message:
                type: string
                description: Message from the counterpart.
                example: TBD
    PersonalContact:
      allOf:
      - type: object
        properties:
          name:
            type: string
            description: Name
            example: John Doe
      - $ref: '#/components/schemas/Contact'
      description: Personal contact
    DocumentResponse:
      type: object
      properties:
        descriptions:
          type: array
          items:
            $ref: '#/components/schemas/Description'
    SystemType:
      type: string
      description: 'The system from which the sent document originates. Must have one of the following values:

        * Oracle

        * SAP

        * SAP Ariba

        * Other'
      example: Oracle
    Party:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        name:
          type: string
          description: Name
          example: Acme Inc.
        department:
          type: string
          description: Department
          example: Accounting
        unitNumber:
          type: string
          description: Unit number
          example: '497654'
        contact:
          $ref: '#/components/schemas/Contact'
        personalContact:
          $ref: '#/components/schemas/PersonalContact'
        ids:
          type: array
          description: Ids, like organisation number, VAT number or GN number.
          items:
            $ref: '#/components/schemas/Id'
        erpId:
          type: string
          description: Identifier in an ERP system, typically a customer or supplier number.
          example: '89543695'
    ClearanceStatus:
      type: object
      description: The clearance status of a document, if available.
      required:
      - status
      - createTime
      properties:
        status:
          type: string
          description: 'The current clearance status of the document. Available values:


            * **Approved**

            * **ApprovedWithWarnings**

            * **DeadlinePassed**

            * **DeliveryImpossible**

            * **DeliverySuccess**

            * **DeliveryFailure**

            * **Rejected**

            * **ValidationFailure**


            Please note that more statuses may be added in the future.'
          example: TBD
        createTime:
          type: string
          format: date-time
          description: Creation time of the clearance status expressed in ISO 8601 format.
