openapi: 3.2.0
info:
  title: Thomson Reuters Processing Instructions API
  version: '1.0'
  description: 'Operations tagged Processing Instructions across 2 of this provider''s published API definitions: thomson-reuters-general-ledger-manager-openapi.json, thomson-reuters-general-ledger-manager-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/general-ledger-manager/v1
security:
- bearerAuth: []
tags:
- name: Processing Instructions
  description: 'Documentation for Processing Instructions Service.

    ONESOURCE General Ledger Manager Processing Instructions APIs enables the definition of the expected data format and related information that is used during the data processing in GLM for the trial balances. During creation of processing instructions, users can provide source information and define, validate and enrichment information about the columns.

    Note: Providing the information on what Chart of Accounts is to be used is mandatory at the time of creating the Processing Instructions and is to be mapped to the field classified as ONESOURCE Account Code.'
paths:
  /templates:
    get:
      tags:
      - Processing Instructions
      summary: Get a paginated list of available Processing Instructions
      description: Returns a list of Processing Instructions with their metadata
      operationId: getTemplates
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Number of records in a Master Trial Balance to skip before starting the response set
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of records to return in the result set
        required: false
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionTemplateMeta'
      security:
      - bearerAuth: []
    post:
      tags:
      - Processing Instructions
      summary: Create a new Processing Instructions
      description: Adds Processing Instructions with required minimum criteria of ID & name and can have additional information around Data Fields (ID, version) & pipeline (validation, enrichment)
      operationId: createTemplate
      parameters:
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      requestBody:
        description: A Processing Instructions object that includes a pipeline. A pipeline is a list of operators that will be applied sequentially to each record in the ingested set
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePipeline'
        required: true
      responses:
        '201':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PostTemplatesResponse'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/general-ledger-manager/v1
  /templates/{id}:
    get:
      tags:
      - Processing Instructions
      summary: Get Processing Instructions by ID
      description: Returns Processing Instructions metadata for the specified Processing Instructions ID
      operationId: getTemplate
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Processing Instructions
        required: true
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Template'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Processing Instructions
      summary: Update Processing Instructions by ID
      description: Updates Processing Instructions metadata for the specified Processing Instructions ID. This endpoint also allows for a Processing Instructions to be renamed.
      operationId: updateTemplate
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Processing Instructions
        required: true
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTemplateRequest'
      responses:
        '204':
          description: default response
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/general-ledger-manager/v1
