openapi: 3.2.0
info:
  version: v1/v2
  title: GoSystem E-file E-file Document V1 API
  description: A RESTful API to provide access to the GoSystem E-file functionality.
servers:
- url: https://api.thomsonreuters.com/gosystem/e-files
security:
- Authorization: []
tags:
- name: E-file Document V1
paths:
  /v1/e-files:
    get:
      tags:
      - E-file Document V1
      summary: Download e-file or validation file
      description: This endpoint downloads the generated e-file or validation file for a tax return by Job ID.
      operationId: RetrieveTheXmlFile
      parameters:
      - name: jobId
        in: query
        description: The jobId is passed from the returned jobId when e-file is triggered.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success. The file is downloaded.
          content:
            application/zip:
              schema:
                type: object
        '400':
          description: 'Invalid input. Can''t proceed with file download. Exception: Files aren''t ready to download yet.'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
        '404':
          description: Not found.
        '500':
          description: Unexpected error encountered. Contact GoSystem Technical Support.
      x-operation-id-source: normalized
      x-operation-id-original: Retrieve the xml file
  /v1/years/{year}/tax-return-types/{taxReturnType}/tax-returns/{taxReturnId}/jurisdictions/{jurisdiction}/e-files:
    get:
      tags:
      - E-file Document V1
      summary: Download generated e-file
      description: This endpoint downloads the generated e-file for a tax return. Prerequisite is e-file creation should be triggered using /v1/e-files or /v1/e-file-validations or via GoSystem.
      operationId: RetrieveTheXmlE-files
      parameters:
      - name: year
        in: path
        required: true
        description: The tax year for which the e-file is being processed. Must be a valid 4-digit year (e.g., 2024).
        schema:
          type: integer
          format: int32
      - name: taxReturnType
        in: path
        required: true
        description: Specifies the type of tax return being filed. 1040, 1041, 1065, 1120, 990, 5500, 709.
        schema:
          type:
          - string
          - 'null'
      - name: taxReturnId
        in: path
        required: true
        description: A 6-digit unique alphanumeric identifier for the specific tax return. This is also referred to as the Locator ID.
        schema:
          type: string
      - name: jurisdiction
        in: path
        required: true
        description: 'The state or local jurisdiction code where the tax is being filed. Example: AL for Alabama. Use the /v1/e-file-jurisdictions endpoint to retrieve valid codes.'
        schema:
          type: string
      - name: Account
        in: header
        required: true
        description: A 4-digit alphanumeric identifier representing the client account. This must match the Account value provided in the request headers.
        schema:
          type: string
      responses:
        '200':
          description: Success. The e-file is downloaded.
          content:
            application/zip:
              schema:
                type: object
        '400':
          description: 'Types of error in message:

            - Invalid input: Message: "Can''t proceed with file download. Exception: Files aren''t ready to download yet."

            - Missing account header: Message: "Please specify account information in header."

            - Invalid tax type: Message: "Invalid Tax Return Type."

            - Locator doesn''t exist: Message: "Locator not found."

            - Invalid jurisdiction: Message: "Invalid Jurisdiction(s) {wrongjurisdictions}."

            - Account doesn''t belong to firm: Message: "Account doesn''t belong to firm."

            - Exception during processing: Message: "Invalid Input {exp message}."'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
        '404':
          description: Not found.
        '500':
          description: Unexpected error encountered. Contact GoSystem Technical Support.
      x-operation-id-source: normalized
      x-operation-id-original: Retrieve the xml e-files
  ? /v1/years/{year}/tax-return-types/{taxReturnType}/tax-returns/{taxReturnId}/jurisdictions/{jurisdiction}/e-file-request-types/{eFileRequestType}/e-files
