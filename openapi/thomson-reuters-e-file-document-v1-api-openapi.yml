  /v1/years/{year}/tax-returns/{taxReturnId}/e-files:
    get:
      tags:
      - E-file Document V1
      summary: Get e-file list
      description: This endpoint retrieves the e-file list for a given year and tax return ID.
      parameters:
      - name: year
        in: path
        required: true
        description: Must be a valid 4-digit year (e.g., 2024).
        schema:
          type: number
      - name: taxReturnId
        in: path
        required: true
        description: A 6-digit unique alphanumeric identifier for the specific tax return. This is also referred to as the Locator ID.
        schema:
          type: string
      - name: Account
        in: header
        required: true
        description: A 4-digit alphanumeric identifier representing the client account. This must match the Account value provided in the request headers.
        schema:
          type: string
      responses:
        '200':
          description: Success. The e-file list is retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EfileRepresentationList'
              examples:
                efile-representation-list-example:
                  $ref: '#/components/examples/efile-representation-list-example'
        '400':
          description: 'Types of error in message:

            - Invalid input values: Message: "Invalid input values."

            - Invalid tax year: Message: "Please provide valid TaxYear."

            - Invalid tax return ID: Message: "Please provide valid TaxReturnId."

            - Missing account header: Message: "Please specify account information in header."

            - Account doesn''t belong to firm: Message: "Account doesn''t belong to firm."

            - No e-file found: Message: "Invalid Input, No E-file for given details."

            - Exception during processing: Message: "Error occurred while fetching E-files, {exception.Message}."'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
        '404':
          description: Not found.
        '500':
          description: Unexpected error encountered. Contact GoSystem Technical Support.
      operationId: getV1YearsByYearTaxReturnsByTaxReturnIdEFiles
      x-operation-id-source: derived
  /v1/years/{year}/tax-returns/{taxReturnId}/e-files/{EfileDocumentId}:
    get:
      tags:
      - E-file Document V1
      summary: Download e-file
      description: This endpoint downloads e-file in XML and PDF format.
      parameters:
      - name: year
        in: path
        required: true
        description: Must be a valid 4-digit year (e.g., 2024).
        schema:
          type: number
      - name: taxReturnId
        in: path
        required: true
        description: A 6-digit unique alphanumeric identifier for the specific tax return. This is also referred to as the Locator ID.
        schema:
          type: string
      - name: EfileDocumentId
        in: path
        required: true
        description: The EfileDocumentId.
        schema:
          type: string
      - name: Account
        in: header
        required: true
        description: A 4-digit alphanumeric identifier representing the client account. This must match the Account value provided in the request headers.
        schema:
          type: string
      responses:
        '200':
          description: Success. The e-file is downloaded.
          content:
            text/xml: {}
            application/pdf: {}
        '400':
          description: 'Types of error in message:

            - Invalid input values: Message: "Invalid input values."

            - Invalid tax year: Message: "Please provide valid TaxYear."

            - Missing EfileDocumentId: Message: "Please provide EfileDocumentId."

            - Invalid EfileDocumentId format: Message: "Invalid EfileDocumentId, provide in ''YYYYYYYY.YYY'' format."

            - Missing Authorization header: Message: "Please provide Authorization header value."

            - Missing Accept header: Message: "Please provide ''Accept'' header to download E-file."

            - Missing account header: Message: "Please specify account information in header."

            - Invalid tax type: Message: "Invalid Tax Return Type."

            - Account doesn''t belong to firm: Message: "Account doesn''t belong to firm."

            - No PDF found: Message: "Invalid Input, No pdf found for EfileDocumentId:''{eFileDocumentId}''."

            - Unsupported Accept header: Message: "Unsupported Accept header: ''{acceptHeader}'' Please provide either ''text/xml'' or ''application/pdf'' to download."

            - Exception during processing: Message: "Error occurred while downloading the E-file, {ex.Message}."'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
        '404':
          description: Not found.
        '500':
          description: Unexpected error encountered. Contact GoSystem Technical Support.
      operationId: getV1YearsByYearTaxReturnsByTaxReturnIdEFilesByEfileDocumentId
      x-operation-id-source: derived
components:
  schemas:
    EfileRepresentationList:
      type: array
      items:
        $ref: '#/components/schemas/EfileRepresentation'
    EfileRepresentation:
      type: object
      properties:
        Jurisdiction:
          type: string
        JurisdictionDescription:
          type: string
        EfileDocumentId:
          type: string
        EfileType:
          type: string
        EfileStatus:
          type: string
        EfileCreatedOn:
          type: string
        EfileSize:
          type: integer
        PDFGeneratedOn:
          type: string
        PDFSize:
          type: integer
  examples:
    efile-representation-list-example:
      value:
      - Jurisdiction: FED
        JurisdictionDescription: Federal
        EfileDocumentId: A0044JH1.XML
        EfileType: REG
        EfileStatus: DiagnosticsExist
        EfileCreatedOn: '2022-12-02T08:20:16.867'
        EfileSize: 9407
        PDFGeneratedOn: '2022-12-02T08:20:32.43'
        PDFSize: 24198
      - Jurisdiction: PA
        JurisdictionDescription: Pennsylvania
        EfileDocumentId: A0044JH1.XPA
        EfileType: REG
        EfileStatus: DiagnosticsExist
        EfileCreatedOn: '2022-12-02T08:20:19.507'
        EfileSize: 7687
        PDFGeneratedOn: '2022-12-02T08:20:32.433'
        PDFSize: 18715
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
