info:
  title: Thomson Reuters Navigation API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Navigation across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Navigation
paths:
  /{version}/site/{siteid}/navigation:
    get:
      tags:
      - Navigation
      summary: Get site navigation menus
      description: Get site navigation menus API
      operationId: getSiteNavigationMenus
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '9'
      - name: siteid
        in: path
        description: The site id of site navigation
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Sitenavigation returned successfully
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting site navigation menus
      security:
      - OAuth: []
    post:
      tags:
      - Navigation
      summary: Add single site navigation menu
      description: 'Single Site navigation menu configurations API


        <itemid>


        Item id should be unique in xml. It is used to design sub menu. For e.g. itemid is used while creating the submenu. <menuid>


        Menu id of database. <menutypealias>


        menutypealias is mandatory field. Allowed values are [COLLABORATE_EXTERNAL_TYPE / COLLABORATE_SINGLE_CONTENT_TYPE / COLLABORATE_CONTAINER_TYPE]


        <contenttypeid>


        Content type id is mandatory field. Following values are allowed. Content type id


        Description


        1


        belongs to a wiki page type menu. And <contentid> should be the wiki id. 2


        belongs to a blog type menu. And <contentid> should be the blog id. 3


        belongs to a task type menu. And <contentid> should be the task id. 4


        belongs to an event type menu. And <contentid> should be the event id. 8


        belongs to a document type menu. And <contentid> should be the document id. 13


        belongs to a folder type menu. And <contentid> should be the folder id. 14


        belongs to a user type menu. And <contentid> should be the user id. 23


        belongs to an isheet view type menu. And <contentid> should be the isheet id. <sheetviewid> should be 0 or greater than 0. <sheetItemID> should be greater than 0. 25


        belongs to a site type menu. And <contentid> should be the site id. 27


        belongs to a blog category type menu. And <contentid> should be the blog category id. 28


        belongs to an event category type menu. And <contentid> should be the event category id. 29


        belongs to a tasklist type menu. And <contentid> should be the tasklist id. 30


        belongs to a module type menu. And <contentid> should be the module id. 31


        belongs to an isheet view type menu. And <contentid> should be the isheet id. <sheetviewid> should be 0 or greater than 0. 32


        belongs to an isheet view type menu. And <contentid> should be the isheet id. Content type id is used to identify the menu type. <contentid>


        content id is mandatory field. When contenttypeid is 30, following values are allowed for module type content type. Content id


        Module name


        1


        SITE_MODULE_HOME


        2


        SITE_MODULE_ACTIVITY


        3


        SITE_MODULE_DOCUMENTS


        4


        SITE_MODULE_WIKI


        5


        SITE_MODULE_BLOGS


        6


        SITE_MODULE_TASKS


        7


        SITE_MODULE_EVENTS


        8


        SITE_MODULE_PEOPLE


        9


        SITE_MODULE_QA


        10


        SITE_MODULE_ISHEET


        13


        SITE_MODULE_REPORTING


        <contentid> should be -1 or greater than -1. <siteid>


        Site is to identify that particular menu is belongs to which site. <numberofcolumns>


        Optional. But is mandatory in COLLABORATE_CONTAINER_TYPE. <parentmenuid>


        Optional. It is used to identify that menu is belongs to which container. <displayorder>


        Optional. It is used at the time of displaying menu order. <externalurl>


        Optional. But is mandatory in COLLABORATE_EXTERNAL_TYPE.Url pattern should be valid. <linktarget>


        Optional. But is mandatory in COLLABORATE_EXTERNAL_TYPE. Default value is _blank. linktarget is usedto open any hyperlink in new window or existing window. <mobilemenucssclassname>


        Optional. Is used for mobile view for menu. <mobilemenucssstyle>


        Optional. Is used for mobile view for menu. <mobilesubmenucssclassname>


        Optional. Is used for mobile view css for sub menu. <mobilesubmenucssstyle>


        Optional. Is used for mobile view css for sub menu. <menucssclassname>


        Optional. Is used for desktop/tablet view css for menu. <menucssstyle>


        Optional. Is used for desktop/tablet view css for menu. <submenucssclassname>


        Optional. Is used for desktop/tablet view css for sub menu. <submenucssstyle>


        Optional. Is used for desktop/tablet view css for sub menu. <submenualign>


        Optional. Is used in for COLLABORATE_CONTAINER_TYPE. Default value is left. And Allowed value is left/right. <sheetviewid>


        Optional. Is used when contenttypeid is 31. <sheetitemid>


        Optional. Is used when contenttypeid is 23. <sheetviewmode>


        Optional. 0 or 1 value is allowed. Otherwise default value 0 will be consider. <menuitemtitle>


        Is used to set the multilingual values for the menu or submenu. English UK is mandatory. Currently following languages are allowed.'
      operationId: insertNavigationMenu
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '9'
      - name: siteid
        in: path
        description: The site id of site navigation
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Site navigation menu saved successfully
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while performing save site navigation menu configuration
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Menu'
          application/json:
            schema:
              $ref: '#/components/schemas/Menu'
          text/xml:
            schema:
              $ref: '#/components/schemas/Menu'
    put:
      tags:
      - Navigation
