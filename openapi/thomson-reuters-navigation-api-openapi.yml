        SITE_MODULE_REPORTING


        <contentid> should be -1 or greater than -1. <siteid>


        Site is to identify that particular menu is belongs to which site. <numberofcolumns>


        Optional. But is mandatory in COLLABORATE_CONTAINER_TYPE. <parentmenuid>


        Optional. It is used to identify that menu is belongs to which container. <displayorder>


        Optional. It is used at the time of displaying menu order. <externalurl>


        Optional. But is mandatory in COLLABORATE_EXTERNAL_TYPE.Url pattern should be valid. <linktarget>


        Optional. But is mandatory in COLLABORATE_EXTERNAL_TYPE. Default value is _blank. linktarget is usedto open any hyperlink in new window or existing window. <mobilemenucssclassname>


        Optional. Is used for mobile view for menu. <mobilemenucssstyle>


        Optional. Is used for mobile view for menu. <mobilesubmenucssclassname>


        Optional. Is used for mobile view css for sub menu. <mobilesubmenucssstyle>


        Optional. Is used for mobile view css for sub menu. <menucssclassname>


        Optional. Is used for desktop/tablet view css for menu. <menucssstyle>


        Optional. Is used for desktop/tablet view css for menu. <submenucssclassname>


        Optional. Is used for desktop/tablet view css for sub menu. <submenucssstyle>


        Optional. Is used for desktop/tablet view css for sub menu. <submenualign>


        Optional. Is used in for COLLABORATE_CONTAINER_TYPE. Default value is left. And Allowed value is left/right. <sheetviewid>


        Optional. Is used when contenttypeid is 31. <sheetitemid>


        Optional. Is used when contenttypeid is 23. <sheetviewmode>


        Optional. 0 or 1 value is allowed. Otherwise default value 0 will be consider. <menuitemtitle>


        Is used to set the multilingual values for the menu or submenu. English UK is mandatory. Currently following languages are allowed.'
      operationId: insertUpdateNavigationMenuConfigurations
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '9'
      - name: siteid
        in: path
        description: The site id of site navigation
        required: true
