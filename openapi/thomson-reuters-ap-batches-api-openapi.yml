    - url: https://api.thomsonreuters.ae/legal-tracker/ap-exchange-api/v1
  /routes/{routeId}/batches/{batchId}:
    patch:
      tags:
      - AP Batches
      summary: Updates batch run
      operationId: APBatch_Patch
      parameters:
      - name: routeId
        in: path
        required: true
        description: AP route ID (Sequence Number)
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: batchId
        in: path
        required: true
        description: AP batch ID
        schema:
          type:
          - string
          - 'null'
        x-position: 2
