tags:
- name: AP Batches
  description: Use the AP Batches AP Exchange API to view AP route batches and view and update batch runs.
paths:
  /routes/{routeId}/batches:
    get:
      tags:
      - AP Batches
      summary: Returns collection of AP route batches
      operationId: APBatch_Index
      parameters:
      - name: routeId
        in: path
        required: true
        description: ID of AP route (Sequence Number)
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: $filter
        in: query
        description: 'Filter batches (example: batchRunDateTime gt 2020-11-26T15:59:12.000Z)'
        schema:
          type: string
      - name: $select
        in: query
        description: Select fields defined in request
        schema:
          type: string
      - name: $count
        in: query
        description: Include parameter with count of items
        schema:
          type: boolean
      - name: $top
        in: query
        description: Limit quantity of items
        schema:
          type: integer
      - name: $skip
        in: query
        description: Skip quantity of items
        schema:
          type: integer
      responses:
        '200':
          description: TrackerODataResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackerODataResponseOfAPBatchModel'
        '400':
          description: One or more validation errors in the request were encountered while processing the initial request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The requested resource requires authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Access is denied:
                  value:
                    error:
                      code: Unauthorized
                      message: The requested resource requires authentication.
        '403':
          description: The web service account has insufficient permissions to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with that identifier could be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
      - Token: []
    servers:
    - url: https://api.thomsonreuters.com/legal-tracker/ap-exchange-api/v1
    - url: https://api.thomsonreuters.co.uk/legal-tracker/ap-exchange-api/v1
    - url: https://api.thomsonreuters.ca/legal-tracker/ap-exchange-api/v1
    - url: https://api.thomsonreuters.com.au/legal-tracker/ap-exchange-api/v1
    - url: https://api.thomsonreuters.de/legal-tracker/ap-exchange-api/v1
    - url: https://api.thomsonreuters.ae/legal-tracker/ap-exchange-api/v1
