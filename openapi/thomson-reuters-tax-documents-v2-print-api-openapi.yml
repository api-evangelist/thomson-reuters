openapi: 3.2.0
info:
  version: v1,v2
  title: GoSystem Tax Documents (Print) Tax Documents V2 (Print) API
  description: The Tax Documents (Print) RESTful services provide access to GoSystem print functionality.
servers:
- url: https://api.thomsonreuters.com/gosystem/tax-returns
security:
- Authorization: []
tags:
- name: Tax Documents V2 (Print)
  description: ⚠️ We recommend using V2 Print instead of V1 Print. V1 Print will be deprecated in a future release.
paths:
  /v2/tax-documents:
    post:
      tags:
      - Tax Documents V2 (Print)
      summary: Generate a V2 print job for a tax return
      operationId: TriggerV2Print
      description: 'Triggers a V2 print job for a tax return. The print job is queued and processed asynchronously.


        ⚠️ Important: PDF filename character limits


        The pdfFileName parameter has a maximum limit of 100 characters. For K-1 separate packages (when K1SeparatePackage is set to true), the limit is 90 characters.


        Filenames that exceed these limits are automatically truncated from the right without warning. Truncation can result in duplicate filenames, which causes newer files to overwrite existing files.


        Example: An original filename of 110 characters, such as Client_ABC_TaxReturn_FY2023_Form1120_Federal_CorporateIncome_Q4_Estimated_Payments_FinalVersion_Approved_Dec15, is truncated to 100 characters: Client_ABC_TaxReturn_FY2023_Form1120_Federal_CorporateIncome_Q4_Estimated_Payments_FinalVersion_Appr.'
      parameters:
      - name: DeviceId
        in: header
        description: A 40-character alphanumeric value that is case-sensitive with no separators. The value consists of characters A-F and 0-9, and is processed through the SHA-1 hash algorithm. Include unique information such as the hardware serial number and UUID of the machine that created the e-file. For more information, see the E-file Glossary section in the IRS publication at https://www.irs.gov/pub/irs-pdf/p1345.pdf.
        required: true
        schema:
          type: string
          example: 1BFD53D7AAC2EB3F192D0F117C8B19815ECD6A30
      - name: account
        in: header
        description: The account number associated with the request.
        required: true
        schema:
          type: string
          example: '1111'
      - name: Password
        in: header
        description: The password for encrypted or protected tax documents.
        required: false
        schema:
          type: string
          example: password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintLocatorRequest'
            examples:
              1120-RequestExample:
                $ref: '#/components/examples/1120-Request-Example'
              1120-Multiple-Children-RequestExample:
                $ref: '#/components/examples/1120-Multiple-Children-Request-Example'
              1065-RequestExample:
                $ref: '#/components/examples/1065-Request-Example'
              All-Estimates-Request-Example:
                $ref: '#/components/examples/All-Estimates-Request-Example'
              K-1-Package-Request-Example:
                $ref: '#/components/examples/K-1-Package-Request-Example'
              K-1-Separate-Package-Request-Example:
                $ref: '#/components/examples/K-1-Separate-PDF-Package-Request-Example'
              8865-Foreign-Partnership-Request-Example:
                $ref: '#/components/examples/8865-Foreign-Partnership-Request-Example'
              706-Request-Example:
                $ref: '#/components/examples/706-Request-Example'
              709-Request-Example:
                $ref: '#/components/examples/709-Request-Example'
        required: true
      responses:
        '202':
          description: Accepted. The print job is queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusWrapper'
              examples:
                202-Print-Started-Response:
                  $ref: '#/components/examples/202-Print-Started-Response'
        '400':
          description: Bad request. The server cannot process the request due to a client error.
          content:
            application/json:
              schema:
                type: string
              examples:
                Invalid-Request-Body:
                  summary: Invalid or null request body
                  value: Invalid printLocatorRequest
                Account-Not-Belong:
                  summary: Account does not belong to firm
                  value: Account does not belong to firm
                Invalid-Tax-Type:
                  summary: Invalid tax type
                  value: Invalid Tax Return Type
                Missing-Device-Id:
                  summary: Missing DeviceId header
                  value: Please specify DeviceId information in header
                Invalid-Device-Id-Format:
                  summary: Invalid DeviceId format
                  value: Invalid Device ID format. Length of Device ID should be 40 characters. Allowed characters are A-F, a-f and 0-9.
                Token-Validation-Message:
                  summary: Token retrieval failed
                  value: Failed while trying to open the return
        '401':
          description: Unauthorized. The access token is missing or invalid (invalid_access_token).
          content:
            application/json:
              examples:
                Invalid-Access-Token:
                  summary: Invalid access token
                  value:
                    type: https://developerportal.thomsonreuters.com/gosystem/errors/#invalid_access_token
                    title: Invalid Access Token
                    detail: Invalid Access Token
                    status: 401
                    instance: /gosystem/tax-returns/v2/tax-documents
                    api_requestId: rrt-0a05d812cfc3ef178-a-de-2201792-13973602-4
        '500':
          description: Internal server error. An unexpected error occurred while processing the request.
          content:
            application/json:
              schema:
                type: string
              examples:
                Unhandled-Exception:
                  summary: Unhandled exception occurred
                  value: Error fetching the response
    get:
      tags:
      - Tax Documents V2 (Print)
      summary: Download a V2 printed tax document
      description: Downloads a printed tax document for a V2 print job. Use the jobId returned from the print request along with the tax return details to retrieve the file. The Accept header must be application/pdf or application/zip.
      operationId: DownloadV2PrintedDocument
      parameters:
      - name: jobId
        in: query
        description: The job ID returned after the print job is triggered.
        required: true
        schema:
          type: string
          example: '40080547'
      - name: account
        in: header
        description: The account number associated with the request.
        required: true
        schema:
          type: string
          example: '1111'
      - name: Accept
        in: header
        description: The content type for the response. Accepted values are application/pdf or application/zip.
        required: true
        schema:
          type: string
          enum:
          - application/pdf
          - application/zip
          example: application/pdf
      - name: password
        in: header
        description: The password for encrypted or protected tax returns.
        required: false
        schema:
          type: string
          example: password
      - name: taxReturnId
        in: query
        description: The 6-character locator ID. This value is case-insensitive and is converted to uppercase.
        required: true
        schema:
          type: string
          example: 1234AB
      - name: taxType
        in: query
        description: 'The tax return type. Valid values are: 1040, 1041, 1065, 1120, 990, 5500, 706, 709, ALL, or all.'
        required: true
        schema:
          type: string
          example: '1065'
          enum:
          - '1040'
          - '1041'
          - '1065'
          - '1120'
          - '990'
          - '5500'
          - '706'
          - '709'
          - ALL
          - all
      - name: taxYear
        in: query
        description: The 4-digit tax year.
        required: true
        schema:
          type: string
          example: '2019'
      responses:
        '200':
          description: Success. The file is downloaded.
        '204':
          description: No content. The job exists, but the file status is empty or null.
        '400':
          description: Bad request. The server cannot process the request due to a client error.
          content:
            text/plain:
              schema:
                type: string
              examples:
                Invalid-Account:
                  summary: Account does not belong to firm
                  value: Account does not belong to firm
                Invalid-Tax-Type:
                  summary: Invalid tax type
                  value: Invalid Tax Return Type
                Invalid-Accept-Header:
                  summary: Invalid Accept header
                  value: Accept header should be application/zip or application/pdf
                Invalid-Tax-Return-Details:
                  summary: Invalid tax return details or job ID
                  value: Invalid tax return details or job id
                Print-Not-Finished:
                  summary: Print job is not complete
                  value: Print not finished
                Invalid-Tax-Return-Id:
                  summary: Invalid tax return ID
                  value: Invalid tax return id
                Invalid-Tax-Year:
                  summary: Invalid tax year
                  value: Invalid tax year
                Invalid-Tax-Account:
                  summary: Invalid tax account
                  value: Invalid tax account
        '401':
          description: Unauthorized. The access token is missing or invalid (invalid_access_token).
          content:
            application/json:
              examples:
                Invalid-Access-Token:
                  summary: Invalid access token
                  value:
                    type: https://developerportal.thomsonreuters.com/gosystem/errors/#invalid_access_token
                    title: Invalid Access Token
                    detail: Invalid Access Token
                    status: 401
                    instance: /gosystem/tax-returns/v2/tax-documents?jobId=svfsdfsdf&taxReturnId=000BW9&taxType=P&taxYear=2024
                    api_requestId: rrt-09a0b422cddf81501-b-de-2571557-14084136-1
        '500':
          description: Internal server error. An unexpected error occurred while processing the request.
          content:
            text/plain:
              schema:
                type: string
              examples:
                Server-Error:
                  summary: General server error
                  value: Error fetching the response
  /v2/tax-document-statuses:
    get:
      tags:
      - Tax Documents V2 (Print)
      summary: Get the V2 print job status for a tax return
      description: Retrieves the current status of a V2 print job. Use the jobId returned from the print request along with the tax return details to check the job status.
      operationId: GetV2PrintStatus
      parameters:
      - name: jobId
        in: query
        description: The job ID returned after the print job is triggered.
        required: true
        schema:
          type: string
      - name: account
        in: header
        description: The account number associated with the request.
        required: true
        schema:
          type: string
          example: '1111'
      - name: taxReturnId
        in: query
        description: The 6-character locator ID.
        required: true
        schema:
          type: string
      - name: taxType
        in: query
        description: 'The tax return type. Valid values are: 1040, 1041, 1065, 1120, 990, 5500, 706, or 709.'
        required: true
        schema:
          type: string
          enum:
          - '1040'
          - '1041'
          - '1065'
          - '1120'
          - '990'
          - '5500'
          - '706'
          - '709'
      - name: taxYear
        in: query
        description: The 4-digit tax year.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success. The print job status is retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintStatusResponse'
              examples:
                200-Print-Status-Started-Response:
                  $ref: '#/components/examples/200-Print-Status-Started-Response'
                200-Print-Status-Finished-Response:
                  $ref: '#/components/examples/200-Print-Status-Finished-Response'
        '400':
          description: Bad request. The server cannot process the request due to a client error.
          content:
            application/json:
              schema:
                type: string
              examples:
                Invalid-Account:
                  summary: Account does not belong to firm
                  value: Account does not belong to firm
                Invalid-Tax-Type:
                  summary: Invalid tax type
                  value: Invalid Tax Return Type
        '401':
          description: Unauthorized. The access token is missing or invalid (invalid_access_token).
          content:
            application/json:
              examples:
                Invalid-Access-Token:
                  summary: Invalid access token
                  value:
                    type: https://developerportal.thomsonreuters.com/gosystem/errors/#invalid_access_token
                    title: Invalid Access Token
                    detail: Invalid Access Token
                    status: 401
                    instance: /gosystem/tax-returns/v2/tax-document-statuses?jobId=sdsdf&taxReturnId=000BW9&taxType=P&taxYear=2024
                    api_requestId: rrt-0cf56e074ce94cbea-b-de-3083122-14038501-6
        '500':
          description: Internal server error. An unexpected error occurred while processing the request.
          content:
            application/json:
              schema:
                type: string
              examples:
                Unhandled-Exception:
                  summary: Unhandled exception occurred during processing
                  value: Error fetching the response
  /v2/print-options:
    get:
      tags:
      - Tax Documents V2 (Print)
      summary: Get V2 print options for a tax return
      description: Retrieves the available print options for a tax return. Use the returned print tree structure to determine which sections can be printed. The response varies based on tax type and selection.
      operationId: GetV2PrintOptions
      parameters:
      - name: account
        in: header
        description: The account number associated with the request.
        required: true
        schema:
          type: string
          example: '1111'
      - name: Password
        in: header
        description: The password for encrypted or protected tax documents.
        required: false
        schema:
          type: string
          example: password
      - name: taxReturnId
        in: query
        description: The 6-character locator ID.
        required: true
        schema:
          type: string
      - name: taxType
        description: 'The tax return type. Valid values are: 1040, 1041, 1065, 1120, 990, 5500, 706, 709, ALL, or all.'
        in: query
        required: true
        schema:
          type: string
          enum:
          - '1040'
          - '1041'
          - '1065'
          - '1120'
          - '990'
          - '5500'
          - '706'
          - '709'
          - ALL
          - all
      - name: taxYear
        in: query
        description: The 4-digit tax year.
        required: true
        schema:
          type: string
      - name: corpType
        in: query
        description: 'The corporation type. Applicable only for tax return type 1120. Valid values are: C (1120C), F (1120F), H (1120H), L (1120LIFE), R (1120RIC), S (1120S), T (1120REIT), or Y (1120PC).'
        required: false
        schema:
          type:
          - string
          - 'null'
          enum:
          - ''
          - C
          - F
          - H
          - L
          - R
          - S
          - T
          - Y
      - name: selection
        in: query
        description: 'The print selection type. The default value is A. Valid values are: A (All, applicable for all tax return types) or K-1 (K-1 Package, applicable only for 1065 tax return types).'
        required: true
        schema:
          type: string
          enum:
          - A
          - K-1
      responses:
        '200':
          description: Success. Print options are retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintOptionsResponse'
              examples:
                1065-PrintTreeNodes:
                  $ref: '#/components/examples/1065-PrintTreeNodes-Subset'
                1120-PrintTreeNodes:
                  $ref: '#/components/examples/1120-PrintTreeNodes-Subset'
        '400':
          description: Bad request. The server cannot process the request due to a client error.
          content:
            application/json:
              schema:
                type: string
              examples:
                Missing-Account-Header:
                  summary: Missing Account header
                  value: Please specify account information in header
                Account-Not-Belong:
                  summary: Account does not belong to firm
                  value: Account does not belong to firm
                Invalid-Tax-Type:
                  summary: Invalid tax type
                  value: Invalid Tax Return Type
                Invalid-Tax-Return-Id:
                  summary: Invalid tax return ID
                  value: Invalid tax return id
                Invalid-Tax-Year:
                  summary: Invalid tax year
                  value: Invalid tax year
                Invalid-Tax-Account:
                  summary: Invalid tax account
                  value: Invalid tax account
                Invalid-Tax-Sub-Type:
                  summary: Invalid tax sub-type
                  value: Invalid tax sub type
                Invalid-Tax-Type-Token:
                  summary: Invalid tax type token
                  value: Invalid tax type
        '401':
          description: Unauthorized. The access token is missing or invalid (invalid_access_token).
          content:
            application/json:
              examples:
                Invalid-Access-Token:
                  summary: Invalid access token
                  value:
                    type: https://developerportal.thomsonreuters.com/gosystem/errors/#invalid_access_token
                    title: Invalid Access Token
                    detail: Invalid Access Token
                    status: 401
                    instance: /gosystem/tax-returns/v2/print-options
                    api_requestId: rrt-0cf56e074ce94cbea-b-de-3083122-14066887-1
        '500':
          description: Internal server error. An unexpected error occurred while processing the request.
          content:
            application/json:
              schema:
                type: string
              examples:
                Unhandled-Exception:
                  summary: Unhandled exception occurred
                  value: Error fetching the response
components:
  schemas:
    Statuses:
      type: object
      properties:
        Error:
          format: int32
          type: integer
          description: The error code. A value of 0 indicates success.
        Code:
          format: int32
          type: integer
          description: The status code.
        Info:
          type: string
          description: The status information.
        Ident:
          type: string
          description: The job identifier.
        Description:
          type: string
          description: The status description.
        JobId:
          type: string
          description: The job ID used for tracking.
        FileName:
          type: string
          description: The generated file name.
        FileIds:
          type: string
          description: The generated file IDs.
    PrintStatusResponse:
      type: object
      properties:
        ProcessStatuses:
          type: array
          items:
            $ref: '#/components/schemas/PrintProcessStatus'
    PrintTreeNode:
      type: object
      properties:
        Name:
          type: string
          description: The name of the print tree node.
        Child:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/PrintTreeNode'
          description: The child print tree node.
    PrintProcessStatus:
      type: object
      properties:
        ProcessId:
          type: string
          description: The unique identifier for the print process.
        ActionType:
          type: string
          description: The type of action performed. The value is Print.
        Firm:
          type: string
          description: The firm identifier.
        Account:
          type: string
          description: The account number.
        TaxYear:
          type: string
          description: The 4-digit tax year.
        LocatorName:
          type: string
          description: The 6-character locator ID.
        TaxReturnType:
          type: string
          description: The tax return type.
        StatusMessage:
          type: string
          description: The current status message.
        StatusCode:
          type: string
          description: The status code.
        SubmitTime:
          type: string
          description: The time when the job was submitted.
        UserId:
          type: string
          description: The ID of the user who submitted the job.
        UserName:
          type:
          - string
          - 'null'
          description: The name of the user who submitted the job.
        Info:
          type: string
          description: Additional information about the print job.
    PrintOptionsResponse:
      type: object
      properties:
        PrintTreeNodes:
          $ref: '#/components/schemas/PrintTreeNodes'
    StatusWrapper:
      type: object
      properties:
        Status:
          $ref: '#/components/schemas/Statuses'
    selection:
      type:
      - string
      - 'null'
      enum:
      - A
      - K-1
      description: 'The print selection type. The default value is A. Valid values are: A (All, applicable for all tax return types) or K-1 (K-1 Package, applicable only for 1065 tax return types).'
    PrintLocatorRequest:
      type: object
      properties:
        TaxYear:
          type: string
          example: '2019'
          description: The 4-digit tax year.
        TaxReturnId:
          type: string
          example: 1234AB
          description: The 6-character locator ID.
        TaxType:
          type: string
          example: '1065'
          description: 'The tax return type. Valid values are: 1040, 1041, 1065, 1120, 990, 5500, 706, or 709.'
        CopyTypes:
          type: array
          items:
            enum:
            - P
            - T
            - G
            description: 'The copy types to include in the print job. Multiple copy types can be requested in a single request. For 1120, the value is always P. Valid values are: P (All, applicable for all tax return types), T (Taxpayer), or G (Government).'
          example:
          - P
          - T
          - G
        PrintTreeNode:
          $ref: '#/components/schemas/PrintTreeNode'
        PdfFileName:
          type: string
          example: C9999ZZ9_My_Test_Tax_Return_1120
          description: The file name used to generate the PDF.
        RedactText:
          type:
          - boolean
          - 'null'
          example: true
          description: Set to true to redact sensitive data such as EIN and SSN. The default value is false.
        CorpType:
          $ref: '#/components/schemas/corpType'
        Selection:
          $ref: '#/components/schemas/selection'
        IncludeEfileAttachments:
          type:
          - boolean
          - 'null'
          example: true
          description: Set to true to include e-file attachments in the print job. The default value is false.
        K1SeparatePackage:
          type:
          - boolean
          - 'null'
          example: null
          description: Applicable only for 1065 tax return types with a K-1 Package (Selection = K-1). The default value is null. Set to true to print K-1 separate packages. Set to false to print each K-1 package as a separate file and bundle all individual packages into a ZIP file. When set to true, the Accept header must be application/zip because this option produces a ZIP file instead of a PDF.
        IgnoreK1Prefix:
          type:
          - boolean
          - 'null'
          example: null
          description: Applicable only for 1065 tax return types with a K-1 Package. The default value is null. Set to true to omit the K-1 prefix from generated document names. Set to false to include the K-1 prefix.
        SeparateK1ByJurisdiction:
          type:
          - boolean
          - 'null'
          example: null
          description: Applicable only for 1065 tax return types with a K-1 Package. The default value is null. Set to true to separate K-1 packages by jurisdiction. Set to false to group all K-1 packages together.
    PrintTreeNodes:
      type: object
      properties:
        Name:
          type: string
          description: The name of the print tree node.
        Children:
          type: array
          items:
            $ref: '#/components/schemas/PrintTreeNodes'
          description: The child print tree nodes.
    corpType:
      type:
      - string
      - 'null'
      enum:
      - ''
      - C
      - F
      - H
      - L
      - R
      - S
      - T
      - Y
      description: 'The corporation type. Applicable only for tax return type 1120. Valid values are: C (1120C), F (1120F), H (1120H), L (1120LIFE), R (1120RIC), S (1120S), T (1120REIT), or Y (1120PC). Leave blank if not applicable.'
  examples:
    K-1-Package-Request-Example:
      summary: K-1 package print request
      value:
        TaxYear: '2019'
        TaxReturnId: 1234AB
        TaxType: '1065'
        copyTypes:
        - P
        printTreeNode:
          name: K-1 Packages
          child:
            name: K-1 Package for All Partners
        pdfFileName: My_K_1Packagefor_All_Partners
        corpType: null
        selection: K-1
        redactText: false
        includeEfileAttachments: false
        K1SeparatePackage: false
        IgnoreK1Prefix: null
        SeparateK1ByJurisdiction: null
    1120-Request-Example:
      summary: 1120 print request
      value:
        TaxYear: '2019'
        TaxReturnId: 1234AB
        TaxType: '1120'
        copyTypes:
        - P
        printTreeNode:
          name: '1120'
          child:
            name: Federal Return
        pdfFileName: My_Federal_Return_1120
        corpType: C
        selection: A
        redactText: true
        includeEfileAttachments: true
    1120-Multiple-Children-Request-Example:
      summary: 1120 print request with multiple children
      value:
        TaxYear: '2019'
        TaxReturnId: 1234AB
        TaxType: '1120'
        copyTypes:
        - P
        printTreeNode:
          name: '1120'
          child:
            name: Selected Federal C Corp
            child:
              name: 1120 Income Tax Return
              child:
                name: 1120 Pages 1-6
        pdfFileName: My_Federal_Return_1120_Pages_1-6
        corpType: C
        selection: A
        redactText: true
        includeEfileAttachments: true
    200-Print-Status-Finished-Response:
      summary: Print status finished response
      value:
        ProcessStatuses:
        - ProcessId: '97176'
          ActionType: Print
          Firm: FT
          Account: '1111'
          TaxYear: '2019'
          LocatorName: 1234AB
          TaxReturnType: P
          StatusMessage: Finished
          StatusCode: '2'
          SubmitTime: 10/28/2020 6:02:36 PM
          UserId: ''
          UserName: null
          Info: Print Return complete
    706-Request-Example:
      summary: 706 print request
      description: Tax type 706 is supported for tax year 2021 and later.
      value:
        TaxYear: '2021'
        TaxReturnId: 3886MK
        TaxType: '706'
        copyTypes:
        - P
        printTreeNode:
          name: '706'
          child:
            name: All Returns
        pdfFileName: My_Federal_Return_706
        Selection: A
        redactText: true
    1120-PrintTreeNodes-Subset:
      summary: 1120 print tree nodes
      value:
        printTreeNodes:
          name: '1120'
          children:
          - name: All Returns
            children: null
          - name: Federal Return
            children: null
          - name: All State & City Returns
            children: null
          - name: All City Returns
            children: null
          - name: All Estimates
            children: null
          - name: All Extensions
            children: null
          - name: Foreign Schedules
            children:
            - name: Foreign Schedules
              children: null
          - name: Foreign Entity Forms Federal
            children:
            - name: All Foreign Entity Forms
              children: null
            - name: 5471 Foreign Corporation Information
              children: null
            - name: 8858 Foreign Disregarded Entities
              children: null
