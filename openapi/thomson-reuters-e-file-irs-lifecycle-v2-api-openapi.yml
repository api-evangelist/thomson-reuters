  schemas:
    AccountQuery:
      type: object
      properties:
        Status:
          type: string
    EFileJurisdictionsSubmissionResponse:
      type: object
      properties:
        EFileSubmissions:
          type: array
          items:
            $ref: '#/components/schemas/EFileSubmissionResponse'
        FailedSubmissionCount:
          format: int32
          type: integer
    EFileRejectedMessagesWrapper:
      type: object
      properties:
        EFileRejectList:
          $ref: '#/components/schemas/EFileRejectedMessages'
    EFileSubmissionResponse:
      type: object
      properties:
        BatchId:
          type:
          - string
          - 'null'
        IsSubmitted:
          type: boolean
        IsBatchComplete:
          type: boolean
        ErrorDetail:
          type:
          - string
          - 'null'
        FileInfo:
          type:
          - string
          - 'null'
        Account:
          type: string
        Year:
          format: int32
          type: integer
        TaxType:
          type: string
        TaxReturnID:
          type: string
        Jurisdiction:
          type: string
        EFileRequestType:
          type: string
    SubmitterQuery:
      type: object
      properties:
        SubmitterLocation:
          type:
          - string
          - 'null'
        SubmitterId:
          type:
          - string
          - 'null'
    EFileRejectedMessage:
      type: object
      properties:
        Severity:
          type: string
        Rec_Name_or_No:
          type: string
        Reject_Code:
          type: string
        Form_Occ_No:
          type: string
        Field_Seq_No:
          type: string
        FormNumber:
          type: string
        FormPageNo:
          type: string
        RuleNumber:
          type: string
        ErrorMessage:
          type: string
        XPathToError:
          type: string
        Text:
          type: string
    EFileRejectedMessages:
      type: object
      properties:
        EFileRejectData:
          type: array
          items:
            $ref: '#/components/schemas/EFileRejectedMessage'
    EFileStatusQuery:
      type: object
      properties:
        TaxReturn:
          $ref: '#/components/schemas/TaxReturnQuery'
        TaxPayer:
          $ref: '#/components/schemas/TaxPayerQuery'
        Submitter:
          $ref: '#/components/schemas/SubmitterQuery'
        Account:
          $ref: '#/components/schemas/AccountQuery'
    TaxReturnQuery:
      type: object
      properties:
        TaxReturnType:
          type:
          - string
          - 'null'
        TaxReturnId:
          type: string
    TaxPayerQuery:
      type: object
      properties:
        TaxPayer:
          type:
          - string
          - 'null'
    EFileRequestV2:
      type: object
      properties:
        Year:
          format: int32
          type: integer
          description: The tax year for which the e-file is being processed. Must be a valid 4-digit year (e.g., 2024).
        TaxType:
          type: string
          description: Specifies the type of tax return being processed. 1040, 1041, 1065, 1120, 990, 5500, 709.
        TaxReturnID:
          type: string
          description: A 6-digit unique alphanumeric identifier for the specific tax return. This is also referred to as the Locator ID.
        Jurisdiction:
          type: string
          description: 'The state or local jurisdiction code where the tax is being filed. Example: AL for Alabama. Use the /v2/e-file-jurisdictions endpoint to retrieve valid codes.'
        EFileRequestType:
          type: string
          description: 'Indicates the type of e-file request. This value is predefined for each jurisdiction. Example: REG, REG2. Use the /v2/e-file-jurisdictions endpoint to retrieve valid request types for each jurisdiction.'
          enum:
          - REG
          - REG2
          - REG3
          - EXT
          - EXT2
          - EXT3
          - EXT4
          - EST
          - EST2
          - EST3
  securitySchemes:
