        adjustmentNumber:
          type: string
          description: User-defined number for an adjustment.
        adjustmentDescription:
          type: string
          description: User-defined description for an adjustment.
        permanentTemporary:
          type: boolean
          description: Mutually exclusive designation for tax adjustment.
        deductibleTaxable:
          type: boolean
        current:
          type: boolean
          description: Adjustments.
        equity:
          type: boolean
        partK1:
          type: boolean
          description: Special tax adjustment.
        foreignPartK1:
          type: boolean
        purchaseAccounting:
          type: boolean
        ftcIncomeInclusion:
          type: boolean
          description: Indicates whether an Inclusion Transfer Mapping chart has been assigned to the binder.
        foreignEntityTaxableIncome:
          type: boolean
        incomeTax:
          type: boolean
        provision:
          type: boolean
        hasXrefMapping:
          type: boolean
          description: Indicates whether a cross-reference mapping chart has been assigned to the binder.
        hasPartnerK1Mapping:
          type: boolean
          description: Indicates whether a Partnership K-1 chart has been assigned to the binder.
        has8865K1Mapping:
          type: boolean
          description: Indicates whether an 8865 K-1 chart has been assigned to the binder.
        federalAdjustmentAccounts:
          type: array
          items:
            $ref: '#/components/schemas/FederalAdjustmentAccount'
        creditTaxReturnPresentation:
          $ref: '#/components/schemas/TaxReturnPresentationItem'
        debitTaxReturnPresentation:
          $ref: '#/components/schemas/TaxReturnPresentationItem'
        internationalCreditTaxReturnPresentation:
          $ref: '#/components/schemas/TaxReturnPresentationItem'
        internationalDebitTaxReturnPresentation:
          $ref: '#/components/schemas/TaxReturnPresentationItem'
    AdjustmentChartPropertyDetailRepresentation:
      type: object
      properties:
        year:
          type: integer
          description: Tax year.
          format: int32
        adjustmentChartId:
          type: string
          description: System-generated unique identifier for a specific adjustment chart.
        adjustmentChartName:
          type: string
          description: Chart name for a specific adjustment chart.
        adjustmentChartType:
          type: string
          description: 'Type of adjustment chart: Book, Reclass, Tax, AMT, or ACE.'
        fcoaChartId:
          type: string
          description: Unique identifier for a Federal Chart of Accounts.
        fcoaChartName:
          type: string
        priorYearChartName:
          type: string
          description: Chart name from the prior year.
        tccChartId:
          type: string
          description: System-generated ID for a TCC chart.
        tccChartName:
          type: string
          description: User-defined name for a TCC chart.
        readOnlyIndicator:
          type: boolean
          description: Indicates whether a binder can be deleted. A binder can't be deleted if it's read-only.
        rollover:
          type: boolean
    FederalAutomaticAccountOption:
      type: object
      properties:
        negate:
          type: boolean
        balanceType:
          type: string
          enum:
          - Preliminary
          - Book
          - Reclass
          - Tax
          - AMT
          - ACE
        computeOption:
          type: string
          enum:
          - Ending
          - Beginning
          - Difference
        defaultProvision:
          type: boolean
        automaticAccountPercentage:
          type: integer
          format: int32
        sourceAccount:
          $ref: '#/components/schemas/FederalAccount'
    TaxReturnPresentationItem:
      type: object
      properties:
        trcFormattedNumber:
          type: string
          description: System-defined number for a TRC.
        trcDescription:
          type: string
          description: System-defined description for a TRC.
        tccId:
          type: integer
          description: System-generated ID code used to combine accounts into subcategories within a single TRC.
          format: int32
        trcCategoryId:
          type: integer
          description: System-generated ID for TRC.
          format: int32
        trcNumber:
          type: integer
          description: System-defined number for a TRC.
          format: int32
        tccNumber:
          type: integer
          description: User-defined code used to combine accounts into subcategories within a single TRC.
          format: int32
        tccDescription:
          type: string
          description: User-defined description used to combine accounts into subcategories within a single TRC (Tax Return Code).
    FieldError:
      type: object
      properties:
        fieldName:
          type: string
        messages:
          type: array
          items:
            type: string
        errorCode:
          type: integer
          format: int32
