openapi: 3.2.0
info:
  title: ONESOURCE Income Tax Charts International Summary Chart…
  description: 'Charts are used to identify Tax Return Code (TRC) and Tax Combination Code (TCC) accounts and adjustments for multiple entities and binders. Use REST APIs to automatically manipulate basic chart functions.


    The charts are related by using elements from other charts to create a set of charts. Each set of charts is then assigned to an entity to use for TRC/TCCs, accounts, and adjustments. Chart assignments are either Common or Separate.'
  termsOfService: ''
  version: v1
servers:
- url: https://api.onesourcetax.com/income-tax/charts
security:
- Authorization: []
tags:
- name: International Summary Chart (2018+)
paths:
  /v1/international-summary-charts:
    get:
      tags:
      - International Summary Chart (2018+)
      summary: Returns the list of International Summary Charts available for 2018 forward
      parameters:
      - name: year
        in: query
        description: 4-digit year.
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalSummaryChartRepresentations'
              examples:
                international-summary-charts:
                  $ref: '#/components/examples/international-summary-charts'
                international-summary-charts-year-specific:
                  $ref: '#/components/examples/international-summary-charts-year-specific'
        '204':
          description: No data found for given inputs.
          content: {}
        '400':
          description: Request failed. This is usually due to validation errors.
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      operationId: getV1InternationalSummaryCharts
      x-operation-id-source: derived
    post:
      tags:
      - International Summary Chart (2018+)
      summary: Creates a new International Summary Chart
      operationId: createsNewInternationalSummaryChart.
      parameters:
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      - name: Content-Type
        in: header
        description: Indicates the response content media type to return.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      requestBody:
        description: InternationalSummaryChart Representation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternationalSummaryChartCreateRepresentation'
            examples:
              create-international-summary-chart:
                $ref: '#/components/examples/create-international-summary-chart'
      responses:
        '200':
          description: InternationalSummaryChart created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalSummaryChartCreateResponseRepresentation'
              examples:
                create-international-summary-chart-response:
                  $ref: '#/components/examples/create-international-summary-chart-response'
        '400':
          description: Request failed. This is usually due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemRepresentation'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      x-operation-id-source: normalized
      x-operation-id-original: creates new International Summary Chart.
