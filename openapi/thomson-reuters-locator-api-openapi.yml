    CreateUserResponse:
      type: object
      properties:
        Description:
          type: string
        LocatorId:
          type: string
    SaveAsLocatorRequest:
      type: object
      required:
      - account
      - locatorId
      - taxYear
      - taxType
      - taxPayerFirstName
      properties:
        account:
          type: string
          description: A 4-digit alphanumeric identifier for the client account. This value must match the Account value in the request headers.
        locatorId:
          type: string
          description: A 6-digit unique alphanumeric identifier for the tax return. Also referred to as the TaxReturnID.
        taxYear:
          type: string
          description: The tax year for which the e-file is required. Must be a valid 4-digit year (for example, 2024).
        taxType:
          type: string
          description: The type of tax return being filed. Valid values are 1040, 1041, 1065, 1120, 990, 5500, and 709.
        taxPayerFirstName:
          type: string
          description: The first name of the taxpayer.
        clientCode:
          type: string
          description: The client code for the respective locator.
        taxPayerLastName:
          type: string
          description: The last name of the taxpayer.
        taxPayerInitial:
          type: string
          description: The middle initial of the taxpayer.
        spouseLastName:
          type: string
          description: The last name of the spouse.
        spouseFirstName:
          type: string
          description: The first name of the spouse.
        spouseInitial:
          type: string
          description: The middle initial of the spouse.
        password:
          type: string
          description: The password for the locator, if one is required.
      additionalProperties: false
    CreateLocatorRequestWrapper:
      type: array
      items:
        $ref: '#/components/schemas/CreateLocatorRequest'
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          default: 0
        message:
          type: string
    UserAssignments:
      type: object
      properties:
        preparer:
          $ref: '#/components/schemas/UserAssignmentType'
        reviewer:
          $ref: '#/components/schemas/UserAssignmentType'
        manager:
          $ref: '#/components/schemas/UserAssignmentType'
        partner:
          $ref: '#/components/schemas/UserAssignmentType'
      additionalProperties: false
    CreateLocatorRequest:
      type: object
      required:
      - account
      - taxyear
      - taxtype
      properties:
        account:
          type: string
          description: A 4-digit alphanumeric identifier for the client account. This value must match the Account value in the request headers.
        taxyear:
          type: string
          description: The tax year for which the e-file is required. Must be a valid 4-digit year (for example, 2024).
        taxtype:
          type: string
          description: The type of tax return being filed. Valid values are 1040, 1041, 1065, 1120, 990, 5500, and 709.
        Taxpayer:
          $ref: '#/components/schemas/taxPayer'
        Spouse:
          $ref: '#/components/schemas/Spouse'
        returntype:
