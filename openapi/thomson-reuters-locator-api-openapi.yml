openapi: 3.2.0
info:
  version: ''
  title: GoSystem Locator API
  description: A RESTful API that provides access to GoSystem Locator functionalities.
servers:
- url: https://api.thomsonreuters.com/gosystem/tax-returns
security:
- Authorization: []
tags:
- name: Locator
paths:
  /v1/createnewlocator:
    post:
      summary: Create locator
      description: Creates a new locator for a tax return. Provide the account details, tax year, and tax type in the request. Additional parameters vary based on the tax type.
      tags:
      - Locator
      operationId: TriggerCreateLocator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocatorRequestWrapper'
            examples:
              Create Locator Whole Request - Example:
                $ref: '#/components/examples/CreateLocator-Example'
              Create 1040 Locator - Example:
                $ref: '#/components/examples/Create-1040-Locator'
              Create 1041 Locator - Example:
                $ref: '#/components/examples/Create-1041-Locator'
              Create 1120 Locator - Example:
                $ref: '#/components/examples/Create-1120-Locator'
              Create 1065 Locator - Example:
                $ref: '#/components/examples/Create-1065-Locator'
              Create 5500/990 Locator - Example:
                $ref: '#/components/examples/Create-5500-990-Locator'
        required: true
      responses:
        '200':
          description: Success. The locator is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLocatorUpdationResponseList'
              examples:
                CreateLocatorSuccessResponse - Example:
                  $ref: '#/components/examples/CreateLocatorSuccess'
                CreateLocatorErrorResponse - Example:
                  $ref: '#/components/examples/CreateLoactorFailure'
                Create Locator Invalid Group - Example:
                  $ref: '#/components/examples/CreateLocator-InvalidGroup'
                Create Locator Required Field - Example:
                  $ref: '#/components/examples/CreateLocator-TaxPayerName-Required'
        '403':
          description: Add user permission required.
        '404':
          description: Account doesn't belong to the firm.
      x-operation-id-source: normalized
      x-operation-id-original: Trigger Create locator
  /locator/v2/deactivate:
    post:
      summary: Deactivate locator
      description: Deactivates a locator for a specific tax return. Provide the account details, locator ID, tax year, and tax type in the request. If the locator is password-protected, you must also provide the password.
      tags:
      - Locator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateLocatorRequest'
            examples:
              Deactivate Locator With Password:
                $ref: '#/components/examples/Deactivate-Request'
              Deactivate Locator Without Password:
                $ref: '#/components/examples/Deactivate-Request-WithoutPassword'
              Deactivate Locator Bad Request:
                $ref: '#/components/examples/Deactivate-RequestWithoutLocatorId'
      responses:
        '200':
          description: Success. The locator is deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateLocatorResponse'
              examples:
                Locator In Use:
                  $ref: '#/components/examples/DeactivateLocatorInUse-Response'
                Deactivate Locator Success:
                  $ref: '#/components/examples/DeactivateSuccess'
                Deactivate Locator Wrong Password:
                  $ref: '#/components/examples/DeactivateLocator-WrongPassword'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                BadRequest - Response:
                  $ref: '#/components/examples/SaveAsBadRequest-Response'
        '500':
          description: Internal server error.
      operationId: postLocatorV2Deactivate
      x-operation-id-source: derived
  /locator/v2/saveas:
    post:
      summary: Create copy of locator
      description: Creates a copy of an existing locator. Provide the account details, locator ID, tax year, tax type, and taxpayer first name in the request. You can include additional parameters to customize the new locator.
      tags:
      - Locator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAsLocatorRequest'
            examples:
              SaveAs BasicSuccessRequest:
                $ref: '#/components/examples/SaveAs-Request1'
              SaveAs-1040/706/709-SuccessRequest:
                $ref: '#/components/examples/SaveAs-1040'
              SaveAs-1041/1120/1065/5500/990-SuccessRequest:
                $ref: '#/components/examples/SaveAs-1041'
              SaveAs-Full-SuccessRequest:
                $ref: '#/components/examples/SaveAs-FullRequest'
              SaveAs BadRequest:
                $ref: '#/components/examples/Bad-Request'
        required: true
      responses:
        '200':
          description: Success. A copy of the locator is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateLocatorResponse'
              examples:
                SaveAsSuccess - Response:
                  $ref: '#/components/examples/SaveAsSuccess-Response'
                SaveAsNoDataFound - Response:
                  $ref: '#/components/examples/SaveAsNoDataExist-Response'
                SaveAsInvalidPassword - Response:
                  $ref: '#/components/examples/SaveAsInvalidPassword-Response'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                BadRequest - Response:
                  $ref: '#/components/examples/SaveAsBadRequest-Response'
        '500':
          description: Internal server error.
      operationId: postLocatorV2Saveas
      x-operation-id-source: derived
  /locator/v2/assignment:
    post:
      summary: Assign groups and users to tax returns
      description: 'Assigns groups, preparers, reviewers, managers, partners, and time tracking information to tax returns.


        When you assign an existing locator to a group without updating time tracking dates, you must still include the timeTracking object in the request as an empty object ("timeTracking": {}). Omitting it or passing null values results in a 400 Bad Request.


        The flag field accepts the following values:


        Users:

        - N: Does nothing.

        - U: Removes the assigned user.

        - C: Assigns the user.


        Groups:

        - N: Does nothing.

        - U: Removes the assigned groups.

        - C: Assigns the groups.'
      tags:
      - Locator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocatorAssignmentRequest'
            examples:
              1040 Assignment Example:
                $ref: '#/components/examples/Assignment-1040-Example'
              1120 Assignment Example:
                $ref: '#/components/examples/Assignment-1120-Example'
              1065 Assignment Example:
                $ref: '#/components/examples/Assignment-1065-Example'
              5500 Assignment Example:
                $ref: '#/components/examples/Assignment-5500-Example'
              Bulk Assignment Example:
                $ref: '#/components/examples/Assignment-Bulk-Example'
              Assignment Without Time Tracking Example:
                $ref: '#/components/examples/Assignment-Without-TimeTracking-Example'
      responses:
        '200':
          description: Success. Groups and users are assigned to tax returns.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidateLocatorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateLocatorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidateLocatorResponse'
        '400':
          description: Bad request.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: postLocatorV2Assignment
      x-operation-id-source: derived
  /locator/v2/validate:
    post:
      summary: Validate locator
      description: Validates a locator by verifying that the provided taxpayer SSN matches the locator's SSN. Provide the account details, locator ID, tax year, tax type, and taxpayer SSN in the request.
      tags:
      - Locator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateLocatorRequest'
            examples:
              Full ValidateLocator Request:
                $ref: '#/components/examples/ValidateLocator-Request1'
              ValidateLocator Empty SSN Request:
                $ref: '#/components/examples/ValidateLocator-EmptySSN'
        required: true
      responses:
        '200':
          description: Success. The locator is validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateLocatorResponse'
              examples:
                Full ValidateLocator Response:
                  $ref: '#/components/examples/ValidateLocator-Request1-Response'
                Invalid SSN Response:
                  $ref: '#/components/examples/ValidateLocator-InvalidSSN-Response'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Empty/Null SSN Response:
                  $ref: '#/components/examples/ValidateLocator-EmptySSN-Response'
        '500':
          description: Internal server error.
      operationId: postLocatorV2Validate
      x-operation-id-source: derived
