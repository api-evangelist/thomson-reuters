openapi: 3.2.0
info:
  title: ONESOURCE Income Tax Charts State AA Forms Cross Reference…
  description: 'Charts are used to identify Tax Return Code (TRC) and Tax Combination Code (TCC) accounts and adjustments for multiple entities and binders. Use REST APIs to automatically manipulate basic chart functions.


    The charts are related by using elements from other charts to create a set of charts. Each set of charts is then assigned to an entity to use for TRC/TCCs, accounts, and adjustments. Chart assignments are either Common or Separate.'
  termsOfService: ''
  version: v1
servers:
- url: https://api.onesourcetax.com/income-tax/charts
security:
- Authorization: []
tags:
- name: State AA Forms Cross Reference Charts
paths:
  /v1/years/{year}/state-aa-form-cross-reference-charts:
    get:
      tags:
      - State AA Forms Cross Reference Charts
      summary: Returns the list of State AA Forms Cross Reference Charts based on year.
      parameters:
      - name: year
        in: path
        required: true
        description: Tax year.
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateAAFormsCrossReferenceChartRepresentations'
              examples:
                state-aa-form-cross-reference-charts:
                  $ref: '#/components/examples/state-aa-form-cross-reference-charts-response'
        '400':
          description: Request failed. This is usually due to validation errors.
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      deprecated: false
      operationId: getV1YearsByYearStateAaFormCrossReferenceCharts
      x-operation-id-source: derived
  /v1/state-aa-form-cross-reference-charts/{chartId}/copies:
    post:
      tags:
      - State AA Forms Cross Reference Charts
      summary: Creates a copy of an existing State AA Forms Cross Reference Chart.
      operationId: CreatesACopyOfAnExistingStateAAFormsCrossReferenceChart.
      parameters:
      - name: chartId
        in: path
        description: 16-character chart ID.
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      - name: Content-Type
        in: header
        description: Indicates the response content media type to return.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternationalSummaryChartRenameRepresentation'
            examples:
              create-state-aa-form-cross-reference-chart:
                $ref: '#/components/examples/international-summary-chart-rename-request'
      responses:
        '200':
          description: StateAAFormsCrossReferenceChart created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateAALogicChartCreateResponseRepresentation'
              examples:
                create-state-aa-form-cross-reference-chart-response:
                  $ref: '#/components/examples/create-state-aa-logic-chart-response'
        '400':
          description: Request failed. This is usually due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemRepresentation'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      x-operation-id-source: normalized
      x-operation-id-original: Creates a copy of an existing State AA Forms Cross Reference Chart.
  /v1/state-aa-form-cross-reference-charts/{chartId}:
    put:
      tags:
      - State AA Forms Cross Reference Charts
      summary: Renames a State AA Forms Cross Reference Chart. Enter the chartId in the URL
      parameters:
      - name: chartId
        in: path
        description: 16-character chart ID.
        required: true
        schema:
          type: string
      - name: Accept
