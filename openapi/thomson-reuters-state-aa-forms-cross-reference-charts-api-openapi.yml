      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternationalSummaryChartRenameRepresentation'
            examples:
              rename-state-aa-form-cross-reference-chart:
                $ref: '#/components/examples/international-summary-chart-rename-request'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateAAFormsCrossReferenceChartRepresentation'
              examples:
                rename-state-aa-form-cross-reference-chart-response:
                  $ref: '#/components/examples/state-aa-form-cross-reference-chart-response'
        '400':
          description: Request failed. This is usually due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemRepresentation'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      operationId: putV1StateAaFormCrossReferenceChartsByChartId
      x-operation-id-source: derived
  /v1/state-aa-form-cross-reference-charts/{chartId}/read-only-status:
    put:
      tags:
      - State AA Forms Cross Reference Charts
      summary: Updates the read-only status for a State AA Forms Cross Reference Chart.
      parameters:
      - name: chartId
        in: path
        description: 16-character chart ID.
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
