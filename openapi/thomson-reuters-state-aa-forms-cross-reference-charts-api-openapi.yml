              $ref: '#/components/schemas/InternationalSummaryChartReadOnlyStatusRepresentation'
            examples:
              read-only-status-state-aa-form-cross-reference-chart:
                $ref: '#/components/examples/international-summary-chart-read-only-status-request'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateAAFormsCrossReferenceChartRepresentation'
              examples:
                read-only-status-state-aa-form-cross-reference-chart-response:
                  $ref: '#/components/examples/state-aa-form-cross-reference-chart-response'
        '400':
          description: Request failed. This is usually due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemRepresentation'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
