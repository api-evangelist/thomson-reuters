          content: {}
      operationId: putV1StateAaFormCrossReferenceChartsByChartIdReadOnlyStatus
      x-operation-id-source: derived
components:
  schemas:
    ProblemRepresentation:
      type: object
      properties:
        type:
          type: object
          format: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        fieldName:
          type: string
        messages:
          type: array
          items:
            type: string
        errorCode:
          type: integer
          format: int32
    StateAAFormsCrossReferenceChartRepresentation:
      type: object
      properties:
        chartId:
          type: string
          description: System-generated unique identifier for a chart.
        chartName:
          type: string
          description: User-defined unique chart name.
        year:
          type: integer
          description: Tax year.
          format: int32
        isReadOnly:
          type: boolean
          description: Indicates whether the chart can be edited.
        jurisdictionName:
          type: string
          description: Jurisdiction name.
        isDefault:
          type: boolean
    InternationalSummaryChartReadOnlyStatusRepresentation:
      type: object
      properties:
        isReadOnly:
          type: boolean
          description: Indicates whether the chart can be edited.
    InternationalSummaryChartRenameRepresentation:
      type: object
      properties:
        chartName:
          type: string
          description: User-defined unique chart name.
    StateAALogicChartCreateResponseRepresentation:
      type: object
      properties:
        year:
          type: integer
          description: Tax year.
          format: int32
        chartId:
          type: string
          description: System-generated unique identifier for a chart.
        chartName:
          type: string
          description: User-defined unique chart name.
    StateAAFormsCrossReferenceChartRepresentations:
      type: array
      items:
        $ref: '#/components/schemas/StateAAFormsCrossReferenceChartRepresentation'
  examples:
    state-aa-form-cross-reference-chart-response:
      value:
        chartId: E45V010100003AWR
        chartName: TestChart
        year: 2022
        isReadOnly: false
        jurisdictionName: Alabama
        isDefault: true
    state-aa-form-cross-reference-charts-response:
      value:
      - chartId: E45V010100003AWR
        chartName: Alabama2022
        year: 2022
        isReadOnly: true
        jurisdictionName: Alabama
        isDefault: true
      - chartId: E45V010100003CYB
        chartName: JP State A&A Forms Cross-References
        year: 2022
        isReadOnly: false
        jurisdictionName: Alabama
        isDefault: false
      - chartId: E45V010100003MSH
        chartName: KW AL Chart Test21
        year: 2022
        isReadOnly: false
        jurisdictionName: Alabama
        isDefault: false
      - chartId: E45V010100003N65
        chartName: test2022
        year: 2022
        isReadOnly: false
        jurisdictionName: Alabama
        isDefault: false
    international-summary-chart-read-only-status-request:
      value:
        isReadOnly: false
    international-summary-chart-rename-request:
      value:
        chartName: TestChart
    create-state-aa-logic-chart-response:
      value:
        year: 2022
        chartId: E45V010100003L6F
        chartName: TestChart
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
