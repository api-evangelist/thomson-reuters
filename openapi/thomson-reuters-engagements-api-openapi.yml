paths:
  /external/v1/engagements/{clientId}:
    get:
      tags:
      - Engagements
      summary: Retrieve all engagements for a specific client
      description: '## Purpose

        This endpoint retrieves all engagements (binders) associated with a specific client ID. Use this to get a comprehensive list of all engagements for a client, including current and prior year engagements.


        ## Why Use This Endpoint

        - Retrieve all engagements/binders for a specific client

        - View engagement details including period dates, types, and status

        - Check finalization status of engagements

        - Identify consolidated engagements and their subsidiaries

        - Access engagement metadata for further operations

        - Navigate between related engagements (current and prior years)


        ## How to Get Client ID

        First, use the `/clients/load-clients` endpoint to retrieve the list of clients and obtain the `clientId` value.


        ## Path Parameter

        - `clientId` (required): The unique identifier of the client. Must be a positive integer greater than 0.


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```

        ## Common Use Cases

        - Display all engagements for a client in your application

        - Check if a client has finalized engagements

        - Navigate to specific engagement details

        - Build engagement selection interfaces

        - Track engagement history across multiple years

        - Identify consolidated engagement structures


        ## Error Responses

        - `400 Bad Request`: Invalid client ID (must be greater than 0)

        - `401 Unauthorized`: Invalid or expired token

        - `404 Not Found`: Client ID does not exist

        - `500 Internal Server Error`: Server or database errors'
      operationId: EmMainEndPointsExternalBinderGetEngagementListByClientIdEndpoint
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      responses:
        '200':
          description: Successfully retrieved the list of engagements.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EMMainDataTransferObjectsModelsEMDTOsEngagementListDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmMainExtensionsUtilityErrorResponse'
              example:
                errors:
                - message: Bad request due to invalid input.
                  extensions:
                    statusCode: 400
                    code: ERR_BAD_4000
                    errorId: 2ebb159b-1a92-428a-b083-62ab6cd4da52
                    dateTime: '2026-04-21T05:50:04.7816961Z'
                    traceId: 1e2c6dc622344d43a7aedda3dacbccac
                    spanId: 358611c48f91f940
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmMainExtensionsUtilityErrorResponse'
              example:
                errors:
                - message: Unauthorized access.
                  extensions:
                    statusCode: 401
                    code: ERR_AUTH_4010
                    errorId: 279b9c43-974c-470a-a2d0-2981c5db1bd9
                    dateTime: '2026-04-21T05:50:04.7816640Z'
                    traceId: 81e5ba9e84704a8aaf327cc5d3df836e
                    spanId: 358611c48f91f940
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmMainExtensionsUtilityErrorResponse'
              example:
                errors:
                - message: Access forbidden.
                  extensions:
                    statusCode: 403
                    code: ERR_FORB_4030
                    errorId: d5ace0dd-d0f2-4131-990c-2983693e1d4a
                    dateTime: '2026-04-21T05:50:04.7816917Z'
                    traceId: 1ff0ac6616f442219263ba1f022276ca
                    spanId: 358611c48f91f940
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmMainExtensionsUtilityErrorResponse'
              example:
                errors:
                - message: An unexpected error occurred.
                  extensions:
                    statusCode: 500
                    code: ERR_INT_5000
                    errorId: b43bbbdd-15d2-4b30-8ce8-987511a046b8
