  /external/v1/engagements/by-binder-id/{binderId}:
    get:
      tags:
      - Engagements
      summary: Retrieve detailed information for a specific engagement
      description: '## Purpose

        This endpoint retrieves comprehensive details for a specific engagement (binder) using its unique identifier. Use this to access detailed engagement information including metadata, configuration, and associated data.


        ## Why Use This Endpoint

        - Retrieve complete engagement details by ID

        - Access engagement metadata and configuration settings

        - View engagement-specific information for processing workflows

        - Retrieve engagement data for display or further operations

        - Access detailed engagement attributes and properties

        - Get engagement information for validation or business logic


        ## How to Get Binder ID

        First, use the `/engagements/{clientId}` endpoint to retrieve the list of engagements for a client and obtain the `binderId` value from the engagement list.


        ## Path Parameter

        - `binderId` (required): The unique identifier of the engagement/binder. Must be a positive integer greater than 0.


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Common Use Cases

        - Display detailed engagement information in your application

        - Retrieve engagement data for processing workflows

        - Validate engagement existence before operations

        - Load engagement configuration and settings

        - Access engagement metadata for business logic

        - Retrieve engagement details for reporting purposes


        ## Error Responses

        - `400 Bad Request`: Invalid binder ID (must be greater than 0)

        - `401 Unauthorized`: Invalid or expired token

        - `500 Internal Server Error`: Server or database errors'
      operationId: EmMainEndPointsEngagementManagementBinderGetBinderExternalEndpoint
      parameters:
      - name: binderId
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      responses:
        '200':
          description: Successfully retrieved the engagement/binder details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalEngagementEngagementBinderExternalDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmMainExtensionsUtilityErrorResponse'
              example:
                errors:
                - message: Bad request due to invalid input.
                  extensions:
                    statusCode: 400
                    code: ERR_BAD_4000
                    errorId: c140b33d-5c75-4ec6-a5e0-6e6cf7c44e79
                    dateTime: '2026-04-21T05:50:05.2334464Z'
                    traceId: d644390c38bb4e33b3798070eab10965
                    spanId: 358611c48f91f940
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmMainExtensionsUtilityErrorResponse'
              example:
                errors:
                - message: Unauthorized access.
                  extensions:
                    statusCode: 401
                    code: ERR_AUTH_4010
                    errorId: 79ce4d97-eaae-4093-8a02-c992dd480aae
