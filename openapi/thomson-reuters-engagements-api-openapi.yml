components:
  schemas:
    EMMainDataTransferObjectsModelsExternalEngagementEngagementBinderExternalDto:
      type: object
      description: 'Represents an engagement binder containing all properties related to its lifecycle,

        finalization state, engagement structure, external system integrations, and processing flags.'
      additionalProperties: false
      properties:
        engagementBinderId:
          type: integer
          description: The unique identifier of the engagement binder.
          format: int32
          example: 1042
        name:
          type: string
          description: The display name of the engagement binder.
          example: ABC Corp Audit 2024
        engagementType:
          type: string
          description: The type of engagement (e.g., Audit, Tax).
          example: Audit
        subsidiaryBinderIds:
          type:
          - array
          - 'null'
          description: The list of binder IDs representing subsidiary binders in a consolidated engagement.
          example:
          - 1043
          - 1044
          - 1045
          items:
            type: integer
            format: int32
        periodFrequency:
          type: string
          description: The frequency of the trial balance period (e.g., Annual, Monthly, Quarterly).
          example: Annual
        period:
          description: The trial balance period associated with the binder.
          example: 12
          oneOf:
          - $ref: '#/components/schemas/EMMainDataTransferObjectsModelsTrialBalancePeriod'
        priorYearsCount:
          type: integer
          description: The number of prior years to include in the binder.
          format: int32
          example: 7
        clientId:
          type: integer
          description: The unique identifier of the client associated with this binder.
          format: int32
          example: 789
        isFinalized:
          type:
          - boolean
          - 'null'
          description: Indicates whether the overall engagement binder has been finalized.
          example: false
        isTrialBalanceFinalized:
          type:
          - boolean
          - 'null'
          description: Indicates whether the trial balance portion of the engagement has been finalized.
          example: false
        isWorkpapersFinalized:
          type:
          - boolean
          - 'null'
          description: Indicates whether the workpapers portion of the engagement has been finalized.
          example: false
        isJournalEntriesFinalized:
          type:
          - boolean
          - 'null'
          description: Indicates whether the journal entries portion of the engagement has been finalized.
          example: false
        isNotesListFinalized:
          type:
          - boolean
          - 'null'
          description: Indicates whether the notes list portion of the engagement has been finalized.
          example: false
        engagementBeginDate:
          type:
          - string
          - 'null'
          description: The start date of the engagement period.
          format: date-time
          example: '2024-01-01T00:00:00Z'
        engagementEndDate:
          type:
          - string
          - 'null'
          description: The end date of the engagement period.
          format: date-time
          example: '2024-12-31T00:00:00Z'
        reportReleaseDate:
          type:
          - string
          - 'null'
          description: The date the engagement report is scheduled for release.
          format: date-time
          example: '2025-03-31T00:00:00Z'
        documentDuration:
          type:
          - integer
          - 'null'
          description: The number of months after which documents are considered complete and eligible for archival.
          example: 12
        documentCompletionDate:
          type:
          - string
          - 'null'
          description: The calculated date by which document completion is expected.
          format: date-time
          example: '2025-06-30T00:00:00Z'
        completionCalculatedFrom:
          type: string
          description: The engagement date field used to calculate the document completion date.
          example: EndingDate
        engagementStructure:
          type: string
          description: The structural type of the engagement (e.g., None, Consolidated, Divisional, FundGroup).
          example: Consolidated
        structureMask:
          type:
          - string
          - 'null'
          description: The mask pattern that defines the division or fund grouping structure for the binder.
          example: '##-###'
        hasCptLinks:
          type: boolean
          description: Indicates whether the binder has active CPT (Checkpoint Tools) integration links.
          example: false
        cptIntegrationData:
          type:
          - string
          - 'null'
          description: Serialized JSON data containing CPT integration configuration details.
          example: '{"cptEngagementId":"CPT-2024-001"}'
        hasSmartEngagementLinks:
          type: boolean
          description: Indicates whether the binder is linked to an Onvio Smart engagement.
          example: true
        smartIntegrationData:
          type:
          - string
          - 'null'
          description: Serialized JSON data containing Onvio Smart integration configuration details.
          example: '{"smartEngagementId":"SMT-2024-042"}'
        smartBinderId:
          type:
          - string
          - 'null'
          description: The unique identifier of the linked Onvio Smart binder.
          example: SMB-98765
        smartRollForwardType:
          type: string
          description: The Smart engagement type to apply when this binder is rolled forward.
          example: Desktop
        taxEntityType:
          type: string
          description: The tax entity type associated with the engagement (e.g., Individual, Corporation, Partnership).
          example: Partnership
        taxSoftwareVendor:
          type: string
          description: The tax software vendor used in conjunction with this engagement.
          example: Lacerte
        taxEntityDescription:
          type: string
          description: The human-readable description of the tax entity type for display purposes.
          example: C Corporation
    EMMainDataTransferObjectsModelsEMDTOsEngagementListDto:
      type: object
      additionalProperties: false
      properties:
        engagementId:
          type: integer
          description: Unique identifier for the engagement/binder. Use this ID to retrieve engagement details or perform operations.
          format: int32
          example: 94
        name:
          type:
          - string
          - 'null'
          description: Name of the engagement/binder. Null if not set.
          example: 2024 Annual Audit
        isFinalized:
          type: boolean
          description: Indicates whether the engagement has been finalized. Finalized engagements are typically locked from further edits.
          example: false
        period:
          description: The trial balance period details for this engagement, including start date, end date, and year-end date.
          oneOf:
          - $ref: '#/components/schemas/EMMainDataTransferObjectsModelsTrialBalancePeriod'
        engagementType:
          type:
          - string
          - 'null'
          description: Type of engagement (e.g., Audit, Review, Tax, Compilation). Null if not specified.
          example: Audit
        taxSoftwareVendor:
          type: string
          description: The tax software vendor used for this engagement (e.g., UltraTax, ProSystem fx, CCH).
          example: UltraTax
        periodFrequency:
          type: string
          description: Frequency of the engagement period (e.g., Annual, Quarterly, Monthly).
          example: Annual
        taxEntityType:
          type:
          - string
          - 'null'
          description: Tax entity type for the engagement (e.g., Corporation, Partnership, Individual). Null if not specified.
          example: Corporation
        engagementStructure:
          type: string
          description: Engagement structure type (e.g., Standard, Consolidated, Subsidiary).
          example: Consolidated
        priorYearsCount:
          type: integer
          description: Number of prior year engagements/binders associated with this engagement.
          format: int32
          example: 3
        subsidiaryBinderIds:
          type: array
          description: List of subsidiary binder IDs if this is a consolidated engagement. Empty if no subsidiaries.
          example:
          - 101
          - 102
          - 103
          items:
            type: integer
            format: int32
