components:
  schemas:
    ProblemRepresentation:
      type: object
      properties:
        type:
          type: object
          format: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ExchangeRateChartRenameRepresentation:
      type: object
      properties:
        chartName:
          type: string
          description: User-defined chart name.
    ExchangeRateChartUpdateCurrenciesRequests:
      type: array
      items:
        $ref: '#/components/schemas/ExchangeRateChartUpdateCurrenciesRequest'
    ExchangeRateChartRenameRequest:
      type: object
      properties:
        ChartName:
          type: string
          description: User-defined unique chart name.
      required:
      - ChartName
    ExchangeRateChartValidYearCurrency:
      type: object
      properties:
        currencyName:
          type: string
          description: Full name of the currency.
        currencyAbbreviation:
          type: string
          description: Standard abbreviation code for the currency.
    ExchangeRateChartUpdateCurrenciesRequest:
      type: object
      properties:
