      x-operation-id-source: normalized
      x-operation-id-original: Creates New Exchange Rate Chart
  /v1/exchange-rate-charts/{chartId}:
    put:
      tags:
      - Exchange Rate Charts (2024+)
      summary: Renames an existing 2024+ Exchange Rate Chart. Enter the chartId in the URL
