openapi: 3.2.0
info:
  title: ONESOURCE Income Tax Charts Exchange Rate Charts (2024+) API
  description: 'Charts are used to identify Tax Return Code (TRC) and Tax Combination Code (TCC) accounts and adjustments for multiple entities and binders. Use REST APIs to automatically manipulate basic chart functions.


    The charts are related by using elements from other charts to create a set of charts. Each set of charts is then assigned to an entity to use for TRC/TCCs, accounts, and adjustments. Chart assignments are either Common or Separate.'
  termsOfService: ''
  version: v1
servers:
- url: https://api.onesourcetax.com/income-tax/charts
security:
- Authorization: []
tags:
- name: Exchange Rate Charts (2024+)
paths:
  /v1/exchange-rate-charts:
    get:
      tags:
      - Exchange Rate Charts (2024+)
      summary: Returns a list of Exchange Rate Charts for tax years 2024 and later
      operationId: RetrievesExchangeRateChartsList
      parameters:
      - name: year
        in: query
        description: Four-digit year (2024 or later)
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        description: Accept header media type
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateChartsRepresentation'
              examples:
                exchange-rate-charts:
                  $ref: '#/components/examples/exchange-rate-charts'
        '400':
          description: Request failed due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemRepresentation'
              examples:
                exchange-rate-charts-error:
                  $ref: '#/components/examples/exchange-rate-charts-error'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves Exchange Rate Charts List
    post:
      tags:
      - Exchange Rate Charts (2024+)
      summary: Creates a new Exchange Rate Chart for tax years 2024 and later
      operationId: CreatesNewExchangeRateChart
      parameters:
      - name: Accept
        in: header
        description: Accept header media type
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      - name: Content-Type
        in: header
        description: Content-Type header media type
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      requestBody:
        description: Exchange Rate Chart creation request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRateChartCreateRequest'
            examples:
              create-exchange-rate-chart:
                $ref: '#/components/examples/create-exchange-rate-chart-request'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateChartRepresentation'
              examples:
                exchange-rate-chart-response:
                  $ref: '#/components/examples/exchange-rate-chart-response'
        '400':
          description: Request failed due to validation errors.
          content:
