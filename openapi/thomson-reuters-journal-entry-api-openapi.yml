paths:
  /external/v1/journalentry/get/{engagementId}:
    get:
      tags:
      - Journal Entry
      summary: Retrieve all journal entries for a specific engagement
      description: '## Purpose

        Retrieves a complete list of all journal entries (JEs) associated with a specific engagement/binder. This endpoint provides access to adjusting entries, reclassifications, eliminations, and other manual entries made to the trial balance for the specified engagement, including detailed line-item breakdowns with debits, credits, and associated workpaper references.


        ## Why Use This Endpoint

        - View all journal entries for an engagement''s trial balance

        - Retrieve JE details for audit documentation and review

        - Extract journal entry data for external reporting or analysis

        - Verify adjusting entries and their impact on the trial balance

        - Review workpaper references and supporting documentation links

        - Export journal entries for compliance or archival purposes

        - Validate balanced entries (debits equal credits) before finalization


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get Journal Entries

        - **Endpoint:** `GET /journalentry/get/{engagementId}` (this endpoint)

        - **Use:** The `engagementId` from Step 2 in the URL path

        - **Returns:** All journal entries for that engagement


        ## Request Details

        - **Route Parameter:** `engagementId` (required integer in URL path)

        - **Format:** `/journalentry/get/{engagementId}`

        - This is a URL route parameter, not a query string or request body parameter


        ## Common Use Cases

        1. **Audit Review:** Review all adjusting entries made during engagement finalization

        2. **Work Paper Export:** Extract journal entry data for audit work papers

        3. **Balance Validation:** Validate that all journal entries are balanced (debits = credits)

        4. **Adjustment Analysis:** Generate reports on types of adjustments made (by JeType)

        5. **Documentation Verification:** Verify workpaper references for supporting documentation

        6. **Consolidation Review:** Analyze reclassifications and eliminations for consolidated financials

        7. **Compliance Export:** Export journal entries for external audit or regulatory review


        ## Important Notes

        - Returns all journal entries for the specified engagement, regardless of type or status

        - Each journal entry contains detailed line items in the JeDetails array

        - DebitTotal should always equal CreditTotal in properly balanced entries

        - IsLockedOrFinalized indicates whether the engagement or JE is locked for editing

        - WorkpaperRef and JeWorkpaper provide links to supporting documentation

        - JeType indicates the purpose: "Standard", "Adjusting", "Reclassification", "Elimination"

        - Empty list is returned if the engagement has no journal entries

        - The engagementId must correspond to a valid engagement that the authenticated user has access to'
      operationId: EmMainEndPointsExternalJEGetJournalEntryExternalEndpoint
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: X-TR-EM-APIKEY
        in: header
        required: true
