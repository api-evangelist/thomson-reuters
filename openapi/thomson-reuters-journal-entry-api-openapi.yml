components:
  schemas:
    EMMainDataTransferObjectsModelsExternalJournalEntryExternal:
      type: object
      additionalProperties: false
      required:
      - jeKey
      - trialBalancePeriodKey
      - reference
      properties:
        jeKey:
          type: integer
          description: Unique identifier for the journal entry. This is the primary key used to reference this specific JE.
          format: int32
          example: 124
        trialBalanceKey:
          type: integer
          description: Identifier for the trial balance that this journal entry belongs to. Links the JE to a specific TB.
          format: int32
          example: 854
        trialBalancePeriodKey:
          type: integer
          description: Identifier for the trial balance period (e.g., fiscal year-end, quarter-end). Required field.
          format: int32
          example: 725
        reference:
          type: string
          description: User-defined reference code or number for this journal entry (e.g., "JE-001", "ADJ-2024-15"). Required field.
          minLength: 1
          example: JE-2024-001
        jeType:
          type: string
          description: Type classification of the journal entry (e.g., "Standard", "Adjusting", "Reclassification", "Elimination").
          example: Adjusting
        description:
          type:
          - string
          - 'null'
          description: General description or narrative explaining the purpose and nature of this journal entry.
          example: Year-end accrual for unbilled revenue
        accounts:
          type:
          - string
          - 'null'
          description: Comma-separated list or summary of account numbers affected by this journal entry.
          example: 1200-Accounts Receivable, 4000-Revenue
        amount:
          type: number
          description: Total amount of the journal entry. Typically equals the debit or credit side (both should be equal in a balanced entry).
          format: decimal
          example: 5000
        workpaperRef:
          type:
          - string
          - 'null'
          description: Reference to the related workpaper document (e.g., "A-1", "B-3") where the supporting documentation exists.
          example: A-1
        jeDetails:
          type: array
          description: List of detailed line items (debits and credits) that make up this journal entry. Each detail represents one account affected.
          items:
