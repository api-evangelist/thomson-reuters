              $ref: '#/components/schemas/EFileV3Representations'
            examples:
              e-file-example:
                $ref: '#/components/examples/e-file-v3-example'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileCreateResponseRepresentation'
              examples:
                E-File Accepted:
                  $ref: '#/components/examples/E-File-V3_Success'
        '201':
          description: Created
        '400':
          description: Request failed. This is usually due to validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileCreateResponseRepresentation'
              examples:
                Invalid JurisdictionId:
                  $ref: '#/components/examples/Efile_V3_Invalid_Jurisdiction'
                Invalid EfileTypeId JurisdictionId Combination:
                  $ref: '#/components/examples/Efile_Invalid_EfileType_Jurisdiction_V3_Combination'
                Invalid BinderId:
                  $ref: '#/components/examples/Efile_Invalid_BinderId'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights
        '500':
          description: Unexpected Error Encountered. Contact ONESOURCE Technical Support.
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Triggers multiple E-files for a given binder id based on efileTypeId and jurisdictionId
