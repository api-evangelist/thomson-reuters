openapi: 3.2.0
info:
  title: Thomson Reuters E-file Document Lifecycle API
  version: v1
  termsOfService: None
  description: 'Operations tagged E-file Document Lifecycle across 2 of this provider''s published API definitions: thomson-reuters-onesource-income-tax-e-file-api-v1-openapi.json, thomson-reuters-onesource-income-tax-e-file-api-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/income-tax/e-file
security:
- Authorization: []
tags:
- name: E-file Document Lifecycle
paths:
  /v1/binders/{binderId}/e-files:
    post:
      tags:
      - E-file Document Lifecycle
      summary: Use to create an E-file document for a given binder id
      operationId: CreatesAnE-fileDocumentForAGivenBinderId
      parameters:
      - name: binderId
        in: path
        description: Binder Id
        required: true
        schema:
          type: string
      - name: DeviceId
        in: header
        description: A 40-digit alphanumeric value that is case sensitive with no separators, consists of characters A-F and 0-9 and run through hash algorithm SHA-1 that should include unique information such as the hardware serial number and UUID together of the machine that created the E-file. Reference the E-file Glossary section in this document published by the IRS - https://www.irs.gov/pub/irs-pdf/p1345.pdf
        required: true
        schema:
          type: string
        example: 1BFD53D7AAC2EB3F192D0F117C8B19815ECD6A30
      requestBody:
        description: '<b>Note:</b> CommandId parameter is <b>required</b> only for TopCon binders with e-file members. Please provide one of the following and keep in mind that e-file generation should be completed in the below order: <ul><li>FE_CreateInternationalXITFile</li> <li>FE_CreateDomesticXDMFile</li> <li>FE_CreateAggregatedEfile</li></ul>'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EFileRepresentation'
            examples:
              e-file-single-jurisdiction-example:
                $ref: '#/components/examples/e-file-single-jurisdiction-example'
              e-file-multiple-jurisdiction-example:
                $ref: '#/components/examples/e-file-multiple-jurisdiction-example'
              e-file-single-jurisdiction-commandid-example:
                $ref: '#/components/examples/e-file-single-jurisdiction-commandid-example'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedMessage'
              examples:
                E-File Accepted:
                  $ref: '#/components/examples/E-File_Accepted'
        '201':
          description: Created
        '400':
          description: Request failed. This is usually due to validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStatusRepresentation'
              examples:
                Invalid Binder:
                  $ref: '#/components/examples/ProcessStatusRepresentation_Invalid_Binder'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights
        '500':
          description: Unexpected Error Encountered. Contact ONESOURCE Technical Support.
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Creates an E-file document for a given binder id
    servers:
    - url: https://api.onesourcetax.com/income-tax/e-file
  /v2/binders/{binderId}/e-files:
    post:
      tags:
      - E-file Document Lifecycle
      summary: Use to create an E-file document for a given binder id for each designated…
      description: 'Available Efile Types:


        Return


        Return2


        Return3


        Return4


        Extension1


        Extension2


        Extension3


        Extension4


        Estimate


        Estimate2


        Estimate3'
      operationId: TriggersMultipleE-filesForAGivenBinderId
      parameters:
      - name: binderId
        in: path
        description: Binder Id
        required: true
        schema:
          type: string
      - name: DeviceId
        in: header
        description: A 40-digit alphanumeric value that is case sensitive with no separators, consists of characters A-F and 0-9 and run through hash algorithm SHA-1 that should include unique information such as the hardware serial number and UUID together of the machine that created the E-file. Reference the E-file Glossary section in this document published by the IRS - https://www.irs.gov/pub/irs-pdf/p1345.pdf
        required: true
        schema:
          type: string
        example: 1BFD53D7AAC2EB3F192D0F117C8B19815ECD6A30
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EFileRepresentations'
            examples:
              e-file-example:
                $ref: '#/components/examples/e-file-example'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              examples:
                E-File Accepted:
                  $ref: '#/components/examples/E-File_Success'
        '201':
          description: Created
        '400':
          description: Request failed. This is usually due to validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EfileValidationsRepresentation'
              examples:
                Invalid Jurisdiction:
                  $ref: '#/components/examples/Efile_Invalid_Jurisdiction'
                Invalid EfileType:
                  $ref: '#/components/examples/Efile_Invalid_EfileType'
                Invalid EfileType Jurisdiction Combination:
                  $ref: '#/components/examples/Efile_Invalid_EfileType_Jurisdiction_Combination'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights
        '500':
          description: Unexpected Error Encountered. Contact ONESOURCE Technical Support.
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Triggers multiple E-files for a given binder id
    servers:
    - url: https://api.onesourcetax.com/income-tax/e-file
  /v3/binders/{binderId}/e-files:
    post:
      tags:
      - E-file Document Lifecycle
      summary: Use to create an E-file document for a given binder id for each designated…
      description: 'Please refer to the GET /v1/e-file-types endpoint to retrieve details about eFileTypeId and jurisdictionId required as input in the request body.


        Note: The E-file documents for International Top Consolidation binders should be created with the POST /v1/binders/{binderId}/e-files endpoint listed above using the required CommandId.'
      operationId: TriggersMultipleE-filesForAGivenBinderIdBasedOnEfileTypeIdAndJurisdictionId
      parameters:
      - name: binderId
        in: path
        description: Binder Id
        required: true
        schema:
          type: string
      - name: DeviceId
        in: header
        description: A 40-digit alphanumeric value that is case sensitive with no separators, consists of characters A-F and 0-9 and run through hash algorithm SHA-1 that should include unique information such as the hardware serial number and UUID together of the machine that created the E-file. Reference the E-file Glossary section in this document published by the IRS - https://www.irs.gov/pub/irs-pdf/p1345.pdf
        required: true
        schema:
          type: string
        example: 1BFD53D7AAC2EB3F192D0F117C8B19815ECD6A30
      requestBody:
