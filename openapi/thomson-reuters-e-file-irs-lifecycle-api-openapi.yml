        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights
        '404':
          description: Not Found
        '500':
          description: Unexpected Error Encountered. Contact ONESOURCE Technical Support.
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves E-file Acknowledgement Events
    servers:
    - url: https://api.onesourcetax.com/income-tax/e-file
  /v1/year/{year}/binder-types/{binderType}/e-filing-types/{efilingType}/e-file-submissions:
    post:
      tags:
      - E-file IRS Lifecycle
      summary: Use to trigger multiple E-file Submissions for a given collection of binder ids…
      operationId: TriggersMultipleE-filesE-filesSubmissions
      parameters:
      - name: year
        in: path
        description: Year
        required: true
        schema:
          type: string
        example: '2023'
      - name: binderType
        in: path
        description: Binder Type
        required: true
        schema:
          type: string
        example: IncomeTax/Partnership
      - name: efilingType
        in: path
        description: EFile Type
        required: true
        schema:
          type: string
        example: FedOnly/StateOnly/FedState
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EFileBatchBinderDetails'
            examples:
              e-file-submission-example:
                $ref: '#/components/examples/e-file-submission-example'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewEfileSubmissionResponseRepresentation'
              examples:
                E-File Successfull Submission:
                  $ref: '#/components/examples/e-file-submission-ok-response'
        '400':
          description: Request failed. This is usually due to validation errors
          content:
            application/json:
