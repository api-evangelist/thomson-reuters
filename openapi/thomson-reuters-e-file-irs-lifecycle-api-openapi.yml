- url: https://api.onesourcetax.com/income-tax/e-file
security:
- Authorization: []
tags:
- name: E-file IRS Lifecycle
paths:
  /v1/years/{year}/event-status:
    get:
      tags:
      - E-file IRS Lifecycle
      summary: Use to retrieve a list of E-file status events occurring within a specific year.
      operationId: RetrievesAYearlyE-fileStatusEventList
      parameters:
      - name: year
        in: path
        description: 4 Digit Year
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileStatusesRepresentation'
              examples:
                E-File Statuses by Year:
                  $ref: '#/components/examples/E-File_Statuses_by_Year'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights
        '404':
          description: Not Found
        '500':
          description: Unexpected Error Encountered. Contact ONESOURCE Technical Support.
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves a Yearly E-file Status Event List
    servers:
    - url: https://api.onesourcetax.com/income-tax/e-file
  /v1/binders/{binderId}/event-status:
    get:
      tags:
      - E-file IRS Lifecycle
      summary: Use to retrieve a list of E-file status events for a specific binder
      operationId: RetrievesAnE-fileStatusEventList
      parameters:
      - name: binderId
        in: path
        description: 16 Character Binder ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileStatusesRepresentation'
              examples:
                E-File Statuses by Binder:
                  $ref: '#/components/examples/E-File_Statuses_by_Binder'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights
        '404':
          description: Not Found
        '500':
          description: Unexpected Error Encountered. Contact ONESOURCE Technical Support.
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves an E-file Status Event List
    servers:
    - url: https://api.onesourcetax.com/income-tax/e-file
  /v1/jurisdictions/{jurisdictionId}/binders/{binderId}/types/{eFileTypeId}/acknowledgements:
    get:
      tags:
      - E-file IRS Lifecycle
      summary: Retrieve a list of E-file acknowledgement details for a specific binder and…
      operationId: RetrievesE-fileAcknowledgementEvents
      parameters:
      - name: jurisdictionId
        in: path
        description: Jurisdiction ID
        required: true
        schema:
          type: string
      - name: binderId
        in: path
        description: 16 Character Binder ID
        required: true
        schema:
          type: string
      - name: eFileTypeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileStatusAcknowledgementRepresentation'
              examples:
