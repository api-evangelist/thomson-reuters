          description: Unexpected Error Encountered. Contact ONESOURCE Technical Support.
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Triggers multiple E-files E-files Submissions
    servers:
    - url: https://api.onesourcetax.com/income-tax/e-file
  /v1/years/{year}/e-file-submissions:
    post:
      tags:
      - E-file IRS Lifecycle
      summary: Use to trigger multiple E-file Submissions for a given collection of binders…
      operationId: TriggersMultipleE-filesSubmissions
