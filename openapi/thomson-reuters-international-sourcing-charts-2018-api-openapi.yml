              $ref: '#/components/schemas/InternationalSummaryChartRenameRepresentation'
            examples:
              create-copy-international-sourcing-chart:
                $ref: '#/components/examples/international-summary-chart-rename-request'
      responses:
        '200':
          description: InternationalSourcingChart created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalSourcingChartCreateResponseRepresentation'
              examples:
                create-copy-international-sourcing-chart-response:
