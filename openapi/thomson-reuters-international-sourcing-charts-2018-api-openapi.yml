      operationId: putV1InternationalSourcingChartsByChartIdReadOnlyStatus
      x-operation-id-source: derived
  /v1/international-sourcing-charts/{chartId}/assigned-source-codes:
    get:
      tags:
      - International Sourcing Charts (2018+)
      summary: Returns the list of assigned source codes for the given International Sourcing…
      parameters:
      - name: chartId
        in: path
        description: 16-character chart ID, system-generated unique identifier for a chart
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Indicates the response content media type to return. application/json is currently the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalSourcingChartSourceCodes'
              examples:
                success:
                  $ref: '#/components/examples/international-sourcing-chart-assigned-source-codes'
        '400':
          description: Request failed due to validation errors.
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
