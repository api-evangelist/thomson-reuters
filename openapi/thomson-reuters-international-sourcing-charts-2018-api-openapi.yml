          - application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternationalSummaryChartReadOnlyStatusRepresentation'
            examples:
              read-only-status-international-sourcing-chart:
                $ref: '#/components/examples/international-summary-chart-read-only-status-request'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalSourcingChartRepresentation'
              examples:
                read-only-status-international-sourcing-chart-response:
