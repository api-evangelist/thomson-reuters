      - year: 2023
        chartId: E45V010100003QV4
        chartName: _AutoAPIIntlSrcCharts120441
        isReadOnly: false
      - year: 2023
        chartId: E45V010100003QV2
        chartName: _AutoAPIIntlSrcCharts13469
        isReadOnly: false
    create-international-summary-chart:
      value:
        year: 2022
