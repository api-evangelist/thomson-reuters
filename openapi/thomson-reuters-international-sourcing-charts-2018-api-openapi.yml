          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      operationId: getV1InternationalSourcingChartsByChartIdUnassignedSourceCodes
      x-operation-id-source: derived
components:
  schemas:
    ProblemRepresentation:
      type: object
      properties:
        type:
          type: object
          format: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    InternationalSourcingChartSourceCodes:
      type: array
      items:
        $ref: '#/components/schemas/InternationalSourcingChartSourceCode'
    InternationalSourcingChartRepresentation:
      type: object
      properties:
        year:
          type: integer
          description: Tax year.
          format: int32
        chartId:
          type: string
          description: System-generated unique identifier for a chart.
        chartName:
          type: string
          description: User-defined unique chart name.
        isReadOnly:
          type: boolean
          description: Indicates whether the chart can be edited.
    InternationalSourcingChartSourceCodesRequest:
      type: object
      properties:
        value:
          type: object
          $ref: '#/components/schemas/InternationalSourcingChartSourceCodeRepresentation'
        path:
          type: string
        op:
          type: string
    InternationalSourcingChartRepresentations:
      type: array
      items:
        $ref: '#/components/schemas/InternationalSourcingChartRepresentation'
    InternationalSourcingChartMultipleResponses:
      type: array
      items:
        $ref: '#/components/schemas/InternationalSourcingChartMultipleResponse'
    InternationalSummaryChartRenameRepresentation:
      type: object
      properties:
        chartName:
          type: string
          description: User-defined unique chart name.
    InternationalSourcingChartSourceCode:
      type: object
      properties:
        id:
          type: integer
          format: int32
        sourceCode:
          type: string
        sourceDescription:
          type: string
        isAssigned:
          type: boolean
    InternationalSourcingChartSourceCodesRequests:
      type: array
      items:
        $ref: '#/components/schemas/InternationalSourcingChartSourceCodesRequest'
    FieldError:
      type: object
      properties:
        fieldName:
          type: string
        messages:
          type: array
          items:
            type: string
        errorCode:
          type: integer
          format: int32
    InternationalSummaryChartReadOnlyStatusRepresentation:
      type: object
      properties:
        isReadOnly:
          type: boolean
          description: Indicates whether the chart can be edited.
    InternationalSummaryChartCreateRepresentation:
      type: object
      properties:
        year:
          type: integer
          description: Tax year.
          format: int32
        chartName:
          type: string
          description: User-defined unique chart name.
    InternationalSourcingChartSourceCodeRepresentation:
      type: object
      properties:
        sourceCode:
          type: string
    InternationalSourcingChartCreateResponseRepresentation:
      type: object
      properties:
        chartId:
          type: string
          description: System-generated unique identifier for a chart.
        chartName:
          type: string
          description: User-defined unique chart name.
        year:
          type: integer
          description: Tax year.
          format: int32
    InternationalSourcingChartMultipleResponse:
      type: object
      properties:
        op:
          type: string
        path:
          type: string
        value:
          type: object
          $ref: '#/components/schemas/InternationalSourcingChartSourceCodeRepresentation'
        statusCode:
          type: integer
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  examples:
    international-sourcing-chart-source-codes-patch-success-response:
      value:
      - op: Add
        path: null
        value:
          SourceCode: '3'
        statusCode: 200
        detail: null
        fieldErrors: []
      - op: Remove
        path: null
        value:
          SourceCode: '1'
        statusCode: 200
        detail: null
        fieldErrors: []
    international-summary-chart-rename-request:
      value:
        chartName: TestChart
    international-sourcing-charts:
      value:
