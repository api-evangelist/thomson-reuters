openapi: 3.2.0
info:
  title: ONESOURCE Income Tax Charts International Sourcing Charts…
  description: 'Charts are used to identify Tax Return Code (TRC) and Tax Combination Code (TCC) accounts and adjustments for multiple entities and binders. Use REST APIs to automatically manipulate basic chart functions.


    The charts are related by using elements from other charts to create a set of charts. Each set of charts is then assigned to an entity to use for TRC/TCCs, accounts, and adjustments. Chart assignments are either Common or Separate.'
  termsOfService: ''
  version: v1
servers:
- url: https://api.onesourcetax.com/income-tax/charts
security:
- Authorization: []
tags:
- name: International Sourcing Charts (2018+)
paths:
  /v1/international-sourcing-charts:
    get:
      tags:
      - International Sourcing Charts (2018+)
      summary: Returns the list of International Sourcing Charts available for 2018 forward
      parameters:
      - name: year
        in: query
        description: 4-digit year.
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalSourcingChartRepresentations'
              examples:
                international-sourcing-charts:
                  $ref: '#/components/examples/international-sourcing-charts'
                international-sourcing-charts-year-specific:
                  $ref: '#/components/examples/international-sourcing-charts-year-specific'
        '204':
          description: No data found for given inputs.
          content: {}
        '400':
          description: Request failed. This is usually due to validation errors.
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      operationId: getV1InternationalSourcingCharts
      x-operation-id-source: derived
    post:
      tags:
      - International Sourcing Charts (2018+)
      summary: Creates a new International Sourcing Chart
      operationId: createsNewInternationalSourcingChart.
      parameters:
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      - name: Content-Type
        in: header
        description: Indicates the response content media type to return.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      requestBody:
        description: InternationalSourcingChart Representation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternationalSummaryChartCreateRepresentation'
            examples:
              create-international-sourcing-chart:
                $ref: '#/components/examples/create-international-summary-chart'
      responses:
        '200':
          description: InternationalSourcingChart created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalSourcingChartCreateResponseRepresentation'
              examples:
                create-international-sourcing-chart-response:
                  $ref: '#/components/examples/create-international-sourcing-chart-response'
        '400':
          description: Request failed. This is usually due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemRepresentation'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      x-operation-id-source: normalized
      x-operation-id-original: creates new International Sourcing Chart.
  /v1/international-sourcing-charts/{chartId}/copies:
    post:
      tags:
      - International Sourcing Charts (2018+)
      summary: Creates a copy of an existing International Sourcing Chart.
      operationId: CreatesACopyOfAnExistingInternationalSourcingChart.
      parameters:
      - name: chartId
        in: path
        description: 16-character chart ID.
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      - name: Content-Type
        in: header
        description: Indicates the response content media type to return.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      requestBody:
        description: InternationalSourcingChart Representation
        content:
          application/json:
