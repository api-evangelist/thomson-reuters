          application/json:
            schema:
              $ref: '#/components/schemas/InternationalSourcingChartSourceCodesRequests'
            examples:
              international-sourcing-chart-source-codes-patch-request:
                $ref: '#/components/examples/international-sourcing-chart-source-codes-patch-request'
      responses:
        '200':
          description: All operations executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalSourcingChartMultipleResponses'
              examples:
                international-sourcing-chart-source-codes-patch-success-response:
                  $ref: '#/components/examples/international-sourcing-chart-source-codes-patch-success-response'
        '207':
          description: One or more operations failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalSourcingChartMultipleResponses'
              examples:
                international-sourcing-chart-source-codes-patch-multiple-responses:
                  $ref: '#/components/examples/international-sourcing-chart-source-codes-patch-multiple-responses'
        '400':
          description: Request failed due to validation errors.
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      operationId: patchV1InternationalSourcingChartsByChartIdAssignedSourceCodes
      x-operation-id-source: derived
  /v1/international-sourcing-charts/{chartId}/unassigned-source-codes:
    get:
      tags:
      - International Sourcing Charts (2018+)
      summary: Returns the list of unassigned source codes for the given International…
      parameters:
      - name: chartId
        in: path
        description: 16-character chart ID, system-generated unique identifier for a chart
        required: true
