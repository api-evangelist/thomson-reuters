          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      operationId: getV1InternationalSourcingChartsByChartIdAssignedSourceCodes
      x-operation-id-source: derived
    patch:
      tags:
      - International Sourcing Charts (2018+)
      summary: Adds or removes source codes for the given International Sourcing Chart.
      parameters:
      - name: chartId
        in: path
