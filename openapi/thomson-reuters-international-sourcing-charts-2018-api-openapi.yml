        '400':
          description: Request failed due to validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemRepresentation'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      operationId: putV1InternationalSourcingChartsByChartId
      x-operation-id-source: derived
  /v1/international-sourcing-charts/{chartId}/read-only-status:
    put:
      tags:
      - International Sourcing Charts (2018+)
