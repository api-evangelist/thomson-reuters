openapi: 3.2.0
info:
  title: Thomson Reuters Attachment API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Attachment API across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Attachment API
paths:
  /{version}/attachments:
    get:
      tags:
      - Attachment API
      summary: Get all attachments
      description: This method is used to get a list of attachment of a Collaborate content item. Please note this method does not apply to iSheet attachments and Q&A attachments, as attachments to those modules are managed separately within the context of those modules.
      operationId: getAllAttachments
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: contenttype
        in: query
        description: "Content type allows below options: \n- Microblogs\n- Wiki\n- Blog\n- Tasks\n- Events\n- Comments\n- Messages"
        required: true
        schema:
          type: string
      - name: contentid
        in: query
        description: This the content id of the required content. <br> e.g. blogid for contenttype=blog, taskid for contenttype=tasks
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Attachments returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Attachments'
            application/json:
              schema:
                $ref: '#/components/schemas/Attachments'
            text/xml:
              schema:
                $ref: '#/components/schemas/Attachments'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting attachments
      security:
      - OAuth: []
    post:
      tags:
      - Attachment API
      summary: Add attachment
      description: 'API method to add an attachment to a content in Collaborate.


        The file should be added as multipart form data. Please note that the parameters are case sensitive.


        If the operation is successful the API returns a progressive key resource object . And based on this progressive key, can see the status of attachment otherwise an error object is returned with the appropriate error code


        To get the status of attachment based on progressive key

        e.g. POST /api/{version}/progressivekeystatus/{progressive_key}


        NameTypeDescription


        progressive_keyString Key to check the status of your action.


        Response


        <attachment>

        <id>101</id>

        </attachment>


        If the operation is successful the API returns a progressive key resource object. Possible statuses are "in-progress", "done" or "failed" otherwise, an error object is returned with the appropriate error code.


        Note: This API will insert an attachment/file into the system with a non-active state. The attachment ID you can use while adding/editing the content API such as task, blog, or event.'
      operationId: addAttachment
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: siteid
        in: query
        description: Site ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Attachment adding process initiated successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while adding attachment
      security:
      - OAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: The parameter name should be called file and the value for it is the file to be uploaded
                  format: binary
                filename:
                  type: string
                  description: Name of the newly created file
              required:
              - file
              - filename
    servers:
    - url: /monumentuat/api
  /{version}/attachments/{attachmentid}:
    delete:
      tags:
      - Attachment API
      summary: Remove attachment from content (un-link)
      description: This method is used to un-link attachment from particular content (not the actual delete of attachment from system).
      operationId: removeAttachment
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: attachmentid
        in: path
        description: Attachment id which is already linked in provided content id
        required: true
        schema:
          type: integer
          format: int32
      - name: contenttype
        in: query
        description: 'Content type allows below options,

          - Wiki

          - Blog

          - Tasks

          - Events

          - Comments'
        required: true
        schema:
          type: string
      - name: contentid
        in: query
        description: 'This the content id of the required content.

          <br> e.g. blogid for contenttype=blog, taskid for contenttype=tasks'
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Attachment un-linked/removed successfully
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while un-linking/removing attachment
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
