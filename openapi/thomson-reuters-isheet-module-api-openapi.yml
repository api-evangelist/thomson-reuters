  /{version}/isheet/{isheetid}/attachment:
    post:
      tags:
      - ISheet Module
      summary: To add iSheet attachment
      description: 'This API call is used to upload file in iSheet for image and attachment column type fields.


        The returned attachment id by calling progressive key API will be used in image or attachment column type while adding/updating an item.


        The file should be added as multipart form data. Please note that the parameters are case sensitive.


        Add iSheet Attachment API response


        <progressivekeyresponse>

        <progressivekey>{progressiveKey}</progressivekey>

        <progressivekeystatus>INPROGRESS or DONE or FAIL</progressivekeystatus>

        </progressivekeyresponse>


        To get the status of an iSheet attachment based on a progressive key


        POST /api/{version}/progressivekeystatus/{progressive_key}


        <progressivekeyresponse>

        <progressivekeystatus>INPROGRESS or DONE or FAIL</progressivekeystatus>

        <attachment>

        <id>{attachmentId}</id>

        </attachment>

        </progressivekeyresponse>'
      operationId: addISheetAttachment
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: isheetid
        in: path
        description: Id of the iSheet
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: This key is returned when a long-running operation is called and can be used to find the final status of the operation.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal server error
      security:
      - OAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: The parameter name should be the file and the value should be the file to be uploaded
                  format: binary
                filename:
                  type: string
                  description: Name of the newly created file
              required:
              - file
              - filename
