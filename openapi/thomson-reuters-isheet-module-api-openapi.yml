          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ItemErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ItemErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ItemErrorDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ItemErrorDBO'
        '500':
          description: Internal server error
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/isheetDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/isheetDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/isheetDBO'
    servers:
    - url: /monumentuat/api
