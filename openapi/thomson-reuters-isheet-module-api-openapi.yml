          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ItemErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ItemErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ItemErrorDBO'
        '500':
          description: Internal server error
      security:
      - OAuth: []
    put:
      tags:
      - ISheet Module
      summary: To edit an iSheet item by using the external id
      description: This API call is used to edit an iSheet item by external id.
      operationId: editIsheetItemByExternalID
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: isheetid
        in: path
        description: Id of the iSheet
        required: true
        schema:
          type: integer
          format: int32
      - name: externalid
        in: path
        description: External id of the iSheet
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The API will return the 200 response code without any message
        '401':
