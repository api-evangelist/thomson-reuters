  /{version}/businessWorkflow/isheet/{isheetid}/search:
    post:
      tags:
      - ISheet Module
      summary: To get the number of records of the iSheet item
      description: This API call is used for Isheet item search record count.
      operationId: businessWorkflowSheetItemSearch
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '6'
      - name: isheetid
        in: path
        description: Id of the iSheet
        required: true
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: The maximum number of records to show per request
        required: false
        schema:
          type: string
          default: '100'
      - name: offset
        in: query
        description: Offset allows us to specify which row to start from retrieving data
        required: false
        schema:
          type: string
          default: '0'
      - name: ruleId
        in: query
        description: ruleId of RuleDetails
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: 'API will return the count of totalRecords. Exa: { "totalRecords": {totalCounts} }'
        '401':
          description: Unauthorised
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
