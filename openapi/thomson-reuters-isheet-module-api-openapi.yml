          type: integer
          format: int32
      - name: itemid
        in: path
        description: Id of the iSheet item
        required: true
        schema:
          type: integer
          format: int32
      - name: sheetviewid
        in: query
        description: Id of the iSheet view. Optional. Default view will be returned
        required: false
        schema:
          type: string
      responses:
        '200':
          description: API will return the specific iSheet item
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal server error
      security:
      - OAuth: []
    put:
      tags:
      - ISheet Module
      summary: To edit iSheet item by using the item id
      description: This API call is used to edit Isheet item by item ID.
      operationId: editIsheetItem
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: isheetid
        in: path
        description: Id of the iSheet
        required: true
        schema:
          type: integer
          format: int32
      - name: itemid
        in: path
        description: Id of the iSheet item
        required: true
        schema:
          type: integer
          format: int32
      responses:
