openapi: 3.2.0
info:
  title: Thomson Reuters ISheet Module API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged ISheet Module across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: ISheet Module
paths:
  /{version}/isheet/doctemplate/generatedocument/singlerecord/{doctemplateid}:
    get:
      tags:
      - ISheet Module
      summary: To download the single-record documents from iSheet
      description: 'This API call is used to download the single-record documents from iSheet.


        Use the progress key to check the status and to download the generated doc template by calling the below API.

        /api/{version}/isheet/doctemplate/generatedocument/{doctemplateid}/download?key={progressiveKey}

        Note: If the iSheet doc template is configured with the setting ''Download document'' checked (this can be found in the add/edit manage document template page) then '' will be returned in the response.'
      operationId: generateSheetContractAutomationReport
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: doctemplateid
        in: path
        description: Id of the document template
        required: true
        schema:
          type: integer
          format: int32
      - name: isheetrecordid
        in: query
        description: Id of iSheet record
        required: true
        schema:
          type: integer
          format: int32
      - name: isheetid
        in: query
        description: Id of the iSheet
        required: true
        schema:
          type: integer
          format: int32
      - name: viewid
        in: query
        description: Id of the iSheet view
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: This key is returned when a long-running operation is called and can be used to find the final status of the operation
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal server error
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/isheet/{isheetid}/items:
    get:
      tags:
      - ISheet Module
      summary: To get a list of iSheet items by item id
      description: 'This API call is used to get a list of iSheet items.


        Note: As seen in the UI, the response will be shown with iSheet views in the correct sequences.'
      operationId: getISheetItems
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: isheetid
        in: path
        description: Id of the iSheet
        required: true
        schema:
          type: integer
          format: int32
      - name: sheetviewid
        in: query
        description: Id of the iSheet view. Optional. Default view will be returned
        required: false
        schema:
          type: string
      - name: sortcolumnid
        in: query
        description: Id of the column to be sorted. Optional. First column sorting will be applied. The sort column id is necessary to pass, if the sort column is set.
        required: false
        schema:
          type: string
      - name: sortorder
        in: query
        description: 'The sorting order. Optional. Default value : 0. Pass 1 for Ascending and 2 for Descending Order'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'The maximum number of records to show per request. Optional. Default value : 100'
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: 'Offset allows us to specify which row to start from retrieving data. Optional. Default value : 0'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: API will return the list of the iSheet items
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal server error
      security:
      - OAuth: []
    post:
      tags:
      - ISheet Module
      summary: To create the iSheet item
      description: 'This API call is used to insert iSheet item. Multiple iSheets can be supported.


        To get the status of an iSheet item based on a progressive key, call API POST /api/3/progressivekeystatus/{progressive_key}

        e.g. POST /api/{version}/progressivekeystatus/{progressive_key}


        NameTypeDescription


        progressive_keyString Key to check the status of your action.


        Response


        <progressivekeyresponse>

        <items>

        <item>

        <itemid>1232</itemid>

        <status>SUCCESS</status>

        <statuscode>200</statuscode>

        <message>Record added successfully</message>

        </item>

        <item>

        <itemid>1233</itemid>

        <status>SUCCESS</status>

        <statuscode>200</statuscode>

        <message>Record added successfully</message>

        </item>

        </items>

        </progressivekeyresponse>'
      operationId: insertISheetItems
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: isheetid
        in: path
        description: Id of the iSheet
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: This key is returned when a long-running operation is called and can be used to find the final status of the operation
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal server error
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/isheetDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/isheetDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/isheetDBO'
    delete:
      tags:
      - ISheet Module
      summary: To delete iSheet item by iSheet id
      description: 'This API call is used to delete iSheet item. This supports multiple sheet items in a single call or all iSheet items.


        To get the status of an iSheet item based on a progressive key

        POST /api/{version}/progressivekeystatus/{progressiveKey}


        {progressiveKey} - This key is returned when a long-running operation is called and can be used to find the final status of the operation


        Response


        <progressivekeyresponse>

        <items>

        <item>

        <itemid>{itemId}</itemid>

        <externalid>{externalId}</externalid>

        <status>INPROGRESS or DONE or FAIL</status>

        <statuscode>{statusCode (e.g. - 200)}</statuscode>

        <message>{API response message (e.g. - Deleted successfully)}</message>

        </item>

        </items>

        </progressivekeyresponse>'
      operationId: deleteISheetItems
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: itemids
        in: query
        description: Id(s) of the iSheet item
        required: true
        schema:
          type: string
      - name: isheetid
        in: path
        description: Id of the iSheet
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: API returns progressive object with status of either 'INPROGRESS', 'DONE', or 'FAIL'. Using the progressive key, an API user can see the status of an iSheet item.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal server error
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/isheet/{isheetid}/items/{itemid}:
    get:
      tags:
      - ISheet Module
      summary: To get an iSheet items by item id
