      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/isheetItemSearchDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/isheetItemSearchDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/isheetItemSearchDBO'
    servers:
    - url: /monumentuat/api
  /{version}/isheet/doctemplate/generatedocument/sitewide/{doctemplateid}:
    get:
      tags:
      - ISheet Module
      summary: Generate site-wide document
      description: 'This API call is used to download a site-wide documents from iSheet.


        To get the status of an iSheet item based on a progressive key, call API POST /api/3/progressivekeystatus/{progressive_key}

        e.g. POST /api/{version}/progressivekeystatus/{progressive_key}


        NameTypeDescription


        progressive_keyString Key to check the status of your action.


        Response


        If generating a document that is in progress


        <progressivekeyresponse>

        <progressivekeystatus>INPROGRESS</progressivekeystatus>

        </progressivekeyresponse>


        If generating a document that is now complete


        <progressivekeyresponse>

        <progressivekeystatus>DONE</progressivekeystatus>

        <downloadlink>https://local.com/sitepont/api/{apiversion}/isheet/doctemplate/generatedocument/{docTemplateId}/download/key={progressiveKey}</downloadlink>

        </progressivekeyresponse>


        Note : If the iSheet doc template is configured with the setting ''Download document'' checked (this can be found in the add/edit manage document template page) then '' will be returned in the response.'
      operationId: generateSheetDocReport
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: doctemplateid
        in: path
        description: Id of the document template
        required: true
        schema:
          type: integer
          format: int32
      - name: isheetrecordids
        in: query
        description: Id(s) of the iSheet record
        required: false
        schema:
          type: string
      - name: isheetid
        in: query
        description: Id of the iSheet
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: This key is returned when a long-running operation is called and can be used to find the final status of the operation
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ProgressiveKeyDBO'
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorised
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal server error
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/isheet/doctemplate/generatedocument/{doctemplateid}/download:
    get:
      tags:
      - ISheet Module
      summary: Download generated document for document template
      description: 'This API call is used to download the generated document template using /isheet/doctemplate/generatedocument API. And a key can be found in the response from the API.


        If generating a document that is in progress


        <progressivekeyresponse>

        <progressivekeystatus>INPROGRESS</progressivekeystatus>

        </progressivekeyresponse>


        If generating a document that is now complete


        <progressivekeyresponse>

        <progressivekeystatus>DONE</progressivekeystatus>

        <downloadlink>https://local.com/sitepont/api//isheet/doctemplate/generatedocument/{docTemplateId}/download/key={progressiveKey}</downloadlink>

        </progressivekeyresponse>


        Response will be in binary stream of document'
      operationId: downloadDocuAutoReport
      parameters:
      - name: version
        in: path
        description: Version of the api
        required: true
        schema:
          type: string
          default: '3'
      - name: key
        in: query
        description: The key generated in response of document generation api
        required: true
        schema:
          type: string
      - name: doctemplateid
        in: path
        description: Id of the document template
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The API will return the 200 response code without any message
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling API endpoint with the wrong method)
        '500':
          description: Internal server error
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
