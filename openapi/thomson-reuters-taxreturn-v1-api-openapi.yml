      value:
        fieldsResponse:
        - groupField: null
          fields:
          - fieldId: RS.ENTITYNAME
            value: Thomson Reuters
            override: true
            responseStatus: null
          - fieldId: BASEIN
            value: 12-1234567
            override: true
            responseStatus: null
    1065-all-activity-number-retrieve-master-group-request:
      value:
        fieldsRequest:
        - groupField: null
          fields:
          - fieldId: ORAP20A01
