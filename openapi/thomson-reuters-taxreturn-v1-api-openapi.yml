          - fieldId: ORAP20A01
            isGroup: true
          - fieldId: FRMNO
            isGroup: true
          - fieldId: PTESET
            isGroup: true
          - fieldId: MTBSET
            isGroup: true
          - fieldId: DPLSETNUM
