            child: null
          fields:
          - fieldId: SK1.ACTNAME
            value: K1 PASS 1
          - fieldId: SK1.ACTTYPE
            value: C
    1040-add-business-expenses-master-group-request:
      value:
        fieldsRequest:
        - groupField:
            fieldId: CAR.PROPNUMBER
            value: '123'
            child: null
          fields:
          - fieldId: FED.F2106
            value: PS2
    1040-all-activity-number-retrieve-master-group-request:
      value:
        fieldsRequest:
