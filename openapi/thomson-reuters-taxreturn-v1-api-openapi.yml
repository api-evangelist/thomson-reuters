openapi: 3.2.0
info:
  title: GoSystem Tax Return TaxReturn (V1) API
  description: This API exposes features for working with GoSystem Tax Returns.
  version: beta
servers:
- url: https://api.thomsonreuters.com/gosystem/tax-returns
security:
- Authorization: []
tags:
- name: TaxReturn (V1)
paths:
  /v1/save-fields:
    post:
      tags:
      - TaxReturn (V1)
      summary: Save one or more field values in an open tax return
      description: This endpoint saves one or more field values in an open tax return. You must open the tax return by calling the open endpoint before calling this endpoint.
      parameters:
      - name: authToken
        in: header
        required: true
        description: Returned from open tax return call
        schema:
          type:
          - string
          - 'null'
      - name: taxReturnSessionToken
        in: header
        required: true
        description: Returned from open tax return call
        schema:
          type:
          - string
          - 'null'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFieldsRequestDTO'
            examples:
              save-fields-request-simple-v1:
                $ref: '#/components/examples/save-fields-request-simple-v1'
              save-fields-request-group-v1:
                $ref: '#/components/examples/save-fields-request-group-v1'
              1120-add-rental-ordinary-master-group-request-v1:
                $ref: '#/components/examples/1120-add-rental-ordinary-master-group-request'
              1120-add-rental-other-master-group-request-v1:
                $ref: '#/components/examples/1120-add-rental-other-master-group-request'
              1120-add-K1-pass-through-ordinary-master-group-request-v1:
                $ref: '#/components/examples/1120-add-K1-pass-through-ordinary-master-group-request'
              1120-add-K1-pass-through-others-master-group-request-v1:
                $ref: '#/components/examples/1120-add-K1-pass-through-others-master-group-request'
              1120-add-form-master-group-request-v1:
                $ref: '#/components/examples/1120-add-form-master-group-request'
              1065-other-rental-master-group-request:
                $ref: '#/components/examples/1065-other-rental-master-group-request'
              1065-other-expense-under-rental-master-group-request-v1:
                $ref: '#/components/examples/1065-other-expense-under-rental-master-group-request-v1'
              1040-add-schedule-K1-partnership-master-group-request-v1:
                $ref: '#/components/examples/1040-add-schedule-K1-partnership-master-group-request'
              1040-add-schedule-K1-estate-trust-master-group-request-v1:
                $ref: '#/components/examples/1040-add-schedule-K1-estate-trust-master-group-request'
              1040-add-schedule-K1-S-corporation-master-group-request-v1:
                $ref: '#/components/examples/1040-add-schedule-K1-S-corporation-master-group-request'
              1040-add-schedule-K1-PTP-master-group-request-v1:
                $ref: '#/components/examples/1040-add-schedule-K1-PTP-master-group-request'
              1040-add-schedule-C-master-group-request-v1:
                $ref: '#/components/examples/1040-add-schedule-C-master-group-request'
              1040-add-business-expenses-master-group-request-v1:
                $ref: '#/components/examples/1040-add-business-expenses-master-group-request'
              1040-add-consolidated-1099-master-group-request-v1:
                $ref: '#/components/examples/1040-add-consolidated-1099-master-group-request'
              1040-add-schedule-E-master-group-request-v1:
                $ref: '#/components/examples/1040-add-schedule-E-master-group-request'
              1040-add-schedule-F-rental-master-group-request-v1:
                $ref: '#/components/examples/1040-add-schedule-F-rental-master-group-request'
              1040-add-schedule-F-master-group-request-v1:
                $ref: '#/components/examples/1040-add-schedule-F-master-group-request'
              1040-add-wages-request-v1:
                $ref: '#/components/examples/1040-add-wages-request-v1'
              1040-save-grid-tables-v1:
                $ref: '#/components/examples/1040-save-grid-tables-v1'
              1041-add-form-1099-INT-request-v1:
                $ref: '#/components/examples/1041-add-form-1099-INT-request-v1'
              990-add-compensation-of-officer-form-990-request-v1:
                $ref: '#/components/examples/990-add-compensation-of-officer-form-990-request-v1'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveFieldsResponseDTOV1'
              examples:
                save-fields-success-v1:
                  $ref: '#/components/examples/save-fields-response-success-v1'
        '207':
          description: Multi Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveFieldsResponseDTOV1'
              examples:
                save-fields-response-validation-failure-simple-v1:
                  $ref: '#/components/examples/save-fields-response-validation-failure-simple-v1'
                save-fields-response-validation-failure-group-v1:
                  $ref: '#/components/examples/save-fields-response-validation-failure-group-v1'
        '400':
          description: Bad Request - Invalid input parameters or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                BadRequest:
                  summary: Bad Request
                  value:
                    responseType: BadRequest
                    statusCode: '400'
                    message: Bad Request
                    fieldErrors: []
        '401':
          description: Unauthorized - Missing or invalid authentication
        '403':
          description: Forbidden - Valid authentication but insufficient permissions to access the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                Forbidden_ReadOnlyTaxReturn_SaveFields:
                  summary: Read-only tax return
                  value:
                    responseType: Forbidden
                    statusCode: '403'
                    message: Read Only TaxReturn
                    fieldErrors: []
        '500':
          description: Internal Server Error - Server-side errors during tax return processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                InternalServerError_GenericError_SaveFields:
                  summary: Generic server error
                  value:
                    responseType: InternalServerError
                    statusCode: '500'
                    message: Something went wrong. Please connect support team.
                    fieldErrors: []
        '503':
          description: Service Unavailable - Dependent services are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                ServiceUnavailable:
                  summary: Service unavailable
                  value:
                    responseType: ServiceUnavailable
                    statusCode: '503'
                    message: Service unavailable
                    fieldErrors: []
                ServiceUnavailable_TaxReturn_Busy:
                  summary: Tax return is busy
                  value:
                    responseType: Bad Request
                    statusCode: '400'
                    message: TaxReturn is busy
                    fieldErrors: []
      operationId: postV1SaveFields
      x-operation-id-source: derived
  /v1/retrieve-fields:
    post:
      tags:
      - TaxReturn (V1)
      summary: Retrieve one or more field values from an open tax return
      description: This endpoint retrieves one or more field values from an open tax return. You must open the tax return by calling the open endpoint before calling this endpoint.
      parameters:
      - name: authToken
        in: header
        required: true
        description: Returned from open tax return call
        schema:
          type:
          - string
          - 'null'
      - name: taxReturnSessionToken
        in: header
        required: true
        description: Returned from open tax return call
        schema:
          type:
          - string
          - 'null'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveFieldsRequestDTO'
            examples:
              retrieve-fields-request-simple-v1:
                $ref: '#/components/examples/retrieve-fields-request-simple'
              retrieve-fields-request-group-v1:
                $ref: '#/components/examples/retrieve-fields-request-group-v1'
              1120-rental-activity-number-retrieve-fields-master-group-request-v1:
                $ref: '#/components/examples/1120-rental-activity-number-retrieve-fields-master-group-request'
              1065-rental-activity-number-retrieve-fields-master-group-request-v1:
                $ref: '#/components/examples/1065-rental-activity-number-retrieve-fields-master-group-request'
              1040-retrieve-fields-request-simple-v1:
                $ref: '#/components/examples/1040-retrieve-fields-request-simple'
              1040-retrieve-fields-request-group-v1:
                $ref: '#/components/examples/1040-retrieve-fields-request-group'
              1040-schedule-C-activity-number-retrieve-fields-master-group-request-v1:
                $ref: '#/components/examples/1040-schedule-C-activity-number-retrieve-fields-master-group-request'
              retrieve-1120-all-activity-number-master-group-request-v1:
                $ref: '#/components/examples/1120-all-activity-number-retrieve-master-group-request'
              retrieve-1065-all-activity-number-master-group-request-v1:
                $ref: '#/components/examples/1065-all-activity-number-retrieve-master-group-request'
              retrieve-1040-all-activity-number-master-group-request-v1:
                $ref: '#/components/examples/1040-all-activity-number-retrieve-master-group-request'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveFieldsResponseDTOV1'
              examples:
                retrieve-fields-response-simple-v1:
                  $ref: '#/components/examples/retrieve-fields-response-simple-v1'
                retrieve-fields-response-group-v1:
                  $ref: '#/components/examples/retrieve-fields-response-group-v1'
        '207':
          description: Multi Status - Partial success, some fields retrieved successfully while others may have failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveFieldsResponseDTOV1'
              examples:
                PartialSuccess_RetrieveFields_V1:
                  summary: Partial success with field errors
                  value:
                    fieldsResponse:
                    - groupField: null
                      fields:
                      - fieldId: RS.ENTITYNAME
                        value: Thomson Reuters
                        isGroup: false
                        override: true
                        responseStatus: null
                      - fieldId: BASEIN
                        value: 12-1234567
                        isGroup: false
                        override: true
                        responseStatus:
                          isSuccess: false
                          code: '500'
                          message: '500'
        '400':
          description: Bad Request - Invalid input parameters or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                BadRequest:
                  summary: Bad Request
                  value:
                    responseType: BadRequest
                    statusCode: '400'
                    message: Bad Request
                    fieldErrors: []
        '406':
          description: Not Acceptable - Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                ValidationFailure_RetrieveFields:
                  summary: Validation Failure
                  value:
                    responseType: ValidationFailure
                    statusCode: '400'
                    message: Validation Failure
                    fieldErrors: []
        '500':
          description: Internal Server Error - Server-side errors during tax return processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                InternalServerError_RetrieveFields:
                  summary: Unable to open tax return
                  value:
                    responseType: Failure
                    statusCode: '500'
                    message: Unable to open Tax Return, please try again later or contact support team
                    fieldErrors: []
        '503':
          description: Service Unavailable - Dependent services are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                ServiceUnavailable:
                  summary: Service unavailable
                  value:
                    responseType: ServiceUnavailable
                    statusCode: '503'
                    message: Service unavailable
                    fieldErrors: []
      operationId: postV1RetrieveFields
      x-operation-id-source: derived
  /v1/jurisdiction-details:
    post:
      tags:
      - TaxReturn (V1)
      summary: Generate the list of active jurisdictions and their e-file data
      description: This endpoint generates the list of active jurisdictions and their e-file data for a given tax year and locator.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenTaxReturnRequestDto'
            examples:
              2024-jurisdiction-details-request:
                $ref: '#/components/examples/2024-jurisdiction-details-request'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileSummary'
              examples:
                jurisdiction-details-All-States-Active-success-response:
                  $ref: '#/components/examples/jurisdiction-details-partial-success-response'
        '400':
          description: Bad Request - Invalid input parameters, validation errors, or business logic failures
          content:
            application/json:
              examples:
                validation-error-missing-required-fields:
                  summary: Missing required fields validation error
                  value:
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                    title: One or more validation errors occurred.
                    status: 400
                    errors:
                      Account:
                      - The Account field is required.
                      TaxYear:
                      - The TaxYear field is required.
                    traceId: 00-11c19133aa9dccd8fbb39793fe435ced-82c168f58fe8659e-00
                invalid-tax-return-or-year:
                  summary: Invalid tax return id or tax year
                  value:
                    statusCode: '400'
                    message: Invalid tax return id or tax year
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error - Unexpected server error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                unknown-error:
                  value:
                    statusCode: '500'
                    message: Unknown Error occured
      operationId: postV1JurisdictionDetails
      x-operation-id-source: derived
components:
  schemas:
    EFileJurisdiction:
      type:
      - object
      - 'null'
      properties:
        name:
          type:
          - string
          - 'null'
        jurisdiction:
          type:
          - string
          - 'null'
        returnType:
          type:
          - string
          - 'null'
        eFileRequestType:
          type:
          - string
          - 'null'
        paperFile:
          type:
          - string
          - 'null'
    FieldsRequestDTO:
      type:
      - object
      - 'null'
      properties:
        groupField:
          $ref: '#/components/schemas/GroupData'
        fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldData'
    SaveFieldsResponseDTOV1:
      type:
      - object
      - 'null'
      properties:
        fieldsResponse:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldsResponseDTOV1'
    RetrieveFieldsRequestDTO:
      type:
      - object
      - 'null'
      properties:
        fieldsRequest:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldsRequestDTO'
    GroupData:
      type:
      - object
      - 'null'
      properties:
        index:
          type: integer
          format: int32
        fieldId:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
          description: Value or Activity Number of the Group, that uniquely identify the group/master group parent.
        child:
          $ref: '#/components/schemas/GroupData'
        responseStatus:
          $ref: '#/components/schemas/FieldResponse'
    OpenTaxReturnRequestDto:
      required:
      - account
      - taxReturnId
      - taxYear
      type:
      - object
      - 'null'
      properties:
        account:
          type: string
        taxYear:
          type: string
        taxReturnId:
          type: string
        password:
          type: string
    FieldData:
      type:
      - object
      - 'null'
      properties:
        fieldId:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
          description: Value of the field. This value must be unique when Master Group data is added.
        isGroup:
          type: boolean
        responseStatus:
          $ref: '#/components/schemas/FieldResponse'
    EFileSummary:
      type:
      - object
      - 'null'
      properties:
        taxType:
          type:
          - string
          - 'null'
        eFiles:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EFileJurisdiction'
    RetrieveFieldsResponseDTOV1:
      type:
      - object
      - 'null'
      properties:
        fieldsResponse:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldsResponseDTOV1'
    ProblemResponseDTO:
      type:
      - object
      - 'null'
      properties:
        responseType:
          type:
          - string
          - 'null'
        statusCode:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        fieldErrors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldError'
    SaveFieldsRequestDTO:
      type:
      - object
      - 'null'
      properties:
        fieldsRequest:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldsRequestDTO'
    FieldResponse:
      type:
      - object
      - 'null'
      properties:
        isSuccess:
          type: boolean
        code:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        messageVariables:
          type:
          - array
          - 'null'
          items:
            type:
            - string
            - 'null'
    FieldError:
      type:
      - object
      - 'null'
      properties:
        fieldId:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        errorCode:
          type:
          - string
          - 'null'
    FieldsResponseDTOV1:
      type:
      - object
      - 'null'
      properties:
        groupField:
          $ref: '#/components/schemas/GroupData'
        fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldDataV1'
    FieldDataV1:
      type:
      - object
      - 'null'
      properties:
        fieldId:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
          description: Value of the field. This value must be unique when Master Group data is added.
        isGroup:
          type: boolean
        override:
          type: boolean
          default: true
          description: Indicates whether the field value can be overridden.
        responseStatus:
          $ref: '#/components/schemas/FieldResponse'
  examples:
    1040-schedule-C-activity-number-retrieve-fields-master-group-request:
      value:
        fieldsRequest:
        - groupField: null
          fields:
          - fieldId: BUS.PROPNUMBER
            isGroup: true
    1040-add-schedule-C-master-group-request:
      value:
        fieldsRequest:
        - groupField:
            fieldId: BUS.PROPNUMBER
            value: '12'
            child: null
          fields:
          - fieldId: BUS.BUSNAME
            value: PS2
          - fieldId: BUS.EMPLIDENTNO
            value: 12-1234567
    1040-retrieve-fields-request-simple:
      value:
        fieldsRequest:
        - groupField: null
          fields:
          - fieldId: FED.ULTRT
          - fieldId: FED.ULTACT
    1041-add-form-1099-INT-request-v1:
      value:
        fieldsRequest:
        - groupField:
            index: 0
            fieldId: INT.PAYRNAME
            value: NewForm
          fields:
          - fieldId: INT.RECNAME
            value: TaxpayerName
    jurisdiction-details-partial-success-response:
      value:
        taxType: '1065'
        eFiles:
        - name: Maryland
          jurisdiction: MD
          returnType: Regular
          eFileRequestType: REG
          paperFile: 'true'
        - name: Maryland Extension
          jurisdiction: MD
          returnType: Extension
          eFileRequestType: EXT
          paperFile: 'false'
    retrieve-fields-request-simple:
      value:
        fieldsRequest:
        - groupField: null
          fields:
          - fieldId: RS.ENTITYNAME
          - fieldId: BASEIN
    1040-add-consolidated-1099-master-group-request:
      value:
        fieldsRequest:
        - groupField:
            fieldId: INT.ACTNUMBER
            value: '1'
            child: null
          fields:
          - fieldId: INT.PAYERBR
            value: PS2
    save-fields-response-success-v1:
      value:
        fieldsResponse: null
