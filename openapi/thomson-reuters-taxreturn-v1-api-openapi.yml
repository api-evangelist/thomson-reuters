      value:
        fieldsRequest:
        - groupField:
            index: 0
            fieldId: FOR.NAME2
            child: null
          fields:
          - fieldId: FOR.PERCENT
          - fieldId: X178.1576.3
    1040-add-schedule-K1-S-corporation-master-group-request:
      value:
        fieldsRequest:
        - groupField:
            fieldId: SK1.PROP
            value: '1'
            child: null
          fields:
          - fieldId: SK1.ID
            value: '2'
          - fieldId: SK1.NAME
            value: ps32
          - fieldId: SK1.TYPEK1
            value: C
    1120-add-K1-pass-through-others-master-group-request:
      value:
        fieldsRequest:
        - groupField:
            fieldId: SK1.SET2
