      value:
        fieldsRequest:
        - groupField:
            index: 0
            fieldId: SLS.PY1231TSJ
            value: J
          fields:
          - fieldId: SLS.PY31ONE
            isGroup: true
          - fieldId: SLS.PY31TWO
            isGroup: true
    1040-add-schedule-F-master-group-request:
      value:
        fieldsRequest:
