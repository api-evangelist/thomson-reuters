openapi: 3.2.0
info:
  title: Thomson Reuters Folders API
  version: '1.4'
  contact:
    name: devportal
  description: 'Operations tagged Folders across 2 of this provider''s published API definitions: thomson-reuters-document-management-api-1-4-openapi.json, thomson-reuters-document-management-api-1-4-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.thomsonreuters.com/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.co.uk/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.ca/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.com.au/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.de/legal-tracker/documents-api/v1
- url: https://api.thomsonreuters.ae/legal-tracker/documents-api/v1
security:
- OAuth2: []
- Token: []
tags:
- name: Folders
  description: Use the Folders endpoint to get information about folders that are used to organize documents.
paths:
  /folders:
    get:
      tags:
      - Folders
      summary: Retrieve all folder information for the current company
      operationId: Folders_GetAll
      parameters:
      - name: $top
        in: query
        description: Show only the first n items, see [Paging - Top](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptiontop)
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          default: 50
        example: 50
      - name: $skip
        in: query
        description: Skip the first n items, see [Paging - Skip](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionskip)
        schema:
          minimum: 0
          type: integer
          default: 0
        example: 0
      - name: $filter
        in: query
        description: Filter items by property values, see [Filtering](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionfilter)<br /><br /><i>Available operations:</i> eq, ne, gt, ge, lt, le, in, and, or, not<br /><i>Available functions:</i> contains, startswith, endswith, indexof<br /><i>Available properties:</i> id, name, active
        schema:
          type:
          - string
          - 'null'
        example: id eq 111222
      - name: $select
        in: query
        description: Select properties to be returned, see [Select](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionselect)
        schema:
          uniqueItems: true
          type: array
          items:
            enum:
            - id
            - name
            - active
            type: string
      - name: $orderby
        in: query
        description: Order items by property values, see [Sorting](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionorderby)
        schema:
          uniqueItems: true
          type: array
          items:
            enum:
            - id
            - name
            - active
            - id desc
            - name desc
            - active desc
            type: string
      - name: $count
        in: query
        description: Include count of items, see [Count](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptioncount)
        schema:
          type: integer
      responses:
        '200':
          description: Returns all folders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderCollection'
        '400':
          description: If the OData filter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: If the user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: If the current user is not authorized to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: If a server error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://api.thomsonreuters.com/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.co.uk/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.ca/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.com.au/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.de/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.ae/legal-tracker/documents-api/v1
  /folders/{id}:
    get:
      tags:
      - Folders
      summary: Look up and retrieve a folder by the provided identifier
      operationId: Folders_GetOne
      parameters:
      - name: id
        in: path
        description: Represents an identifier of a folder.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Returns a folder with the specified identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderModel'
        '400':
          description: If an identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: If the user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: If current user is not authorized to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: If a folder is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: If a server error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://api.thomsonreuters.com/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.co.uk/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.ca/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.com.au/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.de/legal-tracker/documents-api/v1
    - url: https://api.thomsonreuters.ae/legal-tracker/documents-api/v1
components:
  schemas:
    FolderCollection:
      type: object
      properties:
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FolderModel'
      additionalProperties: false
    FolderModel:
      required:
      - id
      type: object
      properties:
        id:
          type: integer
          description: The identifier for the Folder record.
          format: int32
        name:
          type:
          - string
          - 'null'
          description: The name of the Folder.
        active:
          type: boolean
          description: The current active state of the Folder.
      additionalProperties: false
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
    Error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              target:
                type: string
        innerError:
          required:
          - code
          - message
          type: object
          properties:
            code:
              type: string
            message:
              type: string
      additionalProperties: false
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.thomsonreuters.com/onepass/oauth2/token?grant_type=client_credentials
          scopes: {}
    Token:
      type: http
      description: Access token (TR Account)
      scheme: bearer
