openapi: 3.2.0
info:
  title: Thomson Reuters Authorization API
  version: 1.0.0
  description: 'Operations tagged Authorization across 2 of this provider''s published API definitions: thomson-reuters-authorize-openapi.json, thomson-reuters-authorize-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.thomsonreuters.com/gosystem
tags:
- name: Authorization
paths:
  /oauth2/v1/auth-code:
    post:
      summary: Generate authorization code V1
      description: 'This endpoint generates a one-time use authorization code that''s used in the code parameter of the oauth2/v1/token endpoint. The authorization code expires after 60 seconds.


        Parameters for this endpoint are client_id, login_id, firm, center, state, and api_token. The login_id, firm, and center are your GoSystem sign-in details. The api_token should be retrieved by signing in to GoSystem and going to Options (on the right) > API Token menu.'
      tags:
      - Authorization
      responses:
        '200':
          description: Success. The auth code is generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCodeResponse'
        '400':
          description: Error verifying user or error verifying token.
        '401':
          description: 'Types of error in message:

            invalid_client_id - missing or invalid

            invalid_grant_type - missing or invalid

            invalid_scope - missing, invalid, or improperly formed

            invalid_client_assertion - missing, invalid, or improperly formed

            invalid_client_assertion_type - missing or invalid'
        '404':
          description: invalid_api_uri - the URI provided isn't valid.
        '429':
          description: rate_limit_exceed - the rate limit for your application/company has been met.
        '500':
          description: error_api_gateway - an error occurred in Apigee (for example, company might be missing custom attributes).
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  default: wrrAGpAG6yjvKXhVfpF7ngxA5QxNYzHU
                  description: The Client ID (also called Consumer Key) is a unique identifier for your application that's used to authenticate API requests. You can find it in the Thomson Reuters Developer Portal under GoSystem API > My Keys by selecting the eye icon next to your application.
                login_id:
                  type: string
                  default: QAAUTOMATION21
                  description: GoSystem sign-in ID of the user.
                firm:
                  type: string
                  default: 2WF5
                  description: Firm name associated with the request.
                center:
                  type: string
                  default: '***'
                  description: Location of the user.
                state:
                  type: string
                  default: abc
                  description: State code for the request. This is a random unique identifier.
                api_token:
                  type: string
                  default: 293A83913F8B99B13CE64A263365BCE918BA8C785160B88BBA8A1C3B28472DE59447D85CD7794406A2C4CE0261355DCAC6324E6B62EB59803F5F144A274A25B0CAF6E9AC9A
                  description: You can retrieve the token by signing in to GoSystem Tax > Options > API Token in the application interface.
              required:
              - client_id
              - login_id
              - firm
              - center
              - state
              - api_token
      operationId: postOauth2V1AuthCode
      x-operation-id-source: derived
    servers:
    - url: https://api.thomsonreuters.com/gosystem
  /oauth2/v1/token:
    post:
      summary: Get access token V1
      description: 'This endpoint verifies and authenticates your organization and application entitlements, permissions, and validity when calling GoSystem APIs.


        The authorization code grant (3-legged OAuth) requires client_id, scope, grant_type, code, and client_secret. The client_secret should be retrieved from the developer portal keys. The code will be returned from the authorize call. The code expires after 60 seconds.


        Access tokens (also known as bearer tokens) are inserted in the Authorization parameter. Tokens expire after 60 minutes and must be regenerated to continue calling APIs.'
      tags:
      - Authorization
      parameters:
      - name: Content-Type
        in: header
        description: 'application/json: Specifies that the request body is formatted in JSON.'
        schema:
          type: string
          default: application/x-www-form-urlencoded
      responses:
        '200':
          description: Success. An access token is generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResponseV1'
        '401':
          description: 'Types of error in message:

            invalid_client_id - missing or invalid

            invalid_grant_type - missing or invalid

            invalid_scope - missing, invalid, or improperly formed

            invalid_client_assertion - missing, invalid, or improperly formed

            invalid_client_assertion_type - missing or invalid'
        '402':
          description: 'Types of error in message:

            unauthorized_token - client assertion is expired, improper issued_at, or issuer doesn''t have access. Additionally, the issuer might not match public key on file


            unauthorized_client_id - Client ID has been revoked or expired

            unauthorized_client_secret - Client Secret provided doesn''t match the one on file

            unauthorized_auth_code - authcode is empty, missing, invalid, or expired

            access_token_expired - the access token provided has expired or been revoked'
        '404':
          description: invalid_api_uri - the URI provided isn't valid.
        '429':
          description: rate_limit_exceed - the rate limit for your application/company has been met.
        '500':
          description: error_api_gateway - an error occurred in Apigee (for example, company might be missing custom attributes).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
        description: Bearer <token> (Token returned from the Get Security Token call.)
        required: true
      operationId: postOauth2V1Token
      x-operation-id-source: derived
    servers:
    - url: https://api.thomsonreuters.com/gosystem
  /oauth2/v1/refresh:
    post:
      summary: Refresh access token V1
      description: 'The access token is short lived. It''ll expire after 60 minutes. This endpoint refreshes your access token with the help of the refresh token.


        The refresh token endpoint requires client_id and client_secret to be sent in the basic authorization header. The client_id and client_secret should be retrieved from the developer portal keys. The grant_type needs to be passed as refresh_token, and a valid refresh token received from the /oauth2/v1/token call needs to be passed as refresh_token. The refresh token expires after 24 hours.'
      tags:
      - Authorization
      parameters:
      - name: Authorization
        in: header
        description: Bearer <token> (Token returned from the Get Security Token call.)
        required: true
        schema:
          type: string
          default: Basic {{ base64 encoded client id:client secret }}
      responses:
        '200':
          description: Success. An access token is generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResponseV1'
        '401':
          description: 'Types of error in message:

            invalid_client_id - missing or invalid client_id'
        '404':
          description: invalid_api_uri - the URI provided isn't valid.
        '429':
          description: rate_limit_exceed - the rate limit for your application/company has been met.
        '500':
          description: error_api_gateway - an error occurred in Apigee (for example, company might be missing custom attributes).
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  default: refresh_token
                  description: authorization_code
                refresh_token:
                  type: string
                  default: wx0zRxm0530a4BCWKSFhGvnF8fA2sf8M
                  description: refresh_token value.
              required:
              - grant_type
              - refresh_token
      operationId: postOauth2V1Refresh
      x-operation-id-source: derived
    servers:
    - url: https://api.thomsonreuters.com/gosystem
