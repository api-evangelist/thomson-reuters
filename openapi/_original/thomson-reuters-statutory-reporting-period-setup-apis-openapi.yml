components:
  schemas:
    Account:
      description: Represents an individual account. Accounts are identified by a unique code and name, and can have specific rounding behaviors.
      required:
      - code
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the account.
        code:
          minLength: 1
          type: string
          description: A unique, user-defined code for the account. Must be at least 1 character long.
        name:
          minLength: 1
          type: string
          description: The human-readable name of the account. Must be at least 1 character long.
        roundIndependently:
          type: boolean
          description: Indicates whether this account's calculations should be rounded independently of other accounts.
        lastModified:
          type: string
          format: date-time
          description: The date and time when the account was last modified.
      additionalProperties: false
      example:
      - id: 40ff5a72-c6b2-11f0-a08a-0e0af77c40c5
        code: Rounding differences
        name: Rounding differences (suggested assignment creditors)
        roundIndependently: false
        lastModified: '2025-11-20T09:35:56'
      - id: 410032f8-c6b2-11f0-a08b-0e0af77c40c5
        code: suspense
        name: suspense
        roundIndependently: false
        lastModified: '2025-11-20T09:35:56'
      - id: 410066c4-c6b2-11f0-a08c-0e0af77c40c5
        code: A1
