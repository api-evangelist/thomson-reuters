      required:
      - code
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the account, typically used when updating an existing account.
        code:
          minLength: 1
          type: string
          description: A unique code defined by the user for the account. The code must be at least one character long and cannot be changed once created.
        name:
          minLength: 1
          type: string
          description: The human-readable name of the account. Must be at least 1 character long.
        roundIndependently:
          type: boolean
          description: Specifies whether this account's calculations should be rounded independently.
      additionalProperties: false
      example:
      - id: 011f4738-2798-4ea5-8d78-b3a900806aa2
        code: ACC1
        name: ACC1
        roundIndependently: true
    AccountsResult:
      description: A generic container for the result of an accounts operation.
      type: object
      additionalProperties: false
    AccountCreateRequest:
      description: Defines the structure for creating a new account. Requires a unique code and a descriptive name.
      required:
      - code
      - name
      type: object
      properties:
        code:
          minLength: 1
          type: string
          description: A unique code defined by the user for the account. The code must be at least one character long and cannot be changed once created.
        name:
          minLength: 1
          type: string
          description: The human-readable name for the new account. Must be at least 1 character long.
        roundIndependently:
          type: boolean
          description: Specifies whether this new account's calculations should be rounded independently.
      additionalProperties: false
      example:
      - code: ACC4
        name: ACC4
        roundIndependently: true
      - code: ACC3
        name: ACC3
        roundIndependently: true
      - code: ACC2
        name: ACC2
        roundIndependently: true
      - code: ACC1
        name: ACC1
        roundIndependently: true
    ErrorResponse:
      type: object
      description: Standard error response object containing HTTP status code and a descriptive message.
      properties:
        StatusCode:
          type: integer
          format: int32
          description: HTTP status code of the error (for example, 400, 404, 500).
          minimum: 100
          maximum: 599
        Message:
          type: string
          nullable: true
          description: A human-readable message providing details about the error.
          minLength: 1
          maxLength: 512
      additionalProperties: false
      example:
        StatusCode: 400
        Message: Invalid request parameters.
    Currency:
      type: object
      description: Represents a currency with its identifier, name, and associated date information.
      properties:
        currencyId:
          type: string
          format: uuid
          description: Unique identifier for the currency.
        currencyName:
          type: string
          nullable: true
          description: Official name of the currency (e.g., 'US Dollar', 'Euro').
        dates:
          type: array
          items:
            type: string
            format: date-time
          nullable: true
          description: A list of relevant dates associated with the currency, such as effective dates or historical periods.
      additionalProperties: false
    RootCategoriesData:
      type: object
      description: Container for a list of root categories and their total count.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDescendants'
          nullable: true
          description: Array of root category objects.
        count:
          type: integer
          format: int32
          description: Total number of root categories.
      additionalProperties: false
    CategoryDescendants:
      type: object
      description: Represents a category, potentially with its descendant information.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the category.
        name:
          type: string
          nullable: true
          description: Display name of the category.
        code:
          type: string
          nullable: true
          description: Unique short code for the category.
        secondaryCategoryCode:
          type: string
          nullable: true
          description: An optional secondary code for the category.
        lastModified:
          type: string
          format: date-time
          description: Timestamp of the last modification.
        parentCategoryId:
          type: string
          format: uuid
          nullable: true
          description: ID of the parent category, if applicable. Null for root categories.
        level:
          type: integer
          format: int32
          description: Hierarchical level of the category.
      additionalProperties: false
    Assignments:
      type: object
      description: Represents a collection of assignments, typically including a list of individual assignment elements and their total count.
      properties:
        items:
          type: array
          description: A list of individual assignment elements.
          items:
            $ref: '#/components/schemas/AssignmentElement'
          nullable: true
        count:
          type: integer
          format: int32
          description: The total number of assignment elements in the collection.
          example: 2
      additionalProperties: false
      example:
        items:
        - categoryCode: EXP
          categoryName: Expenses
          accounts:
          - code: ACC001
            name: Rent Expense
            assignmentType: Direct
          - code: ACC002
            name: Utilities Expense
            assignmentType: Direct
        - categoryCode: REV
          categoryName: Revenue
          accounts:
          - code: ACC003
            name: Sales Revenue
            assignmentType: Direct
        count: 2
    AssignmentElement:
      type: object
      description: Represents a single assignment, linking a category to a set of accounts.
      properties:
        categoryCode:
          type: string
          nullable: true
          description: A unique code for the category.
          example: EXP
        categoryName:
          type: string
          nullable: true
          description: The human-readable name of the category.
          example: Expenses
        accounts:
          type: array
          description: A list of accounts assigned to this category.
          items:
            $ref: '#/components/schemas/AccountAssigned'
          nullable: true
      additionalProperties: false
      example:
        categoryCode: EXP
        categoryName: Expenses
        accounts:
        - code: ACC001
          name: Rent Expense
          assignmentType: Direct
        - code: ACC002
          name: Utilities Expense
          assignmentType: Direct
    AccountAssigned:
      type: object
      description: Represents an account that has been assigned to a category.
      properties:
        code:
          type: string
          nullable: true
          description: The unique code of the assigned account.
          example: ACC001
        name:
          type: string
          nullable: true
          description: The human-readable name of the assigned account.
          example: Rent Expense
        assignmentType:
          type: string
          nullable: true
          description: The type of assignment for this account (e.g., 'Direct', 'Indirect').
          example: Direct
      additionalProperties: false
      example:
        code: ACC001
        name: Rent Expense
        assignmentType: Direct
    CurrencyLink:
      type: object
      description: Represents an account that has been assigned to a category.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the currency link.
        entityId:
          type: string
          format: uuid
          description: Unique identifier for the entity.
        entityCode:
          type: string
          nullable: true
          description: Unique code for Entity.
        currencyId:
          type: string
          format: uuid
          description: Unique identifier for the currency. Refer to 'Currencies' API to get more details.
        conversionAccountId:
          type: string
          format: uuid
      additionalProperties: false
