openapi: 3.1.0
info:
  title: Statutory Reporting Period Setup APIs
  version: v1
  description: 'The Statutory Reporting Period Setup APIs v1 provide endpoints to support statutory reporting and financial period management:


    - Manage accounts within specific financial periods, including creation, update, deletion, and retrieval.

    - Retrieve currencies and their entries for statutory reporting.

    - Retrieve categories and their entries for statutory reporting.

    - Retrieve assignments and their entries for statutory reporting.

    - Retrieve all currency links associated with a specific financial period.'
  contact:
    name: API Support
    url: https://www.onesourcetax.com/support
    email: api-support@onesourcetax.com
  license:
    name: Proprietary License
    url: https://www.onesourcetax.com/licenses/proprietary
servers:
- url: https://api.onesourcetax.com/statutory-reporting/v1/reporting-entities/
  description: Production server providing global access to reporting entities
- url: https://api.onesourcetax.com/statutory-reporting/v1/template-entities/
  description: Production server providing global access to template entities
- url: https://api-emea.onesourcetax.com/statutory-reporting/v1/reporting-entities/
  description: Production server for reporting entities supporting the EMEA region
- url: https://api-emea.onesourcetax.com/statutory-reporting/v1/template-entities/
  description: Production server for template entities supporting the EMEA region.
- url: https://api-apac.onesourcetax.com/statutory-reporting/v1/reporting-entities/
  description: Production server for reporting entities supporting the APAC region.
- url: https://api-apac.onesourcetax.com/statutory-reporting/v1/template-entities/
  description: Production server for template entities supporting the APAC region.
tags:
- name: Accounts
  description: Provides endpoints to create, update, delete, and retrieve accounts associated with specific financial periods.
- name: Currencies
  description: Currencies endpoints for statutory reporting. Retrieve currencies and their entries.
- name: Categories
  description: Categories endpoints for statutory reporting. Retrieve categories and their entries.
- name: Assignments
  description: Assignments endpoints for statutory reporting. Retrieves master account assignments for a category structure in a financial period.
- name: Currency-Links
  description: Retrieve all currency links within a specified financial period.
paths:
