components:
  schemas:
    ApiCollectionCollectionItem:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
        _meta:
          $ref: '#/components/schemas/ApiMeta'
    ApiMeta:
      type: object
      properties:
        count:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        sort:
          type: string
        filter:
          type: string
        extra:
          type: object
          additionalProperties:
            type: object
          writeOnly: true
    CollectionItem:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the collection.
          format: int32
          example: 6
        name:
          type: string
          description: Label of the collection.
          example: My Collection Name
        version:
          type: integer
          description: Version of the collection.
          format: int32
          example: 3
        year:
          type: integer
          description: Relevant year of importance for the data.
          format: int32
          example: 2019
        period:
          type: integer
          description: Numeric period of no specific precision.
          format: int32
          example: 12
    ApiCollectionCollectionDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionDTO'
        _meta:
          $ref: '#/components/schemas/ApiMeta'
    CollectionDTO:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the collection.
          format: int32
          example: 6
        name:
          type: string
          description: Label of the collection.
          example: My Collection Name
        version:
          type: integer
          description: Version of the collection.
          format: int32
          example: 3
        year:
          type: integer
          description: Relevant year of importance for the data.
          format: int32
          example: 2019
        period:
          type: integer
          description: Numeric period of no specific precision.
          format: int32
          example: 12
        columns:
          type: array
          items:
            $ref: '#/components/schemas/FieldsDTO'
    FieldsDTO:
      type: object
      properties:
        name:
          type: string
          description: Label of the column.
          example: My Column Name
        type:
          type: string
          description: Expected data type of the column values.
          example: number
          enum:
          - currency
          - date
          - number
          - string
        ontology_id:
          type: integer
          description: Unique identifier of the ontology this column represents.
          format: int32
          example: 1
    RecordDTO:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RecordField'
      example: {}
    RecordField:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
    ResultsDTO:
      type: object
      properties:
        items:
          type: array
          example: {}
          items:
            $ref: '#/components/schemas/RecordDTO'
        _meta:
          $ref: '#/components/schemas/ResultsMeta'
    ResultsMeta:
      type: object
      properties:
        offset:
          type: integer
          format: int32
        limit:
          maximum: 2000
          type: integer
          format: int32
          example: 200
        count:
          type: integer
          format: int64
    ResultsDownloadDTO:
      type: object
      properties:
        download_url:
          type: string
          description: URL to download the results.
          example: https://example.thomsonreuters.com/example.csv
    Meta:
      type: object
      properties:
        offset:
          type: integer
          format: int32
        limit:
          maximum: 2000
          type: integer
          format: int32
          example: 200
        count:
          type: integer
          format: int64
    RecordsDTO:
      type: object
      properties:
        items:
          type: array
          example:
          - blueprint_column_1_name: example value
            blueprint_column_2_name: something else
            blueprint_column_3_name: 42
          items:
            $ref: '#/components/schemas/RecordDTO'
        _meta:
          $ref: '#/components/schemas/Meta'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
