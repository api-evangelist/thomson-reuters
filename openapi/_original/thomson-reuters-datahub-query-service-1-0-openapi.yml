      summary: Get the presigned URL from S3 to download aggregated result from the specific version of the collection
      description: Returns the presigned URL from S3.
      operationId: getCollectionLatestVersionResultsdownload
      parameters:
      - name: id
        in: path
        description: Unique identifier of the collection.
        required: true
        schema:
