  /query/odata/collectionservice:
    get:
      description: Retrieves all the available, published collections along with all of its versions that are associated with OData. This API also includes all aggregations and all breakdowns for the corresponding collections.
      operationId: getOdataCollections
      parameters:
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OData default response.
      security:
      - bearerAuth: []
      summary: Get all the versions of collections along with aggregations and breakdowns
      tags:
      - OData Service  (adheres to OData 4.0)
  /query/odata/collectionservice/{collection-name}:
    get:
