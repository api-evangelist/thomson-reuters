openapi: 3.0.1
info:
  title: Datahub Query Service
  description: Allows for the retrieval of reconciled and/or aggregated datasets from published collections
  version: '1.0'
servers:
- url: https://api.onesourcetax.com/data-hub/v1
security:
- bearerAuth: []
paths:
  /query/collections:
    get:
      tags:
      - Query Service
      summary: Get a paginated list of published collections
      description: 'Returns a list of published collections with their metadata.<br /><br />Potential values for ontology: <br /><table><thead><tr><th>id</th><th>name</th></tr></thead><tbody><tr><td>1</td><td>financial-hierarchy-position</td></tr><tr><td>2</td><td>chart of accounts</td></tr><tr><td>3</td><td>entity</td></tr><tr><td>4</td><td>account</td></tr><tr><td>5</td><td>balance</td></tr></tbody></table>'
      operationId: getCollections
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Number of records in a collection to skip before starting the response set.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of records to return in the result set.
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionCollectionDTO'
      security:
      - bearerAuth: []
    post:
      tags:
      - Query Service
      summary: Query a paginated list of collections based on the query request body
      description: Returns a list of collections with their metadata.
      operationId: queryCollections
      parameters:
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      requestBody:
        description: Query paginated list of collection based on filter condition.
        content:
          application/json:
            schema:
              type: string
              example:
                filter:
                  eq:
                  - index[3]
                  - e123
      responses:
        '200':
          description: Collection query successful.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionCollectionItem'
  /query/collections/{id}:
    get:
      tags:
      - Query Service
      summary: Get a published collection by ID
      description: 'Returns collection metadata for the specified collection ID.<br /><br />Potential values for ontology: <br /><table><thead><tr><th>id</th><th>name</th></tr></thead><tbody><tr><td>1</td><td>financial-hierarchy-position</td></tr><tr><td>2</td><td>chart of accounts</td></tr><tr><td>3</td><td>entity</td></tr><tr><td>4</td><td>account</td></tr><tr><td>5</td><td>balance</td></tr></tbody></table>'
      operationId: getCollection
      parameters:
      - name: id
        in: path
        description: Unique identifier of the collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CollectionDTO'
      security:
      - bearerAuth: []
  /query/collections/{id}/versions/{version}/results:
    get:
      tags:
      - Query Service
      summary: Get the aggregated result from a specific version of the collection
      description: Returns the aggregated result from a list of records in a specific version of the collection as structured in the blueprints.
      operationId: getCollectionVersionResults
      parameters:
      - name: id
        in: path
        description: Unique identifier of the collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: version
        in: path
        description: Version of the collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: filter
        in: query
        description: Filter trial balance results to a specific financial hierarchy node. A filter is required when querying records from a trial balance collection.
        required: false
        schema:
          type: string
          default: ''
      - name: offset
        in: query
        description: Number of records in a collection to skip before starting the response set.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of records to return in the result set.
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
