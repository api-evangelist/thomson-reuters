# x-archived-from: thomson-reuters-onesource-e-invoicing-get-source-document-openapi.yml
# x-archived-on: 2026-10-20
openapi: 3.0.1
info:
  title: ONESOURCE E-Invoicing Get source document
  description: "This documentation describes the Source Document API functionality. \nThe Source Document API is responsible for get documents source from pagero service."
  version: 0.7.0
servers:
- url: https://api-uat.onesourcetax.com/einvoicing/document/v1
- url: https://api-emea.onesourcetax.com/einvoicing/document/v1
tags:
- name: Document payloads
  description: Operations on document payloads
paths:
  /documents/{id}/source-document:
    get:
      tags:
      - Document payloads
      summary: Get source document.
      description: Get source document for `Document`. This should always be available.
      parameters:
      - name: id
        in: path
        description: Id of `Document`
        required: true
        schema:
          type: string
          example: 0f57671d-5487-40be-8bfc-2a6ec62e8d53
      responses:
        '200':
          description: Successful response
          content:
            text/xml:
              schema:
                type: string
                format: byte
            text/plain:
              schema:
                type: string
                format: byte
            application/pdf:
              schema:
                type: string
                format: byte
            application/json:
              schema:
                type: string
                format: byte
            application/octet-stream:
              schema:
                type: string
                format: byte
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Address:
      type: object
      properties:
        country:
          type: string
          description: Country
          example: United States
        countryCode:
          type: string
          description: ISO 3166 alpha-2 two-letter country code
          example: US
        postCode:
          type: string
          description: Post code / Zip code
          example: '20854'
        street:
          type: string
          description: Street
          example: 11325 7 Locks Rd
        street2:
          type: string
          description: Additional street
          example: Apt 202
        town:
          type: string
          description: Town
          example: Potomac
        postBox:
          type: string
          description: Post box
          example: '7202'
        province:
          type: string
          description: Province / Region
          example: Maryland
      description: Address
    BusinessStatus:
      type: object
      description: The business level status of a document. Currently this is only available for invoices. The business status of the invoice will be decided by related application responses.
      required:
      - status
      - createTime
      properties:
        status:
          type: string
          description: 'The current business status of the document. Available values:

            * **InProcess**

            * **UnderQuery**

            * **OnHold**

            * **ConditionallyAccepted**

            * **Accepted**

            * **Rejected**

            * **ResponseExpected**

            * **PaymentApproved**

            * **PaymentInitiated**

            * **PaymentRejected**

            * **Paid**


            Please note that more statuses may be added in the future.'
          example: Accepted
        createTime:
          type: string
          format: date-time
          description: Creation time of the business status expressed in ISO 8601 format. This is primarily taken from the related document where the business status is communicated if a timestamp exists there. If not, it will be the time when the related document was processed.
          example: '2024-09-26T09:45:54Z'
        messages:
          type: array
          items:
            type: object
            properties:
              messageCode:
                type: string
                description: Code specified by the counterpart to further specify the business status.
                example: TBD
              message:
                type: string
                description: Message from the counterpart.
                example: TBD
    ClearanceStatus:
      type: object
      description: The clearance status of a document, if available.
      required:
      - status
      - createTime
      properties:
        status:
          type: string
          description: 'The current clearance status of the document. Available values:


            * **Approved**

            * **ApprovedWithWarnings**

            * **DeadlinePassed**

            * **DeliveryImpossible**

            * **DeliverySuccess**

            * **DeliveryFailure**

            * **Rejected**

            * **ValidationFailure**


            Please note that more statuses may be added in the future.'
          example: TBD
        createTime:
          type: string
          format: date-time
          description: Creation time of the clearance status expressed in ISO 8601 format.
          example: '2024-09-26T09:45:54Z'
        clearanceId:
          type: string
          description: The clearance id, generated by the clearance authority
          example: c0875cc3-0988-4f7d-a61f-0b179c5d24b1
        messages:
          type: array
          items:
            type: object
            properties:
              messageCode:
                type: string
                description: Code specified by the counterpart to further specify the clearance status.
                example: TBD
              message:
                type: string
                description: Message from the counterpart.
                example: TBD
    CollectionMetadata:
      type: object
      properties:
        currentPageIndex:
          type: number
          description: The number of pages to skip before starting to collect the result set.
          example: 0
        itemsPerPage:
          type: number
          description: No. of records which user wants to fetch in single api call. The default value is 10
          example: 10
        totalItems:
          type: number
          description: The total number of items in the collection.
          example: 14
        totalPages:
          type: number
          description: The total number of pages in the collection.
          example: 2
    Contact:
      type: object
      properties:
        phone:
          type: string
          description: Phone number
          example: 831-999-7300
        email:
          type: string
          description: Email address
          example: john.doe@acme.com
        fax:
          type: string
          description: Fax number
          example: 1 (929) 207-0142
      description: Contact
    Document:
      required:
      - createTime
      - distribution
      - documentType
      - id
      - isFetched
      - modifiedTime
      - sendStatus
      type: object
      properties:
        id:
          type: string
          description: The document id
          example: 6168900e-6971-4190-9ef3-edb7203bda5d
        sendStatus:
          type: string
          description: 'The send-status of a document. Available values are:

            * **Done** - Documents that have been successfully delivered

            * **Processing** - Documents that are being processed

            * **Error** - Documents that have failed with some error

            * **Canceled** - Documents that have been cancelled


            Received documents will always have the send-status `Done`.'
          example: Done
        linkingDocumentId:
          type: string
          description: When creating a document which is a response to a received document, this id can be used inside the response document to reference the received document. This will make the response document become enriched with data from the received document. The typical example is receiving an invoice and responding with an application response and this is also the only scenario which is supported at the moment. In this case, this id should be included in the application response as a reference to the invoice in the appropriate application response element.
        direction:
          type: string
          description: "It describes the direction of the document\n  * `Sent` - To view all the transaction which is sent by external system to OEI\n  * `Received` - To view all the transaction which is sent by OEI to ERP"
          example: Sent
        documentType:
          type: string
          description: The document type. Available document types are listed [here](https://pagero.github.io/partners/apis/document-types).
          example: Invoice
        documentSubtype:
          type: string
          description: Document subtype. Available document subtypes are listed [here](https://pagero.github.io/partners/apis/document-types).
          example: Debit
        externalStatus:
          type: string
          description: "External status. This is set by the client through the `POST /documents/external-status` endpoint.\n\nAvailable values:\n  * **Success** - Document has been successfully processed by the external system.\n  * **Failure** - Document has failed to be processed by the external system."
          example: Success
        externalStatusMessage:
          type: string
          description: A message related to the `externalStatus`. Can be used to provide an error message if `externalStatus` is `Failure`.
          example: Document could not be processed since it exceeds the maximum file size.
        createTime:
          type: string
          description: Creation time of the document in the system, expressed in ISO 8601 format.
          format: date-time
          example: '2024-09-25T12:14:06Z'
        modifiedTime:
          type: string
          description: Modified time of the document in the system, expressed in ISO 8601 format.
          format: date-time
          example: '2024-09-25T12:14:06Z'
        companyId:
          type: string
          description: Id of the company sending or receiving the document. For sent documents, the company id of the sender. For received document, the company id of the receiver.
          example: 350e20c7-c804-4991-a41e-a1c1e21ecd85
        senderReference:
          type: string
          description: The sender reference, as provided by the sender upon sending the document.
          example: 305c099a-d9ee-4723-9808-732127393085
        documentInfo:
          $ref: '#/components/schemas/DocumentInfo'
        documentReferences:
          type: array
          description: Document references. Includes references to all documents related to this document.
          items:
            $ref: '#/components/schemas/DocumentReference'
        businessStatus:
          $ref: '#/components/schemas/BusinessStatus'
        businessStatusHistory:
          type: array
          description: Business status history.
          items:
            $ref: '#/components/schemas/BusinessStatus'
        clearanceStatus:
          $ref: '#/components/schemas/ClearanceStatus'
        clearanceStatusHistory:
          type: array
          description: Clearance status history
          items:
            $ref: '#/components/schemas/ClearanceStatus'
        errorMessage:
          type: string
          description: If `sendStatus` is `Error`, this property contains an error message.
          example: The document payload is invalid.
        selfBilled:
          type: boolean
          description: True if the document is a self-billed invoice. This means that the invoice was issued by the buyer, on behalf of the seller.
    DocumentAction:
      required:
      - action
      type: object
      properties:
        action:
          type: string
          description: 'The action to take on the `Document`. Available values:

            * **Restart** - Restart the document

            * **Cancel** - Cancel the document'
          example: Cancel
    DocumentAmounts:
      type: object
      description: Document amounts
      properties:
        netAmount:
          type: string
          description: Net amount
          format: decimal
          example: '200.00'
        vatAmount:
          type: string
          description: VAT amount
          format: decimal
          example: '50.00'
        totalAmount:
          type: string
          description: Total amount
          format: decimal
          example: '250.00'
        currency:
          type: string
          description: Currency as an ISO 4217 three-letter code.
          example: EUR
    DocumentInfo:
      type: object
      description: Document metadata, such as information about sender, receiver, dates and amounts.
      properties:
        documentIdentifier:
          type: string
          description: Document identifier, for instance invoice number or order number.
          example: INV384793
        issueDate:
          type: string
          description: Issue date expressed in ISO 8601 format (yyyy-mm-dd)
          format: date
          example: '2024-09-26'
        dueDate:
          type: string
          description: Due date expressed in ISO 8601 format (yyyy-mm-dd)
          format: date
          example: '2024-10-26'
        amounts:
          $ref: '#/components/schemas/DocumentAmounts'
        senderParty:
          $ref: '#/components/schemas/Party'
        receiverParty:
          $ref: '#/components/schemas/Party'
    DocumentReference:
      type: object
      description: Document reference
      required:
      - direction
      - documentId
      - documentType
      properties:
        documentId:
          type: string
          description: Id of the referenced document
          example: 4911b83e-be25-4a17-99ec-1aef7079c5f5
        documentType:
          type: string
          description: The document type. Available document types are listed [here](https://pagero.github.io/partners/apis/document-types).
          example: Order
        documentSubType:
          type: string
          description: Document subtype. Available document subtypes are listed [here](https://pagero.github.io/partners/apis/document-types).
          example: Purchase
        documentIdentifier:
          type: string
          description: Document identifier
          example: AB4565756
        direction:
          type: string
          description: Whether the referenced document was sent or received
          enum:
          - Sent
          - Received
    Id:
      type: object
      required:
      - idType
      - value
      properties:
        idType:
          type: string
          description: 'Id type. Available values are:

            * **GLN** - GLN number. Also known as EAN.

            * **IBAN** - IBAN number

            * **ORGNO** - An organization number

            * **VATNO** - A VAT number

            * **OTHER** - All ids that do not fit into any other id type'
          example: ORGNO
        value:
          type: string
          description: Id value
          example: 5565814695
    Party:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        name:
          type: string
          description: Name
          example: Acme Inc.
        department:
          type: string
          description: Department
          example: Accounting
        unitNumber:
          type: string
          description: Unit number
          example: '497654'
        contact:
          $ref: '#/components/schemas/Contact'
        personalContact:
          $ref: '#/components/schemas/PersonalContact'
        ids:
          type: array
          description: Ids, like organisation number, VAT number or GN number.
          items:
            $ref: '#/components/schemas/Id'
        erpId:
          type: string
          description: Identifier in an ERP system, typically a customer or supplier number.
          example: '89543695'
    PersonalContact:
      allOf:
      - type: object
        properties:
          name:
            type: string
            description: Name
            example: John Doe
      - $ref: '#/components/schemas/Contact'
      description: Personal contact
    Company:
      type: object
      properties:
        id:
          type: string
          description: unique ID generated by OEI for each company
        name:
          type: string
          description: The company name
        department:
          type: string
          description: The department
        address:
          $ref: '#/components/schemas/CompanyAddress'
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/CompanyId'
        contact:
          $ref: '#/components/schemas/ContactInformation'
        customerNumber:
          type: string
    CompanyId:
      type: object
      properties:
        idType:
          type: string
          description: Type of id
        value:
          type: string
          description: The id value
    ContactInformation:
      type: object
      properties:
        email:
          type: string
          description: The company's email address
        phone:
          type: string
          description: The company's phone number
        fax:
          type: string
          description: The company's fax number
    CompanyAddress:
      type: object
      properties:
        street:
          type: string
          description: Street address
        postBox:
          type: string
          description: Post box
        postCode:
          type: string
          description: Post code
        town:
          type: string
          description: Town
        province:
          type: string
          description: Province
        countryCode:
          type: string
          description: Country code in ISO 3366-1 2-letter format
    UnAuthorizedErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          description: "Error code. Possible values:\n UNAUTHORIZED: The authorization code is not active\n"
          enum:
          - UNAUTHORIZED
        description:
          type: string
          description: The translated errormessage.
        technicalDescription:
          type: string
          description: A more detailed description of the error in English.
    InternalServerErrorCompany:
      type: object
      properties:
        errorCode:
          type: string
          description: "Error code. Possible values:\n INTERNAL_SERVER_ERROR: Unknown error\n"
          enum:
          - INTERNAL_SERVER_ERROR
        description:
          type: string
          description: The translated errormessage.
        technicalDescription:
          type: string
          description: A more detailed description of the error in English.
    documentResponse:
      type: object
      properties:
        descriptions:
          type: array
          items:
            $ref: '#/components/schemas/description'
    description:
      type: string
      example: error message
    ExternalStatusRequest:
      type: object
      required:
      - companyId
      - entries
      properties:
        companyId:
          type: string
          example: 6efc3db7-6c76-41b1-a411-a2468a55fc2b
          description: Id of the company which owns the documents in this request. All document ids in the request must belong to documents owned by this company.
        entries:
          type: array
          items:
            type: object
            required:
            - id
            - status
            properties:
              id:
                type: string
                example: 72f912ed-786d-435b-a7d5-f497997b1999
                description: The document id to update the status for.
              status:
                type: string
                example: Failure
                description: "The external status to set. Avilable value are:\n\nAvailable values are:\n  * **Success** - Document has been successfully processed by the external system.\n  * **Failure** - Document has failed to be processed by the external system.\n\nIt's completely up to the external system to define the \"success\" and \"failure\" conditions"
              message:
                type: string
                description: A message related to the external status.
                example: Document could not be processed since it exceeds the maximum file size.
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/documentResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/documentResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/documentResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/documentResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/documentResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/documentResponse'
