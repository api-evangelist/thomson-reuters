      - name
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 0
          type: string
        chart_type:
          type: string
        effective_from:
          type: string
          format: date
        accounting_convention:
          type: string
          enum:
          - NOT_DETERMINED
          - DEBIT_CREDIT
          - NATURAL_SIGN
    ChartOfAccountsCreateResponse:
      type: object
      properties:
        id:
          type: string
        info:
          type: string
    ChartOfAccountsVersionResponse:
      type: object
      properties:
        id:
          type: string
        chart_of_account_version_id:
          type: string
        name:
          type: string
        no_of_accounts:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        has_reference:
          type: boolean
        chart_type:
          type: string
          enum:
          - MASTER
          - SOURCE
        accounting_convention:
          type: string
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
        version_label:
          type: integer
          format: int32
        created_by:
          type: string
        default_rollup_id:
          type: integer
          format: int32
        created_at:
          type: string
          description: Time at which this ingestion was created
          format: date-time
          example: '2020-12-19T21:06:22.453Z'
        updated_by:
          type: string
        updated_at:
          type: string
          description: Time at which this ingestion was updated
          format: date-time
          example: '2020-12-19T21:06:22.453Z'
        associated_jurisdictions:
          type: array
          description: List of jurisdiction codes associated with this chart of accounts
          items:
            type: string
            description: List of jurisdiction codes associated with this chart of accounts
        associated_applications:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationAssociationGetApiResponse'
        associated_entities:
          type: array
          items:
            type: string
        mapped_rollup_count:
          type: integer
          format: int32
    ChartOfAccountsPatchRequest:
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 0
          type: string
        chart_type:
          type: string
        effective_from:
          type: string
          format: date
        accounting_convention:
          type: string
          enum:
