components:
  schemas:
    TRTA.Athena.Models.Api.V4.Mappings.Mapping:
      type: object
      description: Represents a tax account mapping.
      properties:
        id:
          type: string
          description: The unique identifier of the mapping.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          description: The name of the mapping.
        year:
          type: integer
          description: The year associated with the chart of accounts.
          format: int32
        mapType:
          type: string
          description: The type of mapping.
        datasetId:
          type: string
          description: The unique identifier of the dataset.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        chartOfAccountId:
          type: string
          description: The unique identifier of the chart of accounts.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        importType:
          type: string
          description: The type of import associated with the mapping.
        templateId:
          type: string
          description: The unique identifier of the template.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    TRTA.Athena.Models.Api.V4.Mappings.MappingCreateRequest:
      type: object
      description: Represents the request to create a new tax account mapping.
      properties:
        name:
          type: string
          description: The name of the mapping.
        year:
          type: integer
          description: The year associated with the chart of accounts.
          format: int32
        mapType:
          type: string
          description: The type of mapping.
        datasetId:
          type: string
          description: Dataset id
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        chartOfAccounId:
          type: string
          description: The unique identifier of the dataset.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        importType:
          type: string
          description: The type of import associated with the mapping.
        templateId:
          type: string
          description: The unique identifier of the template.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    TRTA.Athena.Models.Api.Errors:
      type: object
      description: Represents an error response.
      properties:
        id:
          type: integer
          description: The unique identifier of the error.
          format: int32
        description:
          type: string
          description: A detailed error message.
    TRTA.Athena.Models.Api.V4.Mappings.MappingPutRequest:
      type: object
      description: Represents the request to add or update entries in an existing mapping.
      properties:
        items:
          type: array
          description: A list of map entries to add or update.
          items:
            $ref: '#/components/schemas/TRTA.Athena.Models.Api.V4.Mappings.MapEntry'
    TRTA.Athena.Models.Api.V4.Mappings.MapEntry:
      type: object
      description: Represents an individual map entry.
      properties:
        mapTarget:
          type: string
          description: The tax account code to map to.
        accountCode:
          type: array
          description: A list of chart of accounts account codes to map from.
          items:
            type: string
