      summary: Retrieve Tax Account Mappings
      description: This endpoint retrieves a list of all tax account mappings available in the system. The response includes details such as mapping name, year, map type, dataset ID, and other metadata.
      operationId: Mappings_Get
      parameters:
      - name: Authorization
        in: header
        description: Bearer token for authorization.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the list of mappings.
