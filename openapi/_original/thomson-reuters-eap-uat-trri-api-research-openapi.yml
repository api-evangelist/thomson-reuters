paths:
  /v1/search:
    post:
      tags:
      - search-controller
      summary: Performs search and returns its result
      operationId: performSearchUsingPOST
      parameters:
      - name: limit
        in: query
        description: result limit
        schema:
          type: integer
          format: int32
        example: 1
      requestBody:
        description: searchRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequestDto'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SearchResponseDto'
        '201':
          description: Created
          content: {}
        '400':
          description: Supplied search request contains invalid data
          content: {}
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
      x-codegen-request-body-name: searchRequest
  /v1/search/{searchId}:
    get:
      tags:
      - search-controller
      summary: Retrieve search result by Search Id
      operationId: retrieveSearchUsingGET
      parameters:
      - name: classifications
        in: query
        description: classifications
        schema:
          type: boolean
          default: false
        example: true
      - name: limit
        in: query
        description: limit
        schema:
          type: integer
          format: int32
        example: 10
      - name: offset
        in: query
        description: offset
        schema:
          type: integer
          format: int32
        example: 5
      - name: searchId
        in: path
        description: searchId
        required: true
        schema:
          type: string
        example: i0adc3e1b00000179793c9e3603bd2125
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SearchResponseDto'
        '400':
          description: INVALID_PARAMETER_MESSAGE
          content: {}
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
  /v1/classifications:
    get:
      tags:
      - classifications-controller
      summary: return a list of all current main classifications
      operationId: getRootClassificationsUsingGET
      parameters:
      - name: depth
        in: query
        description: number of child levels
        schema:
          type: integer
          format: int32
        example: 1
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListClassificationDto'
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
  /v1/classifications/{id}:
    get:
      tags:
      - classifications-controller
      summary: return all child classifications for this particular id
      operationId: getClassificationUsingGET
      parameters:
      - name: depth
        in: query
        description: number of child levels
        schema:
          type: integer
          format: int32
        example: 1
      - name: id
        in: path
        description: classificationId
        required: true
        schema:
          type: string
        example: ID4B86BB0459011E3A899B08B7B2FF604
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClassificationDto'
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
  /v1/document-classifications-view:
    post:
      tags:
      - classifications-controller
      summary: Returns documents classifications
      operationId: getDocumentsClassificationsUsingPOST
      requestBody:
        description: documentIds
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentListRequestDto'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DocumentClassificationsResponse'
        '201':
          description: Created
          content: {}
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Failed to get classifications from Novus
          content: {}
      x-codegen-request-body-name: documentIds
  /v1/document-metadata-view:
    post:
      tags:
      - metadata-controller
      summary: Returns metadata for a list of documents
      operationId: getDocumentsMetadataUsingPOST
      requestBody:
        description: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentListRequestDto'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListDocumentMetadataDto'
        '201':
          description: Created
          content: {}
        '400':
          description: Requested documents list should be > 0 && <= 100
          content: {}
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Failed to get metadata from Novus
          content: {}
      x-codegen-request-body-name: request
  /v1/document-roots/{documentRootId}:
    get:
      tags:
      - version-controller
      summary: Return document versions by family ID
      operationId: getRootDocumentVersionsUsingGET
      parameters:
      - name: documentRootId
        in: path
        description: Document family ID to return versions
        required: true
        schema:
          type: string
        example: ID02B0FE00A9911DDB6FFD6F08131F47D
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DocumentVersionsDto'
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: No versions exist or incorrect document family ID
          content: {}
  /v1/document-roots/{documentRootId}/revisions/{documentId}:
    get:
      tags:
      - compare-controller
      summary: Returns result of comparing document with its previous version
      operationId: getDocumentVersionWithOriginalVersionDifferenceUsingGET
      parameters:
      - name: documentId
        in: path
        description: documentId
        required: true
        schema:
          type: string
      - name: documentRootId
        in: path
        description: documentRootId
        required: true
        schema:
          type: string
      - name: original-doc-id
        in: query
        description: original-doc-id
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
        '400':
          description: Documents cannot be compared
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
  /v1/documents:
    get:
      tags:
      - document-controller
      summary: return list of documents by type with requested limit
      operationId: getDocumentsUsingGET
      parameters:
      - name: limit
        in: query
        description: number of results
        required: true
        schema:
          type: integer
          format: int32
        example: 15
      - name: offset
        in: query
        description: the offset of the results
        schema:
          type: integer
          format: int32
          default: 0
        example: 15
      - name: type
        in: query
        description: type of document
        required: true
        schema:
          type: string
        example: analysis-and-insight
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListDocumentsDTO'
        '400':
          description: 'invalid parameter or missing [parameter name = value] '
          content: {}
        '401':
          description: Supplied transfer token are missed or invalid
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Failed to get document from Novus
          content: {}
  /v2/documents/{documentId}/rulebook-location:
    get:
      tags:
      - metadata-controller
      summary: Returns TOC tree starting with the root node with all the immediate children plus all the nodes of the branch that contains the specified document
      operationId: getDocumentTocTreeUsingGET
      parameters:
      - name: documentId
        in: path
        description: The unique document identifier
        required: true
        schema:
          type: string
        example: IC5A20E7DDE1C454EA14C5AEAA856E7DC
      security:
      - Bearer: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
