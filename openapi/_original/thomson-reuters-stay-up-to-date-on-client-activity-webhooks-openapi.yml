# x-archived-on: 2026-10-20
openapi: 3.0.1
info:
  version: v1
  title: Stay up to date on client activity (Webhooks)
  description: Thomson Reuters SurePrep APIs for receiving updates when specified events occur in the client profile.
servers:
- url: https://api.sureprep.com
  description: Base URLs for SurePrep API.
tags:
- name: Client activity notifications - V7
  description: Using V7 of our API webhooks to receive updates on your client’s records, SurePrep sends your API an automated message with real-time information as soon as it’s available. Once you receive a message, you can decide when to perform an action for optimal results.
- name: Client activity notifications - V5
  description: Using V5 of our API webhooks to receive updates on your client’s records, SurePrep sends your API an automated message with real-time information as soon as it’s available. Once you receive a message, you can decide when to perform an action for optimal results
paths:
  /V7/TaxCaddyAPI/ClientSubscribe:
    put:
      tags:
      - Client activity notifications - V7
      operationId: SurePrepMiddlewareV7_ClientSubscribe
      summary: ClientSubscribe - V7
      description: Used to subscribe clients (All or individual) to the DRL and Document Added webhooks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurePrep.API.TaxCaddyAPI.Model.SubscribeRequest'
      parameters:
      - name: Authorization
        in: header
        description: 'Bearer access token (For example: Bearer ABCD-EFG)'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurePrep.API.TaxCaddyAPI.Model.CommonResponse'
  /V7/TaxCaddyAPI/ClientUnsubscribe:
    put:
      tags:
      - Client activity notifications - V7
      operationId: SurePrepMiddlewareV7_ClientUnsubscribe
      summary: ClientUnsubscribe - V7
      description: Used to unsubscribe clients (All or individual) from the DRL and Document Added webhooks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurePrep.API.TaxCaddyAPI.Model.SubscribeRequest'
      parameters:
      - name: Authorization
        in: header
        description: 'Bearer access token (For example: Bearer ABCD-EFG)'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurePrep.API.TaxCaddyAPI.Model.CommonResponse'
  /V5.0/TaxCaddyAPI/ClientSubscribe:
    put:
      tags:
      - Client activity notifications - V5
      operationId: SurePrepMiddleware_ClientSubscribe
      summary: ClientSubscribe - V5
      description: Used to subscribe clients (All or individual) to the DRL and Document Added webhooks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurePrep.API.TaxCaddyAPI.Model.SubscribeRequest'
      parameters:
      - name: AuthToken
        in: header
        description: Access token from the **GetToken** API call.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurePrep.API.TaxCaddyAPI.Model.CommonResponse'
  /V5.0/TaxCaddyAPI/ClientUnsubscribe:
    put:
      tags:
      - Client activity notifications - V5
      operationId: SurePrepMiddleware_ClientUnsubscribe
      summary: ClientUnsubscribe - V5
      description: Used to unsubscribe clients (All or individual) from the DRL and Document Added webhooks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurePrep.API.TaxCaddyAPI.Model.SubscribeRequest'
      parameters:
      - name: AuthToken
        in: header
        description: Access token from the **GetToken** API call.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurePrep.API.TaxCaddyAPI.Model.CommonResponse'
components:
  schemas:
    SurePrep.API.TaxCaddyAPI.Model.CommonResponse:
      type: object
      properties:
        ErrorCode:
          type: string
          description: Identification code for the error that has occurred.
        ErrorDescription:
          type: string
          description: Description of the error that has occurred for the request attempt.
    SurePrep.API.TaxCaddyAPI.Model.SubscribeRequest:
      type: object
      required:
      - UserEmail
      - TaxClientID
      - EventCode
      properties:
        UserEmail:
          type: string
          description: Email address of the logged in user who will be performing the activity (active FileRoom users only). This user will need to have “Access to TaxCaddy Admin”.
        TaxClientID:
          type: string
          description: The API Method will accept a single Tax Client ID.
        EventCode:
          type: string
          description: The Event Code the client will be subscribed to. Can be **doc.uploaded** to be alerted when a new document is uploaded to a subscribed client's account, or **drl.created** to be alerted when a subscribed client's DRL is created or has gone into error.
        LinkedReturns:
          type: boolean
          description: When users provide 'true', the subscription will include all tax return profiles (i.e. 1040 & 1041) linked to the taxpayer's TaxCaddy account. Provide the 1040 TaxClientID along with the **true** value for this field.
    SurePrep.API.TaxCaddyAPI.Model.PushTypeRequest:
      type: object
      required:
      - EngagementID
      - BinderType
      - TimeStamp
      - TaxClientID
      - UTClientGUID
      properties:
        EngagementID:
          type: integer
          format: int32
          description: ID of the binder you'd like to receive alerts for.
        BinderType:
          type: string
          description: Binder Type of the binder you'd like to receive alerts for.
        TimeStamp:
          type: string
          description: Time stamp of the event you're receiving an alert of.
        TaxClientID:
          type: string
          description: The API Method will accept a single Tax Client ID.
        UTClientGUID:
          type: string
          description: A unique identifier for UltraTax Local/Desktop clients.
        TaxYear:
          type: integer
          format: int32
          description: Tax year of the binder.
        APIBinderStatusID:
          type: integer
          format: int32
          description: Binder ID of the selected binder.
