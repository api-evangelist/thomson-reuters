openapi: 3.0.1
info:
  title: Next Generation Reporting REST APIs
  description: Transaction Extract Reporting REST APIs enable you to access transaction-level data for selected companies according to the unique needs of your organization.
  contact:
    name: IDTAWSResourceOwners@thomson.com
    email: IDT AWS Support
  version: '1.0'
servers:
- url: https://api.onesourcetax.com/indirect-tax-determination/transaction-extracts/v1
  description: IDT US
- url: https://api-emea.onesourcetax.com/indirect-tax-determination/transaction-extracts/v1
  description: IDT EU
- url: https://api.onesourcetax.com/indirect-tax-determination-iv/transaction-extracts/v1
  description: IDT-IV US
- url: https://api-uat.onesourcetax.com/indirect-tax-determination/transaction-extracts/v1
  description: IDT US UAT
- url: https://api-uat.onesourcetax.com/indirect-tax-determination-iv/transaction-extracts/v1
  description: IDT-IV US UAT
paths:
  /indirect-tax-determination/transaction-extracts/v1/document-line-details/extract:
    post:
      tags:
      - report-controller
      description: Retrieve document line level details for a selected list of companies.
      operationId: extractTransactionsRequest
      parameters:
      - name: Authorization
        in: header
        description: JWT Authorization header using the Bearer scheme.
        required: true
        schema:
          type: string
        example: Bearer {token}
      - name: X-API-REQUEST-ID
        in: header
        description: Request ID
        schema:
          type: string
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionExtractRequest'
        required: true
      responses:
        '200':
          description: Extract transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionExtractResponse'
            text/html:
              schema:
                $ref: '#/components/schemas/TransactionExtractResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized access
          content:
            application/json:
              schema:
                type: string
                example:
                  type: https://developers.onesourcetax.com/errors/#keymanagement.service.invalid_access_token
                  title: Invalid Access Token
                  detail: Invalid Access Token
                  status: 401
                  instance: /indirect-tax-determination/transaction-extracts/v1/document-line-details/extract
                  api_requestId: rrt-0dca53a2ef58eee6c-c-sa-15013-3687472-1
            text/html:
              schema:
                type: string
                example:
                  type: https://developers.onesourcetax.com/errors/#keymanagement.service.invalid_access_token
                  title: Invalid Access Token
                  detail: Invalid Access Token
                  status: 401
                  instance: /indirect-tax-determination/transaction-extracts/v1/document-line-details/extract
                  api_requestId: rrt-0dca53a2ef58eee6c-c-sa-15013-3687472-1
        '403':
          description: Forbidden access
          content:
            text/html:
              schema:
                type: string
                example: "<html>\n   <head>\n      <title>403 Forbidden</title>\n   </head>\n   <body>\n      <center>\n         <h1>403 Forbidden</h1>\n      </center>\n      <hr>\n      <center>nginx</center>\n   </body>\n</html>"
        '404':
