components:
  schemas:
    AttributeFilter:
      type: object
      properties:
        name:
          type: string
          description: Custom attribute name
        operator:
          type: string
          description: 'This field accepts the following:

            eq - equal

            ne - not equal'
          enum:
          - eq
          - ne
        value:
          type: string
          description: The custom attribute value for which records needs compared and included.
      description: List of custom attribute predicates for which the transactions to be included in the response
    DateTypes:
      type: string
      description: "Identifies one of the following date types for transactions in the database:\n·Transaction - The date range is based on the date the taxcalculation occurs for the document. Format must be yyyy-mm-dd.\n·Document - The date range is based on document dates. Format must be yyyy-mm-dd. \n·Fiscal - The date range is based on fiscal dates indicated by each transaction. Format must be yyyy-mm-dd. \n·Creation - The timestamp range is based on creation date. Format must be yyyy-mm-dd hh:mm:ss.\n·Insert - The timestamp range is based on insert timestamp. Format must be yyyy-mm-dd hh:mm:ss."
      enum:
      - transaction
      - fiscal
      - document
      - creation
      - insert
    TransactionExtractRequest:
      required:
      - endDate
      - startDate
      type: object
      properties:
        companyNames:
          type: array
          description: Names of companies in the Determination database.
          items:
            type: string
            description: Names of companies in the Determination database.
        dateType:
          $ref: '#/components/schemas/DateTypes'
        startDate:
          type: string
          description: Start date for a given date range.
        endDate:
          type: string
          description: End date(inclusive) for a given date range.
        movementDateType:
          type: string
          description: Movement date type for with the date range is specified :[Movement Date,Movement Date - Line,Original Movement Date, Original Movement Date - Line]
          enum:
          - Movement Date
          - Movement Date - Line
          - Original Movement Date
          - Original Movement Date - Line
        movementStartDate:
          type: string
          description: Movement start date of date range for which the extract is being requested
        movementEndDate:
          type: string
          description: Movement end date of date range for which the extract is being requested
        taxableCountries:
          type: array
          description: Countries where selected companies have a tax obligation.
          items:
            type: string
            description: Countries where selected companies have a tax obligation.
        taxableStates:
          type: array
          description: States where the selected company or companies have tax obligations.
          items:
            type: string
            description: States where the selected company or companies have tax obligations.
        taxableProvinces:
          type: array
          description: Provinces where the selected company or companies have tax obligations.
          items:
            type: string
            description: Provinces where the selected company or companies have tax obligations.
        authorityTypes:
          type: array
          description: List of authority types for which the transactions to be included in the response
          items:
            type: string
            description: List of authority types for which the transactions to be included in the response
        transactionTypes:
          type: array
          description: 2-digit code based on the selected company(s) used in tax data.
          items:
            type: string
            description: 2-digit code based on the selected company(s) used in tax data.
        taxTypes:
          type: array
          description: 2-character abbreviation code used in tax data. Tax type is determined when the jurisdiction is determined. Some tax types are specific to only US or International transactions.
          items:
            type: string
            description: 2-character abbreviation code used in tax data. Tax type is determined when the jurisdiction is determined. Some tax types are specific to only US or International transactions.
        authorityNames:
          type: array
          description: List of tax authority names for which the transactions to be included in the response
          items:
            type: string
            description: List of tax authority names for which the transactions to be included in the response
        productCodes:
          type: array
          description: ERP system product codes.
          items:
            type: string
            description: ERP system product codes.
        companyRoles:
          type: array
          description: The role the company plays in a given transaction:Buyer,Seller,or Middleman. Also seen in Determination as Merchant role.
          items:
            type: string
            description: The role the company plays in a given transaction:Buyer,Seller,or Middleman. Also seen in Determination as Merchant role.
        taxDirection:
          type: string
          description: 'Specifies direction in which taxes are paid:

            ·Empty String (Any)

            ·I (Input Tax)

            ·O (Output Tax)'
        commodityCodes:
          type: array
          description: Commodity identifier for a transaction.
          items:
            type: string
            description: Commodity identifier for a transaction.
        customerNumbers:
          type: array
          description: An optional customer number(s) to limit output.
          items:
            type: string
            description: An optional customer number(s) to limit output.
        documentNumbers:
          type: array
          description: List of document numbers, document number is a transaction identifier;for example,an invoice or credit memo number.
          items:
            type: string
            description: List of document numbers, document number is a transaction identifier;for example,an invoice or credit memo number.
        vendorNumbers:
          type: array
          description: Comes from Determination data source.
          items:
            type: string
            description: Comes from Determination data source.
        fields:
          type: array
          description: List of column name (header).
          items:
            type: string
            description: List of column name (header).
        attributeFilters:
          type: array
          description: List of custom attribute predicates for which the transactions to be included in the response
          items:
            $ref: '#/components/schemas/AttributeFilter'
        excludeFullyExemptTransactions:
          type: boolean
          description: '"True" omits fully exempt tax lines."False"includes fully exempt tax lines.'
        vctAppliedFlag:
          type: boolean
          description: '"True" VCT applied "False"VCT not applied'
        offset:
          minimum: 0
          type: integer
          description: Offset of paginated response
          format: int32
        limit:
          minimum: 1
          type: integer
          description: Limit of records per page of response
          format: int32
      description: Extract Transactions Request
    MetaData:
      required:
      - fields
      type: object
      properties:
        fields:
          type: array
          items:
            type: string
        totalItems:
          type: integer
          format: int32
      description: The wrapper for transaction extract response to contain metadata like column/fields, total no. of records in the response etc.
    TransactionExtractResponse:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: The list of records in transaction extract response.
          items:
            type: object
            description: The list of records in transaction extract response.
        get_meta:
          $ref: '#/components/schemas/MetaData'
      example:
        items:
        - - NGRA_Cloud_QA_TestCompany
          - BuyerAudit21-017-2020 09170009:17:00+0000
          - 19821899
        - - NGRA_Cloud_QA_TestCompany
          - BuyerAudit21-040-2020 08404508:40:45+0000
          - 19579836
        _meta:
          fields:
          - Company Name
          - Document Number
          - Internal Invoice ID
          totalItems: 2
    Error:
      type: object
      properties:
        code:
          type: string
          description: HTTP error code
        message:
          type: string
          description: Error message
        details:
          type: array
          description: List to include the detail of error message, root cause or possible resolution.
          items:
            type: string
            description: List to include the detail of error message, root cause or possible resolution.
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      example:
        error:
          code: 400 BAD_REQUEST
          message: 'Unrecognized token ''asd'': was expecting (JSON String, Number, Array, Object or token ''null'', ''true'' or ''false'')'
          details:
          - "com.fasterxml.jackson.core.JsonParseException: Unrecognized token 'asd': was expecting (JSON String, Number, Array, Object or token 'null', 'true' or 'false')\n at [Source: (org.springframework.util.StreamUtils$NonClosingInputStream); line: 4, column: 31]"
    Company:
      type: object
      properties:
        companyName:
          type: string
          description: Name of the company used is authorized
        countries:
          type: array
          description: 'List of countries with transaction for the company '
          items:
            $ref: '#/components/schemas/Country'
        taxTypes:
          type: array
          description: List of tax types with transaction for the company
          items:
            type: string
            description: List of tax types with transaction for the company
        transactionTypes:
          type: array
          description: List of transaction types with transaction for the company
          items:
            type: string
            description: List of transaction types with transaction for the company
        authorityTypes:
          type: array
          description: List of authority types with transaction for the company
          items:
            type: string
            description: List of authority types with transaction for the company
      description: List of companies the user is authorized to access.
    Country:
      type: object
      properties:
        taxableCountry:
          type: string
        taxableStates:
          type: array
          items:
            type: string
        taxableProvinces:
          type: array
          items:
            type: string
      description: 'List of countries with transaction for the company '
    FieldGroupInfo:
      type: object
      properties:
        fieldGroup:
          type: string
        fieldInfos:
          type: array
          items:
            $ref: '#/components/schemas/FieldInfo'
      description: Mapping of field/column group name and associated fields
    FieldInfo:
      type: object
      properties:
        field:
          type: string
    ParametersResponse:
      type: object
      properties:
        companies:
          type: array
          description: List of companies the user is authorized to access.
          items:
            $ref: '#/components/schemas/Company'
        companyRoles:
          type: array
          description: List of companies roles the user is authorized for.
          items:
            type: string
            description: List of companies roles the user is authorized for.
        fieldGroupInfos:
          type: array
          description: Mapping of field/column group name and associated fields
          items:
            $ref: '#/components/schemas/FieldGroupInfo'
      example:
        companies:
        - companyName: NGRA_Cloud_QA_TestCompany
          countries:
          - taxableCountry: UNITED STATES
            taxableStates:
            - SOUTH CAROLINA
            taxableProvinces:
            - N/A
          taxTypes:
          - Sales
          - Use
          - No Liability
          - European Community Dispatch
          - Consumer Use
          transactionTypes:
          - Goods
          authorityTypes:
          - District Sales/Use
          - County Sales/Use
          - State Sales/Use
          - City Sales/Use
          - TVA
          - Business and Occupation
        companyRoles:
        - B
        - S
        - M
        fieldGroupInfos:
        - fieldGroup: Addresses - Document
          fieldInfos:
          - field: Bill To Facility ID
          - field: Middleman District
        - fieldGroup: Tax Code Qualification
          fieldInfos:
          - field: ERP Tax Code
    ApiInfoResponse:
      type: object
      properties:
        version:
          type: string
        authorizationHost:
          type: string
        dataSourceUrl:
          type: string
      example:
        version: 1.16.0.
        authorizationHost: onesource-idt-det-sandbox-int.hostedtax.thomsonreuters.com
        dataSourceUrl: a206447-deal-query-service-use1-dev.tr-tax-nonprod.aws-int.thomsonreuters.com:5439/deal_dev
  securitySchemes:
    JWT:
      type: apiKey
      name: Authorization
      in: header
