# x-archived-from: thomson-reuters-api-documentation-for-jurisdictions-services-2-0-openapi.yml
# x-archived-on: 2026-10-20
openapi: 3.1.1
info:
  version: '2.0'
  title: API documentation for Jurisdictions services
servers:
- url: https://api.onesourcetax.com/administration
  description: All V1 endpoints will be removed by Q2 2026. Please use V2
security:
- Authorization: []
paths:
  /v1/jurisdictions:
    get:
      tags:
      - Jurisdictions-📦 Version 1 Endpoints
      summary: Retrieve a list of Jurisdictions
      description: 'Use this operation to fetch a standard list of jurisdictions in ONESOURCE. Warning: This API call may return large set of records, depending on your filter settings. Enter the type of jurisdiction to further filter the list. This endpoint will be deprecated by Q2 2026. Please start consuming the newly listed v2 endpoints for continued support and access to the latest features.'
      operationId: Retrieve a list of Jurisdictions
      parameters:
      - name: Accept-Language
        in: header
        description: Accept Language
        required: false
        schema:
          type: string
      - name: X-LoneStar-AccountId
        in: header
        description: AccountId you want to access if you are a support user
        required: false
        schema:
          type: string
      - name: clientId
        in: header
        description: Client Id of the tenant
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: The Jurisdiction type that will be searched.
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionSearchResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
        '500':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV1'
      security:
      - Authorization: []
  /v2/jurisdictions/{id}:
    put:
      tags:
      - Jurisdictions-📦 Version 2 Endpoints
      summary: Update Jurisdiction records of an account
      description: Use this operation to update a record by its ID. It allows modifying the associated application (related apps), alternate name, or both in a single request.
      operationId: jurisdictionUpdateRequest
      parameters:
      - name: X-LoneStar-AccountId
        in: header
        description: AccountId you want to access if you are a support user
        schema:
          type: string
      - name: id
        in: path
        description: jurisdiction_id of the record
        required: true
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        schema:
          type: string
          enum:
          - application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JurisdictionCustomerDataRequestV3'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
        '204':
          description: No Content
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionCustomerDataResponseV3'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '403':
          description: Forbidden
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
            text/csv:
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '500':
          description: Failure
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV2'
  /v2/jurisdictions:
    get:
      tags:
      - Jurisdictions-📦 Version 2 Endpoints
      summary: Retrieve a list of Jurisdictions
      description: Use this operation to fetch a standard paginated list of jurisdictions in ONESOURCE
      operationId: getJurisdictions
      parameters:
      - name: X-LoneStar-AccountId
        in: header
        description: AccountId you want to access if you are a support user
        schema:
          type: string
      - name: effective_from
        in: query
        required: false
        description: results to include only records that are effective from  this date
        schema:
          type: string
      - name: effective_to
        in: query
        required: false
        description: results to include only records that are effective to  this date
        schema:
          type: string
      - name: filter
        in: query
        description: 'Criteria used to narrow down the results based on specific conditions. supports eq,contains,in eg: id in (1,2)'
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Defines the order in which results are returned. format +/-{{attribute}}, + denotes asc and - denotes desc eg:+id
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: The index of the item to return. A non negative integer. Default value is 0.
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        description: The maximum number of records to return in the response.Default value is 200. Max value is 500
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        required: false
        schema:
          type: string
          default: application/json
          enum:
          - text/csv
      responses:
        '200':
          description: Success
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionViewItemV3'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionViewItemV3'
            text/csv:
              schema:
                $ref: '#/components/schemas/ApiCollectionJurisdictionViewItemV3'
        '204':
          description: No Content
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '403':
          description: Forbidden
          content:
            application/vnd.tri.onesource.ii.graph.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
            text/csv:
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '500':
          description: Failure
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV2'
components:
  securitySchemes:
    Authorization:
      type: apiKey
      name: Authorization
      in: header
  schemas:
    Jurisdiction:
      type: object
      properties:
        id:
          type: string
          description: The id of the Jurisdiction instance.
        three_digit_code:
          type: string
          description: The three digit code of the Jurisdiction instance.
        type:
          type: string
          description: The type of the Jurisdiction instance.
        name_local:
          type: string
          description: The name local of the Jurisdiction instance.
        two_digit_code:
          type: string
          description: The two digit code of the Jurisdiction instance.
        name:
          type: string
          description: The name short english of the Jurisdiction instance.
        located_in:
          type: string
          description: The located in of the Jurisdiction instance.
      description: The details about a Jurisdiction in the customer graph.
    JurisdictionSearchResponse:
      type: object
      properties:
        _meta:
          description: _meta
          $ref: '#/components/schemas/Meta'
        items:
          type: array
          description: items
          items:
            $ref: '#/components/schemas/Jurisdiction'
        error:
          description: error
          $ref: '#/components/schemas/ErrorV1_Jurisdiction'
    Meta:
      type: object
      properties:
        data_type:
          type: string
          description: data_type
        total_results:
          type: integer
          format: int32
          description: total_results
        items_count:
          type: integer
          format: int32
          description: items_count
    FailureV1_object:
      type: object
      properties:
        detail_count:
          type: integer
          format: int32
          description: The number of failures that were encountered.
        details:
          type: array
          description: The collection of failures that were encountered.
          items:
            $ref: '#/components/schemas/FailureDetailV1'
        item:
          type: object
          description: The item associated with a failure. Typically this will be the POJO that encountered a failure such as a validation error.
      description: Contains information about a failure.
    FailureV1_Jurisdiction:
      type: object
      properties:
        detail_count:
          type: integer
          format: int32
          description: The number of failures that were encountered.
        details:
          type: array
          description: The collection of failures that were encountered.
          items:
            $ref: '#/components/schemas/FailureDetailV1'
        item:
          description: The item associated with a failure. Typically this will be the POJO that encountered a failure such as a validation error.
          $ref: '#/components/schemas/Jurisdiction'
      description: Contains information about a failure.
    ErrorV1:
      type: object
      properties:
        code:
          type: string
          description: code
        message:
          type: string
          description: message
        error_count:
          type: integer
          format: int32
          description: error_count
        failures:
          type: array
          description: failures
          items:
            $ref: '#/components/schemas/FailureV1_object'
    Error:
      type: object
      properties:
        code:
          type: string
          description: code
        message:
          type: string
          description: message
        error_count:
          type: integer
          format: int32
          description: error_count
        failures:
          type: array
          description: failures
          items:
            $ref: '#/components/schemas/Failure'
    Failure:
      type: object
      properties:
        detail_count:
          type: integer
          format: int32
          description: The number of failures that were encountered.
        details:
          type: array
          description: The collection of failures that were encountered.
          items:
            $ref: '#/components/schemas/FailureDetail'
        item:
          type: object
          description: The item associated with a failure. Typically this will be the POJO that encountered a failure such as a validation error.
      description: Contains information about a failure.
    FailureDetail:
      type: object
      properties:
        cause:
          type: string
          description: The cause of a failure. This is used to identify what POJO field may be in error or what DB could not be reached.
        description:
          type: string
          description: A description of the failure. This is used to provide some meaningful description of the failure. The message should be considered internal and not customer facing.
        error_id:
          type: string
          description: The error identifier
        error_parameters:
          type: object
          description: The error parameter keys and values
          additionalProperties:
            type: string
        failure_type:
          type: string
          description: The general category of the type of failure.
          enum:
          - ERROR
          - WARNING
          - VALIDATION
        message:
          type: string
          description: The default message category
      description: Provides detail information about a failure.
    FailureDetailV1:
      type: object
      properties:
        cause:
          type: string
          description: The cause of a failure. This is used to identify what POJO field may be in error or what DB could not be reached.
        description:
          type: string
          description: A description of the failure. This is used to provide some meaningful description of the failure. The message should be considered internal and not customer facing.
        error_id:
          type: string
          description: The error identifier
        error_parameters:
          type: object
          description: The error parameter keys and values
          additionalProperties:
            type: string
        failure_type:
          type: string
          description: The general category of the type of failure.
          enum:
          - ERROR
          - WARNING
          - VALIDATION
        message:
          type: string
          description: The default message category
      description: Provides detail information about a failure.
    ErrorV1_Jurisdiction:
      type: object
      properties:
        code:
          type: string
          description: code
        message:
          type: string
          description: message
        error_count:
          type: integer
          format: int32
          description: error_count
        failures:
          type: array
          description: failures
          items:
            $ref: '#/components/schemas/FailureV1_Jurisdiction'
    QueryResponseV1DTO_Jurisdiction:
      type: object
      properties:
        _meta:
          description: _meta
          $ref: '#/components/schemas/Meta'
        items:
          type: array
          description: items
          items:
            $ref: '#/components/schemas/Jurisdiction'
        error:
          description: error
          $ref: '#/components/schemas/ErrorV1_Jurisdiction'
    JurisdictionCustomerDataRequestV3:
      type: object
      properties:
        related_apps:
          type: array
          description: Specifies related apps of the jurisdiction record to be updated.
          items:
            type: string
        alternate_name:
          type: string
          description: Specifies alternate name of the jurisdiction record to be updated.
        type:
          type: string
          description: Type of the jurisdiction record
    ApiCollectionJurisdictionCustomerDataResponseV3:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JurisdictionCustomerDataResponseV3'
        _meta:
          description: Meta data information
          $ref: '#/components/schemas/ApiMeta'
    ApiCollectionJurisdictionViewItemV3:
      type: object
      properties:
        items:
          type: array
          description: Item list of jurisdiction records
          items:
            $ref: '#/components/schemas/JurisdictionViewItemV3'
        _meta:
          description: Meta data information
          $ref: '#/components/schemas/ApiMeta'
    JurisdictionViewItemV3:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Id of jurisdiction record
        code:
          type: string
          description: Code of jurisdiction record
        name:
          type: string
          description: Name of jurisdiction record
        effective_from:
          type: string
          format: date
          description: Effective from date of jurisdiction record
        effective_to:
          type: string
          format: date
          description: Effective to date of jurisdiction record
        two_char_code:
          type: string
          description: Two Character Code of jurisdiction record
        three_char_code:
          type: string
          description: Three Character Code of jurisdiction record
        type:
          type: string
          description: Type of jurisdiction record
        located_in:
          type: string
          description: Location of jurisdiction record
        country:
          type: string
          description: Country of jurisdiction record
        alternate_name:
          type: string
          description: Alternate name of jurisdiction record
        related_apps:
          type: array
          description: Related applications list of jurisdiction record
          items:
            type: string
    ApiMeta:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: Total number of records
        limit:
          type: integer
          format: int32
          description: Max number of records in the response
        offset:
          type: integer
          format: int32
          description: Index of the items returned
        sort:
          type: string
          description: Order in which results are returned
        filter:
          type: string
          description: Filter applied on the result
        extra:
          type: object
          additionalProperties:
            type: object
          writeOnly: true
    JurisdictionCustomerDataResponseV3:
      type: object
      description: Details of updated jurisdiction record
      properties:
        related_apps:
          type: array
          description: Related applications list of jurisdiction record
          items:
            type: string
        alternate_name:
          type: string
          description: Alternate name of the jurisdiction record
        type:
          type: string
          description: Type of the jurisdiction record
    ErrorV2:
      type: object
      description: Details about the error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: code of the error
            message:
              type: string
              description: message of the error
