      operationId: getQueryComparison
      parameters:
      - name: id
        in: path
        description: Unique Identifier of a comparison
        required: true
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
