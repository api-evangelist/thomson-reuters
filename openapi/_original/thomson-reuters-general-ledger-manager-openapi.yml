openapi: 3.0.1
info:
  title: GENERAL LEDGER MANAGER
  version: '1.0'
servers:
- url: https://api.onesourcetax.com/general-ledger-manager/v1
tags:
- name: Data Fields
  description: "Data Fields can be used to create Master Trial Balance that reconcile Trial Balance.\n ONESOURCE General Ledger Manager Data Fields APIs provides access to the pre-defined Data Fields for Standard Trial Balance and Tax Provision with the data type that are used during the processing, validation and classification for Trial Balances in General Ledger Manager."
- name: Processing Instructions
  description: "Documentation for Processing Instructions Service. \n ONESOURCE General Ledger Manager Processing Instructions APIs enables the definition of the expected data format and related information that is used during the data processing in GLM for the trial balances. During creation of processing instructions, users can provide source information and define, validate and enrichment information about the columns. \n Note: Providing the information on what Chart of Accounts is to be used is mandatory at the time of creating the Processing Instructions and is to be mapped to the field classified as ONESOURCE Account Code."
- name: Data Queue
  description: "Manage ingests, upload files, extensions, extract data from integrations. \n ONESOURCE General Ledger Manager Data Queue APIs enables the users to upload the trial balance data from multiple disparate sources and process it. "
- name: Trial Balance
  description: "A set of Trial Balance records that have gone through processing and are in ready, unavailable, invalid state. \n ONESOURCE General Ledger Manager Trial Balance APIs enables the users to view the various trial balance data that have been uploaded from multiple disparate sources and have been processed by GLM. Trial Balance APIs helps in providing users with the options to view and act on their data before creating the Master Trial Balance."
- name: Master Trial Balance
  description: "An aggregated set of one or more Trial Balances which are based on the same Data Fields. \n ONESOURCE General Ledger Manager Master Trial Balance APIs enables the users to group the trial balance data that have been uploaded and processed; by providing the Account Rollup (mandatory) and Entity Rollup (not mandatory). Users can create a Master Trial Balance, providing them with concise and consolidated view on their Accounts and Entities."
- name: Job Service
  description: "Documentation for jobs. \n ONESOURCE General Ledger Manager Jobs APIs enables the users to stage and process the trial balance."
- name: Query Service
  description: "Allows for the retrieval of reconciled and/or aggregated data sets from published Master Trial Balance. \n ONESOURCE General Ledger Manager Query APIs enables the access to information contained in or about a published Master Trial Balance."
- name: Query Comparisons Service
  description: "Manage all available comparisons. \n ONESOURCE Data Hub Query comparison APIs provides the comparison between datasets of two Trial Balances and/or two Master Trial Balance. A user can create a comparison of two Master Trial Balances or Trial Balance and retrieves details of those comparisons by a unique id."
security:
- bearerAuth: []
