    RegistrationData:
      title: RegistrationData
      required:
      - id
      - idType
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          example: Sample4_03_10
        idType:
          type: string
          description: "It is idType\n  * `IT:Ufficio` - Initials of the province where the Company is registered.\n  * `IT:NumeroREA` - The registration number in the \"companies register\".\n  * `IT:CapitaleSociale` - Only in the case of a company (SpA, SApA, SRL), the element must be filled in with the share capital\n  * `IT:SocioUnico` - Only in the case of a joint-stock company or limited liability company, the element must be filled in to indicate if there is a single shareholder or several shareholders.\n  * `IT:StatoLiquidazione` - Indication of whether the Company is in liquidation or not. Allowed values: LS or LN. (LS = In liquidation, LN = Not in liquidation.)\n  * `ES:Book` - Book in the register of the company.\n  * `ES:RegisterOfCompaniesLocation` - In which register the company is located.\n  * `ES:Sheet` - Sheet in the register of the company.\n  * `ES:Folio` - Folio in the register of the company.\n  * `ES:Section` - Section in the register of the company.\n  * `ES:Volume`\
            \ - Volume in the register of the company.\n  * `ES:AdditionalRegistrationData` - Other registration data.\n  * `FR:DenomSociete` - Legal name.\n  * `FR:TypeSociete` - Type of company (for example SAS).\n  * `FR:CapitalSocial` - Share capital, capital contributed to a company at the time of its creation.\n  * `FR:RCSNumber` - Trade and Companies Register number.\n  * `FR:APE` - Business activity classification code.\n  * `MY:CertEx` - Authorisation Number for Certified Exporter (e.g., ATIGA number).\n  * `PH:SellerType` - Supplier VAT Registration Allowed values: 0 or 1. 0 = VAT Registered. 1 = Non VAT registered.\n"
          enum:
          - IT:Ufficio
          - IT:NumeroREA
          - IT:CapitaleSociale
          - IT:SocioUnico
          - IT:StatoLiquidazione
          - ES:Book
          - ES:RegisterOfCompaniesLocation
          - ES:Sheet
          - ES:Folio
          - ES:Section
          - ES:Volume
          - ES:AdditionalRegistrationData
          - FR:DenomSociete
          - FR:TypeSociete
          - FR:CapitalSocial
          - FR:RCSNumber
          - FR:APE
          - MY:CertEx
          - PH:SellerType
    PostalAddress:
      title: PostalAddress
      required:
      - cityName
      - countryIdentificationCode
      - postalZone
      - streetName
      type: object
      properties:
        postbox:
          type: string
          description: Buyer/Sellers postal address post box.
          example: Po Box 351
        streetName:
          type: string
          pattern: ^(?!\s*$).+
          description: The main address line in an address  Optional but should be filled out in most cases
          example: Main Street 1
        additionalStreetName:
          type: string
          description: An additional address line in an address that can be used to give further details supplementing the main line.
          example: Around the corner
        buildingNumber:
          type: string
          description: Buyer/Sellers postal address building number.
          example: '21'
        department:
          type: string
          description: Buyer/Sellers postal address department
          example: Finance
        plotIdentification:
          type: string
          description: Buyer/Sellers postal address plot identification. Additional address number. An identifier for the piece of land associated with this address.
        citySubdivisionName:
          type: string
          description: Buyer/Sellers postal address city subdivision name. The name of the subdivision of the seller city, town, or village in which its address is located, such as the name of its district or borough.
          example: Soho
        cityName:
          type: string
          pattern: ^(?!\s*$).+
          description: Buyer/Seller's postal address city name  Optional but should be filled out in most cases
          example: London
        postalZone:
          type: string
          pattern: ^(?!\s*$).+
          description: Buyer/Seller's postal address post code    Optional but should be filled out in most cases
          example: W1G 8LZ
        countrySubentity:
          type: string
          description: Buyer/Seller's postal address province or state
          example: Region A
        countrySubentityCode:
          type: string
          description: Address province or state code.
          example: '01'
        addressLines:
          type: array
          items:
            $ref: '#/components/schemas/AddressLine'
        countryIdentificationCode:
          type: string
          pattern: ^(?!\s*$).+
          description: 'A code that identifies the country. Should be the country code from ISO3166-1: Alpha2'
          example: GB
        countryName:
          type: string
          description: Buyer/Sellers postal address country name.
          example: Great Britain
      description: A group of business terms providing information about the address  of the seller. Sufficient components of the address are to be filled to comply with legal requirements
    AddressLine:
      title: AddressLine
      description: Note that streetName and additionalStreetName should be populated prior of using this element.
      required:
      - line
      type: object
      properties:
        line:
          type: string
          pattern: ^(?!\s*$).+
          description: Address line.
          example: Sample4_03_10
    PartyTaxScheme:
      title: PartyTaxScheme
      description: Buyer/Seller's tax registration number
      required:
      - companyId
      - taxSchemeId
      type: object
      properties:
        companyId:
          type: string
          pattern: ^(?!\s*$).+
          description: The TAX identification id or the local identification
          example: UK1234554321
        taxSchemeId:
          type: string
          description: "Buyer/Seller's tax registration identifier name\n  * `OTH`\n  * `TAX`\n  * `VAT` - Value Added Tax.\n  * `GST` - Goods and Services Tax.\n  * `LOC` - Sales tax.\n  * `SST` - Sales and Services Tax.\n  * `STT` - State/provincial sales tax.\n  * `AAG` - Harmonised sales tax (HST), Canadian. A harmonized sales tax consisting of a goods and service tax, a Canadian provincial sales tax and, as applicable, a Quebec sales tax which is recoverable.\n  * `AAH` - Quebec sales tax (QST).\n  * `AAI` - Canadian provincial sales tax (PST).\n  * `IGST` - Integrated Goods and Services Tax, India.\n  * `CGST` - Central Goods and Services Tax, India.\n  * `SGST` - State Goods and Services Tax, India.\n  * `UTGST` - Union Territory Goods and Services Tax, India.\n  * `CESS` - CESS, India.\n  * `CESS Non advol` - CESS Non Ad Valorem, India.\n  * `STATECESS` - State CESS, India.\n  * `STATECESS Non Advol` - State CESS Non Ad Valorem, India."
          example: VAT
          enum:
          - OTH
          - TAX
          - VAT
          - GST
          - LOC
          - SST
          - STT
          - AAG
          - AAH
          - AAI
          - IGST
          - CGST
          - SGST
          - UTGST
          - CESS
          - CESS Non advol
          - STATECESS
          - STATECESS Non Advol
    PartyLegalEntity:
      title: PartyLegalEntity
      type: object
      required:
      - companyId
      properties:
        registrationName:
          type: string
          description: Buyer/Seller formal name or company name.
          example: Thomson Reuters Test Buyer
        companyId:
          $ref: '#/components/schemas/PartyIdentificationId'
        registrationCityName:
          type: string
          description: Buyer/Seller City
        registrationCountry:
          type: string
          description: Buyer/Seller Country
        companyLegalForm:
          type: string
          description: Relevant legal information regarding the buyer.
    Contact:
      title: Contact
      description: A group of business terms providing contact information
      type: object
      properties:
        name:
          type: string
          description: Name of contact person.  One needs to be filled out if the seller contact tag is used
          example: xyz123
        telephone:
          type: string
          description: Phone number of contact person.  One needs to be filled out if the seller contact tag is used
          example: '887654321'
        electronicMail:
          type: string
          pattern: ^[^=|+\-@].*
          description: E-mail of contact person.
          example: stefan.parge@pagero.com
