    EDocumentPeriod:
      type: object
      description: A group of business terms providing information on the document period. Also called delivery period. If the group is used, start date and/or end date must be used.
      title: EDocumentPeriod
      required:
      - endDate
      - startDate
      properties:
        startDate:
          type: string
          description: The date when the document period starts. Format = 'YYYY-MM-DD'.
          example: '2017-01-25'
          format: date
        endDate:
          type: string
          description: The date when the document period ends. Format = 'YYYY-MM-DD'
          example: '2017-01-31'
          format: date
        descriptions:
          type: array
          description: This is document description.
          items:
            type: string
            description: free text
          example:
          - free text1
          - free text2
          - free text3
    OrderReference:
      title: OrderReference
      description: Purchase order identifier - issued by the buyer. An invoice should at least have a buyer reference or purchase order reference.
      type: object
      properties:
        id:
          type: string
          description: Purchase order identifier.
          example: '98776'
        salesOrderId:
          type: string
          description: Sales order identifier, issued by the seller.
          example: '112233'
        issueDate:
          type: string
          description: Date of issue of the referenced purchase order. Format 'YYYY-MM-DD'.
          example: '2021-01-21'
          format: date
    BillingReference:
      title: BillingReference
      description: A group of business terms providing information on one or more preceding Invoices.
      required:
      - id
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          description: The identification of an invoice that was previously sent by the Seller.  Mandatory if it is a credit note
          example: inv123
        issueDate:
          type: string
          description: Issue date of a previous issued invoice. Should be provided in case the preceding invoice identifier is not unique  Format 'YYYY-MM-DD'
          example: '2017-09-15'
          format: date
        billingReferenceExtension:
          $ref: '#/components/schemas/BillingReferenceExtension'
    DespatchDocumentReference:
      title: DespatchDocumentReference
      required:
      - id
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          description: Identifier of issued despatch advice.
          example: 123321
        issueDate:
          type: string
          description: Issue date of despatch advice. Format 'YYYY-MM-DD'.
          example: '2017-09-15'
          format: date
    ReceiptDocumentReference:
      title: ReceiptDocumentReference
      required:
      - id
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          description: An identifier of a referenced receiving advice.
          example: 123321
    OriginatorDocumentReference:
      title: OriginatorDocumentReference
      required:
      - id
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          description: The identification of the call for tender or lot the invoice relates to
          example: 123321
        issueDate:
          type: string
          description: Issue date of the tender. Format 'YYYY-MM-DD'.
          example: '2017-09-15'
          format: date
    ContractDocumentReference:
      title: ContractDocumentReference
      required:
      - id
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          description: The identification of a contract
          example: 123321
        issueDate:
          type: string
          description: Issue date of the contract. Format 'YYYY-MM-DD'.
          example: '2017-09-15'
          format: date
    AdditionalDocumentReference:
      title: AdditionalDocumentReference
      description: A group of business terms providing information about additional  supporting documents substantiating the claims made in the Invoice. The additional supporting documents can be used for both referencing a document number which is expected to be known by the receiver, an external document (referenced by a URL) or as an embedded document, Base64 encoded (such as a time report)
      required:
      - id
      type: object
      properties:
        id:
          $ref: '#/components/schemas/DocumentReferenceId'
        documentTypeCode:
          type: string
          description: Should be 13 if referencing an invoiced object. Not used for other additional document references.
          example: '13'
        documentDescription:
          type: string
          description: A description of the supporting document, such as timesheet, usage report etc. If the value in cbc:DocumentDescription is 'Commercial Invoice' or 'Credit Note' the attachment will be interpreted as a an invoice presentation/image otherwise the attachment will be interpreted as a miscellaneous or 'other' type of document.
          example: Time list
    ProjectReference:
      title: ProjectReference
      required:
      - id
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          description: An identifier of the project.
          example: 123321
    AccountingSupplierParty:
      title: AccountingSupplierParty
      description: A group of business terms providing information about the seller
      required:
      - party
      type: object
      properties:
        party:
          $ref: '#/components/schemas/PartySupplier'
        accountingContact:
          $ref: '#/components/schemas/AccountingContact'
    AccountingCustomerParty:
      title: AccountingCustomerParty
      description: A group of business terms providing information about the buyer
      required:
      - party
      type: object
      properties:
        party:
          $ref: '#/components/schemas/PartyCustomer'
        accountingContact:
          $ref: '#/components/schemas/AccountingContact'
