          description: "It is an enum which defines the type of document. For invoice it is INV, for credit note it is CRN, for debit note it is DBN and for pre-payment invoice it is PIN\n  * `INV` - Invoice\n  * `CRN` - Credit note\n  * `DBN` - Debit note\n  * `PIN` - Prepayment invoice"
