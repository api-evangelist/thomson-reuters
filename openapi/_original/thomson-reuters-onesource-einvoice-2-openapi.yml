    Item:
      title: Item
      description: A group of business terms providing information about the goods and services invoiced
      required:
      - classifiedTaxCategories
      - descriptions
      - name
      type: object
      properties:
        descriptions:
          type: array
          minItems: 1
          description: It is the extra information as note.
          items:
            type: string
            description: free text
          example:
          - free text1
          - free text2
          - free text3
        name:
          type: string
          pattern: ^[^=|+\-@].*
          description: Name of the item
          example: Item name
        buyersItemIdentificationId:
          type: string
          description: buyers item identification id
        sellersItemId:
          type: string
          description: it is sellers item id
        manufacturersItemId:
          type: string
          description: it is manufacturers item id
        standardItemIdentification:
          $ref: '#/components/schemas/StandardItemIdentification'
        originCountryCode:
          type: string
          description: it is country code
        commodityClassification:
          $ref: '#/components/schemas/CommodityClassification'
          description: this commodityClassification field will be deprecated soon, so please start using new commodityClassifications array field
        commodityClassifications:
          type: array
          items:
            $ref: '#/components/schemas/CommodityClassifications'
        classifiedTaxCategories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ClassifiedTaxCategory'
        additionalItemProperties:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalItemProperty'
        itemInstances:
          type: array
          items:
            $ref: '#/components/schemas/ItemInstance'
    ItemInstance:
      title: ItemInstance
      description: A group of business terms providing additional information about item.
      type: object
      properties:
        manufactureDate:
          type: string
          description: Manufactured date Date of when the item was manufactured. Format 'YYYY-MM-DD'.
          example: '1999-01-01'
          format: date
        bestBeforeDate:
          type: string
          description: Best before date The items best before date. Format 'YYYY-MM-DD'.
          example: '1999-01-01'
          format: date
        serialId:
          type: string
          description: Serial number of the item.
          example: '123456'
        lotId:
          type: string
          description: it is lot id
        lotExpiryDate:
          type: string
          description: it is lot expiry date
          format: date
    AdditionalItemProperty:
      title: AdditionalItemProperty
      description: A group of business terms providing information about properties of the goods and services invoiced.
      type: object
      properties:
        name:
          type: string
          description: Additional item property name The name of the item property. E.g. Size.
          example: Size
        value:
          type: string
          description: Additional item information value The value of the item property. E.g. XXL.
          example: XXL
    CommodityClassification:
      title: CommodityClassification
      type: object
      properties:
        itemClassificationCode:
          $ref: '#/components/schemas/ItemClassificationCode'
    CommodityClassifications:
      title: CommodityClassifications
      type: object
      properties:
        itemClassificationCode:
          $ref: '#/components/schemas/ItemClassificationCodes'
    ClassifiedTaxCategory:
      title: ClassifiedTaxCategory
      required:
      - id
      - percent
      - taxSchemeId
      type: object
      properties:
        id:
          type: string
          description: "'Code for identifying the tax category E.g. tax category ''S'' '\n  * `AE` - Vat Reverse Charge: Code specifying that the standard VAT rate is levied from the invoicee.\n  * `E` - Exempt from Tax: Code specifying that taxes are not applicable.\n  * `S` - Standard rate: Code specifying the standard rate.\n  * `Z` - Zero rated goods: Code specifying that the goods are at a zero rate.\n  * `G` - Free export item, VAT not charged: Code specifying that the item is free export and taxes are not charged.\n  * `O` - Services outside scope of tax: Code specifying that taxes are not applicable to the services.\n  * `K` - VAT exempt for EEA intra-community supply of goods and\n              services: A tax category code indicating the item is VAT exempt due to an intra-community supply in the European Economic Area.\n  * `L` - Canary Islands general indirect tax: Impuesto General Indirecto Canario (IGIC) is an indirect tax levied on goods and services supplied in the Canary\
            \ Islands (Spain) by traders and professionals, as well as on import of goods.\n  * `M` - Tax for production, services and importation in Ceuta and\n              Melilla: Impuesto sobre la Producción, los Servicios y la Importación (IPSI) is an indirect municipal tax, levied on the production, processing and import of all kinds of movable tangible property, the supply of services and the transfer of immovable property located in the cities of Ceuta and Melilla.\n  * `B` - Transferred (VAT), In Italy: VAT not to be paid to the issuer of the invoice but directly to relevant tax authority. This code             is allowed in the EN 16931 for Italy only based on the Italian A-deviation."
          example: S
          enum:
          - AE
          - E
          - S
          - Z
          - G
          - O
          - K
          - L
          - M
          - B
        percent:
          type: number
          description: Percentage rate for the tax category
          example: 25
        taxSchemeId:
          type: string
          description: "It is type of tax scheme\n  * `VAT` - Value Added Tax.\n  * `GST` - Goods and Services Tax.\n  * `LOC` - Sales tax.\n  * `STT` - State/provincial sales tax.\n  * `AAG` - Harmonised sales tax (HST), Canadian. A harmonized sales tax consisting of a goods and service tax, a Canadian provincial sales tax and, as applicable, a Quebec sales tax which is recoverable.\n  * `AAH` - Quebec sales tax (QST).\n  * `AAI` - Canadian provincial sales tax (PST).\n  * `IGST` - Integrated Goods and Services Tax, India.\n  * `CGST` - Central Goods and Services Tax, India.\n  * `SGST` - State Goods and Services Tax, India.\n  * `UTGST` - Union Territory Goods and Services Tax, India.\n  * `CESS` - CESS, India.\n  * `CESS Non advol` - CESS Non Ad Valorem, India.\n  * `STATECESS` - State CESS, India.\n  * `STATECESS Non Advol` - State CESS Non Ad Valorem, India."
          example: VAT
          enum:
          - OTH
          - TAX
          - VAT
          - GST
          - LOC
          - STT
          - AAG
          - AAH
          - AAI
          - IGST
          - CGST
          - SGST
          - UTGST
          - CESS
          - CESS Non advol
          - STATECESS
          - STATECESS Non Advol
    Price:
      title: Price
      description: A group of business terms providing information about the price applied for the goods and services invoiced on the Invoice line.
      required:
      - priceAmount
      type: object
      properties:
        priceAmount:
          $ref: '#/components/schemas/Amount'
        baseQuantity:
          $ref: '#/components/schemas/Quantity'
        allowanceCharges:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLineAllowanceCharge'
    LineExtension:
      title: LineExtension
      description: Amount of each individual item / service within the invoice, excluding any taxes, charges or discounts.
      type: object
      properties:
        lineExclAllowanceChargeAmount:
          $ref: '#/components/schemas/Amount'
    BillingReferenceExtension:
      title: BillingReferenceExtension
      description: Description for BillingReferenceExtension - TBD.
      type: object
      properties:
        clearanceUUID:
          type: string
          pattern: ^(?!\s*$).+
          description: Clearance ID of the referenced document ID, usually assigned by the Tax Authority, of the referenced document e.g. UUID in Malaysia.
          example: Clearance ID
    StandardItemIdentification:
      title: StandardItemIdentification
      type: object
      properties:
        id:
          $ref: '#/components/schemas/PartyIdentificationId'
    DocumentReferenceId:
      title: DocumentReferenceId
      type: object
      required:
      - value
      - schemeId
      properties:
        value:
          type: string
          pattern: ^(?!\s*$).+
          description: Identifier for the referenced object/document on which the invoice is based (provided by the seller). .
          example: '1098670'
        schemeId:
          type: string
          description: "Scheme identifier of the referenced object/document\n  * `AAA` - Order acknowledgement document identifier: [1018] Reference number identifying the acknowledgement of an order.\n  * `AAB` - Proforma invoice document identifier: [1088] Reference number to identify a proforma invoice.\n  * `AAC` - Documentary credit identifier: [1172] Reference number to identify a documentary credit.\n  * `AAD` - Contract document addendum identifier: [1318] Reference number to identify an addendum to a contract.\n  * `AAE` - Goods declaration number: Reference number assigned to a goods declaration.\n  * `AAF` - Debit card number: A reference number identifying a debit card.\n  * `AAG` - Offer number: (1332) Reference number assigned by issuing party to an offer.\n  * `AAH` - Bank's batch interbank transaction reference number: Reference number allocated by the bank to a batch of different underlying interbank transactions.\n  * `AAI` - Bank's individual interbank transaction reference\
            \ number: Reference number allocated by the bank to one specific interbank transaction.\n  * `AAJ` - Delivery order number: Reference number assigned by issuer to a delivery order.\n  * `AAK` - Despatch advice number: [1035] Reference number assigned by issuing party to a despatch advice.\n  * `AAL` - Drawing number: Reference number identifying a specific product drawing.\n  * `AAM` - Waybill number: Reference number assigned to a waybill, see: 1001 = 700.\n  * `AAN` - Delivery schedule number: Reference number assigned by buyer to a delivery schedule.\n  * `AAO` - Consignment identifier, consignee assigned: [1362] Reference number assigned by the consignee to identify a particular consignment.\n  * `AAP` - Partial shipment identifier: [1310] Identifier of a shipment which is part of an order.\n  * `AAQ` - Transport equipment identifier: [8260] To identify a piece if transport equipment e.g. container or unit load device.\n  * `AAR` - Municipality assigned business registry\
            \ number: A reference number assigned by a municipality to identify a business.\n  * `AAS` - Transport contract document identifier: [1188] Reference number to identify a document evidencing a transport contract.\n  * `AAT` - Master label number: Identifies the master label number of any package type.\n  * `AAU` - Despatch note document identifier: [1128] Reference number to identify a Despatch Note.\n  * `AAV` - Enquiry number: Reference number assigned to an enquiry.\n  * `AAW` - Docket number: A reference number identifying the docket.\n  * `AAX` - Civil action number: A reference number identifying the civil action.\n  * `AAY` - Carrier's agent reference number: Reference number assigned by the carriers agent to a transaction.\n  * `AAZ` - Standard Carrier Alpha Code (SCAC) number: For maritime shipments, this code qualifies a Standard Alpha Carrier Code (SCAC) as issued by the United Stated National Motor Traffic Association Inc.\n  * `ABA` - Customs valuation decision number:\
            \ Reference by an importing party to a previous decision made by a Customs administration regarding the valuation of goods.\n  * `ABB` - End use authorization number: Reference issued by a Customs administration authorizing a preferential rate of duty if a product is used for a specified purpose, see: 1001 = 990.\n  * `ABC` - Anti-dumping case number: Reference issued by a Customs administration pertaining to a past or current investigation of goods \"dumped\" at a price lower than the exporter's domestic market price.\n  * `ABD` - Customs tariff number: (7357) Code number of the goods in accordance with the tariff nomenclature system of classification in use where the Customs declaration is made.\n  * `ABE` - Declarant's reference number: Unique reference number assigned to a document or a message by the declarant for identification purposes.\n  * `ABF` - Repair estimate number: A number identifying a repair estimate.\n  * `ABG` - Customs decision request number: Reference issued\
            \ by Customs pertaining to a pending tariff classification decision requested by an importer or agent.\n  * `ABH` - Sub-house bill of lading number: Reference assigned to a sub-house bill of lading.\n  * `ABI` - Tax payment identifier: [1168] Reference number identifying a payment of a duty or tax e.g. under a transit procedure.\n  * `ABJ` - Quota number: Reference number allocated by a government authority to identify a quota.\n  * `ABK` - Transit (onward carriage) guarantee (bond) number: Reference number to identify the guarantee or security provided for Customs transit operation (CCC).\n  * `ABL` - Customs guarantee number: Reference assigned to a Customs guarantee.\n  * `ABM` - Replacing part number: New part number which replaces the existing part number.\n  * `ABN` - Seller's catalogue number: Identification number assigned to a seller's catalogue.\n  * `ABO` - Originator's reference: A unique reference assigned by the originator.\n  * `ABP` - Declarant's Customs identity\
            \ number: Reference to the party whose posted bond or security is being declared in order to accept responsibility for a goods declaration and the applicable duties and taxes.\n  * `ABQ` - Importer reference number: Reference number assigned by the importer to identify a particular shipment for his own purposes.\n  * `ABR` - Export clearance instruction reference number: Reference number of the clearance instructions given by the consignor through different means.\n  * `ABS` - Import clearance instruction reference number: Reference number of the import clearance instructions given by the consignor/consignee through different means.\n  * `ABT` - Goods declaration document identifier, Customs: [1426] Reference number, assigned or accepted by Customs, to identify a goods declaration.\n  * `ABU` - Article number: A number that identifies an article.\n  * `ABV` - Intra-plant routing: To define routing within a plant.\n  * `ABW` - Stock keeping unit number: A number that identifies\
            \ the stock keeping unit.\n  * `ABX` - Text Element Identifier deletion reference: The reference used within a given TEI (Text Element Identifier) which is to be deleted.\n  * `ABY` - Allotment identification (Air): Reference assigned to guarantied capacity on one or more specific flights on specific date(s) to third parties as agents and other airlines.\n  * `ABZ` - Vehicle licence number: Number of the licence issued for a vehicle by an agency of government.\n  * `AC` - Air cargo transfer manifest: A number assigned to an air cargo list of goods to be transferred.\n  * `ACA` - Cargo acceptance order reference number: Reference assigned to the cargo acceptance order.\n  * `ACB` - US government agency number: A number that identifies a United States Government agency.\n  * `ACC` - Shipping unit identification: Identifying marks on the outermost unit that is used to transport merchandise.\n  * `ACD` - Additional reference number: [1010] Reference number provided in addition to\
            \ another given reference.\n  * `ACE` - Related document number: Reference number identifying a related document.\n  * `ACF` - Addressee reference: A reference number of an addressee.\n  * `ACG` - ATA carnet number: Reference number assigned to an ATA carnet.\n  * `ACH` - Packaging unit identification: Identifying marks on packing units.\n  * `ACI` - Outerpackaging unit identification: Identifying marks on packing units contained within an outermost shipping unit.\n  * `ACJ` - Customer material specification number: Number for a material specification given by customer.\n  * `ACK` - Bank reference: Cross reference issued by financial institution.\n  * `ACL` - Principal reference number: A number that identifies the principal reference.\n  * `ACN` - Collection advice document identifier: [1030] Reference number to identify a collection advice document.\n  * `ACO` - Iron charge number: Number attributed to the iron charge for the production of steel products.\n  * `ACP` - Hot roll\
