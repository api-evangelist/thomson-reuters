    DocumentResponse:
      type: object
      properties:
        responseCode:
          type: string
          description: "response code\n  * `ERR` - Error\n  * `INI` - Initiated\n  * `INP` - In progress\n  * `SUC` - Success\n  * `CLA` - Clearance accepted\n  * `CLR` - Clearance rejected\n  * `BRI` - Business response initiated\n  * `BUA` - Business accepted\n  * `BUR` - Business rejected\n  * `CAN` - Cancel\n  * `CCA` - Conditionally accepted\n  * `DDP` - Deadline passed"
          example: INP
          enum:
          - ERR
          - INI
          - INP
          - SUC
          - CLA
          - CLR
          - BRI
          - BUA
          - BUR
          - CAN
          - CCA
          - DDP
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/Status'
    Status:
      type: object
      properties:
        reasonCode:
          type: string
          example: UNAUTHORIZED
          description: "reason codes\n  * `UNAUTHORIZED` - User is not authorized\n  * `BAD_REQUEST` - Input is not correct\n  * `PUF_TRANSFORMATION_FAILED` - Failure at puf transformation \n  * `XSD_VALIDATION_FAILED` - Failure at puf validation through XSD \n  * `SCHEMATRON_VALIDATION_FAILED` - Failure at puf validation through Schematron \n  * `FAILED_TO_SUBMIT` - Failed to submit to Pagero \n  * `INTERNAL_SERVER_ERROR` - An internal server error has occured for unknown reason \n  * `FAILED_POST_SUBMIT` - Failed after submission to Pagero\n  * `DOCUMENT_CANCELLED_SUCCESSFULLY` - Document cancelled successfully\n  * `AWAITING_BUSINESS_RESPONSE` - Business response is required & is still pending\n  * `NOT_AWAITING_BUSINESS_RESPONSE` - Business response is not required\n  * `AWAITING_CLEARANCE_RESPONSE` - Clearance response is required & is still pending\n  * `NOT_AWAITING_CLEARANCE_RESPONSE` - Clearance response is not required"
          enum:
          - UNAUTHORIZED
          - BAD_REQUEST
          - PUF_TRANSFORMATION_FAILED
          - XSD_VALIDATION_FAILED
          - SCHEMATRON_VALIDATION_FAILED
          - FAILED_TO_SUBMIT
          - INTERNAL_SERVER_ERROR
          - FAILED_POST_SUBMIT
          - DOCUMENT_CANCELLED_SUCCESSFULLY
          - AWAITING_BUSINESS_RESPONSE
          - NOT_AWAITING_BUSINESS_RESPONSE
          - AWAITING_CLEARANCE_RESPONSE
          - NOT_AWAITING_CLEARANCE_RESPONSE
        reason:
          type: array
          items:
            $ref: '#/components/schemas/ReasonResponse'
    BusinessStatus:
      type: object
      required:
      - reasonCode
      properties:
        reasonCode:
          pattern: ^(?!\s*$).+
          type: string
          example: OTH
        reason:
          type: array
          items:
            $ref: '#/components/schemas/BusinessReason'
    ClearanceResponse:
      title: ClearanceResponse
      type: object
      properties:
        referenceId:
          type: string
        qrString:
          type: string
        authorityName:
          type: string
    ReasonResponse:
      title: Reason
      type: object
      properties:
        description:
          type: string
        listId:
          type: string
          example: OPStatusReason
    BusinessReason:
      title: Reason
      type: object
      properties:
        description:
          type: string
        listId:
          type: string
          example: OPStatusReason
          enum:
          - OPStatusAction
          - OPStatusReason
    DocumentReferenceDocumentStatus:
      title: DocumentReference
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          example: doc123
          description: unique id of DocumentReference
        issueDate:
          type: string
          description: issueDate of DocumentReference
          example: '2023-08-17'
          format: date
        documentType:
          type: string
          description: type of document type
        documentSubType:
          type: string
          description: type of document sub type
    PartyLegalEntityDocumentStatus:
      title: PartyLegalEntity
      type: object
      properties:
        registrationName:
          type: string
          pattern: ^(?!\s*$).+
          description: Party registration name
          example: Thomson Reuters Test Buyer
    ApplicationResponse:
      description: Response from getDocumentStatusAPI
      type: object
      properties:
        id:
          type: string
          example: tx123
          pattern: ^(?!\s*$).+
          description: id
        issueDate:
          type: string
          description: issueDate
          example: '2023-08-17'
          format: date
        sourceSystem:
          type: string
          description: It is the source of payload.
          example: ORACLE
