    CardAccount:
      title: CardAccount
      description: A group of business terms providing information about card used for payment contemporaneous with invoice issuance
      type: object
      required:
      - primaryAccountNumberId
      - networkId
      - holderName
      properties:
        primaryAccountNumberId:
          type: string
          pattern: ^(?!\s*$).+
          description: The Primary Account Number (PAN) of the card used for payment.  In accordance with card payments security standards, an invoice should never include a full card primary account number
          example: '1234'
        networkId:
          type: string
          pattern: ^(?!\s*$).+
          description: Card Network identifier, such as VISA, American Express, Master Card.
          example: VISA
        holderName:
          type: string
          pattern: ^(?!\s*$).+
          description: Name of the card holder
          example: John Doe
    PayeeFinancialAccount:
      title: PayeeFinancialAccount
      description: A group of business terms to specify credit transfer payments
      required:
      - id
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          description: Payment account number Account number
          example: GB64BARC20039585681462
        name:
          type: string
          description: The name of the payment account, at a payment service provider, to which payment should be made
          example: Payment Account
        financialInstitutionBranch:
          $ref: '#/components/schemas/FinancialInstitutionBranch'
    FinancialInstitutionBranch:
      title: FinancialInstitutionBranch
      required:
      - id
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          description: Payment account identifier e.g. a BIC or Swift.
          example: RBSSGBKC
        name:
          type: string
          description: Payment bank name The name of the bank branch or division of the bank organization, to which payment should be made.
          example: Bank Name
    PaymentTerms:
      title: PaymentTerms
      type: object
      properties:
        descriptions:
          type: array
          description: It is the extra information as note.
          items:
            type: string
            description: free text
          example:
          - free text1
          - free text2
          - free text3
        penaltySurchargePercent:
          type: string
          description: Penalty interest rate Penalty interest rate, numeric value only.
          example: '15.0'
