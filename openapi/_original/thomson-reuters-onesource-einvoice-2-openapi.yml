components:
  schemas:
    EDocument:
      title: EDocument
      description: It contains various supporting information about the document.
      required:
      - id
      - documentNumber
      - sourceSystem
      - eDocumentCurrencyCode
      - eDocumentType
      - customerType
      - issueDate
      - accountingSupplierParty
      - accountingCustomerParty
      - taxTotals
      - legalMonetaryTotal
      - documentLines
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!-)[a-zA-Z0-9-_]+$
          description: This is the unique id generated by ERP for this Document.
          example: id12345
        documentNumber:
          type: string
          pattern: ^[^=|+\-@].*
          description: A unique identification of the Document.
          example: tx123456
        sourceSystem:
          type: string
          description: It is the source of payload.
          example: Oracle
          enum:
          - SAP
          - Oracle
          - Other
        issueDate:
          type: string
          description: The date when the Invoice was issued. Format 'YYYY-MM-DD'
          example: '2023-08-17'
          format: date
        issueTime:
          type: string
          description: Issue time of the invoice. Format 'HH:mm:ss', 'HH:mm:ssZZZZ', 'HH:mm:ss.SSSZ'', or 'HH:mm:ss.SSS'.
          example: '2017-07-21T17:32:28Z'
          format: date-time
        dueDate:
          type: string
          description: The date when the payment is due Format 'YYYY-MM-DD'. It is mandatory for INV, DBN, PIN and optional for CRN
          format: date
          example: '2017-12-01'
        eDocumentType:
          $ref: '#/components/schemas/EDocumentType'
        eDocumentSubType:
          type: string
          description: "It will capture the country specific document type\n  * `TD16` - When an Italian Buyer needs to report a domestic business transaction subject to Reverse Charge (tax obligations rely on buyer instead of supplier). They will have to issue a TD16 document.\n  * `TD17` - When an Italian Buyer purchases Services from a foreign Intra-Community / EU company, or a foreign non-EU company. They will have to issue a TD17 document.\n  * `TD18` - When an Italian Buyer purchases Goods from a foreign Intra-Community / EU company, they will have to issue a TD18 document.\n  * `TD19` - When an Italian Buyer purchases Goods that are already in Italy from a foreign Intra-Community / EU company, or a foreign non-EU company. They will have to issue a TD19 document.\n  * `TD28` - When an Italian Buyer receive a VAT paper invoice for purchases of Goods and Services from San Marino, they will have to issue a TD28 document.\n  * `SELF-BILLED` - Malaysia AP cross border self billed document"
          example: TD16
          enum:
          - TD16
          - TD17
          - TD18
          - TD19
          - TD28
          - SELF-BILLED
        customerType:
          type: string
          description: "This field signifies the type of customer we are dealing with in this transaction. Supported values are B2B and B2G.\n  * `B2B` - Business to business\n  * `B2G` - Business to government"
          example: B2B
          enum:
          - B2B
          - B2G
        descriptions:
          type: array
          description: This is document description.
          items:
            type: string
            description: free text
          example:
          - free text1
          - free text2
          - free text3
        taxPointDate:
          type: string
          description: This element should be filled in if the date when VAT become liable for seller and buyer is different from the invoice issue date.
          example: '2023-08-17'
          format: date
        eDocumentCurrencyCode:
          type: string
          description: "The currency code in which the amounts is specified through out the document.\n  * `AED` - UAE Dirham\n  * `AFN` - Afghani\n  * `ALL` - Lek\n  * `AMD` - Armenian Dram\n  * `ANG` - Netherlands Antillean Guilder\n  * `AOA` - Kwanza\n  * `ARS` - Argentine Peso\n  * `AUD` - Australian Dollar\n  * `AWG` - Aruban Florin\n  * `AZN` - Azerbaijan Manat\n  * `BAM` - Convertible Mark\n  * `BBD` - Barbados Dollar\n  * `BDT` - Taka\n  * `BGN` - Bulgarian Lev\n  * `BHD` - Bahraini Dinar\n  * `BIF` - Burundi Franc\n  * `BMD` - Bermudian Dollar\n  * `BND` - Brunei Dollar\n  * `BOB` - Boliviano\n  * `BOV` - Mvdol\n  * `BRL` - Brazilian Real\n  * `BSD` - Bahamian Dollar\n  * `BTN` - Ngultrum\n  * `BWP` - Pula\n  * `BYN` - Belarusian Ruble\n  * `BZD` - Belize Dollar\n  * `CAD` - Canadian Dollar\n  * `CDF` - Congolese Franc\n  * `CHE` - WIR Euro\n  * `CHF` - Swiss Franc\n  * `CHW` - WIR Franc\n  * `CLF` - Unidad de Fomento\n  * `CLP` - Chilean Peso\n  * `CNY` - Yuan Renminbi\n  * `COP`\
            \ - Colombian Peso\n  * `COU` - Unidad de Valor Real\n  * `CRC` - Costa Rican Colon\n  * `CUC` - Peso Convertible\n  * `CUP` - Cuban Peso\n  * `CVE` - Cabo Verde Escudo\n  * `CZK` - Czech Koruna\n  * `DJF` - Djibouti Franc\n  * `DKK` - Danish Krone\n  * `DOP` - Dominican Peso\n  * `DZD` - Algerian Dinar\n  * `EGP` - Egyptian Pound\n  * `ERN` - Nakfa\n  * `ETB` - Ethiopian Birr\n  * `EUR` - Euro\n  * `FJD` - Fiji Dollar\n  * `FKP` - Falkland Islands Pound\n  * `GBP` - Pound Sterling\n  * `GEL` - Lari\n  * `GHS` - Ghana Cedi\n  * `GIP` - Gibraltar Pound\n  * `GMD` - Dalasi\n  * `GNF` - Guinean Franc\n  * `GTQ` - Quetzal\n  * `GYD` - Guyana Dollar\n  * `HKD` - Hong Kong Dollar\n  * `HNL` - Lempira\n  * `HRK` - Kuna\n  * `HTG` - Gourde\n  * `HUF` - Forint\n  * `IDR` - Rupiah\n  * `ILS` - New Israeli Sheqel\n  * `INR` - Indian Rupee\n  * `IQD` - Iraqi Dinar\n  * `IRR` - Iranian Rial\n  * `ISK` - Iceland Krona\n  * `JMD` - Jamaican Dollar\n  * `JOD` - Jordanian Dinar\n  * `JPY` - Yen\n\
