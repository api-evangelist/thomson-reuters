        name:
          type: string
          description: MSIC industry classification name.
          example: AGRICULTURE, FORESTRY AND FISHING
    AccountingContact:
      title: AccountingContact
      description: Contact details of the accounting contact of the organization
      type: object
      properties:
        telephone:
          type: string
          description: The telephone number for the accounting contact of the organization
          example: '887654321'
        telefax:
          type: string
          description: The telefax number for the accounting contact of the organization.
          example: '887654322'
        electronicMail:
          type: string
          pattern: ^[^=|+\-@].*
          description: The e-mail address for the accounting contact of the organization. (Also used for distribution via email in Pagero Online).
          example: stefan.parge@pagero.com
    PayeeParty:
      title: PayeeParty
      description: A group of business terms providing information about the payee, i.e. the role that receives the payment. Shall be used when the payee is different from the seller
      type: object
      required:
      - partyName
      properties:
        partyIdentificationId:
          $ref: '#/components/schemas/PartyIdentificationId'
        partyName:
          type: string
          pattern: ^(?!\s*$).+
          description: name of the party(buyer/seller)
          example: Sample4_03_10
        partyLegalEntities:
          type: array
          items:
            $ref: '#/components/schemas/PartyLegalEntity'
    BuyerCustomerParty:
      title: BuyerCustomerParty
      description: This party should contain information regarding the buyer of the goods or service and should only be used if the buyer party differs from accounting customer party.  If cac:BuyerCustomerParty is used, the cac:AccountingCustomerParty is to be considered the receiver of the document.
      required:
      - party
      type: object
      properties:
        party:
          $ref: '#/components/schemas/PartyCustomer'
        accountingContact:
          $ref: '#/components/schemas/AccountingContact'
    TaxRepresentativeParty:
      title: TaxRepresentativeParty
      description: A group of business terms providing information about the seller's tax representative
      required:
      - party
      type: object
      properties:
        party:
          $ref: '#/components/schemas/PartyCustomer'
    Delivery:
      title: Delivery
      description: A group of business terms providing information about where and when the goods and services invoiced are delivered
      type: object
      properties:
        actualDeliveryDate:
          type: string
          description: The date on which the supply of goods or services was made or completed. Format = 'YYYY-MM-DD'
          example: '2017-12-01'
          format: date
        latestDeliveryDate:
          type: string
          description: The latest date of delivery allowed by the buyer.  Format = 'YYYY-MM-DD'
          example: '2017-12-31'
          format: date
        deliveryLocation:
          $ref: '#/components/schemas/DeliveryLocation'
        deliveryParty:
          $ref: '#/components/schemas/DeliveryParty'
        despatchParty:
          $ref: '#/components/schemas/DespatchParty'
    DeliveryLocation:
      title: DeliveryLocation
      required:
      - id
      type: object
      properties:
        id:
          $ref: '#/components/schemas/PartyIdentificationId'
        descriptions:
          type: array
          description: It is the extra information as note.
          items:
            type: string
            description: free text
          example:
          - free text1
          - free text2
          - free text3
        address:
          $ref: '#/components/schemas/PostalAddress'
    DeliveryParty:
      title: DeliveryParty
      required:
      - partyName
      type: object
      properties:
        partyIdentificationId:
          $ref: '#/components/schemas/PartyIdentificationId'
        partyName:
          type: string
          pattern: ^(?!\s*$).+
          description: name of the party(buyer/seller)
          example: Sample4_03_10
        contact:
          $ref: '#/components/schemas/Contact'
    DespatchParty:
      title: DespatchParty
      type: object
      properties:
        partyName:
          type: string
          description: name of the party(buyer/seller)
          example: Sample4_03_10
        postalAddress:
          $ref: '#/components/schemas/PostalAddress'
    DeliveryTerms:
      title: DeliveryTerms
      type: object
      properties:
        id:
          type: string
          description: A set of international trade rules that define the responsibilities of buyers and suppliers. The input of special characters is not allowed.
        specialTerms:
          type: string
          description: Delivery Terms Description of the delivery terms.
        lossRiskResponsibilityCode:
          type: string
          description: Code to identify the responsibility for the loss risk
        lossRisk:
          type: string
          description: A description of the responsibility for the loss risk
    PaymentMeans:
      title: PaymentMeans
      description: A group of business terms providing information about the payment.
      required:
      - code
      type: object
      properties:
        code:
          type: string
          description: "Code for how the payment is to be settled\n  * `1` - Instrument not defined: Not defined legally enforceable agreement between two or more parties (expressing a contractual right or a right to the payment of money).\n  * `2` - Automated clearing house credit: A credit transaction made through the automated clearing house system.\n  * `3` - Automated clearing house debit: A debit transaction made through the automated clearing house system.\n  * `4` - ACH demand debit reversal: A request to reverse an ACH debit transaction to a demand deposit account.\n  * `5` - ACH demand credit reversal: A request to reverse a credit transaction to a demand deposit account.\n  * `6` - ACH demand credit: A credit transaction made through the ACH system to a demand deposit account.\n  * `7` - ACH demand debit: A debit transaction made through the ACH system to a demand deposit account.\n  * `8` - Hold: Indicates that the bank should hold the payment for collection by the beneficiary\
            \ or other instructions.\n  * `9` - National or regional clearing: Indicates that the payment should be made using the national or regional clearing.\n  * `10` - In cash: Payment by currency (including bills and coins) in circulation, including checking account deposits.\n  * `11` - ACH savings credit reversal: A request to reverse an ACH credit transaction to a savings account.\n  * `12` - ACH savings debit reversal: A request to reverse an ACH debit transaction to a savings account.\n  * `13` - ACH savings credit: A credit transaction made through the ACH system to a savings account.\n  * `14` - ACH savings debit: A debit transaction made through the ACH system to a savings account.\n  * `15` - Bookentry credit: A credit entry between two accounts at the same bank branch. Synonym: house credit.\n  * `16` - Bookentry debit: A debit entry between two accounts at the same bank branch. Synonym: house debit.\n  * `17` - ACH demand cash concentration/disbursement (CCD) credit: A\
            \ credit transaction made through the ACH system to a demand deposit account using the CCD payment format.\n  * `18` - ACH demand cash concentration/disbursement (CCD) debit: A debit transaction made through the ACH system to a demand deposit account using the CCD payment format.\n  * `19` - ACH demand corporate trade payment (CTP) credit: A credit transaction made through the ACH system to a demand deposit account using the CTP payment format.\n  * `20` - Cheque: Payment by a pre-printed form on which instructions are given to an account holder (a bank or building society) to pay a stated sum to a named recipient.\n  * `21` - Banker's draft: Issue of a banker's draft in payment of the funds.\n  * `22` - Certified banker's draft: Cheque drawn by a bank on itself or its agent. A person who owes money to another buys the draft from a bank for cash and hands it to the creditor who need have no fear that it might be dishonoured.\n  * `23` - Bank cheque (issued by a banking or similar\
            \ establishment): Payment by a pre-printed form, which has been completed by a financial institution, on which instructions are given to an account holder (a bank or building society) to pay a stated sum to a named recipient.\n  * `24` - Bill of exchange awaiting acceptance: Bill drawn by the creditor on the debtor but not yet accepted by the debtor.\n  * `25` - Certified cheque: Payment by a pre-printed form stamped with the paying bank's certification on which instructions are given to an account holder (a bank or building society) to pay a stated sum to a named recipient .\n  * `26` - Local cheque: Indicates that the cheque is given local to the recipient.\n  * `27` - ACH demand corporate trade payment (CTP) debit: A debit transaction made through the ACH system to a demand deposit account using the CTP payment format.\n  * `28` - ACH demand corporate trade exchange (CTX) credit: A credit transaction made through the ACH system to a demand deposit account using the CTX payment\
            \ format.\n  * `29` - ACH demand corporate trade exchange (CTX) debit: A debit transaction made through the ACH system to a demand account using the CTX payment format.\n  * `30` - Credit transfer: Payment by credit movement of funds from one account to another.\n  * `31` - Debit transfer: Payment by debit movement of funds from one account to another.\n  * `32` - ACH demand cash concentration/disbursement plus (CCD+) credit: A credit transaction made through the ACH system to a demand deposit account using the CCD+ payment format.\n  * `33` - ACH demand cash concentration/disbursement plus (CCD+) debit: A debit transaction made through the ACH system to a demand deposit account using the CCD+ payment format.\n  * `34` - ACH prearranged payment and deposit (PPD): A consumer credit transaction made through the ACH system to a demand deposit or savings account.\n  * `35` - ACH savings cash concentration/disbursement (CCD) credit: A credit transaction made through the ACH system\
            \ to a demand deposit or savings account.\n  * `36` - ACH savings cash concentration/disbursement (CCD) debit: A debit transaction made through the ACH system to a savings account using the CCD payment format.\n  * `37` - ACH savings corporate trade payment (CTP) credit: A credit transaction made through the ACH system to a savings account using the CTP payment format.\n  * `38` - ACH savings corporate trade payment (CTP) debit: A debit transaction made through the ACH system to a savings account using the CTP payment format.\n  * `39` - ACH savings corporate trade exchange (CTX) credit: A credit transaction made through the ACH system to a savings account using the CTX payment format.\n  * `40` - ACH savings corporate trade exchange (CTX) debit: A debit transaction made through the ACH system to a savings account using the CTX payment format.\n  * `41` - ACH savings cash concentration/disbursement plus (CCD+) credit: A credit transaction made through the ACH system to a savings\
            \ account using the CCD+ payment format.\n  * `42` - Payment to bank account: Payment by an arrangement for settling debts that is operated by the Post Office.\n  * `43` - ACH savings cash concentration/disbursement plus (CCD+) debit: A debit transaction made through the ACH system to a savings account using the CCD+ payment format.\n  * `44` - Accepted bill of exchange: Bill drawn by the creditor on the debtor and accepted by the debtor.\n  * `45` - Referenced home-banking credit transfer: A referenced credit transfer initiated through home- banking.\n  * `46` - Interbank debit transfer: A debit transfer via interbank means.\n  * `47` - Home-banking debit transfer: A debit transfer initiated through home-banking.\n  * `48` - Bank card: Payment by means of a card issued by a bank or other financial institution.\n  * `49` - Direct debit: The amount is to be, or has been, directly debited to the customer's bank account.\n  * `50` - Payment by postgiro: A method for the transmission\
            \ of funds through the postal system rather than through the banking system.\n  * `51` - FR, norme 6 97-Telereglement CFONB (French Organisation for: Banking Standards) - Option A A French standard procedure that allows a debtor to pay an amount due to a creditor. The creditor will forward it to its bank, which will collect the money on the bank account of the debtor.\n  * `52` - Urgent commercial payment: Payment order which requires guaranteed processing by the most appropriate means to ensure it occurs on the requested execution date, provided that it is issued to the ordered bank before the agreed cut-off time.\n  * `53` - Urgent Treasury Payment: Payment order or transfer which must be executed, by the most appropriate means, as urgently as possible and before urgent commercial payments.\n  * `54` - Credit card: Payment made by means of credit card.\n  * `55` - Debit card: Payment made by means of debit card.\n  * `56` - Bankgiro: Payment will be, or has been, made by bankgiro.\n\
            \  * `57` - Standing agreement: The payment means have been previously agreed between seller and buyer and thus are not stated again.\n  * `58` - SEPA credit transfer: Credit transfer inside the Single Euro Payment Area (SEPA) system.\n  * `59` - SEPA direct debit: Direct debit inside the Single Euro Payment Area (SEPA) system.\n  * `60` - Promissory note: Payment by an unconditional promise in writing made by one person to another, signed by the maker, engaging to pay on demand or at a fixed or determinable future time a sum certain in money, to order or to bearer.\n  * `61` - Promissory note signed by the debtor: Payment by an unconditional promise in writing made by the debtor to another person, signed by the debtor, engaging to pay on demand or at a fixed or determinable future time a sum certain in money, to order or to bearer.\n  * `62` - Promissory note signed by the debtor and endorsed by a bank: Payment by an unconditional promise in writing made by the debtor to another\
            \ person, signed by the debtor and endorsed by a bank, engaging to pay on demand or at a fixed or determinable future time a sum certain in money, to order or to bearer.\n  * `63` - Promissory note signed by the debtor and endorsed by a third party: Payment by an unconditional promise in writing made by the debtor to another person, signed by the debtor and endorsed by a third party, engaging to pay on demand or at a fixed or determinable future time a sum certain in money, to order or to bearer.\n  * `64` - Promissory note signed by a bank: Payment by an unconditional promise in writing made by the bank to another person, signed by the bank, engaging to pay on demand or at a fixed or determinable future time a sum certain in money, to order or to bearer.\n  * `65` - Promissory note signed by a bank and endorsed by another bank: Payment by an unconditional promise in writing made by the bank to another person, signed by the bank and endorsed by another bank, engaging to pay on\
            \ demand or at a fixed or determinable future time a sum certain in money, to order or to bearer.\n  * `66` - Promissory note signed by a third party: Payment by an unconditional promise in writing made by a third party to another person, signed by the third party, engaging to pay on demand or at a fixed or determinable future time a sum certain in money, to order or to bearer.\n  * `67` - Promissory note signed by a third party and endorsed by a bank: Payment by an unconditional promise in writing made by a third party to another person, signed by the third party and endorsed by a bank, engaging to pay on demand or at a fixed or determinable future time a sum certain in money, to order or to bearer.\n  * `68` - Online payment service: Payment will be made or has been made by an online payment service.\n  * `70` - Bill drawn by the creditor on the debtor: Bill drawn by the creditor on the debtor.\n  * `74` - Bill drawn by the creditor on a bank: Bill drawn by the creditor on\
            \ a bank.\n  * `75` - Bill drawn by the creditor, endorsed by another bank: Bill drawn by the creditor, endorsed by another bank.\n  * `76` - Bill drawn by the creditor on a bank and endorsed by a third party: Bill drawn by the creditor on a bank and endorsed by a third party.\n  * `77` - Bill drawn by the creditor on a third party: Bill drawn by the creditor on a third party.\n  * `78` - Bill drawn by creditor on third party, accepted and endorsed by bank: Bill drawn by creditor on third party, accepted and endorsed by bank.\n  * `91` - Not transferable banker's draft: Issue a bankers draft not endorsable.\n  * `92` - Not transferable local cheque: Issue a cheque not endorsable in payment of the funds.\n  * `93` - Reference giro: Ordering customer tells the bank to use the payment system 'Reference giro'. Used in the Finnish national banking system.\n  * `94` - Urgent giro: Ordering customer tells the bank to use the bank service 'Urgent Giro' when transferring the payment.\
