    TaxTotal:
      title: TaxTotal
      description: When tax currency code is provided, two instances of the tax total must be present
      required:
      - taxAmount
      - taxSubtotals
      type: object
      properties:
        taxAmount:
          $ref: '#/components/schemas/Amount'
        taxSubtotals:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TaxSubtotal'
    TaxTotalDocLine:
      title: TaxTotalDocLine
      description: When tax currency code is provided, two instances of the tax total must be present
      required:
      - taxAmount
      - taxSubtotals
      type: object
      properties:
        taxAmount:
          $ref: '#/components/schemas/Amount'
        taxSubtotals:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TaxSubtotalDocLine'
    TaxSubtotal:
      title: TaxSubtotal
      description: A group of business terms providing information about VAT breakdown by different categories, rates and exemption reasons  One segment for each VAT rate on the invoice
      required:
      - taxAmount
      - taxCategory
      - taxableAmount
      type: object
      properties:
        taxAmount:
          $ref: '#/components/schemas/Amount'
        taxableAmount:
          $ref: '#/components/schemas/Amount'
        taxCategory:
          $ref: '#/components/schemas/TaxCategory'
        taxChargeability:
          type: string
          description: "Possible values to provide\n  * `I` - VAT with immediate chargeability\n  * `D` - VAT unrealized\n  * `S` - Splitting of payments\n"
          enum:
          - I
          - D
          - S
    TaxSubtotalDocLine:
      title: TaxSubtotalDocLine
      description: A group of business terms providing information about VAT breakdown by different categories, rates and exemption reasons  One segment for each VAT rate on the invoice
      required:
      - taxAmount
      - taxCategory
      - taxableAmount
      type: object
      properties:
        taxAmount:
          $ref: '#/components/schemas/Amount'
        taxableAmount:
          $ref: '#/components/schemas/Amount'
        taxCategory:
          $ref: '#/components/schemas/TaxCategory'
        taxChargeability:
          type: string
          description: "Possible values to provide\n  * `I` - VAT with immediate chargeability\n  * `D` - VAT unrealized\n  * `S` - Splitting of payments\n"
          enum:
          - I
          - D
          - S
    LegalMonetaryTotal:
      title: LegalMonetaryTotal
      description: A group of business terms providing the monetary totals for the  Invoice
      required:
      - lineExtensionAmount
      - payableAmount
      - taxExclusiveAmount
      - taxInclusiveAmount
      type: object
      properties:
        lineExtensionAmount:
          $ref: '#/components/schemas/Amount'
        taxExclusiveAmount:
          $ref: '#/components/schemas/Amount'
        taxInclusiveAmount:
          $ref: '#/components/schemas/Amount'
        allowanceTotalAmount:
          $ref: '#/components/schemas/Amount'
        chargeTotalAmount:
          $ref: '#/components/schemas/Amount'
        prepaidAmount:
          $ref: '#/components/schemas/Amount'
        payableRoundingAmount:
          $ref: '#/components/schemas/Amount'
        payableAmount:
          $ref: '#/components/schemas/Amount'
    DocumentLine:
      title: DocumentLine
      description: A group of business terms providing information on individual Invoice lines.   One instance for each invoice line  Different element name if a credit invoice (CreditNote/cac:CreditNoteLine)
      required:
      - id
      - quantity
      - item
      - lineExtensionAmount
      - price
      - taxTotals
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!-)[a-zA-Z0-9-_]+$
          description: Unique line identifier
          example: '1'
        descriptions:
          type: array
          description: It is the extra information as note.
          items:
            type: string
            description: free text
          example:
          - free text1
          - free text2
          - free text3
        lineExtension:
          $ref: '#/components/schemas/LineExtension'
        quantity:
          $ref: '#/components/schemas/Quantity'
        lineExtensionAmount:
          $ref: '#/components/schemas/Amount'
        accountingCost:
          type: string
          description: Line book keeping reference for buyers financial system
          example: 1287:65464
        documentPeriods:
          type: array
          items:
            $ref: '#/components/schemas/EDocumentPeriod'
        orderLineReferences:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineReference'
        despatchLineReferences:
          type: array
          items:
            $ref: '#/components/schemas/DespatchLineReference'
        documentReferences:
          type: array
          items:
            $ref: '#/components/schemas/DocumentReference'
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLineDelivery'
        allowanceCharges:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLineAllowanceCharge'
        taxTotals:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TaxTotalDocLine'
        item:
          $ref: '#/components/schemas/Item'
        price:
          $ref: '#/components/schemas/Price'
    OrderLineReference:
      title: OrderLineReference
      required:
      - id
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          description: An identifier for a referenced line within a purchase order, issued by the buyer
          example: '1'
        salesOrderLineId:
          type: string
          description: Sales Order line reference Reference to the sales order line.
          example: '1'
        orderReference:
          $ref: '#/components/schemas/OrderReference'
    DespatchLineReference:
      title: DespatchLineReference
      required:
      - id
      type: object
      properties:
        id:
          type: string
          pattern: ^(?!\s*$).+
          description: Despatch advice line reference Reference to the despatch advice line.
          example: '1'
        documentReference:
          $ref: '#/components/schemas/DespatchDocumentReference'
    DocumentReference:
      title: DocumentReference
      required:
      - id
      type: object
      properties:
        id:
          $ref: '#/components/schemas/DocumentReferenceId'
        issueDate:
          type: string
          description: Issue date of the referenced document Format 'YYYY-MM-DD'.
          example: '1999-01-01'
          format: date
        issueTime:
          type: string
          description: Issue time of the referenced document Format 'HH:mm:ss', 'HH:mm:ssZZZZ', 'HH:mm:ss.SSSZ'', or 'HH:mm:ss.SSS'.
          example: '2017-07-21T17:32:28Z'
          format: date-time
        documentTypeCode:
          type: string
          description: Document type code Document type code should be '130' if referencing an invoiced object.
          example: '130'
          default: '130'
    DocumentLineDelivery:
      title: Delivery
      description: A group of business terms providing information about where and when the goods and services (on this specific row) is invoiced are delivered.   Should be used if the delivery location is not the same for the entire invoice or the recipient has a special request.
      type: object
      required:
      - quantity
      - actualDeliveryDate
      properties:
        quantity:
          $ref: '#/components/schemas/Quantity'
        actualDeliveryDate:
          type: string
          description: Delivery date Date of delivery. Format = 'YYYY-MM-DD'
          example: '2017-12-01'
          format: date
        deliveryLocation:
          $ref: '#/components/schemas/DeliveryLocation'
    DocumentLineAllowanceCharge:
