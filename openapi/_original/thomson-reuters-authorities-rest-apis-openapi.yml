openapi: 3.0.1
info:
  title: Authorities REST APIs
  description: Authorities REST APIs enable you to access Authorities data
  contact:
    name: Team Spartans
    email: IDT_Spartans@thomsonreuters.com
  version: '1.0'
servers:
- url: https://api-cloud-qa.onesourcetax.com/indirect-tax-determination/authority-services/beta
- url: https://api-cloud-uat.onesourcetax.com/indirect-tax-determination/authority-services/beta
  description: UAT test environment
- url: https://api.onesourcetax.com/indirect-tax-determination/authority-services/beta
  description: AMER region Production environment
- url: https://api-emea.onesourcetax.com/indirect-tax-determination/authority-services/beta
  description: EMEA region Production environment
security:
- ApiKeyAuth: []
tags:
- name: authority-api-controller
  description: Operations related to authority API controller
- name: zones-api-controller
  description: Operations related to zones API controller
paths:
  /authorities/standard/countries/{countryCode}/regions/{regionCode}:
    get:
      tags:
      - authority-api-controller
      summary: Retrieve Standard Authorities
      description: Fetches Standard Authorities that support Pagination and Filter.
      operationId: getStandardAuthorityList
      parameters:
      - name: regionCode
        in: path
        required: true
        schema:
          type: string
      - name: countryCode
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionAuthoritiesCustomResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized access
        '403':
          description: Forbidden access
        '404':
          description: Not Found
        '500':
          description: Internal Server Error. For more details check the logs
  /authorities/custom/companies/{companyName}:
    get:
      tags:
      - authority-api-controller
      summary: Retrieve Custom Authorities
      description: Fetches Custom Authorities that support Pagination and Filter.
      operationId: getCustomAuthorityList
      parameters:
      - name: companyName
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionAuthoritiesCustomResponse'
  /zones/countries:
    get:
      tags:
      - zones-api-controller
      summary: Retrieve Countries
      description: Fetches Countries that support Pagination and Filter.
      operationId: getCountryList
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionCountriesResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized access
        '403':
          description: Forbidden access
        '404':
          description: Not Found
        '500':
          description: Internal Server Error. For more details check the logs
  /zones/authorities/countries/{countryCode}/regions:
    get:
      tags:
      - zones-api-controller
      summary: Retrieve Regions/States
      description: Fetches Regions/States that support Pagination and Filter.
      operationId: getRegionsList
      parameters:
      - name: countryCode
        in: path
        required: true
        schema:
          type: string
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionRegionsResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized access
        '403':
          description: Forbidden access
        '404':
          description: Not Found
        '500':
          description: Internal Server Error. For more details check the logs
