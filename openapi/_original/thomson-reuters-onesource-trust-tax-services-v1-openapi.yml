          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
  /v1/assets/operations/{id}:
    get:
      tags:
      - Asset
      summary: Allows an authenticated user to retrieve the asset operation status.
      description: Allows an authenticated user to retrieve the asset operation status.
      operationId: Retrieve Asset Update Operation status.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
