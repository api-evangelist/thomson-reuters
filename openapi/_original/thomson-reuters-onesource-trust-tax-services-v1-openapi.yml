openapi: 3.0.3
info:
  title: ONESOURCE Trust Tax Services - V1
  version: '2.0'
  description: ONESOURCE Trust Tax is a comprehensive and integrated web application that automates the trust tax process from the initial bridging of trust accounting data to the final print and filing of completed tax returns. Our selection of RESTful APIs allows authenticated ONESOURCE Trust Tax users direct access to specified functions within the ONESOURCE Trust Tax application. For example, the Account APIs allow authenticated ONESOURCE Trust Tax users to retrieve a paginated list of Product Access Numbers (PANs), or to retrieve a paginated list of accounts in the current tax year or any of the four prior tax years for a specific PAN. The Partnership Schedule K1 APIs allow for retrieving the import status for a partnership K-1 or importing partnership K-1 amounts into ONESOURCE Trust Tax.
servers:
- url: https://api.onesourcetax.com/trust-tax
security:
- bearerAuth: []
paths:
  /v1/pans:
    get:
      tags:
      - Account
      summary: Allows an authenticated user to retrieve list of allowed PANs.
      description: Allows an authenticated user to retrieve list of allowed PANs.
      operationId: Retrieve a PAN List
      parameters:
      - name: all-pans
        in: query
        description: A value of true returns a list of all PANs. A value of false or blank returns only the list of PANs the user is granted access to.
        schema:
          type: boolean
          description: A value of true returns a list of all PANs. A value of false or blank returns only the list of PANs the user is granted access to.
      - name: top
        in: query
        description: The number of items to return per page in the response. The value must be a positive number. A value of blank returns the default number of items.
        schema:
          type: integer
          description: The number of items to return per page in the response. The value must be a positive number. A value of blank returns the default number of items.
          format: int32
      - name: skip
        in: query
        description: The number of items to skip. The value must be a positive number.
        schema:
          type: integer
          description: The number of items to skip. The value must be a positive number.
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanResponseModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
  /v1/pans/{pan}/accounts:
    get:
      tags:
      - Account
      summary: Allows an authenticated user to retrieve a paginated list of accounts for a specific PAN, in the current tax year and up to four prior tax years.
      description: Allows an authenticated user to retrieve a paginated list of accounts for a specific PAN, in the current tax year and up to four prior tax years.
      operationId: Retrieve an Account List for a PAN
      parameters:
      - name: pan
        in: path
        description: Filters the response based on Product Access Number.
        required: true
        schema:
          type: string
          description: Filters the response based on Product Access Number.
          nullable: true
      - name: tax-year
        in: query
        description: Filters the response based on the tax year. The value can be the current tax year or any of the four prior tax years.
        schema:
          type: integer
          description: Filters the response based on the tax year. The value can be the current tax year or any of the four prior tax years.
          format: int32
      - name: top
        in: query
        description: The number of items to return per page in the response. The value must be a positive number. A value of blank returns the default number of items.
        schema:
          type: integer
          description: The number of items to return per page in the response. The value must be a positive number. A value of blank returns the default number of items.
          format: int32
      - name: skip
        in: query
        description: The number of items to skip. The value must be a positive number.
        schema:
          type: integer
          description: The number of items to skip. The value must be a positive number.
          format: int32
      responses:
        '200':
          description: Success
          content:
