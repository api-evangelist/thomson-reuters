      summary: "Allows an authenticated user to import Scorp K1 amounts for each of the participants accounts.\r\nThis data will be displayed on the ONESOURCE Trust Tax Software K1 Input screens and will feed to the 1041 tax return and will be used in estimate calculations. Year 2020."
