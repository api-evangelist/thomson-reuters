definitions:
  AuthorizationRequest:
    type: object
    example:
      client_id: wrrAGpAG6yjvKXhVfpF7ngxA5QxNYzHU
      code: pDuc8tKv
      client_secret: Tny5ztH9UqteAiHA
      scope: urn:tr:gosystem:auth:api:taxreturn,urn:tr:gosystem:auth:firm:FT,urn:tr:gosystem:auth:location:FTSUPPORT
      grant_type: authorization_code
    properties:
      client_id:
        type: string
        description: The Client ID (also called Consumer Key) is a unique identifier for your application that's used to authenticate API requests. You can find it in the Thomson Reuters Developer Portal under GoSystem API > My Keys by selecting the eye icon next to your application.
      code:
        type: string
        description: Authorization code from auth-code.
      client_secret:
        type: string
        description: The Client Secret is a confidential key paired with the Client ID to securely authenticate your application. It should be kept private and is also available in the My Keys section of the Thomson Reuters Developer Portal.
      scope:
        type: string
        example: '"urn:tr:gosystem:auth:api:taxreturn","urn:tr:gosystem:auth:firm:FT","urn:tr:gogsystem:auth:location:FTSUPPORT"'
        description: ''
      grant_type:
        type: string
        example: authorization_code
        description: authorization_code
