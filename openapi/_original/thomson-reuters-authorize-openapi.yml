      - name: login_id
        in: formData
        type: string
        description: GoSystem sign-in ID of the user.
        required: true
        default: QAAUTOMATION21
      - name: firm
        in: formData
        type: string
        description: Firm name associated with the request.
        required: true
        default: 2WF5
      - name: center
        in: formData
        type: string
        description: Location of the user.
        required: true
        default: '***'
      - name: state
        in: formData
        type: string
        description: State code for the request. This is a random unique identifier.
        required: true
        default: abc
      - name: api_token
        in: formData
        type: string
        description: You can retrieve the token by signing in to GoSystem Tax > Options > API Token in the application interface.
        required: true
        default: 293A83913F8B99B13CE64A263365BCE918BA8C785160B88BBA8A1C3B28472DE59447D85CD7794406A2C4CE0261355DCAC6324E6B62EB59803F5F144A274A25B0CAF6E9AC9A
      responses:
