openapi: 3.0.1
info:
  version: '2.0'
  title: API documentation for Authorities services
servers:
- url: https://api.onesourcetax.com/administration/v1
paths:
  /authorities:
    get:
      tags:
      - Authorities
      summary: Retrieve a list of Authorities
      description: Use this operation to fetch a standard list of authorities in ONESOURCE. Enter the jurisdiction and domain type to further filter the list of authorities. Authority name can also be entered to retrieve a particular authority
      operationId: Retrieve a list of Authorities
      parameters:
      - name: Accept-Language
        in: header
        description: Accept Language
        schema:
          type: string
      - name: X-LoneStar-AccountId
        in: header
        description: AccountId you want to access if you are a support user
        schema:
          type: string
      - name: clientId
        in: header
        description: Client Id of the tenant
        schema:
          type: string
      - name: jurisdiction_type
        in: query
        description: The Jurisdiction type that will be searched.
        schema:
          type: string
      - name: domain_type
        in: query
        description: The domain type that will be searched.
        schema:
          type: string
      - name: name
        in: query
        description: The authorityName that will be searched.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoritySearchResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
        '500':
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV1'
      security:
      - Authorization: []
