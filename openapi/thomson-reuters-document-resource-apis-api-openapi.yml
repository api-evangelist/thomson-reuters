      description: 'This API method adds or updates file permissions for a group/user.

        Please note the permissions can only be added to the existing permissions inherited from the parent folder and does not allow the removal of the inherited permissions from the parent folder in which the file exists.

        usergrouptype In request xml are 1 for user based site and 2 for group based site.'
      operationId: updateFileGroupPermission
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '3'
      - name: fileid
        in: path
        description: The ID for the file. To get the file id, use get files list API
        required: true
        schema:
          type: string
      - name: foldertype
        in: query
        description: the foldertype=qa for Q&A file support from version 5
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/UserGroupPermissions'
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupPermissions'
    servers:
    - url: /monumentuat/api
