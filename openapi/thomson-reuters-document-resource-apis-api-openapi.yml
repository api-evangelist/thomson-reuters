openapi: 3.2.0
info:
  title: Thomson Reuters Document Resource APIs API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Document Resource APIs across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Document Resource APIs
paths:
  /{version}/files/{fileid}/parent:
    post:
      tags:
      - Document Resource APIs
      summary: Copy file
      description: 'Copy a file from one location to another. In case of a copy operation the target folder can be a folder in another site.

        While copying the file, the version history and permissions will not be copied over, but the permissions for the new folder to which the file is being moved is going to be applied to the copied file.'
      operationId: copyFile
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: fileid
        in: path
        description: The id of the file which needs to be copied
        required: true
        schema:
          type: string
      - name: targetfolder
        in: query
        description: The target folder id of the folder under which the file will be copied
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Your content is copied successfull...
        '400':
          description: Request resource or xml is not valid
        '403':
          description: Access denied
      security:
      - OAuth: []
    put:
      tags:
      - Document Resource APIs
      summary: Move file
      description: Move a single file from one location to another. A file can only be moved within a site.
      operationId: moveFile
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: fileid
        in: path
        description: The id of the file which is to be moved
        required: true
        schema:
          type: string
      - name: targetfolder
        in: query
        description: The target folder id of the folder under which the folder is to be moved
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully moved
        '400':
          description: Request resource or xml is not valid
        '403':
          description: Validation failed/ Forbidden
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/files/{fileid}:
    get:
      tags:
      - Document Resource APIs
      summary: Gets the file info
      description: API method to get a single file info from Collaborate.
      operationId: getDocumentInfo
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: fileid
        in: path
        description: The ID of file to get Info
        required: true
        schema:
          type: string
      - name: lastdmsinfo
        in: query
        description: Last DMS info (true/false)
        required: false
        schema:
          type: boolean
      - name: foldertype
        in: query
        description: Folder type
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/DocumentDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDBO'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    put:
      tags:
      - Document Resource APIs
      summary: Update file
      description: This api is used for update file.
      operationId: updateDocument
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: fileid
        in: path
        description: file ID
        required: true
        schema:
          type: string
      - name: rootfolderid
        in: query
        description: Root folder ID
        required: false
        schema:
          type: string
      - name: batchid
        in: query
        description: Batch ID
        required: false
        schema:
          type: string
      - name: foldertype
        in: query
        description: Folder type
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Document updated successfully.
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while updating document
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/DocumentDBO'
          application/xml:
            schema:
              $ref: '#/components/schemas/DocumentDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentDBO'
    delete:
      tags:
      - Document Resource APIs
      summary: Delete file
      description: This API deletes a file from a Collaborate Site and places it in the recycle bin. The documents being deleted should be an active document in a site.
      operationId: deleteDocument
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: fileid
        in: path
        description: The {fileid} is the Id of the file which is to be deleted.
        required: true
        schema:
          type: string
      - name: foldertype
        in: query
        description: Folder type
        required: false
        schema:
          type: string
      responses:
        '200':
          description: File/Document deleted successfully.
        '204':
          description: File/Document deleted successfully.
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed (calling api with wrong method)
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/sites/{siteid}/batchid:
    get:
      tags:
      - Document Resource APIs
      summary: Gets the batch id
      description: This API is used to get batchId for the specified site.
      operationId: getBatchID
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: siteid
        in: path
        description: siteID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '403':
          description: Validation failed/ Forbidden
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/files/{fileid}/activity:
    post:
      tags:
      - Document Resource APIs
      summary: Register view activity for a file
      description: This API is used to add 'view' activity on file
      operationId: addActivity
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: fileid
        in: path
        description: The id of the file in which activity to be added
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: The type of activity which is always 'view'
        required: true
        schema:
          type: string
      - name: foldertype
        in: query
        description: Folder type
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
        '403':
          description: Validation failed/ Forbidden
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/shares/link:
    post:
      tags:
      - Document Resource APIs
      summary: Share via link
      description: 'This api used to share content from my files or shared items


        Note :


        - resourcetype tag : {folder/file}.

        - resourceid tag : (the folder/file id can be any from my files or shared items).

        - Integer value for the shareoption tag : {1(anyone) / 2(my organisation user) / 3(system users)/ 4(Can be accessed by anyone who has the password) this 4th option is introduced from api version 6 onwards for sharing

        password protected files}.

        - password tag option is only used from api version 6 onwards when shareoption value is 4.

        - expiry tag format is ''UTC date and time(dd MMM yyyy HH:mm)''.'
      operationId: shareViaLink
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      responses:
        '200':
          description: Response successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Share'
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Share'
          application/json:
            schema:
              $ref: '#/components/schemas/Share'
    servers:
    - url: /monumentuat/api
  /{version}/changes/{sourceclient}/folder/{folderid}:
    post:
      tags:
      - Document Resource APIs
      summary: Register folder
      description: To register a given folder for Changes API based on source Client.
      operationId: registerFolder
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: folderid
        in: path
        description: Folder ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '404':
          description: Document doesn't exists in the system
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occurred while getting document content
      security:
      - OAuth: []
    delete:
      tags:
      - Document Resource APIs
      summary: Removes the registered folder
      description: To Remove registered folder for Changes API based on sourceclient.
      operationId: removeRegisteredFolder
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: folderid
        in: path
        description: Folder ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '404':
          description: Document doesn't exists in the system
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occurred while getting document content
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/folders/{folderid}:
    get:
      tags:
      - Document Resource APIs
      summary: Gets the folder info
      description: The method provides folder detail of given folder id.
      operationId: getFolderInfo
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: folderid
        in: path
        description: folderID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/FolderDBOV2'
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDBOV2'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    put:
      tags:
      - Document Resource APIs
      summary: Update folder
      description: This api will allow you to update folder.
      operationId: updateFolder
      parameters:
      - name: version
        in: path
        description: Version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: batchid
        in: query
        description: Batch ID
        required: false
        schema:
          type: string
      - name: rootfolderid
        in: query
        description: Root folder ID
        required: false
        schema:
          type: string
      - name: folderid
        in: path
        description: folderID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Folder updated successfully
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while updating folder
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/FolderDBO'
          application/xml:
            schema:
              $ref: '#/components/schemas/FolderDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/FolderDBO'
    delete:
      tags:
      - Document Resource APIs
      summary: Delete folder
      description: This api going to delete active folder from to the site, one's folder deleted it goes to recycle bin (Deleted items folder).
      operationId: deleteFolder
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: folderid
        in: path
        description: Folder ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Folder deleted successfully.
        '204':
          description: Folder deleted successfully.
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed (calling api with wrong method)
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/shares/{shareid}:
    delete:
      tags:
      - Document Resource APIs
      summary: Delete share/Remove share
      description: 'The "Remove a share" API endpoint deletes only single share link.


        Note :


        - The share link being deleted should be an active share link.

        - This API will remove only single share link.

        - If provided {shareid} not exists in system, then ''Access denied'' response will be produced.'
      operationId: deleteShare
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: shareid
        in: path
        description: The {shareid} is the Id of the share which is to be deleted
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Share link deleted successfully.
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed (calling api with wrong method)
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/shares/email:
    post:
      tags:
      - Document Resource APIs
      summary: Share via email
      description: 'This api used to share content of my files and shared items


        Note :


        - resourcetype tag : {folder/file}.

        - resourceid tag : (the folder/file id can be any from my files or shared items).

        - Integer value for the shareoption tag : {1(Can be accessed by anyone who has the link) / 2(Restrict access to specified system users below) / 3(Recipients must be registered to access the link)/ 4(Can be accessed by

        anyone who has the password) this 4th option is introduced from api version 6 onwards for sharing password protected files}

        - password tag option is only used from api version 6 onwards when shareoption value is 4

        - expiry tag format is ''UTC date and time(dd MMM yyyy HH:mm)''

        - Integer value for the permission tag : {1(download_view_print) / 2(view_only)}'
      operationId: shareViaEmail
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      responses:
        '200':
          description: Response successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Share'
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Share'
          application/json:
            schema:
              $ref: '#/components/schemas/Share'
    servers:
    - url: /monumentuat/api
  /{version}/files:
    get:
      tags:
      - Document Resource APIs
      summary: Gets the file list
      description: 'API method to get a list of files from Collaborate.


        The representation of q parameter works as under


        q = "folderid=1"'
      operationId: getFileList
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: q
        in: query
        description: query to filter out results
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: No of items to returned
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Starting point of the returned items. This should be the item ID.
        required: false
        schema:
          type: string
      - name: orderby
        in: query
        description: This is the order of the items returned. Possible values are "Asc" , "desc" , Default is Desc, which means that the latest items are returned first.
        required: false
        schema:
          type: string
      - name: ordertype
        in: query
        description: can be one of name, size, author, lastModified, filetype
        required: false
        schema:
          type: string
      - name: filelist
        in: query
        description: fileID CSV
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Get File List successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/DocumentDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDBO'
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occurred
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/folders/{folderid}/parent:
    post:
      tags:
      - Document Resource APIs
      summary: Copy folder
      description: The method allows a given folder to be copied from one folder location to another folder location. The target folder location can be in a different site.
      operationId: copyFolder
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: folderid
        in: path
        description: The id of the folder which needs to be copied
        required: true
        schema:
          type: string
      - name: targetfolder
        in: query
        description: "\tThe target folder id of the folder under which the folder will be copied"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Your content is copied successfull...
        '400':
          description: Request resource or xml is not valid
        '403':
          description: Validation failed/ Forbidden
      security:
      - OAuth: []
    put:
      tags:
      - Document Resource APIs
      summary: Move folder
      description: The method allows a given folder to be moved from one folder location to another folder location within a site.
      operationId: moveFolder
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: folderid
        in: path
        description: 'The id of the folder which is to be moved  '
        required: true
        schema:
          type: string
      - name: targetfolder
        in: query
        description: The target folder id of the folder under which the folder is to be moved
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully moved
        '400':
          description: Request resource or xml is not valid
        '403':
          description: Validation failed/ Forbidden
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/folders/{folderid}/foldersize:
    get:
      tags:
      - Document Resource APIs
      summary: Gets the folder size
      description: Get a folder size by folder ID.
      operationId: getFolderSize
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: folderid
        in: path
        description: folderID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/FolderDBOV2'
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDBOV2'
        '401':
          description: Unauthorized
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/folders/{folderid}/items:
    get:
      tags:
      - Document Resource APIs
      summary: Gets the folder list
      description: 'This API method provides a list of folders under a given folder.


        Note :


        The value of limit parameter behaves as following

        - limit =100 is the default value

        - if limit>0 then (number of items returned is equal to limit)

        - if limit=-1 then return all records

        - if limit 0 then the records are returned from the offset value

        - if offset < 0 then offset value of 0 is set


        Defalut value for orderby parameter is asc and for ordertype is creation date.'
      operationId: getFolderList
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: folderid
        in: path
        description: Folder ID
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: The no of items to return for this request
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: The starting point for each item returned
        required: false
        schema:
          type: string
      - name: orderby
        in: query
        description: The items can be organised by either asc/desc order
        required: false
        schema:
          type: string
      - name: ordertype
        in: query
        description: In addition to the order we can organise items by name/author and last modified date.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Get Folder List successfully
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occurred
          content:
            application/xml:
              schema:
