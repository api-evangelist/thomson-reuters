  /{version}/changes:
    get:
      tags:
      - Document Resource APIs
      summary: Gets the changes for sync
      description: 'The purpose of this API is to provide changes to the system. This will get the sync changes detail.


        Note :


        - In the response nextsyncposition means the next sync position the client should use to obtain changes.

        - syncpositionid : If the next sync position id is provided, then changes following that sync position will be returned. Otherwise a response with a current sync position ID is given (without activities).If syncpositionid=0 then first 500 top activities will be given in response.

        - limit : This parameter can be used to limit the number of changes returned otherwise 500 changes are returned.

        - contenttype : To filter the result set by a specific content type like ''Files''. If this parameter is set then it will return specific type of changes, otherwise all types of content will be returned. "contenttype=files" will return both file and folder contents.

        - siteid : to get changes by sourceclient basis. If provided, then it will give site specific sync changes otherwise not.'
      operationId: getChangesForSync
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: syncpositionid
        in: query
        description: 'The start location for the content sync. All items from the syncpositionid will be returned. '
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: The no of items to return for this request
        required: false
        schema:
          type: string
      - name: contenttype
        in: query
        description: The type of content for which the changes are required, the default is all but you can save the changes by the following content types Files
        required: false
        schema:
          type: string
      - name: siteid
        in: query
        description: User can filter by site
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Get Changes List successfully
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorised
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling API with wrong method)
        '500':
          description: Internal error occurred
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
