  /{version}/files/{fileid}/content:
    get:
      tags:
      - Document Resource APIs
      summary: Download file
      description: 'API method to download a single document ( document content not its metadata) from Collaborate. The method supports download by a specific document version.


        Note :


        - original=true parameter is only applicable for users, who have rights to download original version from UI.

        - If workflow is enabled & document is in pending state then the document should only download file to file owner & content admin.

        - getconvertedfile=true parameter is used to get encrypted document.

        - Users, who have rights to download original version from the Collaborate interface will receive the original document others will get encrypted document.

        - thumbnail=true allows the user to obtain the thumbnail of the specified document.

        - imagewidth should in range of ''2048,1024,800,512,256,128,64''. If thumbnail is true then ''imagewidth'' will be mandatory.'
      operationId: downloadDocumentAPI
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: fileid
        in: path
        description: file ID
        required: true
        schema:
          type: string
      - name: foldertype
        in: query
        description: Folder type
        required: false
        schema:
          type: string
      - name: imagewidth
        in: query
        description: Image width
        required: false
        schema:
          type: string
      - name: thumbnail
        in: query
        description: Thumbnail
        required: false
        schema:
          type: boolean
      - name: getconvertedfile
        in: query
        description: To get encrypted document (true/false)
        required: false
        schema:
          type: string
      - name: original
        in: query
        description: download original version of document (true/false)
        required: false
        schema:
          type: string
      - name: version
        in: query
        description: Document version number
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Document found
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '404':
          description: Document doesn't exists in the system
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while gettting document content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    post:
      tags:
      - Document Resource APIs
      summary: Add file version
      description: 'This api is used for add new file version.


        Note :


        - Optional form data param called "notification" which is used for "notification" preference.

        - 1= Respect user preference.

        - 2= Force email notification.

        - 3= Suppress all notifications.

        This notification form data param is not mandatory and when user does not provide it then default value = 3 = Suppress all notifications.'
