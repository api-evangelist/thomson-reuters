    servers:
    - url: /monumentuat/api
  /{version}/files/placeholder:
    post:
      tags:
      - Document Resource APIs
      summary: Add Placeholder file
      description: 'This api used for to add placeholder file.


        Note :


        - Optional form data param called "notification" which is used for "notification" preference.

        - 1= Respect user preference.

        - 2= Force email notification.

        - 3= Suppress all notifications.

        This notification form data param is not mandatory and when user does not provide it then default value = 3 = Suppress all notifications.'
      operationId: insertPlaceHolder
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: parentfolderid
        in: query
        description: Parent folder ID
        required: true
        schema:
          type: string
      responses:
        '201':
          description: placeholder created successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/DocumentDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDBO'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while uploading document
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  description: Document name
                notification:
                  type: string
                  description: Notification
              required:
              - filename
    servers:
    - url: /monumentuat/api
  /{version}/files/content:
    post:
      tags:
      - Document Resource APIs
      summary: Add file
      description: 'This api used for insert file in specified folder in site.


        Note :


        Optional form data param called "notification" which is used for "notification" preference.

        - 1= Respect user preference.

        - 2= Force email notification.

        - 3= Suppress all notifications.

        This notification form data param is not mandatory and when user does not provide it then default value = 3 = Suppress all notifications.'
      operationId: insertDocument
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: parentfolderid
        in: query
        description: Parent folder ID
        required: true
        schema:
          type: string
      - name: batchid
        in: query
        description: batchID
        required: false
        schema:
          type: string
      - name: rootfolderid
        in: query
        description: Root folder ID
        required: false
        schema:
          type: string
      responses:
        '201':
          description: document uploaded  successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/DocumentDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDBO'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while uploading document
      security:
      - OAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Choose file
                  format: binary
                filename:
                  type: string
                  description: Document name
                progressiveoperkey:
                  type: string
                  description: Progressiveoperkey
                dmsdatabasename:
                  type: string
                  description: DMS database name
                dmseditdate:
                  type: string
                  description: DMS edit date
                dmsparentfolderid:
                  type: string
                  description: DMS parent folder ID
                dmsdocid:
                  type: string
                  description: DMS doc ID
                dmsversion:
                  type: string
                  description: DMS version
                notification:
                  type: string
                  description: Notification
              required:
              - file
              - filename
    servers:
    - url: /monumentuat/api
