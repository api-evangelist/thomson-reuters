components:
  schemas:
    CategoryDescendants:
      type: object
      description: Represents a category, potentially with its descendant information.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the category.
        name:
          type: string
          nullable: true
          description: Display name of the category.
        code:
          type: string
          nullable: true
          description: Unique short code for the category.
        secondaryCategoryCode:
          type: string
          nullable: true
          description: An optional secondary code for the category.
        lastModified:
          type: string
          format: date-time
          description: Timestamp of the last modification.
        parentCategoryId:
          type: string
          format: uuid
          nullable: true
          description: ID of the parent category, if applicable. Null for root categories.
        level:
          type: integer
          format: int32
          description: Hierarchical level of the category.
      additionalProperties: false
    ErrorResponse:
      type: object
      description: Standard error response object containing HTTP status code and a descriptive message.
      properties:
        StatusCode:
          type: integer
          format: int32
          description: HTTP status code of the error (for example, 400, 404, 500).
          minimum: 100
          maximum: 599
        Message:
          type: string
          nullable: true
          description: A human-readable message providing details about the error.
          minLength: 1
          maxLength: 512
      additionalProperties: false
      example:
        StatusCode: 400
        Message: Invalid request parameters.
    RootCategoriesData:
      type: object
      description: Container for a list of root categories and their total count.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDescendants'
          nullable: true
          description: Array of root category objects.
        count:
          type: integer
          format: int32
          description: Total number of root categories.
      additionalProperties: false
  securitySchemes:
    Token:
      type: apiKey
      description: 'Authorization header. Provide a valid Access token for authentication  Example: `Authorization: Bearer <<Access Token>>`. You can find Authentication process in ''API Access'' Section'
      name: Authorization
      in: header
