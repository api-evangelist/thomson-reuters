tags:
- name: Categories
  description: Categories endpoints for statutory reporting. Retrieve categories and their entries.
paths:
  /{entity-id}/financial-periods/{financial-period-id}/categories:
    get:
      summary: Get Categories
      tags:
      - Categories
      description: Use this operation to return a list of the root categories existing in the financial period passed in the params.
      operationId: GetCategories
      parameters:
      - name: entity-id
        in: path
        required: true
        description: The entity id in which the financial period is created. To obtain a reporting entity ID, refer to the [Get Reporting Entities API](#tag/reporting-entities/get/) documentation. For guidance on obtaining a template entity ID, see the [Get Template Entities API](#tag/template-entities/get/) documentation.
        schema:
          type: string
          format: uuid
        example: 90eb7c21-8d0d-46b9-8079-b38d004dd6a0
      - name: financial-period-id
        in: path
        required: true
        description: The identifier of the financial period from which category details are retrieved. Obtain this ID using the [Get Financial Periods API](#tag/financial-periods/get{entity-id}/financial-periods).
        schema:
          type: string
          format: uuid
        example: 0f4252ee-8f46-4ba5-a8e4-b39c00881c11
      - name: level
        in: query
        schema:
          type: integer
          format: int32
        description: The hierarchical level of the category. Root categories are at the top level.
        example: 1
      responses:
        '200':
          description: Successfully retrieved a list of root categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootCategoriesData'
              examples:
                listOfCategories:
                  summary: Example of a successful root categories response
