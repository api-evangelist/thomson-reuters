                Success response:
                  value:
                    AdminRights:
                    - Right: Add Groups
                      Code: ADDGROUPS
                      Description: Allows users to add new groups
                    - Right: Edit Groups
                      Code: EDITGROUPS
                      Description: Allows users to edit existing groups
                    - Right: Delete Groups
                      Code: DELETEGROUPS
                      Description: Allows users to delete existing groups
                    - Right: Firm Config
                      Code: FIRMCONFIG
                      Description: User will have access to firm config and also make changes to it
                    - Right: Letters and Filing Instr
                      Code: LAFI
                      Description: User can fully access Letters and Filling instructions
                    - Right: Add Users
                      Code: ADDUSER
                      Description: Allows users to add new users
                    - Right: Edit Users
                      Code: EDITUSER
                      Description: Allows users to edit existing users
                    - Right: Delete Users
                      Code: DELETEUSER
                      Description: Allows users to delete existing users
                    - Right: Transfer
                      Code: TRANSFER
                      Description: User will have access to transfer returns from one account to another within same firm
                    - Right: External Transfer
                      Code: ETXR
                      Description: User will have access to transfer returns from account to another outside own firm too
                    - Right: Create Administrator
                      Code: CREATEADMIN
                      Description: Allows users to create new administrator users with admin rights
                    - Right: Group Import
                      Code: GROUPIMPORT
                      Description: Allow users to do group import
                    - Right: Free Other Returns
                      Code: FREERETURNS
                      Description: Allows user to  free returns
                    - Right: De-Federate User
                      Code: DEFEDERATE
                      Description: Allow user to de federate a federated user
                    UserRights:
                    - Right: FormSource
                      Code: FORMSOURCE
                      Description: Gives user access to use formsource and run queries.
                    - Right: e-Form RS
                      Code: EFORMRS
                      Description: Gives user permission to access E-form RS application in Gosystem RS
                    - Right: Export Grid Data
                      Code: EXPORTGRIDDATA
                      Description: Allows user access to export grid data
                    - Right: MyTaxInfo Admin
                      Code: TAXINFOADMIN
                      Description: Gives user administrator access to MyTaxInfo, allowing them to have full access to customize theme, contact email and legal information. Review/Edit a tax payer questionnaire etc
                    - Right: MyTaxInfo Preparer (Full Access)
                      Code: WEBORGUSER
                      Description: Gives user the preparer access to MyTaxInfo, allowing them to create questionnaire, view status reports review/edit and send questionnaire to Gosystem
                    - Right: MyTaxInfo Preparer (read only)
                      Code: WEBORGUSERR
                      Description: Gives user the prepare access to MyTaxInfo, allowing them to review and send the questionnaire
                    - Right: Elf Admin
                      Code: ELFADMIN
                      Description: Allows user to access E-file section to submit and download e-files and generate e-file report
                    - Right: Elf Unlock
                      Code: ELFUNLOCK
                      Description: Allows user to unlock e-files if any of the jurisdictions are locked
                    - Right: Prior Year
                      Code: PRIORYEAR
                      Description: User will have access to prior year returns
                    - Right: TEQ
                      Code: TEQ
                      Description: ''
