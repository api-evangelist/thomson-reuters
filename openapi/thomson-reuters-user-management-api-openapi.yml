  /external/v1/usermanagement/users/all:
    get:
      tags:
      - User Management
      summary: Retrieve all users with their permission groups
      description: '## Purpose

        This endpoint retrieves a complete list of all users in the system along with their assigned permission groups (security roles). Use this for user management, access control audits, and user listing displays.


        ## Why Use This Endpoint

        - Retrieve all users in the organization

        - View user details including login names, initials, and status

        - Check permission group assignments for each user

        - Build user management interfaces

        - Perform user access audits

        - Export user lists for reporting


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Common Use Cases

        1. **User Management Dashboard:** Display all users in administrative interface

        2. **Access Reports:** Generate user access reports for compliance

        3. **Permission Audits:** Audit user permissions across the organization

        4. **User Selection:** Build user selection dropdowns for assignment

        5. **Data Export:** Export user data for compliance requirements

        6. **Role Analysis:** Identify users with specific permission groups'
