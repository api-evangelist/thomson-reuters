  /external/v1/usermanagement/users/{permissiongroupId}:
    get:
      tags:
      - User Management
      summary: Retrieve all users assigned to a specific permission group
      description: '## Purpose

        Retrieves a list of all users who are members of a specified EmMain permission group (security role). This endpoint allows filtering users by their assigned permission group to understand group membership and audit access rights.


        ## Why Use This Endpoint

        - View all users with a specific permission level

        - Audit permission group membership for compliance

        - Generate reports on users by role assignment

        - Verify who has access to specific features controlled by the permission group

        - Display team members with particular access rights

        - Identify users for bulk permission changes

        - Validate permission group assignments before making changes


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Request Details

        - **Method:** GET

        - **Route Parameter `permissiongroupId`** (integer, required) - ID of the permission group

        - Permission group IDs can be obtained from `/usermanagement/users/em-permission-groups` endpoint

        - Returns all active users assigned to the specified permission group

        - Users may belong to multiple permission groups (only those with this specific group are returned)


        ## Common Use Cases

        1. **Permission Audit:** View all System Administrators for audit purposes

        2. **Role Reports:** List all users with specific permissions (e.g., "Tax Preparer")

        3. **Access Verification:** Verify who has access to sensitive features

        4. **User Migration:** Identify users for permission group migration

        5. **Team Structure:** Display team structure organized by roles

        6. **Compliance:** Generate compliance reports on access control


        ## Important Notes

        - Returns only users who have the specified permission group assigned

        - Users may appear with multiple permission groups in their PermissionGroups list

        - Empty list is returned if no users are assigned to the permission group

        - Only active users are typically included (disabled users may be excluded)

        - The permissiongroupId must be a valid EmMain permission group ID

        - For GFR security groups, this endpoint does not apply'
