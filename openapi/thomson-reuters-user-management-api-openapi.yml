  /external/v1/usermanagement/users/logged-in-user-details:
    get:
      tags:
      - User Management
      summary: Retrieve complete profile information for the currently authenticated user
      description: '## Purpose

        Retrieves comprehensive account information for the currently logged-in user based on their authentication token. This endpoint provides a complete user profile including personal details, permission groups, account status, file system access, administrative privileges, and confirmation history.


        ## Why Use This Endpoint

        - Display user profile information in the application interface

        - Verify current user''s permissions and access rights

        - Retrieve user settings and preferences for personalization

        - Check account status and expiration before performing operations

        - Obtain user initials for document annotations and audit trails

        - Validate Smart integration metadata for Onvio Smart users

        - Implement self-service profile viewing functionality

        - Get file system identifiers for document management operations


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```

        The user''s identity is automatically determined from the authentication token - no user identifier is required in the request.


        ## Request Details

        - **Method:** GET

        - No request body or parameters required

        - User identity is extracted from the Bearer token automatically

        - Endpoint uses the authenticated user''s context from the CIAM token


        ## Common Use Cases

        1. **Profile Display:** Load user profile on application startup or login

        2. **Navigation:** Display user information in navigation header or profile dropdown

        3. **Permission Check:** Check if user has specific administrative privileges

        4. **Form Prepopulation:** Retrieve user initials for prepopulating forms or signatures

        5. **UI Features:** Validate user permissions before showing UI features

        6. **Smart Integration:** Get Smart metadata for Onvio Smart integration workflows

        7. **Self-Service:** Implement "View My Profile" functionality


        ## Important Notes

        - Returns data for the authenticated user only (cannot view other users'' details)

        - Requires valid CIAM authentication token

        - SmartMetadata contains JSON-formatted Onvio Smart integration details

        - Roles list may be empty if user has no assigned permission groups

        - ConfirmationUser contains email of the account approver/modifier

        - FileSystemId is the user''s identifier in GoFileRoom (GFR)'
