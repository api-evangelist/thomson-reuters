components:
  schemas:
    EmMainExtensionsEnumerationsFileSystemSource:
      type: integer
      description: ''
      x-enumNames:
      - None
      - GoFileRoom
      - SmartOnline
      enum:
      - 0
      - 1
      - 2
    EMMainDataTransferObjectsModelsUserManagementUserDeleteResponseDto:
      type: object
      additionalProperties: false
      properties:
        loginId:
          type: string
          description: Login name of the user that was attempted to be deleted.
          example: john.smith@company.com
        isDeleted:
          type: boolean
          description: Indicates whether the user was successfully deleted. True if deleted, false if deletion failed.
          example: true
        deleteUserException:
          type: string
          description: Error message if deletion failed, otherwise contains success message or empty string.
          example: User deleted successfully
    EMMainDataTransferObjectsModelsExternalUserListDto:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: integer
          description: Unique identifier for the user in the system.
          format: int32
          example: 12345
        displayName:
          type: string
          description: Full display name of the user (typically First Name + Last Name).
          example: John Smith
        fileSystemId:
          type: string
          description: GoFileRoom file system identifier for the user. Used for GFR integration and document management.
          example: GFR-USR-001
        loginName:
          type: string
          description: User's login name/email address used for authentication.
          example: john.smith@company.com
        initials:
          type: string
          description: User's initials, typically used for document signatures and audit trails.
          example: JS
        userAccountStatus:
          type: string
          description: Current account status as a human-readable string (e.g., "Active", "Inactive", "Locked").
          example: Active
        permissionGroups:
          type: array
          description: List of permission groups (security roles) assigned to the user. Defines user access and capabilities within the system.
          items:
            $ref: '#/components/schemas/EMMainDataTransferObjectsModelsUserManagementSecurityRoleDetailsDto'
    EMMainDataTransferObjectsModelsUserManagementSecurityGroupResponse:
      type: object
      additionalProperties: false
      properties:
        securityGroupId:
          type: string
          description: Unique identifier for the GoFileRoom (GFR) security group. This ID is used to reference the group in GFR operations.
          example: GFR-SEC-GROUP-147
        securityGroupName:
          type: string
          description: Human-readable name of the GoFileRoom security group. This name describes the group's purpose or access level.
          example: Corporate Documents Access
        mfa:
          type: integer
          description: 'Multi-factor authentication (MFA) setting for this security group. Numeric flag indicating MFA status: 0 = not configured, 1 = enabled.'
          format: int32
          example: 1
        mfaRequired:
          type: integer
          description: Indicates whether MFA is required for members of this security group. 0 = not required, 1 = required.
          format: int32
          example: 1
    EMMainDataTransferObjectsModelsExternalGetUsersResponse:
      allOf:
      - $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalUserBaseExternal'
      - type: object
        additionalProperties: false
        properties:
          roles:
            type: array
            description: List of permission groups (security roles) assigned to the user. Each role defines a set of permissions and access rights within the system.
            items:
              $ref: '#/components/schemas/EMMainDataTransferObjectsModelsUserManagementSecurityRoleDetailsDto'
          confirmationUser:
            description: Information about the user who confirmed or last modified this user account. Contains the confirming user's email address.
