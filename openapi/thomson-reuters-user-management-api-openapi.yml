  /external/v1/usermanagement/users/em-permission-groups:
    get:
      tags:
      - User Management
      summary: Retrieve all available Engagement Manager (EM) permission groups
      description: '## Purpose

        Retrieves a complete list of all Engagement Manager (EmMain) permission groups (security roles) available in the system. These permission groups define sets of access rights and capabilities that can be assigned to users for controlling their access to engagement management features.


        ## Why Use This Endpoint

        - Populate dropdown lists for permission group selection during user creation/modification

        - Display available permission groups in administrative interfaces

        - Validate permission group IDs before assigning them to users

        - Audit available security roles in the system

        - Implement role-based access control (RBAC) configuration interfaces

        - Document available permission levels for system administrators

        - Compare user permissions against available roles


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Request Details

        - No request body or parameters required

        - Returns all available EmMain permission groups

        - Permission groups are system-defined and control access to EM features


        ## Common Use Cases

        1. **User Creation Forms:** Populate permission group dropdown lists

        2. **User Modification:** Display available permission groups when modifying user access

        3. **Validation:** Validate permission group IDs before user update operations

        4. **Profile Views:** Show current user''s assigned permission groups

        5. **Role Management:** Implement permission group management interfaces

        6. **Documentation:** Generate documentation of available system roles

        7. **Audit Reports:** Generate reports showing all available access levels


        ## Important Notes

        - Returns all system-defined EmMain permission groups

        - Permission groups control access to Engagement Manager features only (not GFR)

        - For GoFileRoom (GFR) security groups, use the `/users/gfr-permission-groups` endpoint instead

        - PermissionGroupId values are used when assigning permission groups to users

        - Permission groups may have dependencies or hierarchies (e.g., Admin includes all lower permissions)

        - The list is relatively static and can be cached on the client side'
      operationId: EmMainEndPointsExternalUserManagementGetEmPermissionGroupsExternalEndpoint
