  /external/v1/usermanagement/users/details:
    post:
      tags:
      - User Management
      summary: Retrieve comprehensive details for a specific user account
      description: '## Purpose

        Retrieves complete user account information including profile details, permissions, file storage group access, account status, expiration settings, and administrative privileges. This endpoint provides a comprehensive view of a user''s configuration in both EmMain and GoFileRoom (GFR) systems.


        ## Why Use This Endpoint

        - View complete user account information before making updates

        - Audit user permissions and access rights

        - Verify user account status and expiration dates

        - Check GFR Administrator status and file storage group assignments

        - Retrieve permission groups for authorization decisions

        - Validate user existence before performing operations

        - Display user profile information in administrative interfaces


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Request Details

        - **Method:** POST

        - **Request Body Parameter `LoginName`** (string, required) - Email address of the user to retrieve

        - Login names can be obtained from the `/usermanagement/users/all` endpoint

        - The endpoint validates user existence and returns full details if found


        ## Common Use Cases

        1. **Edit User:** Loading user details for editing in an administration interface

        2. **Permission Verification:** Verifying user permissions before granting access to resources

        3. **Account Audit:** Auditing user account configuration and access rights

        4. **Status Check:** Checking account status (enabled/disabled) before authentication

        5. **File Access Control:** Retrieving file storage groups for document access control

        6. **User Validation:** Validating user existence before creating related records


        ## Important Notes

        - Returns full user details even for disabled accounts

        - Legacy AdvanceFlow fields are only populated for migrated users from the predecessor system

        - Groups field contains GFR file storage group names that control document access

        - GFRAdmin is a string field with values like "Yes" or "No"

        - UserDisabled uses numeric values: 0 = enabled, 1 = disabled

        - AdvanceflowUserPermission is only populated for users migrated from legacy AdvanceFlow system

        - This endpoint uses POST method to send the LoginName in the request body'
