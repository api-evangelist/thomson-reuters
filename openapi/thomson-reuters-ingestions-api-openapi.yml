openapi: 3.2.0
info:
  title: Thomson Reuters Ingestions API
  version: '1.0'
  description: 'Operations tagged Ingestions across 3 of this provider''s published API definitions: thomson-reuters-ingest-service-1-0-openapi.json, thomson-reuters-ingest-service-1-0-openapi.yml, thomson-reuters-ingest-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/data-hub/v1/ingest
security:
- bearerAuth: []
tags:
- name: Ingestions
paths:
  /ingestions:
    get:
      tags:
      - Ingestions
      summary: Get a paginated list of available ingestions
      description: Returns a list of all the ingestions for a particular client based on filter conditions with their metadata
      operationId: getIngestions
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionIngestionResponse'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1/ingest
  /ingestions/{id}:
    get:
      tags:
      - Ingestions
      summary: Get an ingestion by ID
      description: Retrieves details of an ingestion identified by a unique id from ingest Metadata
      operationId: getIngestionById
      parameters:
      - name: id
        in: path
        description: Unique identifier of the ingested data
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IngestionResponse'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Ingestions
      summary: Delete Ingest
      description: Remove Ingest details by ingest id
      operationId: removeIngestDetails
      parameters:
      - name: id
        in: path
        description: Unique identifier of the ingest data
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ingest details does not exist
      security:
      - bearerAuth: []
    patch:
      tags:
      - Ingestions
      summary: Updates an existing ingest Metadata
      description: Updates Metadata to change Year, Period & Name
      operationId: updateMetadata_1
      parameters:
      - name: id
        in: path
        description: Unique identifier of the ingested data
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchIngestionRequest'
      responses:
        '204':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdResponse'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1/ingest
components:
  schemas:
    PatchIngestionRequest:
      type: object
      properties:
        year:
          type: integer
          description: Relevant year of importance for the file data
          format: int32
          example: 2019
        period:
          type: integer
          description: Numeric period of no specific precision
          format: int32
          example: 12
        name:
          type: string
          description: Label of the File
          example: My File Name.csv
    IdResponse:
      type: object
      properties:
        id:
          type: string
    IngestionResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Ingestion
          example: '46'
        name:
          type: string
          description: Label of the ingestion
          example: My File Name.csv
        year:
          type: integer
          description: Relevant year of importance for the ingestion
          format: int32
          example: 2019
        period:
          type: integer
          description: Numeric period of no specific precision
          format: int32
          example: 12
        provider:
          type: string
          description: Source of ingestion
          example: INTEGRATION, FILE, ALTERYX
        status:
          type: string
          enum:
          - COMPLETE
          - AWAITING
        created_at:
          type: string
          description: Time at which this ingestion was created
          format: date-time
          example: '2020-12-19T21:06:22.453Z'
        created_by:
          type: string
          example: UserA
        mime_type:
          type: string
        content_type:
          type: string
    ApiCollectionIngestionResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IngestionResponse'
        _meta:
          $ref: '#/components/schemas/ApiMeta'
    ApiMeta:
      type: object
      properties:
        count:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        sort:
          type: string
        filter:
          type: string
        extra:
          type: object
          additionalProperties:
            type: object
          writeOnly: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
