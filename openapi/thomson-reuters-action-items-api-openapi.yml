components:
  schemas:
    ActionItem:
      type: object
      properties:
        title:
          type:
          - string
          - 'null'
        count:
          type: integer
          format: int32
        url:
          type:
          - string
          - 'null'
        dueDate:
          type:
          - string
          - 'null'
          format: date-time
        message:
          type:
