tags:
- name: Action Items
  description: Use the ActionItems endpoint to get the action items of a user in Legal Tracker.
paths:
  /users/{id}/actionItems:
    get:
      tags:
      - Action Items
      summary: Retrieve action items for a specific user
      operationId: ActionItems_Get
      parameters:
      - name: id
        in: path
        description: The unique identifier of the user to get action items for.
        required: true
        schema:
          type: integer
          format: int32
      - name: $top
        in: query
        description: Show only the first n items, see [Paging - Top](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptiontop)
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          default: 50
        example: 50
      - name: $skip
        in: query
        description: Skip the first n items, see [Paging - Skip](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionskip)
        schema:
          minimum: 0
          type: integer
          default: 0
        example: 0
      - name: $filter
        in: query
        description: Filter items by property values, see [Filtering](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionfilter)<br /><br /><i>Available operations:</i> eq, ne, gt, ge, lt, le, in, and, or, not<br /><i>Available functions:</i> contains, startswith, endswith, indexof<br /><i>Available properties:</i> title, count, url, dueDate, message
        schema:
          type:
          - string
          - 'null'
        example: id eq 111222
      - name: $select
        in: query
        description: Select properties to be returned, see [Select](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionselect)
        schema:
          uniqueItems: true
          type: array
          items:
            enum:
            - title
            - count
            - url
            - dueDate
            - message
            type: string
      - name: $orderby
        in: query
        description: Order items by property values, see [Sorting](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionorderby)
        schema:
          uniqueItems: true
          type: array
          items:
            enum:
            - title
            - count
            - url
            - dueDate
            - message
            - title desc
            - count desc
            - url desc
            - dueDate desc
            - message desc
            type: string
      - name: $count
        in: query
        description: Include count of items, see [Count](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptioncount)
        schema:
          type: integer
      responses:
        '200':
          description: Returns the action items for a particular user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItemCollection'
        '400':
          description: The request is invalid.
          content:
            application/json:
              schema:
