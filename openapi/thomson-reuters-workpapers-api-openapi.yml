  /external/v1/SignOff/get-all-signoffs:
    get:
      tags:
      - Workpapers
      summary: Retrieve all active sign-off types for workpapers
      description: '## Purpose

        Retrieves all active sign-off types available in the system. Sign-off types define the approval workflow stages for workpapers (e.g., Prepared, Reviewed, Manager Review, Partner Review). This endpoint provides the list of available sign-off options that can be applied to workpapers.


        ## Why Use This Endpoint

        - Retrieve available sign-off types for workpaper approval workflows

        - Display sign-off options in user interfaces

        - Validate sign-off type IDs before saving workpaper sign-offs

        - Build approval workflow management features

        - Understand the sign-off hierarchy and sequence


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get All Active Sign-Off Types

        - **Endpoint:** `GET /SignOff/get-all-signoffs` (this endpoint)

        - **Returns:** List of active sign-off types with their IDs and properties

        - **Example:** Returns sign-off types like "Prepared", "Reviewed", "Manager Review", etc.


        **Step 2 (Optional):** Save Workpaper Sign-Offs

        - **Endpoint:** `POST /SignOff/save-workpaper-signoffs`

        - **Use:** Use sign-off type IDs from Step 1 to assign sign-offs to workpapers

        - **Returns:** Success confirmation


        ## Request Details

        - **Method:** GET

        - **Content-Type:** application/json

        - **No path parameters required**

        - **No request body required**


        ## Common Use Cases

        1. **Sign-Off Selection:** Populate dropdowns or selection lists with available sign-off types

        2. **Workflow Configuration:** Display sign-off stages when configuring approval workflows

        3. **Validation:** Verify sign-off type IDs before submitting workpaper sign-offs

        4. **Status Display:** Show available approval stages in workpaper status views


        ## Important Notes

        - Only active sign-off types are returned (inactive types are excluded)

        - Sign-off types are system-wide and apply to all engagements

        - The order/sequence of sign-off types typically follows a hierarchical approval flow

        - Sign-off type IDs are required when saving workpaper sign-offs via `/SignOff/save-workpaper-signoffs`

        - Some sign-off types may have dependencies or require previous sign-offs to be completed'
      operationId: EmMainEndPointsExternalBinderGetAllActiveSignOffsExternalEndpoint
      parameters:
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      responses:
        '200':
          description: Successfully retrieved all active sign-off types.
          content:
            application/json:
              schema:
                type: array
