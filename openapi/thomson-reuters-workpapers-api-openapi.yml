  /external/v1/workpapers/move-recyclebin:
    post:
      tags:
      - Workpapers
      summary: Move workpapers to recycle bin (soft delete)
      description: '## Purpose

        Moves one or more workpapers to the recycle bin (soft delete). This operation marks workpapers as deleted without permanently removing them, allowing for recovery if needed.


        ## Why Use This Endpoint

        - Safely remove workpapers without permanent deletion

        - Clean up unwanted or obsolete workpapers

        - Delete multiple workpapers in a single operation

        - Allow for workpaper recovery if deleted by mistake

        - Maintain engagement organization and cleanliness


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get Binder Item IDs and Folder Structure

        - **Endpoint:** `GET /workpapers/tree-data/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** Complete binder structure with workpaper IDs and folder IDs


        **Step 4:** Move Workpapers to Recycle Bin

        - **Endpoint:** `POST /workpapers/move-recyclebin` (this endpoint)

        - **Use:** The `engagementId` and list of `workpaperIds` in the request body

        - **Select:** The IDs of workpapers you want to move to recycle bin

        - **Example:** `workpaperIds: [12345, 12346, 12347]`


        ## Request Details

        - **Method:** POST

        - **Content-Type:** application/json

        - **Request Body Parameters:**

        - `EngagementId` (int, required) - The engagement identifier

        - `WorkpaperIds` (array of int, required) - List of workpaper identifiers

        - Must contain at least one workpaper ID

        - All IDs must exist in the specified engagement

        - Duplicates are handled gracefully


        ## Common Use Cases

        1. **Cleanup Operations:** Remove old or draft workpapers from active view

        2. **Bulk Deletion:** Delete multiple workpapers at once

        3. **Mistake Correction:** Remove workpapers added by error

        4. **Engagement Organization:** Clean up engagement structure by removing unused workpapers


        ## Important Notes

        - All item IDs must belong to the specified engagement

        - Operation fails if any ID is invalid or doesn''t exist

        - Files associated with workpapers remain in the system

        - Some workpapers may be protected from operations based on engagement state

        - This is a soft delete operation; workpapers can be restored later

        - Workpapers are moved to the recycle bin, not permanently deleted

        - Workpapers in recycle bin are not visible in normal workpaper lists

        - To permanently delete, use the recycle bin management features

        - Workpapers can be restored from recycle bin by authorized users'
      operationId: EmMainEndPointsExternalWorkpapersMoveWorkpaperToRecycleBinExternalEndpoint
      parameters:
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      requestBody:
        x-name: MoveWorkpaperExternalRequestDto
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalWorkpapersMoveWorkpaperExternalRequestDto'
        required: true
        x-position: 1
      responses:
        '200':
          description: Successfully moved workpapers to recycle bin.
          content:
            application/json:
              schema:
                type: boolean
              example: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmMainExtensionsUtilityErrorResponse'
              example:
                errors:
                - message: Bad request due to invalid input.
                  extensions:
                    statusCode: 400
                    code: ERR_BAD_4000
                    errorId: b3365190-92d7-4f8a-b109-2ed6132392f8
