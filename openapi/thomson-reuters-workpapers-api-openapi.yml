      summary: Retrieve binder items (folders and workpapers) available for move operations
      description: '## Purpose

        Retrieves a simplified list of all folders and workpapers in an engagement, specifically formatted for move and reorganization operations. This endpoint provides the necessary information to display available destination folders and validate move operations within the engagement binder structure.


        ## Why Use This Endpoint

        - Get a list of folders and workpapers for move/reorganization interfaces

        - Display available destination folders when moving workpapers

        - Validate that target folders exist before moving items

        - Build folder selection dropdowns for move operations

        - Retrieve folder hierarchy information for drag-and-drop interfaces


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

