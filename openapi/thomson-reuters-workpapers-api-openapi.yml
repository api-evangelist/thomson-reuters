        - **Example:** `engagementId: 94`


        **Step 3:** Get Binder Items for Move

        - **Endpoint:** `GET /workpapers/get-binder-itemsExternal/{engagementId}` (this endpoint)

        - **Use:** The `engagementId` from Step 2

        - **Returns:** Simplified list of folders and workpapers formatted for move operations


        **Step 4 (Optional):** Move Items

        - **Endpoint:** `POST /workpapers/move`

        - **Use:** Use folder IDs from Step 3 to specify destination folders

        - **Returns:** Confirmation of successful move


        ## Request Details

        - **Method:** GET

        - **Content-Type:** application/json

        - **Path Parameters:**

        - `engagementId` (int, required) - The engagement identifier

        - **No request body required**


        ## Common Use Cases

        1. **Move Dialog:** Populate folder selection in move workpaper dialogs

        2. **Drag-and-Drop:** Provide folder structure for drag-and-drop reorganization

        3. **Folder Validation:** Verify target folders exist before move operations

        4. **Tree Navigation:** Build simplified tree views for reorganization interfaces


        ## Important Notes

        - Response is optimized for move operations (lighter than full tree-data endpoint)

        - Includes recycle bin indicator to prevent moving items to deleted folders

        - Folder IDs from this response are used in the move endpoint

        - Items maintain hierarchical parent-child relationships

        - Display order is included for maintaining item sequence

        - Some metadata available in full tree-data endpoint may be excluded here for performance'
