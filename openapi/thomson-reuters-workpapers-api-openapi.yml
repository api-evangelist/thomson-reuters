  /external/v1/workpapers/load-editable-workpaper-properties/{workpaperId}:
    get:
      tags:
      - Workpapers
      summary: Retrieve only editable properties of a workpaper for modification
      description: '## Purpose

        Retrieves only the editable properties of a specific workpaper, excluding read-only system fields. This endpoint is designed specifically for workpaper update workflows, providing only the fields that can be modified by users.


        ## Why Use This Endpoint

        - Prepare workpaper data for editing in user interfaces

        - Retrieve only modifiable properties to update a workpaper

        - Reduce response payload by excluding read-only fields

        - Build workpaper edit forms with appropriate fields

        - Ensure users only interact with editable properties


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the `workpaperId`

        - **Endpoint:** `GET /workpapers/tree-data/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** List of workpapers with their IDs

        - **Example:** `workpaperId: 12345`


        **Step 4:** Retrieve Editable Workpaper Properties

        - **Endpoint:** `GET /workpapers/load-editable-workpaper-properties/{workpaperId}` (this endpoint)

        - **Use:** The `workpaperId` from Step 3

        - **Returns:** Editable workpaper properties ready for modification


        **Step 5 (Optional):** Update Workpaper Properties

        - **Endpoint:** `PUT /workpapers/update-workpaper-properties`

        - **Use:** Modify the properties from Step 4 and submit the updated object

        - **Returns:** Success confirmation


        ## Request Details

        - **Method:** GET

        - **Content-Type:** application/json

        - **Path Parameters:**

        - `workpaperId` (int, required) - The unique identifier of the workpaper

        - **No request body required**


        ## Common Use Cases

        1. **Workpaper Edit Form:** Populate edit forms with current editable values

        2. **Property Updates:** Retrieve current values before making changes

        3. **Bulk Updates:** Load properties for multiple workpapers to update programmatically

        4. **Assignment Changes:** Update workpaper assignments to different users


        ## Important Notes

        - Returns only editable properties; use `/workpapers/load-all-workpaper-properties/{workpaperId}` for complete data

        - The response object can be directly used with `/workpapers/update-workpaper-properties` endpoint

        - Read-only system fields (timestamps, IDs, etc.) are excluded from the response

        - Workpaper must exist and user must have edit permissions

        - Some properties may be conditionally editable based on engagement state'
      operationId: EmMainEndPointsWorkPapersLoadEditableWorkpaperPropertiesExternalEndpoint
      parameters:
      - name: workpaperId
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      responses:
        '200':
          description: Successfully retrieved editable workpaper properties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalWorkpaperExternalDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmMainExtensionsUtilityErrorResponse'
              example:
