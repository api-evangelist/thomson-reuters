  /external/v1/workpapers/add-with-file:
    post:
      tags:
      - Workpapers
      summary: Create a new workpaper with file upload (max 95MB)
      description: '## Purpose

        Creates a new workpaper with an associated file upload in a single operation. This endpoint accepts both the workpaper metadata and the file content via multipart form-data. Suitable for files up to 95MB; for larger files, use the metadata + chunk upload workflow instead.


        ## Why Use This Endpoint

        - Add new workpapers with files in a single request

        - Upload documents up to 95MB directly

        - Simplify workpaper creation for standard-sized files

        - Combine metadata and file upload in one operation

        - Quick workpaper addition without multi-step workflows


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the `folderId` (Optional)

        - **Endpoint:** `GET /workpapers/folder-structure/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** Folder structure with folder IDs

        - **Example:** `folderId: 393395`


        **Step 4:** Get the `assignedLoginId` (Optional)

        - **Endpoint:** `GET /users/all`

        - **Returns:** List of users with their login IDs

        - **Example:** `assignedLoginId: 1395`


        **Step 5:** Add Workpaper with File

        - **Endpoint:** `POST /workpapers/add-with-file` (this endpoint)

        - **Use:** Submit form-data with file and metadata from previous steps


        ## Request Details

        - **Method:** POST

        - **Content-Type:** multipart/form-data

        - **Form-Data Fields:**

        - `File` (IFormFile, required) - The workpaper file to upload (max 95MB)

        - `EngagementId` (int, required) - The engagement binder ID

        - `Description` (string, required) - The workpaper title/description

        - `Reference` (string, optional) - Reference number or code

        - `FolderId` (int?, optional) - Destination folder ID (null for root level)

        - `AssignedLoginId` (int?, optional) - Assigned user login ID

        - `RollForwardType` (string, optional) - Roll forward behavior: "Include" (default), "Exclude", "Replace with placeholder"

        - `DeleteDuringFinalize` (bool?, optional) - Whether to delete during finalization

        - `DocumentId` (string, optional) - Document ID for positioning


        ## Common Use Cases

        1. **Standard Document Upload:** Add Excel, PDF, or Word files as workpapers

        2. **Supporting Documentation:** Upload supporting documents for engagement work

        3. **Initial Workpaper Setup:** Create workpaper structure with files during engagement setup

        4. **Batch Workpaper Creation:** Programmatically add multiple workpapers with files


        ## Important Notes

        - Maximum file size is 95MB; files larger than this must use the chunk upload workflow

        - For files >95MB: Use `/workpapers/add-metadata` endpoint first, then `/documentmanagement/upload-chunk/{documentId}`

        - File is uploaded immediately and associated with the workpaper

        - EngagementId, Description, and File are required fields

        - FolderId determines where the workpaper appears in the folder hierarchy

        - RollForwardType values: "Include", "Exclude", "Replace with placeholder"

        - DocumentId is optional and used for positioning the workpaper after a specific document

        - The request must use multipart/form-data encoding

        - File type is automatically detected from the uploaded file'
