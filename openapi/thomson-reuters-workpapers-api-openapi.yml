  /external/v1/SignOff/save-workpaper-signoffs:
    post:
      tags:
      - Workpapers
      summary: Save or update sign-off statuses for workpapers
      description: '## Purpose

        Saves or updates sign-off statuses for one or more workpapers within an engagement. Sign-offs track the approval workflow stages (e.g., Prepared, Reviewed, Manager Review) and who completed each stage. This endpoint allows programmatic management of workpaper approval workflows.


        ## Why Use This Endpoint

        - Track workpaper approval workflow progress

        - Record who prepared or reviewed workpapers

        - Manage sign-off status programmatically

        - Update sign-off dates and completion status

        - Support audit trail requirements for workpaper reviews

        - Integrate with external workflow systems


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the `workpaperIds`

        - **Endpoint:** `GET /workpapers/tree-data/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** List of workpapers with their IDs

        - **Example:** `workpaperId: 12345`


        **Step 4:** Get Sign-Off Type IDs

        - **Endpoint:** `GET /SignOff/get-all-signoffs`

        - **Returns:** List of active sign-off types with their IDs

        - **Example:** SignOffTypeId for "Reviewed" = 2


        **Step 5:** Get User IDs (for sign-off assignment)

        - **Endpoint:** `GET /users/all`

        - **Returns:** List of users with their IDs

        - **Example:** `userId: 1395`


        **Step 6:** Save Workpaper Sign-Offs

        - **Endpoint:** `POST /SignOff/save-workpaper-signoffs` (this endpoint)

        - **Use:** Submit sign-off data with IDs from previous steps


        ## Request Details

        - **Method:** POST

        - **Content-Type:** application/json

        - **Request Body:** `WorkPaperSignOffExternalRequest` object with fields:

        - `EngagementId` (int, required) - The engagement identifier

        - `WorkpaperSignOffs` (array, required) - List of sign-off records to save:

        - `WorkpaperId` (int) - The workpaper identifier

        - `SignOffTypeId` (int) - The sign-off type identifier (from get-all-signoffs)

        - `UserId` (int) - The user who completed the sign-off

        - `SignOffDate` (DateTime) - When the sign-off was completed

        - `IsCompleted` (bool) - Whether the sign-off stage is complete


        ## Common Use Cases

        1. **Workpaper Preparation:** Mark workpapers as "Prepared" when initial work is complete

        2. **Review Tracking:** Record review completion by managers or partners

        3. **Approval Workflows:** Track multi-level approval processes

        4. **Audit Documentation:** Maintain sign-off records for compliance and audit purposes


        ## Important Notes

        - Sign-off type IDs must be obtained from `/SignOff/get-all-signoffs` endpoint

        - All workpaper IDs must belong to the specified engagement

        - Sign-off dates should be in valid DateTime format (ISO 8601 recommended)

        - User IDs must be valid users with access to the engagement

        - Sign-offs can be updated by submitting the same workpaper/sign-off type combination

        - Existing sign-offs are updated; new sign-offs are created

        - Some sign-off types may have hierarchical dependencies

        - Sign-off records are permanent and tracked for audit purposes

        - Invalid sign-off type IDs or workpaper IDs will cause validation errors'
      operationId: EmMainEndPointsExternalWorkpapersSaveWorkpaperSignOffsExternalEndpoint
      parameters:
