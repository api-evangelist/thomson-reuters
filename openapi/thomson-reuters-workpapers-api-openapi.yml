  /external/v1/workpapers/tree-data/{engagementId}:
    get:
      tags:
      - Workpapers
      summary: Retrieve all binder items (workpapers and folders) for an engagement
      description: '## Purpose

        Retrieves the complete tree structure of all binder items including both folders and workpapers for a specific engagement. This endpoint provides a comprehensive view of the engagement''s document organization, including hierarchical relationships, metadata, and properties for all items.


        ## Why Use This Endpoint

        - Get complete engagement document structure in one call

        - Display full binder contents including folders and workpapers

        - Build navigation trees with complete item metadata

        - Retrieve workpaper IDs for subsequent operations

        - Analyze engagement organization and structure

        - Export engagement content listings


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get All Binder Items

        - **Endpoint:** `GET /workpapers/tree-data/{engagementId}` (this endpoint)

        - **Use:** The `engagementId` from Step 2

        - **Returns:** Complete tree structure with all folders and workpapers


        ## Request Details

        - **Method:** GET

        - **Content-Type:** application/json

        - **Path Parameters:**

        - `engagementId` (int, required) - The engagement identifier

        - **No request body required**


        ## Common Use Cases

        1. **Full Binder View:** Display complete engagement contents to users

        2. **Workpaper Selection:** Retrieve workpaper IDs for operations like updates or deletions

        3. **Structure Analysis:** Analyze how engagement documents are organized

        4. **Reporting:** Generate reports of engagement contents and organization


        ## Important Notes

        - Returns both folders and workpapers (unlike `/folder-structure/` which returns only folders)

        - Response includes complete metadata for all items

        - Tree structure reflects current state of the engagement

        - Workpaper IDs from this response can be used in other workpaper operations

        - Large engagements may return significant data; consider pagination if available

        - Workpapers in recycle bin are typically excluded from this view

        - Items are organized hierarchically based on folder relationships'
      operationId: EmMainEndPointsExternalWorkpapersGetBinderItemsExternalEndpoint
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      responses:
        '200':
          description: Successfully retrieved the workpaper tree data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EMMainDataTransferObjectsModelsExternalEngagementBinderItemResultExternal'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmMainExtensionsUtilityErrorResponse'
              example:
                errors:
                - message: Bad request due to invalid input.
                  extensions:
                    statusCode: 400
                    code: ERR_BAD_4000
                    errorId: d0a1c0b7-5bed-4cb2-8fcc-3974205b547c
                    dateTime: '2026-04-21T05:50:04.6952854Z'
                    traceId: 82bc6b2eb6f14d68b5aab5bc728c248e
                    spanId: 358611c48f91f940
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmMainExtensionsUtilityErrorResponse'
              example:
                errors:
                - message: Unauthorized access.
                  extensions:
                    statusCode: 401
                    code: ERR_AUTH_4010
                    errorId: 4ad00e22-2550-4852-9855-e362cbb4119f
                    dateTime: '2026-04-21T05:50:04.6952139Z'
                    traceId: 886501a387444db9b752a7a44bb51c61
