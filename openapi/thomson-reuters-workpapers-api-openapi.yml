  /external/v1/workpapers/move:
    post:
      tags:
      - Workpapers
      summary: Move workpapers or folders to different locations within an engagement
      description: '## Purpose

        Moves one or more binder items (workpapers and/or folders) to a different folder location within the same engagement. This endpoint allows reorganization of engagement structure while maintaining item properties and contents.


        ## Why Use This Endpoint

        - Reorganize engagement folder structure

        - Move workpapers to different locations for better organization

        - Relocate entire folder hierarchies to new positions

        - Clean up and optimize engagement structure

        - Implement bulk reorganization operations


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get Binder Item IDs and Folder Structure

        - **Endpoint:** `GET /workpapers/tree-data/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** Complete binder structure with workpaper IDs and folder IDs


        **Step 4:** Move Binder Items

        - **Endpoint:** `POST /workpapers/move` (this endpoint)

        - **Use:** Submit move request with source item IDs and destination folder ID

        - **Select:** IDs of items to move and destination folder ID


        ## Request Details

        - **Method:** POST

        - **Content-Type:** application/json

        - **Request Body Parameters:**

        - `EngagementId` (int, required) - The engagement identifier

        - `DestFolderId` (int, required) - Destination folder ID where items will be moved

        - `WorkpaperIds` (array of int, optional) - List of workpaper IDs to move

        - `FolderIds` (array of int, optional) - List of folder IDs to move

        - `DisplayOrderIndex` (int, optional) - Display order position in destination folder


        **Note:** At least one of WorkpaperIds or FolderIds must be provided


        ## Common Use Cases

        1. **Workpaper Reorganization:** Move workpapers to appropriate folders after initial upload

        2. **Folder Restructuring:** Relocate entire folders to reorganize engagement structure

        3. **Batch Operations:** Move multiple items at once for efficiency

        4. **Order Management:** Control item display order by specifying DisplayOrderIndex


        ## Important Notes

        - All item IDs must belong to the specified engagement

        - Operation fails if any ID is invalid or doesn''t exist

        - Files associated with workpapers remain in the system

        - Some workpapers may be protected from operations based on engagement state

        - Destination folder must exist in the same engagement

        - Cannot move a folder into itself or its own descendants

        - Moving a folder moves all its contents (subfolders and workpapers)

        - DisplayOrderIndex determines position in destination folder (0-based)

        - Items maintain all properties and metadata after moving

        - Operation is atomic; either all items move or none do

        - Cannot move items across different engagements

        - Root-level folders may have restrictions on moving

        - Invalid folder hierarchy operations will cause validation errors'
      operationId: EmMainEndPointsExternalWorkpapersMoveBinderItemsExternalEndpoint
      parameters:
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      requestBody:
        x-name: MoveItemsExternalDto
        description: ''
        content:
