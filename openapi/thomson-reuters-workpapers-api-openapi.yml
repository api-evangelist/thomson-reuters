  /external/v1/workpapers/add-metadata:
    post:
      tags:
      - Workpapers
      summary: Add workpaper with metadata only (no file upload)
      description: '## Purpose

        Creates a new workpaper entry with metadata only, without uploading the file content. This endpoint is designed for large file workflows (files >95MB) where the workpaper metadata is created first, and the file is uploaded separately in chunks using the chunk upload endpoint. The endpoint returns a DocumentId that is used for subsequent chunk uploads. ## Why Use This Endpoint

        - Upload files larger than 95MB using the chunk upload workflow

        - Separate workpaper creation from file upload operations

        - Pre-create workpaper entries before file upload completes

        - Implement multi-step upload workflows

        - Create placeholders for workpapers with pending file uploads

        - Support resumable upload scenarios


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the `folderId` (Optional)

        - **Endpoint:** `GET /workpapers/folder-structure/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** Folder structure with folder IDs

        - **Example:** `folderId: 393395`


        **Step 4:** Get the `assignedLoginId` (Optional)

        - **Endpoint:** `GET /users/all`

        - **Returns:** List of users with their login IDs

        - **Example:** `assignedLoginId: 1395`


        **Step 5:** Add Workpaper Metadata

        - **Endpoint:** `POST /workpapers/add-metadata` (this endpoint)

        - **Use:** Submit workpaper metadata including FileSize and FileType

        - **Returns:** WorkpaperId and DocumentId for the new workpaper


        **Step 6:** Upload File in Chunks

        - **Endpoint:** `POST /documentmanagement/upload-chunk/{documentId}`

        - **Use:** The DocumentId from Step 5 to upload file chunks (max 10MB per chunk)

        - **Repeat:** For each chunk until file upload is complete


        ## Request Details

        - **Method:** POST

        - **Content-Type:** application/json

        - **Request Body:** `AddWorkpaperExternalMainRequest` object with fields:

        - `EngagementId` (int, required) - The engagement identifier

        - `Description` (string, required) - Workpaper description/name

        - `Reference` (string, optional) - Workpaper reference code

        - `FolderId` (int, optional) - Parent folder ID

        - `AssignedLoginId` (int, optional) - ID of user assigned to the workpaper

        - `RollForwardType` (string, optional) - "Include", "Exclude", or "Replace with placeholder"

        - `DeleteDuringFinalize` (bool, optional) - Whether to delete during finalization

        - `DocumentId` (string, optional) - Position reference for workpaper insertion

        - `FileSize` (long, required) - Total file size in bytes

        - `FileType` (string, required) - File extension (e.g., "xlsx", "pdf", "docx")


        ## Common Use Cases

        1. **Large File Upload:** Upload files >95MB by creating metadata first, then uploading chunks

        2. **Resumable Uploads:** Create workpaper entry before starting upload to enable resume capability

        3. **Multi-Step Workflows:** Separate workpaper creation from file upload in complex workflows

        4.'
