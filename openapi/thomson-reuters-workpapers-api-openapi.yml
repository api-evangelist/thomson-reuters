  /external/v1/workpapers/load-all-workpaper-properties/{workpaperId}:
    get:
      tags:
      - Workpapers
      summary: Retrieve all properties of a specific workpaper
      description: '## Purpose

        Retrieves comprehensive information about a specific workpaper including all its properties, metadata, and configuration settings. This endpoint provides complete workpaper details including both editable and read-only properties.


        ## Why Use This Endpoint

        - View complete workpaper information and metadata

        - Audit workpaper properties and settings

        - Display full workpaper details in user interfaces

        - Analyze workpaper configuration and assignments

        - Retrieve information for reporting and documentation purposes


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the `workpaperId`

        - **Endpoint:** `GET /workpapers/tree-data/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** List of workpapers with their IDs

        - **Example:** `workpaperId: 12345`


        **Step 4:** Retrieve All Workpaper Properties

        - **Endpoint:** `GET /workpapers/load-all-workpaper-properties/{workpaperId}` (this endpoint)

        - **Use:** The `workpaperId` from Step 3

        - **Returns:** Complete workpaper properties and metadata


        ## Request Details

        - **Method:** GET

        - **Content-Type:** application/json

        - **Path Parameters:**

        - `workpaperId` (int, required) - The unique identifier of the workpaper

        - **No request body required**


        ## Common Use Cases

        1. **Workpaper Details View:** Display comprehensive workpaper information to users

        2. **Audit Trail:** Review complete workpaper configuration for compliance

        3. **Data Export:** Extract full workpaper data for reporting or migration

        4. **Integration Sync:** Retrieve complete workpaper state for system synchronization


        ## Important Notes

        - Returns all properties including read-only fields

        - For editing workpapers, use `/workpapers/load-editable-workpaper-properties/{workpaperId}` instead

        - Workpaper must exist in the system

        - User must have access permissions to the engagement containing the workpaper

        - Response includes system-generated properties that cannot be modified'
      operationId: EmMainEndPointsExternalWorkpapersLoadAllWorkpaperPropertiesEndpoint
      parameters:
      - name: workpaperId
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: X-TR-EM-APIKEY
        in: header
        required: true
        description: Required API key for external endpoints
        schema:
          type: string
          description: API key for external endpoints
      responses:
        '200':
