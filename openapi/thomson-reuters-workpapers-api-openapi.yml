  /external/v1/workpapers/update-workpaper-properties:
    put:
      tags:
      - Workpapers
      summary: Update properties of an existing workpaper
      description: '## Purpose

        Updates the editable properties of an existing workpaper. This endpoint allows modification of workpaper metadata such as description, reference, assigned user, folder location, and roll forward settings. Use this to change workpaper information without affecting the associated file.


        ## Why Use This Endpoint

        - Modify workpaper description or reference codes

        - Reassign workpapers to different users

        - Move workpapers to different folders

        - Update roll forward behavior settings

        - Change workpaper finalization settings

        - Bulk update workpaper properties programmatically


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the `workpaperId`

        - **Endpoint:** `GET /workpapers/tree-data/{engagementId}`

        - **Use:** The `engagementId` from Step 2

        - **Returns:** List of workpapers with their IDs

        - **Example:** `workpaperId: 12345`


        **Step 4:** Load Current Editable Properties

        - **Endpoint:** `GET /workpapers/load-editable-workpaper-properties/{workpaperId}`

        - **Use:** The `workpaperId` from Step 3

        - **Returns:** Current editable workpaper properties

        - **Note:** Use this response as the base for your updates


        **Step 5:** Update Workpaper Properties

        - **Endpoint:** `PUT /workpapers/update-workpaper-properties` (this endpoint)

        - **Use:** Modify properties from Step 4 and submit the updated object


        ## Request Details

        - **Method:** PUT

        - **Content-Type:** application/json

        - **Request Body:** `WorkpaperExternalDto` object with fields:

        - `WorkpaperId` (int, required) - The workpaper identifier

        - `EngagementId` (int, required) - The engagement identifier

        - `Description` (string, optional) - Workpaper description/name

        - `Reference` (string, optional) - Workpaper reference code

        - `AssignedLoginId` (int, optional) - ID of user assigned to the workpaper

        - `FolderId` (int, optional) - Parent folder ID

        - `RollForwardType` (string, optional) - "Include", "Exclude", or "Replace with placeholder"

        - `DeleteDuringFinalize` (bool, optional) - Whether to delete during finalization


        ## Common Use Cases

        1. **Reassignment:** Change the assigned user for a workpaper

        2. **Reorganization:** Move workpapers to different folders

        3. **Description Updates:** Update workpaper descriptions for clarity

        4. **Roll Forward Config:** Change roll forward behavior for year-end processes

        5. **Bulk Updates:** Programmatically update multiple workpapers


        ## Important Notes

        - Load current properties first using `/workpapers/load-editable-workpaper-properties/{workpaperId}`

        - Only editable properties can be modified; system fields are ignored

        - Workpaper must exist and user must have edit permissions

        - WorkpaperId and EngagementId are required and cannot be changed

        - Moving to a different folder requires a valid FolderId from the same engagement

        - Updates do not affect the associated file content

        - Some properties may be read-only based on engagement state (e.g., finalized engagements)

        - Invalid RollForwardType values will cause validation errors'
