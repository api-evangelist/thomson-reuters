  /external/v1/workpapers/folder-structure/{engagementId}:
    get:
      tags:
      - Workpapers
      summary: Retrieve hierarchical folder structure of workpapers for an engagement
      description: '## Purpose

        Retrieves the complete hierarchical folder structure for workpapers within a specific engagement. This endpoint returns the organizational structure of folders and workpapers, allowing you to understand how documents are organized within an engagement binder.


        ## Why Use This Endpoint

        - Understand the organizational structure of workpapers in an engagement

        - Navigate the folder hierarchy programmatically

        - Build user interfaces that display workpaper organization

        - Identify folder IDs needed for adding or moving workpapers

        - Retrieve folder metadata and properties


        ## Authentication

        Requires Bearer token authentication (CIAM). Include the token in the Authorization header:

        ```

        Authorization: Bearer

        ```


        ## Workflow - How to Get Required IDs

        **Step 1:** Get the `clientId`

        - **Endpoint:** `GET /clients/load-clients`

        - **Returns:** List of clients with their IDs

        - **Example:** `clientId: 1547`


        **Step 2:** Get the `engagementId`

        - **Endpoint:** `GET /engagements/{clientId}`

        - **Use:** The `clientId` from Step 1

        - **Returns:** List of engagements with their IDs

        - **Example:** `engagementId: 94`


        **Step 3:** Get the Folder Structure

        - **Endpoint:** `GET /workpapers/folder-structure/{engagementId}` (this endpoint)

        - **Use:** The `engagementId` from Step 2

        - **Returns:** Hierarchical folder structure with folder IDs and properties


        ## Request Details

        - **Method:** GET

        - **Content-Type:** application/json

        - **Path Parameters:**

        - `engagementId` (int, required) - The engagement identifier

        - **No request body required**


        ## Common Use Cases

        1. **Navigation UI:** Build a tree-view interface showing folder organization

        2. **Folder Selection:** Provide users with folder options when uploading workpapers

        3. **Structure Analysis:** Analyze how workpapers are organized across engagements

        4. **Folder Management:** Identify folder IDs for moving or reorganizing workpapers


        ## Important Notes

        - Only returns folders, not individual workpapers (use `/workpapers/tree-data/{engagementId}` for full binder items)

        - Folder structure reflects the current state of the engagement

        - Empty folders are included in the response

        - Folder IDs are required for operations like adding or moving workpapers

        - The structure is hierarchical and preserves parent-child relationships'
      operationId: EmMainEndPointsExternalWorkpapersGetWorkpaperFolderStructureExternalEndpoint
      parameters:
      - name: engagementId
        in: path
        required: true
        schema:
          type:
