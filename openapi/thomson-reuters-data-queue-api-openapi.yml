openapi: 3.2.0
info:
  title: Thomson Reuters Data Queue API
  version: '1.0'
  description: 'Operations tagged Data Queue across 2 of this provider''s published API definitions: thomson-reuters-general-ledger-manager-openapi.json, thomson-reuters-general-ledger-manager-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/general-ledger-manager/v1
security:
- bearerAuth: []
tags:
- name: Data Queue
  description: 'Manage ingests, upload files, extensions, extract data from integrations.

    ONESOURCE General Ledger Manager Data Queue APIs enables the users to upload the trial balance data from multiple disparate sources and process it.'
paths:
  /ingest/ingestions:
    get:
      tags:
      - Data Queue
      summary: Get a paginated list of available ingestions
      description: Returns a list of all the ingestions for a particular client based on filter conditions with their metadata
      operationId: getIngestions
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionIngestionResponse'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/general-ledger-manager/v1
  /ingest/ingestions/{id}:
    get:
      tags:
      - Data Queue
      summary: Get an ingestion by ID
      description: Retrieves details of an ingestion identified by a unique id from ingest Metadata
      operationId: getIngestionById
      parameters:
      - name: id
        in: path
        description: Unique identifier of the ingested data
        required: true
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IngestionResponse'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Data Queue
      summary: Delete Ingest
      description: Remove Ingest details by ingest id
      operationId: removeIngestDetails
      parameters:
      - name: id
        in: path
        description: Unique identifier of the ingest data
        required: true
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      responses:
        '204':
          description: ingest details does not exist
      security:
      - bearerAuth: []
    patch:
      tags:
      - Data Queue
      summary: Updates an existing ingest Metadata
      description: Updates Metadata to change Year, Period & Name
      operationId: updateMetadata_1
      parameters:
      - name: id
        in: path
        description: Unique identifier of the ingested data
        required: true
        schema:
          type: string
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchIngestionRequest'
      responses:
        '204':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdResponse'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/general-ledger-manager/v1
