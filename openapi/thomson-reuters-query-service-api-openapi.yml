components:
  schemas:
    RecordField:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
    ApiCollectionCollectionDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionDTO'
        _meta:
          $ref: '#/components/schemas/ApiMeta'
    ApiCollectionCollectionItem:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItem'
        _meta:
          $ref: '#/components/schemas/ApiMeta'
    ResultsMeta:
      type: object
      properties:
        offset:
          type: integer
          format: int32
        limit:
          maximum: 2000
          type: integer
          format: int32
          example: 200
        count:
          type: integer
          format: int64
    RecordDTO:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RecordField'
      example: {}
    RecordsDTO:
      type: object
      properties:
        items:
          type: array
          example:
          - blueprint_column_1_name: example value
            blueprint_column_2_name: something else
            blueprint_column_3_name: 42
          items:
            $ref: '#/components/schemas/RecordDTO'
        _meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      type: object
      properties:
        offset:
          type: integer
          format: int32
        limit:
          maximum: 2000
          type: integer
          format: int32
          example: 200
        count:
          type: integer
          format: int64
    CollectionItem:
      type: object
      properties:
        id:
