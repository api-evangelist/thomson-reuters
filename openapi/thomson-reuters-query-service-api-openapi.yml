openapi: 3.2.0
info:
  title: Thomson Reuters Query Service API
  version: '1.0'
  description: 'Operations tagged Query Service across 5 of this provider''s published API definitions: thomson-reuters-datahub-query-service-1-0-openapi.json, thomson-reuters-general-ledger-manager-openapi.json, thomson-reuters-datahub-query-service-1-0-openapi.yml, thomson-reuters-datahub-query-service-openapi.yml, thomson-reuters-general-ledger-manager-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/data-hub/v1
- url: https://api.onesourcetax.com/general-ledger-manager/v1
security:
- bearerAuth: []
tags:
- name: Query Service
paths:
  /query/collections:
    get:
      tags:
      - Query Service
      summary: Get a paginated list of published collections
      description: 'Returns a list of published collections with their metadata.


        Potential values for ontology:


        idname


        1financial-hierarchy-position


        2chart of accounts


        3entity


        4account


        5balance'
      operationId: getCollections
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Number of records in a collection to skip before starting the response set.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of records to return in the result set.
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionCollectionDTO'
      security:
      - bearerAuth: []
    post:
      tags:
      - Query Service
      summary: Query a paginated list of collections based on the query request body
      description: Returns a list of collections with their metadata.
      operationId: queryCollections
      parameters:
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
          type: string
      requestBody:
        description: Query paginated list of collection based on filter condition.
        content:
          application/json:
            schema:
              type: string
              example:
                filter:
                  eq:
                  - index[3]
                  - e123
      responses:
        '200':
          description: Collection query successful.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionCollectionItem'
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /query/collections/{id}:
    get:
      tags:
      - Query Service
      summary: Get a published collection by ID
      description: 'Returns collection metadata for the specified collection ID.


        Potential values for ontology:


        idname


        1financial-hierarchy-position


        2chart of accounts


        3entity


        4account


        5balance'
      operationId: getCollection
      parameters:
      - name: id
        in: path
        description: Unique identifier of the collection.
        required: true
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        required: false
        schema:
