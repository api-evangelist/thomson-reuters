openapi: 3.2.0
info:
  title: Thomson Reuters Shipments API
  version: '1.0'
  description: 'Operations tagged Shipments across 2 of this provider''s published API definitions: thomson-reuters-onesource-trust-tax-shipment-openapi.json, thomson-reuters-onesource-trust-tax-shipment-openapi.yml. Each path carries the servers of the definition it was published in.'
host: api.onesourcetax.com
basePath: /trust-tax/shipment
tags:
- name: Shipments
paths:
  /eap/odata/pans/{pan}/history:
    get:
      tags:
      - Shipments
      summary: Returns shipment histories data for the particular PAN and year
      description: Allows authenticated users to access the Shipments history data
      operationId: AllowsAuthenticatedUsersToAccessTheShipmentsHistoryData
      consumes: []
      produces:
      - application/json
      parameters:
      - name: pan
        in: path
        description: ''
        required: true
        type: string
      - name: taxyear
        in: query
        description: ''
        required: false
        type: integer
        format: int32
      - name: $select
        in: query
        description: Limits the properties returned in the result.
        required: false
        type: string
      - name: $expand
        in: query
        description: Indicates the related entities to be represented inline. The maximum depth is 2.
        required: false
        type: string
      - name: $filter
        in: query
        description: 'Restricts the set of items returned. The maximum number of expressions is 100. The allowed functions are: allfunctions.'
        required: false
        type: string
      - name: $orderby
        in: query
        description: Specifies the order in which items are returned. The maximum number of expressions is 5.
        required: false
        type: string
      - name: $top
        in: query
        description: Limits the number of items returned from a collection.
        required: false
        type: integer
        format: int32
      - name: $skip
        in: query
        description: Excludes the specified number of items of the queried collection from the result.
        required: false
        type: integer
        format: int32
      - name: $count
        in: query
        description: Indicates whether the total count of items within a collection are returned in the result.
        required: false
        type: boolean
        default: false
      - name: authorization
        in: header
        description: 'JWT Authorization header using the Bearer scheme. Example: "Bearer {token}"'
        required: true
        type: string
      responses:
        '200':
          description: Success
          schema:
            uniqueItems: false
            type: array
            items:
              $ref: '#/definitions/ShipmentHistory'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponseModel'
        '500':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponseModel'
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Allows authenticated users to access the Shipments history data
  /eap/odata/pans/{pan}/tracking:
    get:
      tags:
      - Shipments
      summary: Returns shipment trackings data for the particular PAN
      description: Allows authenticated users to access the Shipments tracking data
      operationId: AllowsAuthenticatedUsersToAccessTheShipmentsTrackingData
      consumes: []
      produces:
      - application/json
      parameters:
      - name: pan
        in: path
        description: ''
        required: true
        type: string
      - name: $select
        in: query
        description: Limits the properties returned in the result.
        required: false
        type: string
      - name: $expand
        in: query
        description: Indicates the related entities to be represented inline. The maximum depth is 2.
        required: false
        type: string
      - name: $filter
        in: query
        description: 'Restricts the set of items returned. The maximum number of expressions is 100. The allowed functions are: allfunctions.'
        required: false
        type: string
      - name: $orderby
        in: query
        description: Specifies the order in which items are returned. The maximum number of expressions is 5.
        required: false
        type: string
      - name: $top
        in: query
        description: Limits the number of items returned from a collection.
        required: false
        type: integer
        format: int32
      - name: $skip
        in: query
        description: Excludes the specified number of items of the queried collection from the result.
        required: false
        type: integer
        format: int32
      - name: $count
        in: query
        description: Indicates whether the total count of items within a collection are returned in the result.
        required: false
        type: boolean
        default: false
      - name: authorization
        in: header
        description: 'JWT Authorization header using the Bearer scheme. Example: "Bearer {token}"'
        required: true
        type: string
      responses:
        '200':
          description: Success
          schema:
            uniqueItems: false
            type: array
            items:
              $ref: '#/definitions/ShipmentTracking'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponseModel'
        '500':
          description: Server Error
          schema:
            $ref: '#/definitions/ErrorResponseModel'
      deprecated: false
      x-operation-id-source: normalized
      x-operation-id-original: Allows authenticated users to access the Shipments tracking data
