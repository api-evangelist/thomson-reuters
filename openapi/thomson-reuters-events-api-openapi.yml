    StandardEventType:
      type: string
      description: ''
      x-enumNames:
      - Other
      - TrialDate
      - DiscoveryCutoff
      - Deposition
      - CaseAnalysis30
      - CaseAnalysis90
      enum:
      - Other
      - TrialDate
      - DiscoveryCutoff
      - Deposition
      - 30DayCaseAnalysisDue
      - 90DayCaseAnalysisDue
    BaseEventType:
      type: string
      description: ''
      x-enumNames:
      - Standard
      - Matter
      - Contract
      - Other
      - Sop
      - Document
      enum:
      - Standard
      - Matter
      - Contract
      - Other
      - Sop
      - Document
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            target:
              type: string
            details:
              type: array
              items:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  target:
                    type: string
            innererror:
