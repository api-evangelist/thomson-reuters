      x-operation-id-source: derived
  /beta/close:
    post:
      tags:
      - TaxReturn (beta)
      summary: Close an already opened tax return
      description: This endpoint closes an already opened tax return. You must open the tax return by calling the open endpoint before calling this endpoint.
      parameters:
      - name: authToken
        in: header
        required: true
        description: Returned from open tax return call
        schema:
          type:
          - string
          - 'null'
      - name: taxReturnSessionToken
        in: header
        required: true
        description: Returned from open tax return call
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                BadRequest_Close_TaxReturn_Busy:
                  summary: Tax return is busy
                  value:
                    statusCode: '400'
                    message: Unable to close the tax return. The tax return might already be closed. If not, the tax return will be auto-closed after some time by the system.
      operationId: postBetaClose
      x-operation-id-source: derived
  /beta/opentaxdefaults:
    post:
      tags:
      - TaxReturn (beta)
      summary: Open default tax return for editing
      description: This endpoint opens a default tax return for editing. Only administrator roles have access to this endpoint.
      requestBody:
        description: Request to open tax defaults
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenTaxReturnDefaultRequestDto'
            examples:
              opentaxdefaults-request:
                summary: Open tax defaults request
                value:
                  account: '3777'
                  taxYear: '2024'
      responses:
        '200':
          description: Success - Tax defaults opened successfully. Returns session tokens required for subsequent operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenTaxReturnResponseDto'
        '400':
          description: Bad Request - Invalid input parameters, validation errors, access denied for non-admin users, or business logic failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                BadRequest_InvalidModelState:
                  summary: Model validation failed
                  value:
                    type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                    title: One or more validation errors occurred.
                    status: 400
                    errors:
                      Account:
                      - Invalid account
                      TaxYear:
                      - Invalid tax year
                BadRequest_InvalidTaxReturnOrYear:
                  summary: Invalid tax return id or tax year
                  value:
                    message: Invalid tax return id or tax year
                    statusCode: '400'
                BadRequest_OnlyAdminAccess:
                  summary: Only administrators can access tax defaults
                  value:
                    message: Only Admin roles have access to open tax defaults
                    statusCode: '400'
        '401':
          description: Unauthorized - Missing or invalid authentication, or missing required user claims.
        '500':
          description: Internal Server Error - Server-side errors during tax defaults opening process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                InternalServerError_Generic:
                  summary: Generic server error
                  value:
                    message: An unexpected error occurred
                    statusCode: '500'
      operationId: postBetaOpentaxdefaults
      x-operation-id-source: derived
components:
