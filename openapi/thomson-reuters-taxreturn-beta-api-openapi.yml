        required: true
        description: Returned from open tax return call
        schema:
          type:
          - string
          - 'null'
      - name: taxReturnSessionToken
        in: header
        required: true
        description: Returned from open tax return call
        schema:
          type:
          - string
          - 'null'
      requestBody:
