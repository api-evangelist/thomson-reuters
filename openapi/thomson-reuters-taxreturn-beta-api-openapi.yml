          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                BadRequest:
                  summary: Bad Request
                  value:
                    responseType: BadRequest
                    statusCode: '400'
                    message: Bad Request
                    fieldErrors: []
        '406':
