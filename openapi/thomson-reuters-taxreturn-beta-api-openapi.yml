              1040-add-schedule-K1-partnership-master-group-request:
                $ref: '#/components/examples/1040-add-schedule-K1-partnership-master-group-request'
              1040-add-schedule-K1-estate-trust-master-group-request:
                $ref: '#/components/examples/1040-add-schedule-K1-estate-trust-master-group-request'
              1040-add-schedule-K1-S-corporation-master-group-request:
                $ref: '#/components/examples/1040-add-schedule-K1-S-corporation-master-group-request'
              1040-add-schedule-K1-PTP-master-group-request:
                $ref: '#/components/examples/1040-add-schedule-K1-PTP-master-group-request'
              1040-add-schedule-C-master-group-request:
                $ref: '#/components/examples/1040-add-schedule-C-master-group-request'
              1040-add-business-expenses-master-group-request:
                $ref: '#/components/examples/1040-add-business-expenses-master-group-request'
              1040-add-consolidated-1099-master-group-request:
                $ref: '#/components/examples/1040-add-consolidated-1099-master-group-request'
              1040-add-schedule-E-master-group-request:
                $ref: '#/components/examples/1040-add-schedule-E-master-group-request'
              1040-add-schedule-F-rental-master-group-request:
                $ref: '#/components/examples/1040-add-schedule-F-rental-master-group-request'
              1040-add-schedule-F-master-group-request:
                $ref: '#/components/examples/1040-add-schedule-F-master-group-request'
              1040-add-wages-request:
                $ref: '#/components/examples/1040-add-wages-request'
              1040-save-grid-tables:
                $ref: '#/components/examples/1040-save-grid-tables'
              1041-add-form-1099-INT-request:
                $ref: '#/components/examples/1041-add-form-1099-INT-request'
              990-add-compensation-of-officer-form-990-request:
                $ref: '#/components/examples/990-add-compensation-of-officer-form-990-request'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveFieldsResponseDTO'
              examples:
                save-fields-success:
                  $ref: '#/components/examples/save-fields-response-success'
        '207':
          description: Multi Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveFieldsResponseDTO'
              examples:
                save-fields-response-validation-failure-simple:
                  $ref: '#/components/examples/save-fields-response-validation-failure-simple'
                save-fields-response-validation-failure-group:
                  $ref: '#/components/examples/save-fields-response-validation-failure-group'
        '400':
          description: Bad Request - Invalid input parameters or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                BadRequest:
                  summary: Bad Request
                  value:
                    responseType: BadRequest
                    statusCode: '400'
                    message: Bad Request
                    fieldErrors: []
        '401':
          description: Unauthorized - Missing or invalid authentication
        '403':
          description: Forbidden - Valid authentication but insufficient permissions to access the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                Forbidden_ReadOnlyTaxReturn_SaveFields:
                  summary: Read-only tax return
                  value:
                    responseType: Forbidden
                    statusCode: '403'
                    message: Read Only TaxReturn
                    fieldErrors: []
        '500':
          description: Internal Server Error - Server-side errors during tax return processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                InternalServerError_GenericError_SaveFields:
                  summary: Generic server error
                  value:
                    responseType: InternalServerError
                    statusCode: '500'
                    message: Something went wrong. Please connect support team.
                    fieldErrors: []
        '503':
          description: Service Unavailable - Dependent services are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseDTO'
              examples:
                ServiceUnavailable:
                  summary: Service unavailable
                  value:
                    responseType: ServiceUnavailable
                    statusCode: '503'
                    message: Service unavailable
                    fieldErrors: []
      operationId: postBetaSaveFields
      x-operation-id-source: derived
