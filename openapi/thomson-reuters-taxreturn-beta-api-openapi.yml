openapi: 3.2.0
info:
  title: GoSystem Tax Return TaxReturn (beta) API
  description: This API exposes features for working with GoSystem Tax Returns.
  version: beta
servers:
- url: https://api.thomsonreuters.com/gosystem/tax-returns
security:
- Authorization: []
tags:
- name: TaxReturn (beta)
paths:
  /beta/open:
    post:
      tags:
      - TaxReturn (beta)
      summary: Open a tax return for editing
      description: This endpoint opens a tax return for editing. You must call this endpoint before calling other tax return operations.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenTaxReturnRequestDto'
            examples:
              tax-return-open-request:
                $ref: '#/components/examples/tax-return-open-request'
              password-protected-tax-return-open-request:
                $ref: '#/components/examples/password-protected-tax-return-open-request'
      responses:
        '200':
          description: Success - Tax return opened successfully. Returns session tokens required for subsequent operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenTaxReturnResponseDto'
              examples:
                open-return-success-response:
                  $ref: '#/components/examples/open-return-success-response'
        '400':
          description: Bad Request - Invalid input parameters, validation errors, or business logic failures. Includes model validation errors, account/tax return existence validation, tax year range errors, and password requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenLocatorErrorResponse'
              examples:
                BadRequest_InvalidTaxReturnOrYear:
                  $ref: '#/components/examples/BadRequest_InvalidTaxReturnOrYear'
                BadRequest_InvalidAccount:
                  $ref: '#/components/examples/BadRequest_InvalidAccount'
                BadRequest_InvalidTaxYear:
                  $ref: '#/components/examples/BadRequest_InvalidTaxYear'
                BadRequest_InvalidTaxReturnId:
                  $ref: '#/components/examples/BadRequest_InvalidTaxReturnId'
                BadRequest_AccountDoesNotExist:
                  $ref: '#/components/examples/BadRequest_AccountDoesNotExist'
                BadRequest_TaxReturnIdDoesNotExist:
                  $ref: '#/components/examples/BadRequest_TaxReturnIdDoesNotExist'
                BadRequest_TaxYearOutOfRange:
                  $ref: '#/components/examples/BadRequest_TaxYearOutOfRange'
                BadRequest_TaxYearTooHigh:
                  $ref: '#/components/examples/BadRequest_TaxYearTooHigh'
                BadRequest_PasswordRequired:
                  $ref: '#/components/examples/BadRequest_PasswordRequired'
                BadRequest_TaxReturnNotFoundForParameters:
                  $ref: '#/components/examples/BadRequest_TaxReturnNotFoundForParameters'
        '401':
          description: Unauthorized - Missing or invalid authentication, incorrect passwords, or insufficient user permissions. Includes JWT token issues, password errors for protected returns, and user access failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenLocatorErrorResponse'
              examples:
                Unauthorized_GroupNoAccessToTaxReturn:
                  $ref: '#/components/examples/Unauthorized_GroupNoAccessToTaxReturn'
                Unauthorized_InvalidCredentials:
                  $ref: '#/components/examples/Unauthorized_InvalidCredentials'
                Unauthorized_IncorrectPassword:
                  $ref: '#/components/examples/Unauthorized_IncorrectPassword'
                Unauthorized_NoAccessToTaxReturn:
                  $ref: '#/components/examples/Unauthorized_NoAccessToTaxReturn'
        '403':
          description: Forbidden - Valid authentication but insufficient permissions to access the resource. Includes user group access control failures, account access restrictions, and group assignment issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenLocatorErrorResponse'
              examples:
                Forbidden_NotMemberOfGroups:
                  $ref: '#/components/examples/Forbidden_NotMemberOfGroups'
                Forbidden_UserGroupNoAccess:
                  $ref: '#/components/examples/Forbidden_UserGroupNoAccess'
                Forbidden_NoAccessToAccount:
                  $ref: '#/components/examples/Forbidden_NoAccessToAccount'
                Forbidden_UserNotMemberOfAnyGroups:
                  $ref: '#/components/examples/Forbidden_UserNotMemberOfAnyGroups'
        '404':
          description: Not Found - The requested tax return can't be found in the system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenLocatorErrorResponse'
              examples:
                NotFound_TaxReturnNotFound:
                  $ref: '#/components/examples/NotFound_TaxReturnNotFound'
        '500':
          description: Internal Server Error - Server-side errors during tax return opening process. Includes tax return busy states, generic system errors, and data corruption issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenLocatorErrorResponse'
              examples:
                InternalServerError_TaxReturnBusy:
                  $ref: '#/components/examples/InternalServerError_TaxReturnBusy'
                InternalServerError_GenericError:
                  $ref: '#/components/examples/InternalServerError_GenericError'
                InternalServerError_TaxReturnDataDeleted:
                  $ref: '#/components/examples/InternalServerError_TaxReturnDataDeleted'
        '503':
          description: Service Unavailable - Dependent services are temporarily unavailable. Includes database connectivity issues and system maintenance scenarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenLocatorErrorResponse'
              examples:
                ServiceUnavailable_UnableToFetchLastTaxYear:
                  $ref: '#/components/examples/ServiceUnavailable_UnableToFetchLastTaxYear'
      operationId: postBetaOpen
      x-operation-id-source: derived
  /beta/save-fields:
