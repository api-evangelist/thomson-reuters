openapi: 3.2.0
info:
  title: Thomson Reuters Accounts API
  version: '1.0'
  description: 'Operations tagged Accounts across 6 of this provider''s published API definitions: thomson-reuters-common-accounts-service-1-0-openapi.json, thomson-reuters-common-accounts-service-openapi.json, thomson-reuters-statutory-reporting-period-setup-apis-openapi.json, thomson-reuters-common-accounts-service-1-0-openapi.yml, thomson-reuters-common-accounts-service-openapi.yml, thomson-reuters-statutory-reporting-period-setup-apis-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/administration/accounts/v1/charts-of-accounts
  description: Generated server url
- url: https://api.onesourcetax.com/statutory-reporting/v1/reporting-entities/
  description: Production server providing global access to reporting entities
- url: https://api.onesourcetax.com/statutory-reporting/v1/template-entities/
  description: Production server providing global access to template entities
- url: https://api-emea.onesourcetax.com/statutory-reporting/v1/reporting-entities/
  description: Production server for reporting entities supporting the EMEA region
- url: https://api-emea.onesourcetax.com/statutory-reporting/v1/template-entities/
  description: Production server for template entities supporting the EMEA region.
- url: https://api-apac.onesourcetax.com/statutory-reporting/v1/reporting-entities/
  description: Production server for reporting entities supporting the APAC region.
- url: https://api-apac.onesourcetax.com/statutory-reporting/v1/template-entities/
  description: Production server for template entities supporting the APAC region.
