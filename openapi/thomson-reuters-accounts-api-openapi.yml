  /{chart_of_accounts_id}/accounts/predictions/job:
    post:
      tags:
      - Accounts
      summary: Request FH mappings from AI model and apply it to unmapped accounts (limited to…
      description: Asynchronously predict FH for unmapped accounts (limited to first 10K). Returns a prediction job that can be used to track the progress of the bulk prediction operation. The job ID can be used to query the status of the prediction job later.
      operationId: triggerFHPredictionsForUnmappedAccounts
      parameters:
      - name: chart_of_accounts_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok - Returns prediction job details
          content:
