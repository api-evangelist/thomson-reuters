  /{entity-id}/financial-periods/{financial-period-id}/bulk/accounts:
    get:
      summary: Get Accounts
      tags:
      - Accounts
      description: Use this operation to return a list of Accounts with its attributes.
      operationId: GetListOfAccounts
      parameters:
      - name: entity-id
        in: path
        required: true
        description: The entity id in which the financial period is created. To obtain a reporting entity ID, refer to the [Get Reporting Entities API](#tag/reporting-entities/get/) documentation. For guidance on obtaining a template entity ID, see the [Get Template Entities API](#tag/template-entities/get/) documentation.
        schema:
          type: string
          format: uuid
        example: 81fa8dec-d6b0-454c-bd15-b38a00b479ab
      - name: financial-period-id
        in: path
        required: true
        description: The identifier of the financial period from which account details are retrieved. Obtain this ID using the [Get Financial Periods API](#tag/financial-periods/get{entity-id}/financial-periods).
        schema:
          type: string
          format: uuid
        example: 16378fc4-3147-47d0-a22a-b39f00aab97d
      responses:
        '200':
          description: Successfully retrieved a list of accounts with its data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '400':
          description: Bad Request. Occurs when the server cannot process the request due to invalid parameters or a malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidParameter:
                  summary: Example invalid financial-period-id error
                  value:
                    statusCode: 400
                    message: financial-period-id is not valid
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: https://developers.onesourcetax.com/errors/#keymanagement.service.invalid_access_token
                  title:
                    type: string
                    example: Invalid Access Token
                  detail:
                    type: string
                    example: Invalid Access Token
                  status:
                    type: integer
                    example: 401
                  instance:
                    type: string
                    example: /statutory-reporting/v1/reporting-entities/92abcd47-4e56-4961-b9b6-b30e00f46ba8/financial-periods/a5d4f2f3-5250-494d-b773-b30e00f46d48/bulk/accounts
                  api_requestId:
                    type: string
                    example: rrt-0080bd6edb6a51c07-c-ea-1408325-2337761-1
        '403':
          description: 'Forbidden: The request was understood, but the server refuses to authorize it. The client does not have the necessary permissions to access the resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenAccessDenied:
                  summary: Example forbidden error - Insufficient permissions
                  value:
                    StatusCode: 403
                    Message: 'Access Denied: User does not have the required role or permissions to perform this action.'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: string
                example: '{"message":"financialperiod is not found","statusCode":404}'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  StatusCode:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: An internal server error occurred while processing your request.
      security:
      - Token: []
      x-operation-id-source: normalized
      x-operation-id-original: Get List of Accounts
    put:
      summary: Update Accounts
      tags:
      - Accounts
      description: Use this operation to update accounts for a financial period.
      operationId: UpdateAccounts
      parameters:
      - name: entity-id
        in: path
        required: true
        description: The entity id in which the financial period is created. To obtain a reporting entity ID, refer to the [Get Reporting Entities API](#tag/reporting-entities/get/) documentation. For guidance on obtaining a template entity ID, see the [Get Template Entities API](#tag/template-entities/get/) documentation.
        schema:
          type: string
          format: uuid
        example: 81fa8dec-d6b0-454c-bd15-b38a00b479ab
      - name: financial-period-id
        in: path
        required: true
        description: The identifier of the financial period during which account information is updated. Obtain this ID using the [Get Financial Periods API](#tag/financial-periods/get{entity-id}/financial-periods).
        schema:
          type: string
          format: uuid
        example: 16378fc4-3147-47d0-a22a-b39f00aab97d
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AccountRequest_3'
      responses:
        '200':
          description: Accounts updated successfully.
        '207':
          description: 'Multi-Status: The request was processed, but individual accounts update operations may have varied statuses.'
          content:
            application/json:
              schema:
                type: object
              examples:
                emptyMultiStatusResponse:
                  summary: Example of an 207 Multi-Status response
                  value: {}
        '400':
          description: Bad Request. Occurs when the server cannot process the request due to invalid parameters or a malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidParameter:
                  summary: Example invalid financial-period-id error
                  value:
                    statusCode: 400
                    message: financial-period-id is not valid
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: https://developers.onesourcetax.com/errors/#keymanagement.service.invalid_access_token
                  title:
                    type: string
                    example: Invalid Access Token
                  detail:
                    type: string
                    example: Invalid Access Token
                  status:
                    type: integer
                    example: 401
