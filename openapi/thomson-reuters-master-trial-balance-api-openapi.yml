openapi: 3.2.0
info:
  title: Thomson Reuters Master Trial Balance API
  version: '1.0'
  description: 'Operations tagged Master Trial Balance across 2 of this provider''s published API definitions: thomson-reuters-general-ledger-manager-openapi.json, thomson-reuters-general-ledger-manager-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/general-ledger-manager/v1
security:
- bearerAuth: []
tags:
- name: Master Trial Balance
  description: 'An aggregated set of one or more Trial Balances which are based on the same Data Fields.

    ONESOURCE General Ledger Manager Master Trial Balance APIs enables the users to group the trial balance data that have been uploaded and processed; by providing the Account Rollup (mandatory) and Entity Rollup (not mandatory). Users can create a Master Trial Balance, providing them with concise and consolidated view on their Accounts and Entities.'
paths:
  /collections:
    get:
      tags:
      - Master Trial Balance
      summary: Get a paginated list of Master Trial Balance
      description: 'Returns a list of Master Trial Balance with their metadata


        Potential values for published status:


        idname


        1UNPUBLISHED


        2PUBLISHING


        3PUBLISHED


        4 UNPUBLISHING


        5 ERROR


        Potential values for Blueprint type:


        idname


        1Standard Trial Balance


        2Tax Provision - 6 Columns Fields'
      operationId: getCollections
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Number of records in a master trial balance to skip before starting the response set
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of records to return in the result set
        required: false
        schema:
          type: integer
          format: int32
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CollectionResponseDTO'
      security:
      - bearerAuth: []
    post:
      tags:
      - Master Trial Balance
      summary: Creates a new Master Trial Balance
      description: Adds Master Trial Balance with name and Data Fields metadata
      operationId: createCollection
      parameters:
      - name: X-ONESOURCE-Client-Id
        in: header
        description: Client Id
        required: false
        schema:
          type: integer
      - name: X-ONESOURCE-Client-Number
        in: header
        description: Client Number
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Master Trial Balance is created.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CollectionIdDTO'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/general-ledger-manager/v1
  /collections/{id}:
    get:
      tags:
      - Master Trial Balance
      summary: Returns a Master Trial Balance by ID
      description: 'Returns Master Trial Balance metadata for the specified Master Trial Balance ID


        Potential values for published status:


        idname


