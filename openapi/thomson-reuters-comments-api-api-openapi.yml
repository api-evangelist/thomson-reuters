info:
  title: Thomson Reuters Comments API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Comments API across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Comments API
paths:
  /{version}/comments:
    post:
      tags:
      - Comments API
      summary: Add Comment
      description: Add comment API
      operationId: addComment
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: groupsupport
        in: query
        description: groupsupport flag for mention group
        required: false
        schema:
          type: string
          default: '0'
      - name: contentid
        in: query
        description: This the content id of the required content.<br><br>e.g. blogid for contenttype=blog, taskid for contenttype=tasks
        required: true
        schema:
          type: integer
          format: int32
      - name: contenttype
        in: query
        description: 'Content type<br><br>e.g. /api/1/comments?contenttype=files<br>- Microblogs

          - Files

          - Wiki

          - Blog

          - Tasks

          - Events'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Comment added successfully
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while adding comment
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/CommentDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/CommentDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/CommentDBO'
    servers:
    - url: /monumentuat/api
  /{version}/comments/{commentid}:
    put:
      tags:
      - Comments API
      summary: Edit Comment
      description: Edit comment API
      operationId: updateComment
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: groupsupport
        in: query
        description: groupsupport flag for mention group
        required: false
        schema:
          type: string
          default: '0'
      - name: commentid
        in: path
        description: This is the comment id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Comment updated successfully
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while updating comment
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/CommentDBO'
          application/json:
            schema:
              $ref: '#/components/schemas/CommentDBO'
          text/xml:
            schema:
              $ref: '#/components/schemas/CommentDBO'
    delete:
      tags:
      - Comments API
      summary: Delete Comment
      description: Delete comment API
      operationId: deleteComment
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: commentid
        in: path
        description: This is the comment id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Comment deleted successfully
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while deleting comment
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
