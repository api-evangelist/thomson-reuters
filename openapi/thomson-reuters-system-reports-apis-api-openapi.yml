servers:
- url: /monumentuat/api
tags:
- name: System Reports APIs
paths:
  /{version}/systemreports/sitesummaryreport/content:
    get:
      tags:
      - System Reports APIs
      summary: Download Site summary xlsx report
      description: 'API method to download Site summary report export in xlsx format

        - Only System admin (Internal Admin) can download the report'
      operationId: downloadSiteSummarySystemReportsXLSFile
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '7'
      responses:
        '200':
          description: Document downloaded
        '401':
          description: Unauthorized
        '403':
          description: Access denied
        '404':
          description: Page not found / Metthod calling with invalid API version
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal server error
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
