                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
      requestBody:
        content:
