  /{version}/sites/{siteid}/groups:
    get:
      tags:
      - Site Resource APIs
      summary: Get all site groups
      description: 'A list of site groups.Notes :

        In the response all site groups are returned e.g. org,site,system,admin, allsystem and synced.'
      operationId: getAllSiteGroups
      parameters:
      - name: siteid
        in: path
        description: site id
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: 'org (only org groups which are in the site)<br>synced (only AD groups which are in the site) <br>system (only system groups which are in the site) <br>site (Only site groups which are in the site) <br>allsystem ({system + AD + org } groups which are in the site)<br>admin (Admin groups like Site admin, Member admin, Content admin, Reporting admin, QA admin )<br>Filter the group list by these 6 options.If no parameter is provided for the filter, then all groups of the site are returned. '
        required: false
        schema:
          type: string
          enum:
          - org
          - synced
          - system
          - site
          - allsystem
          - admin
      - name: orderby
        in: query
        description: Sort the group list by these 2 options.<br>If no parameter is provided for orderby, the  group list will be sorted in ascending order.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: ordertype
        in: query
        description: The group is ordered by these 5 options.<br>If no parameter is provided for ordertype, then the name is the default value.
        required: false
        schema:
          type: string
          enum:
          - name
          - type
          - numberofusers
          - created
          - modified
      - name: q
        in: query
        description: Text that will be searched against the group name to filter out the list of the group.
        required: false
        schema:
          type: string
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '3'
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/modulepermissions'
            application/json:
              schema:
                $ref: '#/components/schemas/modulepermissions'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
    post:
      tags:
      - Site Resource APIs
      summary: Add site group
      description: 'This API method adds a new group to the site.

        Notes


        copypermissionsfrom is Mandatory field it is use to copy other group permission.

        Please set value of copypermissionsfrom to -1 when you don''t want to copy any other groups permissions.

        The group name cannot contain the following characters: \ / : * ? " |'
      operationId: createSiteGroup
      parameters:
      - name: siteid
        in: path
        description: The ID of the site.
        required: true
        schema:
          type: string
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '3'
      responses:
        '201':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/group'
            application/json:
              schema:
                $ref: '#/components/schemas/group'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/group'
          application/json:
            schema:
              $ref: '#/components/schemas/group'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/group'
    servers:
    - url: /monumentuat/api
  /{version}/sites/{siteid}/users:
    get:
      tags:
      - Site Resource APIs
      summary: Get all site users
      description: 'Method to obtain a list of site users


        Notes

        1.The value of limit parameter behaves as follows:

        limit =100 is the default value

        if limit>0 then (number of items returned is equal to limit)

        if limit=-1 then return all records

        if limit <-1 then the system returns the default no of items i.e 100

        2.The value of the offset parameter behaves as below

        (Default) offset =0

        if the offset is higher than 0 then the records are returned from the offset value

        if offset is lower than 0 then an offset value of 0 is set

        3.Default value for orderby parameter is asc (ascending)

        4.Default value for ordertype parameter is organisation (organisation name)

        5.In limit parameter if the limit is 0, it will display a validation message stating that the "limit provided is invalid"'
      operationId: getAllSiteUsers
      parameters:
      - name: siteid
        in: path
        description: The ID of the site.
        required: true
        schema:
          type: integer
          format: int32
      - name: organisationid
        in: query
        description: A integer value representing an organisation in the Collaborate instance, the ID can be obtained by calling the Get Organisations API.
        required: false
        schema:
          type: string
      - name: invitationnotsent
        in: query
        description: A list of all users to whom an invitation is not sent.
        required: false
        schema:
          type: string
      - name: notloggedin
        in: query
        description: A list of users who have never logged in to the site.
        required: false
        schema:
          type: string
      - name: suspendedusers
        in: query
        description: A list of suspended users of the site.
        required: false
        schema:
          type: string
      - name: unallocatedusers
        in: query
        description: A list of users who are not a member of any groups in the site.
        required: false
        schema:
          type: string
      - name: groupid
        in: query
        description: A integer value representing a group.
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: The starting position of the user list from when the user list  should be returned. This is to allow pagination.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: The number of items to return in an individual get call.
        required: false
        schema:
          type: string
      - name: orderby
        in: query
        description: Can be ordered asc (ascending) or desc (descending). The default is ascending.
        required: false
        schema:
          type: string
      - name: ordertype
        in: query
        description: The order type is fullname, organisation, invited, lastlogin. The default is organisation
        required: false
        schema:
          type: string
      - name: activeusers
        in: query
        description: A list of active users of the site
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: Text that will be searched against first name, last name, email and organisation to filter out users. Available from collaborate version 5.0
        required: false
        schema:
          type: string
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '3'
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/users'
            application/json:
              schema:
                $ref: '#/components/schemas/users'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
    post:
      tags:
      - Site Resource APIs
      summary: Add user to site
      description: 'This method explains how to add a number of new users to the site.

        When adding a single user to a site follow the first step below. When adding more than one user to a site the below two steps should be followed.

        Note: The getProgressiveKey call is covered in step 1 and is used further in the process.Step 1:

        Request URI

        POST /api/3/sites/{siteid}/users

        Response

        The API returns a 200 OK http response if successful, otherwise an error object and error code is returned.

        If a single user has been added successfully then the response will be as per below:

        <users>

        <user>

        <index>1</index>

        <userid>1805</userid>

        <email>testemail@highq.com</email>

        <status>Success</status>

        <statuscode>201</statuscode>

        <message>User added successfully</message>

        </user>

        </users>

        If more than one user has been added successfully then response will be as per below:

        <progressivekeyresponse>

        <progressivekey>zJ5IlSYyhJ_1500443110814</progressivekey>

        <progressivekeystatus>INPROGRESS</progressivekeystatus>

        </progressivekeyresponse>

        Step 2:

        Purpose

        Once step 1 has been called, the user progress status needs to be checked. This is done by using this API end point call.

        <progressivekeyresponse>

        <progressivekey>zJ5IlSYyhJ_1500443110814</progressivekey>

        <progressivekeystatus>INPROGRESS</progressivekeystatus>

        </progressivekeyresponse>

        When a user has been added successfully the response will be as per below:

        <?xml version="1.0" encoding="UTF-8" standalone="yes"?>

        <users>

        <user>

        <index>1</index>

        <userid>1805</userid>

        <email>testemail@highq.com</email>

        <status>Success</status>

        <statuscode>201</statuscode>

        <message>User added successfully</message>

        </user>

        <user>

        <index>2</index>

        <status>Failure</status>

        <statuscode>403</statuscode>

        <message>Invalid Email address</message>

        </user>

        </users>

        Assumption

        - User will be added in site with the existing organisation only.

        - If a user with the same email already exists in the site, a validation message will be displayed.

        - Please note that if an existing system user is added to a site, then the request xml information such as firstname, lastname and orgid will not be updated. Only the system user will be added to site.

        - If user associated with external organization then it will not add in internal site, a validation message will be displayed.(From 5.1 onwards)'
      operationId: addUserToSite
      parameters:
      - name: siteid
        in: path
        description: Site IDs
        required: true
        schema:
          type: integer
          format: int32
      - name: sendinvitation
        in: query
        description: If set to true, the newly added user will be sent an invitation
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '3'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/IntegrationResponseUsersObject'
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationResponseUsersObject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IntegrationResponseUsersObject'
    put:
      tags:
      - Site Resource APIs
      summary: Add existing user to site
      description: 'This is the method to add a user to the site. This method expects that the user already exists in the system and the API user is aware of the userid of the user.

        Note: The site should already exist in the system.'
      operationId: insertExistingUserToSite
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: siteid
        in: path
        description: The ID of the site to which the user is to be added.
        required: true
        schema:
          type: string
      - name: userid
        in: query
        description: "\tThe ID of the user who is to be added to the site."
        required: true
        schema:
          type: string
      - name: sendinvitation
        in: query
        description: 'True or false option. (This is set to true by default)<br>If you do not want the notification sent to the user when a users are added to the site, the parameter should be set to false. '
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
    delete:
      tags:
      - Site Resource APIs
      summary: Remove users from a site
      description: This method can be used to remove user(s) from a site.
      operationId: removeUserFromSite
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '3'
      - name: siteid
        in: path
        description: The ID for the site.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/transactionstatus'
            application/json:
              schema:
