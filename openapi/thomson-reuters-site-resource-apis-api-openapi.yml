  /{version}/sites/templates/{templateid}:
    get:
      tags:
      - Site Resource APIs
      summary: Get template
      description: 'The get template API returned the details for a template. Anyone with template access in Collaborate is permitted to use this API endpoint.

        The fields returned for the template object are determined based on user permissions. If the user is a site admin user then they will get fields like Admin Notes otherwise not.

        The current implementation does not include logo link.

        The response object contains the user ID of the template owner.

        The API responds with an access denied message when ''My site'' details of another user are accessed.

        Blank values for individual fields are not returned in the XML response, absence of value in the returned XML means that either the value does not exist for that field or the user does not have access to that field.

        From version 7 onwards module tag will be in response to all user (Not only Admin) , and enable=0/1 will be based on either ON/OFF or have access (for normal users) to that module'
      operationId: getTemplate
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '8'
      - name: templateid
        in: path
        description: The ID for the template in question
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/site'
            application/json:
              schema:
                $ref: '#/components/schemas/site'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
    put:
      tags:
      - Site Resource APIs
      summary: Update template
      description: Use this API endpoint to update the details of an existing template. The API supports the same fields used in create template API.
      operationId: updateSite_1
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '8'
      - name: templateid
        in: path
        description: The ID for the template
        required: true
        schema:
          type: string
      responses:
        '201':
          description: OK
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteTemplate'
          application/xml:
            schema:
              $ref: '#/components/schemas/SiteTemplate'
    delete:
      tags:
      - Site Resource APIs
      summary: Delete template
      description: 'This API method is used to delete a template. The template is marked as archived and the system admin can revert the action if required. The system throws an ''Access Denied'' message if the template does not exist.

        If a delete file request is sent through the API for a template that has already been archived, the API will return a 200 OK response to that request.


        Response

        The system sends a 200 OK response in case of success and throws an error object in case of an error.'
      operationId: deleteSite_1
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '8'
      - name: templateid
        in: path
        description: The ID for the template in question.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while deleting site
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
  /{version}/sites/templates:
    post:
      tags:
      - Site Resource APIs
      summary: Create template
      description: 'Use this API to create a new template.The template object only supports attributes which are visible in the create template interface.

        The method implementation now supports site templates.

        This method does not support uploading template image in this call, the template icon support will be provided as a separate call.

        The method call expects an existing category ID. The category ID should be obtained by the calling application by an earlier call to the template categories interface.

        template start and end date should be in the format of ''dd MMM yyyy'' and it is NOT UTC. API client will always request actual date.

        We expect three different wordings or identifications for options in for Files module. Possible values are:

        - files (root folder)

        - files (recent activity)

        - files (advanced search)

        API 7 or higher, template created from template will follow modules from source template and it will ignore module list sent in request body.'
      operationId: createSite_1
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '8'
      responses:
        '201':
          description: Template created successfully [id,sitename and link tags are used in response.]
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/site'
            application/json:
              schema:
                $ref: '#/components/schemas/site'
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '409':
          description: Template already exists in the system
        '500':
          description: Internal error occured while adding template
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/SiteTemplate'
          application/json:
            schema:
              $ref: '#/components/schemas/SiteTemplate'
    servers:
    - url: /monumentuat/api
