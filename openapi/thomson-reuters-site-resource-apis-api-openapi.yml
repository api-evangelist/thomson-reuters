  /{version}/sites:
    get:
      tags:
      - Site Resource APIs
      summary: Get site list v2
      description: 'This method returns the list of sites a user owns in Collaborate.

        Please note that a site which has one of the configuration options enabled as specified in the "callfrom" parameter will not serve the documents using the API, as the configuration settings such as DRM, password protection etc cannot be bypassed using the API at the moment.

        Until we provide API endpoints that allow you to accept these settings using the API, there is no way to get documents from these sites, doing so will conflict with the Collaborate security policies and hence cannot be achieved using the API at this time.

        From version 7 onwards module tag will be in response to all user (Not only Admin) , and enable=0/1 will be based on either ON/OFF or have access (for normal users) to that module.

        API version 8 onwards, a new tag ''restrictiontype'' is added as part of ''Site Security API'' functionality.There will be 8 restrictions shown under this tag each with value 0/1 to show whether the respective feature is enabled or disabled for the site.'
      operationId: getSites
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: filterby
        in: query
        description: Possible values are {recent|favourite|category|all} Default for this field is "recent"<br>By default any filter will send back the first 20 sites if pagination is false
        required: false
        schema:
          type: string
          enum:
          - recent
          - favourite
          - category
          - all
      - name: returncount
        in: query
        description: The no of sites returned. Default is 20. This option does not apply if filterBy property is set to all
        required: false
        schema:
          type: string
      - name: categoryid
        in: query
        description: This parameter is used to get the site list based on the site category ID, please provide site categoryid in addition to setting the filterby property to category.<br>example = /api/1/sites?filterby=category&categoryid=1
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: 'This parameter is used to search a site by name.The site is included in the search result if the string appears in the title of the site.(The results are returned in ascending order)<br>example: Retrieve sites having "HighQ" word in their name: /api/1/sites?name=''HighQ''<br>This will return all sites having "HighQ" in their site name.<br>Now from 5.1 onwards  search a site by name filter is support multilingual site name.<br>Version 6 or higher, provided search term for site name, should be considered as user preferred language.(because in response of site list api, site name returns in user preferred language)<br>If site name is not configured in user''s preferred language then input terms should try to match with default UK English language and return response according.<br>Version 5 or lower it should work as it was, provided site name in search term should consider as default UK English'
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: A site status available in the system {active|archived|readonly|preparation}<br>Default -> {active + readonly + preparation}<br>for filterBy={recent|favourite| category}]if filterBy={all} is set then all status become applicable.
        required: false
        schema:
          type: string
      - name: includefolderpermission
        in: query
        description: '{true|false} the default is false'
        required: false
        schema:
          type: string
      - name: callFrom
        in: query
        description: 'The only valid value is HIGHQDRIVE. If set the site list filters out any sites that have any restrictions on them. The conditions are as under.<br>1. ''Visible on HighQ Drive or Office Plugin'' check box is not selected in Site->Admin->Advanced page.<br>2. Password protected site <br>3. 2FA enable site <br> 4. Terms & conditions applied on the site <br> 5. IP Restricted sites<br> 6. Document workflow enabled site <br> 7. Check-in / check out enabled site <br> 8. DRM enabled site <br>9. Files module is disabled<br>example: exclude restricted site as: /api/1/sites? callFrom=HIGHQDRIVE'
        required: false
        schema:
          type: string
      - name: orderby
        in: query
        description: asc or desc
        required: false
        schema:
          type: string
      - name: ordertype
        in: query
        description: ordertype
        required: false
        schema:
          type: string
          enum:
          - owner
          - siteStartDate
          - matterNumber
          - siteName
          - clientNo
          - statusDisplayName
          - siteExpiryDate
          - lastUpdateDate
          - lastAccessedDate
      - name: offset
        in: query
        description: The starting position of the site list from when the site list should be returned. This is to allow pagination
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: The no of items to return in an individual get call
        required: false
        schema:
          type: string
      - name: matterno
        in: query
        description: Provide matter number as csv
        required: false
        schema:
          type: string
      - name: clientno
        in: query
        description: Provide client number
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/sites'
            application/json:
              schema:
                $ref: '#/components/schemas/sites'
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorised
        '403':
          description: Validation failed/Forbidden
        '405':
          description: Method not allowed (calling API with the wrong method)
        '500':
          description: Internal error occurred
      security:
      - OAuth: []
    post:
      tags:
      - Site Resource APIs
      summary: Add site
      description: 'Use this API to create a new site.The site object only supports attributes which are visible in the create site interface.

        The method implementation now supports site templates.

        This method does not support uploading site image in this call, the site icon support will be provided as a separate call.

        The method call expects an existing category ID. The category ID should be obtained by the calling application by an earlier call to the Site categories interface.

        Site start and end date should be in the format of ''dd MMM yyyy'' and it is NOT UTC. API client will always request actual date.

        We expect three different wordings or identifications for options in for Files module. Possible values are:

        - files (root folder)

        - files (recent activity)

        - files (advanced search)

        The method implementation now supports(from 5.1 onward) Multilingual sitename. API version 6 or higher will represent in request body based on user preference order.API version 5 or older will represent default UK English.

        will represent sitenames in every languages (Which will be additional tag in "Object it self API" from 5.1 onward)API version 6 or higher, in request body, They are sending both tags i.e. and then we need to validate values e.g. must be match with respective tag in terms of User''s language preference.API 7 or higher, site created from template will follow modules from source template and it will ignore module list sent in request body.


        Please note support for creating site from template using this API will be deprecated in future. To create site from template please use new API Create site from template (/sites/templates/{templateid}/site) which is a long polling API(having support for long running requests)'
      operationId: createSite
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      responses:
        '201':
          description: Site created successfully [id,sitename and link tags are used in response.]
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/site'
            application/json:
              schema:
                $ref: '#/components/schemas/site'
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '409':
          description: Site already exists in the system
        '500':
          description: Internal error occured while adding site
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/site'
          application/json:
            schema:
              $ref: '#/components/schemas/site'
    servers:
    - url: /monumentuat/api
