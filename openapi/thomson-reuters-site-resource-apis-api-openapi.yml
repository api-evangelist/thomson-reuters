  /{version}/sites/{siteid}:
    get:
      tags:
      - Site Resource APIs
      summary: Get site
      description: 'The get site API returned the details for a site. Anyone with site access in Collaborate is permitted to use this API endpoint.

        The fields returned for the site object are determined based on user permissions. If the user is a site admin user then they will get fields like Admin Notes otherwise not.

        The current implementation does not include logo link.

        The response object contains the user ID of the site owner.

        The API responds with an access denied message when ''My site'' details of another user are accessed.

        Blank values for individual fields are not returned in the XML response, absence of value in the returned XML means that either the value does not exist for that field or the user does not have access to that field.

        From version 7 onwards module tag will be in response to all user (Not only Admin) , and enable=0/1 will be based on either ON/OFF or have access (for normal users) to that module.

        API version 8 onwards, a new tag ''restrictiontype'' is added as part of ''Site Security API'' functionality.There will be 8 restrictions shown under this tag each with value 0/1 to show whether the respective feature is enabled or disabled for the site.'
      operationId: getSite
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: siteid
        in: path
        description: The ID for the site in question
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/site'
            application/json:
              schema:
                $ref: '#/components/schemas/site'
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
    put:
      tags:
      - Site Resource APIs
      summary: Update site
      description: Use this API endpoint to update the details of an existing site. The API supports the same fields used in Create site API.
      operationId: updateSite
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: siteid
        in: path
        description: The ID for the site
        required: true
        schema:
          type: string
      responses:
        '201':
          description: OK
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while gettting site
      security:
      - OAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/site'
          application/xml:
            schema:
              $ref: '#/components/schemas/site'
    delete:
      tags:
      - Site Resource APIs
      summary: Delete site
      description: 'This API method is used to delete a site. The site is marked as archived and the system admin can revert the action if required. The system throws an ''Access Denied'' message if the site does not exist.

        If a delete file request is sent through the API for a site that has already been archived, the API will return a 200 OK response to that request.

        ''My site'' cannot be deleted using this API method.

        Response

        The system sends a 200 OK response in case of success and throws an error object in case of an error.'
      operationId: deleteSite
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: siteid
        in: path
        description: The ID for the site in question.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal error occured while deleting site
