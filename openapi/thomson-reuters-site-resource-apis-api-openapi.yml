        Step 1: Start the Create site from template process


        Request URI:


        POST api/8/sites/templates/{template_id}/site


        Request body:


        <site>

        <sitename></sitename>

        <sitedescription></sitedescription>

        <module></module>

        <landingpage></landingpage>

        <startdate></startdate>

        <endDate></endDate>

        <clientno></clientno>

        <matterno></matterno>

        <categories></categories>

        <adminnote></adminnote>

        </site>


        Response:


        Status code: 202 Accepted


        Response body:


        <progressresponse>

        <progresskeystatus>INPROGRESS</progresskeystatus>

        <link>https://host.com/context/api/8/progress/{progress_key}</link>

        </progressresponse>


        Step 2: Check the progress of Create site from template process


        Request URI:


        GET /api/8/progress/{progress_key}


        Response:


        In case Create site from template process is still running.


        Status code: 200 OK


        Response body:


        <progressresponse>

        <progresskeystatus>INPROGRESS</progresskeystatus>

        <link>https://host.com/context/api/8/progress/{progress_key}</link>

        </progressresponse>


        When Create site from template process has been completed.


        Status code: 303 See Other


        Response body:


        <progressresponse>

        <progresskeystatus>DONE</progresskeystatus>

        <link>https://host.com/context/api/8/sites/{site_id}</link>

        </progressresponse>'
      operationId: createSiteFromTemplate
