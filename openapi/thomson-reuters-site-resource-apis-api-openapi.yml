openapi: 3.2.0
info:
  title: Thomson Reuters Site Resource APIs API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Site Resource APIs across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Site Resource APIs
paths:
  /{version}/sites/templates/content:
    post:
      tags:
      - Site Resource APIs
      summary: Import template
      description: 'API to import template from .hqa file.


        This is a Long polling API( Multi step API). Below are the steps explaning how to consume this API.


        Step 1: Start the Import template process


        Request URI:


        POST /api/8/sites/templates/content


        Request body (as a form-data):


        .hqa file as FIle (multipart input)

        templatename as Text(String)


        Response:


        Status code: 202 Accepted


        Response body:


        <progressresponse>

        <progresskeystatus>INPROGRESS</progresskeystatus>

        <link>https://host.com/context/api/8/progress/{progress_key}</link>

        </progressresponse>


        Step 2: Check the progress of Import template process


        Request URI:


        GET /api/8/progress/{progress_key}


        Response:


        In case Import template process is still running.


        Status code: 200 OK


        Response body:


        <progressresponse>

        <progresskeystatus>INPROGRESS</progresskeystatus>

        <link>https://host.com/context/api/8/progress/{progress_key}</link>

        </progressresponse>


        When Import template process has been completed.


        Status code: 303 See Other


        Response body:


        <progressresponse>

        <progresskeystatus>DONE</progresskeystatus>

        <link>https://host.com/context/api/8/sites/templates/{template_id}</link>

        </progressresponse>'
      operationId: importTemplate
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '9'
      responses:
        '156':
          description: Site name already exists in the system
        '200':
          description: OK
        '202':
          description: Import template is in progress.
        '303':
          description: Import template completed.
        '401':
          description: Unauthorized
        '403':
          description: Access denied
        '404':
          description: Page not found / Metthod calling with invalid API version
        '405':
          description: Method not allowed (calling api with wrong method)
        '436':
          description: Invalid hqa file
        '437':
          description: Backward compability is not supported
        '438':
          description: Cannot create site because the instance licence limits have been reached. Please contact the System Administrator
        '500':
          description: Internal server error
      security:
      - OAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Choose file
                  format: binary
                templatename:
                  type: string
                  description: Template name
              required:
              - file
              - templatename
    servers:
    - url: /monumentuat/api
