  /{version}/sites/{siteid}/templates:
    post:
      tags:
      - Site Resource APIs
      summary: Create template from site
      description: 'API to Create template from site.


        This is a Long polling API( Multi step API). Below are the steps explaning how to consume this API.


        Step 1: Start the Create template from site process


        Request URI:


        POST api/8/sites/{site_id}/templates


        Request body:


        <template>

        <templatename></templatename>

        <templatedescription></templatedescription>

        <adminnote></adminnote>

        <clientno></clientno>

        <matterno></matterno>

        <categories></categories>

        <includeUsers></includeUsers>

        <includeSiteLogo></includeSiteLogo >

        </template>


        Response:


        Status code: 202 Accepted


        Response body:


        <progressresponse>

        <progresskeystatus>INPROGRESS</progresskeystatus>

        <link>https://host.com/context/api/8/progress/{progress_key}</link>

        </progressresponse>


        Step 2: Check the progress of Create template from site process


        Request URI:


        GET /api/8/progress/{progress_key}


        Response:


        In case Create template from site process is still running.


        Status code: 200 OK


        Response body:


        <progressresponse>

        <progresskeystatus>INPROGRESS</progresskeystatus>

        <link>https://host.com/context/api/8/progress/{progress_key}</link>

        </progressresponse>


        When Create template from site has been completed.


        Status code: 303 See Other


        Response body:


        <progressresponse>

        <progresskeystatus>DONE</progresskeystatus>

        <link>https://host.com/context/api/8/sites/templates/{template_id}</link>

        </progressresponse>'
      operationId: createTemplateFromSite
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: siteid
        in: path
        description: The ID for the site
        required: true
        schema:
          type: string
      responses:
        '156':
          description: Template name already exists in the system
        '200':
          description: OK
        '202':
          description: Create template from site process is in progress
        '303':
          description: Create template from site process completed
        '400':
          description: Problem with parsing XML or JSON object (Bad Request)
        '401':
          description: Unauthorized
        '403':
          description: Validation failed/ Forbidden
        '404':
          description: Page not found / Metthod calling with invalid API version
        '405':
          description: Method not allowed (calling api with wrong method)
        '500':
          description: Internal server error
      security:
      - OAuth: []
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/SiteTemplate'
          application/json:
            schema:
              $ref: '#/components/schemas/SiteTemplate'
    servers:
    - url: /monumentuat/api
