security:
- Token: []
tags:
- name: Assignments
  description: Assignments endpoints for statutory reporting. Retrieves master account assignments for a category structure in a financial period.
paths:
  /{entity-id}/financial-periods/{financial-period-id}/categories/{category-id}/assignments:
    get:
      tags:
      - Assignments
      description: Use this operation to return a list of account assignments associated with a category.
      operationId: GetListOfAccountAssigments
      summary: Get List of Account Assigments
      parameters:
      - name: entity-id
        in: path
        required: true
        description: The entity id in which the financial period is created. To obtain a reporting entity ID, refer to the [Get Reporting Entities API](#tag/reporting-entities/get/) documentation. For guidance on obtaining a template entity ID, see the [Get Template Entities API](#tag/template-entities/get/) documentation.
        schema:
          type: string
          format: uuid
        example: 90eb7c21-8d0d-46b9-8079-b38d004dd6a0
      - name: financial-period-id
        in: path
        required: true
        description: The identifier of the financial period from which account assignment details are retrieved. Obtain this ID using the [Get Financial Periods API](#tag/financial-periods/get{entity-id}/financial-periods).
        schema:
          type: string
          format: uuid
        example: 0f4252ee-8f46-4ba5-a8e4-b39c00881c11
      - name: category-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the category. Refer to the [Get Categories API](#tag/categories/get{entity-id}/financial-periods/{financial-period-id}/categories) endpoint in this documentation for category Id details.
        example: c3d4e5f6-a7b8-9012-3456-7890abcdef23
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 4000
        description: The maximum number of items to return in a single page of results.
        example: 100
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
        description: The page number to retrieve for paginated results.
        example: 2
      responses:
        '200':
          description: Successfully retrieved a list of assignments with its count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignments'
              examples:
                listOfAssignments:
                  summary: Example of a successful assignments response
                  value:
                    items:
                    - categoryCode: Balance
                      categoryName: Balance
                      accounts:
                      - code: suspense
                        name: suspense
                        assignmentType: Always
                      - code: Test_02
                        name: Testaccount
                        assignmentType: Always
                    count: 2
        '400':
          description: Bad Request. Occurs when the server cannot process the request due to invalid parameters or a malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidParameter:
                  summary: Example invalid category-id error
                  value:
                    statusCode: 400
                    message: A root category ID must be provided
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: https://developers.onesourcetax.com/errors/#keymanagement.service.invalid_access_token
                  title:
                    type: string
                    example: Invalid Access Token
                  detail:
                    type: string
                    example: Invalid Access Token
                  status:
                    type: integer
                    example: 401
                  instance:
                    type: string
                    example: /statutory-reporting/v1/reporting-entities/92abcd47-4e56-4961-b9b6-b30e00f46ba8/financial-periods/a5d4f2f3-5250-494d-b773-b30e00f46d48/categories/c3d4e5f6-a7b8-9012-3456-7890abcdef23/assignments
                  api_requestId:
                    type: string
                    example: rrt-0080bd6edb6a51c07-c-ea-1408325-2337761-1
        '403':
          description: 'Forbidden: The request was understood, but the server refuses to authorize it. The client does not have the necessary permissions to access the resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenAccessDenied:
                  summary: Example forbidden error - Insufficient permissions
                  value:
                    StatusCode: 403
                    Message: 'Access Denied: User does not have the required role or permissions to perform this action.'
        '404':
          description: Not Found. The requested entity does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFoundError:
                  summary: Example not found error
                  value:
                    statusCode: 404
                    message: There are no assignments with the given inputs.
        '500':
          description: Internal Server Error. An unexpected error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  summary: Example server error
                  value:
                    StatusCode: 500
                    Message: An unexpected error occurred.
