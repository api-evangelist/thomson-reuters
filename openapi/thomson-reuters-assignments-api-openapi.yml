components:
  schemas:
    Assignments:
      type: object
      description: Represents a collection of assignments, typically including a list of individual assignment elements and their total count.
      properties:
        items:
          type: array
          description: A list of individual assignment elements.
          items:
            $ref: '#/components/schemas/AssignmentElement'
          nullable: true
        count:
          type: integer
          format: int32
          description: The total number of assignment elements in the collection.
          example: 2
      additionalProperties: false
      example:
        items:
        - categoryCode: EXP
          categoryName: Expenses
          accounts:
          - code: ACC001
            name: Rent Expense
            assignmentType: Direct
          - code: ACC002
            name: Utilities Expense
            assignmentType: Direct
        - categoryCode: REV
          categoryName: Revenue
          accounts:
          - code: ACC003
            name: Sales Revenue
            assignmentType: Direct
        count: 2
    AccountAssigned:
      type: object
      description: Represents an account that has been assigned to a category.
      properties:
        code:
          type: string
          nullable: true
          description: The unique code of the assigned account.
          example: ACC001
        name:
          type: string
          nullable: true
          description: The human-readable name of the assigned account.
          example: Rent Expense
        assignmentType:
          type: string
          nullable: true
          description: The type of assignment for this account (e.g., 'Direct', 'Indirect').
          example: Direct
      additionalProperties: false
      example:
        code: ACC001
        name: Rent Expense
        assignmentType: Direct
    AssignmentElement:
      type: object
      description: Represents a single assignment, linking a category to a set of accounts.
      properties:
        categoryCode:
          type: string
          nullable: true
          description: A unique code for the category.
          example: EXP
        categoryName:
          type: string
          nullable: true
          description: The human-readable name of the category.
          example: Expenses
        accounts:
          type: array
          description: A list of accounts assigned to this category.
          items:
            $ref: '#/components/schemas/AccountAssigned'
          nullable: true
      additionalProperties: false
      example:
        categoryCode: EXP
        categoryName: Expenses
        accounts:
        - code: ACC001
          name: Rent Expense
          assignmentType: Direct
        - code: ACC002
          name: Utilities Expense
          assignmentType: Direct
    ErrorResponse:
      type: object
      description: Standard error response object containing HTTP status code and a descriptive message.
      properties:
        StatusCode:
          type: integer
          format: int32
          description: HTTP status code of the error (for example, 400, 404, 500).
          minimum: 100
          maximum: 599
        Message:
          type: string
          nullable: true
          description: A human-readable message providing details about the error.
          minLength: 1
          maxLength: 512
      additionalProperties: false
      example:
        StatusCode: 400
        Message: Invalid request parameters.
  securitySchemes:
    Token:
      type: apiKey
      description: 'Authorization header. Provide a valid Access token for authentication  Example: `Authorization: Bearer <<Access Token>>`. You can find Authentication process in ''API Access'' Section'
      name: Authorization
      in: header
