components:
  schemas:
    DomainDBO:
      type: object
      properties:
        domainID:
          type: integer
          format: int32
        name:
          type: string
        link:
          type: string
        status:
          type: string
      xml:
        name: domain
    ErrorDBO:
      type: object
      properties:
        summary:
          type: string
        ref:
          type: string
        link:
          type: string
      xml:
        name: error
    Domains:
      type: object
      properties:
        total:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        domain:
          type: array
          items:
            $ref: '#/components/schemas/DomainDBO'
      xml:
        name: domains
    domain:
      type: object
      required:
      - status
      - url
      properties:
        url:
          type: string
          example: ' aaa.com'
          description: any valid url
        status:
          type: string
          description: status of domain
          enum:
          - ACTIVE/PENDING/ARCHIVE
  securitySchemes:
    OAuth:
      type: oauth2
      flows:
        authorizationCode:
          scopes: {}
          authorizationUrl: https://monumentuat.highq.com/monumentuat/authorize.action
          tokenUrl: https://monumentuat.highq.com/monumentuat/api/oauth2/token
