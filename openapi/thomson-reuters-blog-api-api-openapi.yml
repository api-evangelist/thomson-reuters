openapi: 3.2.0
info:
  title: Thomson Reuters Blog API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Blog API across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Blog API
paths:
  /{version}/blog/create:
    post:
      tags:
      - Blog API
      summary: Add/update Blog
      description: To add or update blog in provided site
      operationId: createBlog
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: siteid
        in: query
        description: site id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Blog created/updated successfully
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResponseDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while creating/updating blog
      security:
      - OAuth: []
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/BlogListDBO'
    servers:
    - url: /monumentuat/api
  /{version}/blog/category:
    post:
      tags:
      - Blog API
      summary: Get sites by blog categories
      description: 'To get list of sites for given blog categories


        Purponse: To get list of blog categories'
      operationId: siteCategories
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      responses:
        '200':
          description: Site categories successfully returned
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResponseDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while getting sitecategories
      security:
      - OAuth: []
      requestBody:
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/category'
    servers:
    - url: /monumentuat/api
  /{version}/blog/reSynchronisationFlag:
    get:
      tags:
      - Blog API
      summary: Get Blog Synchronisation Check
      description: 'Check re-synchronization required or not

        Purponse: To check re-syncrhonization required or not for blogs(will return list of categories/sites for while resynchronization is required)


        e.g. ../blog/reSynchronisationFlag?lastSynkDate=2014-04-28%2012:23:40'
      operationId: reSynchronisationFlag
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '1'
      - name: lastSynkDate
        in: query
        description: Last synchronisation date of blog
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Conversations returned successfully
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResponseDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while checking blog synchronisation
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
