          type: string
        suburb:
          description: Address suburb
          type: string
        country:
          description: Address country
          type: string
    Fbt.Models.CustomerApi.ReportingEntity.ReporingEntityBenefitModelForCustomerApi:
      description: ''
      type: object
      properties:
        employeeContributions:
          format: double
          description: Employee contributions
          type: number
        grossTaxable:
          format: double
          description: Gross taxable
          type: number
        number:
          format: int32
          description: Number
          type: integer
        taxableValue:
          format: double
          description: Taxable value
          type: number
        valueReduction:
          format: double
          description: Value reduction
          type: number
    Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityContactModelForCustomerApi:
      type: object
      properties:
        title:
          description: Contact title
          type: string
        givenNames1:
          description: Contact given names1
          type: string
        givenNames2:
          description: Contact given names2
          type: string
        surname:
          description: Contact surname
          type: string
        phoneNumber:
          description: Contact Phone number
          type: string
        emailAddress:
          description: Contact email address
          type: string
        areaCode:
          description: Contact area code
          type: string
    Fbt.Models.CustomerApi.ReportingEntity.EmployerIndividualModelForCustomerApi:
      type: object
