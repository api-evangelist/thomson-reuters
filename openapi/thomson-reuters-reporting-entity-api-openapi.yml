openapi: 3.2.0
info:
  version: v1
  title: FBT CUSTOMER Reporting Entity API
servers:
- url: https://api-apac.onesourcetax.com/fringe-benefits-tax/eap/administration
tags:
- name: Reporting Entity
paths:
  /periods/{period-id}/organizations/{organization-id}/reporting-entities:
    get:
      tags:
      - Reporting Entity
      summary: Get all reporting entities in an organisation
      operationId: ReportingEntity_GetReportingEntities
      parameters:
      - name: period-id
        in: path
        description: Period id
        required: true
        schema:
          type: string
          format: uuid
      - name: organization-id
        in: path
        description: Organization id
        required: true
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        description: Offset
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Limit
        required: false
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: The authorization token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get all reporting entities in an organisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityBaseForCustomerApi'
            text/json:
              schema:
                $ref: '#/components/schemas/Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityBaseForCustomerApi'
            application/xml:
              schema:
                $ref: '#/components/schemas/Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityBaseForCustomerApi'
            text/xml:
              schema:
                $ref: '#/components/schemas/Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityBaseForCustomerApi'
        '404':
          description: Invalid input id
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
            text/json:
              schema:
                type: array
                items:
                  type: string
            application/xml:
              schema:
                type: array
                items:
                  type: string
            text/xml:
              schema:
                type: array
                items:
                  type: string
  /periods/{period-id}/organizations/{organization-id}/reporting-entities/{reporting-entity-id}:
    get:
      tags:
      - Reporting Entity
      summary: Get all reporting entity details by id
      operationId: ReportingEntity_GetReportingEntityById
      parameters:
      - name: period-id
        in: path
        description: Period id
        required: true
        schema:
          type: string
          format: uuid
      - name: organization-id
        in: path
        description: Organization id
        required: true
        schema:
          type: string
          format: uuid
      - name: reporting-entity-id
        in: path
        description: Reporting entity id
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: The authorization token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get all reporting entity details by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityForCustomerApi'
            text/json:
              schema:
                $ref: '#/components/schemas/Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityForCustomerApi'
            application/xml:
              schema:
                $ref: '#/components/schemas/Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityForCustomerApi'
            text/xml:
              schema:
                $ref: '#/components/schemas/Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityForCustomerApi'
        '404':
          description: Invalid input id
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
            text/json:
              schema:
                type: array
                items:
                  type: string
            application/xml:
              schema:
                type: array
                items:
                  type: string
            text/xml:
              schema:
                type: array
                items:
                  type: string
components:
  schemas:
    Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityBaseForCustomerApi:
      description: Reporting entity base model
      type: object
      properties:
        id:
          format: uuid
          description: Report entity id
          type: string
          example: 00000000-0000-0000-0000-000000000000
        code:
          description: Reporting entity code
          type: string
        name:
          description: Reporting entity name
          type: string
        displayName:
          description: Display name
          type: string
        isActive:
          description: Is active
          type: boolean
        isGroup:
          description: Is group
          type: boolean
        isLocked:
          description: Is locked
          type: boolean
    Fbt.Models.CustomerApi.ReportingEntity.TaxAgentModelForCustomerApi:
      description: ''
      type: object
      properties:
        name:
          description: Tax agent name
          type: string
        phoneNumber:
          description: Tax agent phone number
          type: string
        areaCode:
          description: Tax agent area code
          type: string
        declarationDate:
          description: Tax agent declaration date
          type: string
        registrationNumber:
          description: Tax agent registration number
          type: string
        abn:
          description: Tax agent australia business number
          type: string
    Fbt.Models.CustomerApi.ReportingEntity.ReportingEntityAddressModelForCustomerApi:
      description: ''
