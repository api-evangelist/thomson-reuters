  /submissions/{id}/e-filing-status:
    get:
      tags:
      - Submissions
      summary: Check E-Filing Status
      description: This endpoint retrieves the current status of a tax return e-filing operation using its unique ID.
      operationId: Submissions_GetFilingActionStatus
      parameters:
      - name: id
        in: path
        description: The unique identifier of the e-filing operation.
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Bearer token for authorization.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the e-filing status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EfilerStatusResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/EfilerStatusResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/EfilerStatusResponse'
            text/xml:
