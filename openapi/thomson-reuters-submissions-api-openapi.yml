            text/xml:
              schema:
                $ref: '#/components/schemas/EfilerStatusResponse'
        '404':
          description: E-filing operation not found.
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            text/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            application/xml:
