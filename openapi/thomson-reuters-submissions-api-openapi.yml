            text/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            application/xml:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            text/xml:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
    servers:
