      description: APAC server for corporate tax datasets
  /submissions/{id}/e-filing-receipt:
    get:
      tags:
      - Submissions
      summary: Download E-Filing Receipt
      description: This endpoint retrieves the receipt for a specific tax return e-filing operation using its unique ID.
      operationId: Submissions_GetEFilerReceipt
      parameters:
      - name: id
        in: path
        description: The unique identifier of the e-filing operation.
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Bearer token for authorization.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the e-filing receipt.
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
        '404':
          description: E-filing operation not found.
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            text/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            application/xml:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            text/xml:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
    servers:
    - url: https://api-uat.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: UAT server for corporate tax datasets
    - url: https://api-emea.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: EMEA server for corporate tax datasets
    - url: https://api-apac.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: APAC server for corporate tax datasets
  /submissions/efiling-statuses-list/{jurisdiction}:
    get:
      tags:
      - Submissions
      summary: Retrieve E-Filing Statuses by Jurisdiction
      description: This endpoint retrieves a list of e-filing statuses for a specific jurisdiction.
      operationId: Submissions_GetJurisdictionFilings
      parameters:
      - name: jurisdiction
        in: path
        description: The name of the jurisdiction.
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer token for authorization.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the e-filing statuses.
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
