openapi: 3.2.0
info:
  title: Thomson Reuters Submissions API
  version: v1
  description: 'Operations tagged Submissions across 2 of this provider''s published API definitions: thomson-reuters-e-filing-api-openapi.json, thomson-reuters-trta-efiler-services-publicapi-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-uat.onesourcetax.com/corporate-tax/v1/e-filing-manager
  description: UAT server for corporate tax datasets
- url: https://api-emea.onesourcetax.com/corporate-tax/v1/e-filing-manager
  description: EMEA server for corporate tax datasets
- url: https://api-apac.onesourcetax.com/corporate-tax/v1/e-filing-manager
  description: APAC server for corporate tax datasets
tags:
- name: Submissions
paths:
  /submissions/search:
    post:
      tags:
      - Submissions
      summary: Search tax return submissions
      description: This endpoint allows users to search for tax return submissions based on specific criteria such as entity name, queued date range, and form code.
      operationId: Submissions_SearchSubmissions
      parameters:
      - name: offset
        in: query
        description: The number of items to skip before starting to collect the result set.
        required: true
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: The number of items to return in the result set.
        required: true
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        description: Bearer token for authorization.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionsSearchRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SubmissionsSearchRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SubmissionsSearchRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/SubmissionsSearchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmissionsSearchRequest'
        required: true
      responses:
        '200':
          description: Successfully retrieved the list of submissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionsSearchResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/SubmissionsSearchResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SubmissionsSearchResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/SubmissionsSearchResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            text/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            application/xml:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            text/xml:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
      x-codegen-request-body-name: submissionsSearchRequest
    servers:
    - url: https://api-uat.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: UAT server for corporate tax datasets
    - url: https://api-emea.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: EMEA server for corporate tax datasets
    - url: https://api-apac.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: APAC server for corporate tax datasets
  /submissions/{id}/package:
    get:
      tags:
      - Submissions
      summary: Download E-Filing Package
      description: This endpoint retrieves the e-filing package data for a specific submission, identified by its unique ID.
      operationId: Submissions_GetEFilerExportPackageDataForDownload
      parameters:
      - name: id
        in: path
        description: The unique identifier of the submission.
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Bearer token for authorization.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the e-filing package data.
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
        '400':
          description: Bad request due to invalid input.
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
        '404':
          description: Submission not found.
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            text/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            application/xml:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            text/xml:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
    servers:
    - url: https://api-uat.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: UAT server for corporate tax datasets
    - url: https://api-emea.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: EMEA server for corporate tax datasets
    - url: https://api-apac.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: APAC server for corporate tax datasets
  /submissions/{id}/e-filings:
    post:
      tags:
      - Submissions
      summary: Submit Tax Return for E-Filing
      description: This endpoint submits a tax return for e-filing using the provided submission ID and credentials.
      operationId: Submissions_EFileReturn
      parameters:
      - name: id
        in: path
        description: The unique identifier of the submission.
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        description: Bearer token for authorization.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
        required: true
      responses:
        '202':
          description: Submission accepted for processing.
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
        '404':
          description: Submission not found.
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
        '409':
          description: Conflict occurred during submission.
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            text/json:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            application/xml:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
            text/xml:
              schema:
                $ref: '#/components/schemas/HttpResponseException'
      x-codegen-request-body-name: submissionRequest
    servers:
    - url: https://api-uat.onesourcetax.com/corporate-tax/v1/e-filing-manager
