      description: UAT server for corporate tax datasets
    - url: https://api-emea.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: EMEA server for corporate tax datasets
    - url: https://api-apac.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: APAC server for corporate tax datasets
components:
  schemas:
    SubmissionsSearchResponse:
      type: object
      description: Represents the response for a submissions search.
      properties:
        items:
          type: array
          description: A list of submissions matching the search criteria.
          items:
            $ref: '#/components/schemas/Submission'
        _meta:
          $ref: '#/components/schemas/Meta'
    SubmissionRequest:
      type: object
      description: Represents the request body for submitting a tax return for e-filing.
      properties:
        username:
          type: string
          description: The username for e-filing authentication.
        password:
          type: string
          description: The password for e-filing authentication.
    SubmissionsSearchRequest:
      required:
      - entityName
      - queuedEndDate
      - queuedStartDate
      type: object
      description: Represents the request body for searching submissions.
      properties:
        entityName:
          type: string
          description: The name of the entity associated with the submission.
        queuedStartDate:
          type: string
          description: The start date for the queued submissions (yyyy-MM-dd).
        queuedEndDate:
          type: string
          description: The end date for the queued submissions (yyyy-MM-dd).
        formCode:
          type: string
          description: The form code of the tax return.
        status:
          type: string
          description: The status of the submission.
        gatewayAcknowledgementId:
          type: string
          description: The gatewayAcknowledgementId ID for the submission.
    ErrorModel:
      type: object
      description: Represents an error encountered during processing.
      properties:
        code:
          type: string
          description: The error code
        type:
          type: string
          description: The type of error.
        location:
          type: string
          description: The location where the error occurred.
        message:
          type: string
          description: A detailed error message.
        details:
          type: string
          description: error details
    UpdateEfilingStatusRequest:
      type: object
      description: Represents the request body for updating the e-filing status of a submission.
      properties:
        gatewayAcknowledgementId:
          type: string
          description: The gatewayAcknowledgementId ID for the submission.
    EfilerStatusResponse:
      type: object
      description: Represents the response for an e-filing status request.
      properties:
        status:
          type: string
          description: The current status of the tax return submission.
        submittedDate:
          type: string
          description: The date when the tax return was submitted.
        queuedDate:
          type: string
          description: The date when the tax return was queued.
        gatewayAcknowledgementId:
          type: string
          description: The gatewayAcknowledgementId ID for the submission.
        irMark:
          type: string
          description: The irMark indicates encrypted value for the every unique submission.
        testInLive:
          type: string
          description: The testInLive indicates submission type of return either live or test submission.
        errors:
          type: array
          description: A list of errors, if any, associated with the submission.
          items:
            $ref: '#/components/schemas/ErrorModel'
    Meta:
      type: object
      description: Represents metadata for a paginated response.
      properties:
        totalItems:
          type: integer
          description: The total number of items in the result set.
          format: int32
    Submission:
      type: object
      description: Represents an individual submission.
      properties:
        id:
          type: string
          description: The unique identifier of the submission.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        returnId:
          type: string
          description: The unique identifier of the return associated with the submission.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        clientName:
          type: string
          description: The name of the client associated with the submission.
        enityName:
          type: string
          description: The name of the entity associated with the submission.
        queuedDate:
          type: string
          description: The date when the submission was queued.
        formCode:
          type: string
          description: The form code of the tax return.
        status:
          type: string
          description: The current status of the submission.
        clientId:
          type: integer
          description: The unique identifier of the client.
          format: int32
        isAmended:
          type: boolean
          description: Indicates whether the submission is an amended return.
        gatewayAcknowledgementId:
          type: string
          description: The gatewayAcknowledgementId ID for the submission.
        testInLive:
          type: string
          description: Indicates whether the submission is a test in live environment.
        irMark:
          type: string
          description: The irMark indicates encrypted value for the every unique submission.
    HttpResponseException:
      type: object
      description: Represents an error response from the server.
      properties:
        Response:
          type: object
          description: The HTTP response object.
          properties: {}
          readOnly: true
        Message:
          type: string
          description: A detailed error message.
          readOnly: true
        Data:
          type: object
          description: Additional data related to the error.
          additionalProperties:
            type: object
            properties: {}
          readOnly: true
        InnerException:
          type: object
          description: Details of the inner exception, if any.
          properties: {}
          readOnly: true
        StackTrace:
          type: string
          description: The stack trace of the error.
          readOnly: true
        HelpLink:
          type: string
          description: A link to additional help or documentation.
        Source:
          type: string
          description: The source of the error.
        HResult:
          type: integer
          description: The HRESULT code for the error.
          format: int32
          readOnly: true
    SubmissionsSearchRequest_2:
      required:
      - entityName
      - queuedEndDate
      - queuedStartDate
      type: object
      description: Represents the request body for searching submissions.
      properties:
        entityName:
          type: string
          description: The name of the entity associated with the submission.
        queuedStartDate:
          type: string
          description: The start date for the queued submissions (yyyy-MM-dd).
        queuedEndDate:
          type: string
          description: The end date for the queued submissions (yyyy-MM-dd).
        formCode:
          type: string
          description: The form code of the tax return.
        status:
          type: string
          description: The status of the submission.
    UpdateEfilingStatusRequest_2:
      type: object
      description: Represents the request body for updating the e-filing status of a submission.
      properties:
        gatewayAcknowledgementId:
          type: string
          description: The gatewayAcknowledgement ID for the submission.
    EfilerStatusResponse_2:
      type: object
      description: Represents the response for an e-filing status request.
      properties:
        status:
          type: string
          description: The current status of the tax return submission.
        submittedDate:
          type: string
          description: The date when the tax return was submitted.
        errors:
          type: array
          description: A list of errors, if any, associated with the submission.
          items:
            $ref: '#/components/schemas/ErrorModel'
    Submission_2:
      type: object
      description: Represents an individual submission.
      properties:
        id:
          type: string
          description: The unique identifier of the submission.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        returnId:
          type: string
          description: The unique identifier of the return associated with the submission.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        clientName:
          type: string
          description: The name of the client associated with the submission.
        enityName:
          type: string
          description: The name of the entity associated with the submission.
        queuedDate:
