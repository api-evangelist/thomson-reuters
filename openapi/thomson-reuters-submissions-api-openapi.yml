    - url: https://api-emea.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: EMEA server for corporate tax datasets
    - url: https://api-apac.onesourcetax.com/corporate-tax/v1/e-filing-manager
      description: APAC server for corporate tax datasets
  /submissions/set-efiling-status/{id}/{efilingstatus}:
    post:
      tags:
      - Submissions
      summary: Update Submission E-Filing Status
      description: This endpoint updates the e-filing status of a submission using its unique ID and the new status.
      operationId: Submissions_UpdateEfilingStatus
      parameters:
      - name: id
        in: query
        description: The unique identifier of the submission.
        required: true
        schema:
          type: string
          format: uuid
      - name: efilingstatus
        in: query
        description: The new e-filing status to set.
        required: true
        schema:
          type: string
      - name: gatewayAcknowledgementId
        in: query
        description: The gatewayAcknowledgementId ID for the submission (optional).
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer token for authorization.
        required: true
        schema:
