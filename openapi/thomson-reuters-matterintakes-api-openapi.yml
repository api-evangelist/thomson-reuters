tags:
- name: MatterIntakes
  description: Use the MatterIntakes API to upload matterIntakes into Tracker.
paths:
  /intake-requests/{id}:
    get:
      tags:
      - MatterIntakes
      summary: Find a matterIntake by ID
      description: Retrieves information about a matterIntake by ID.
      operationId: MatterIntake_GetMatterIntake
      parameters:
      - name: id
        in: path
        required: true
        description: ID of matter intake.
        schema:
          type: integer
          format: int32
        x-position: 1
      responses:
        '200':
          description: MatterIntake
          headers:
            ETag:
              description: The ETag response-header field provides the current value of the entity tag for the requested variant. Used with If-Match, If-None-Match and If-Range to implement optimistic concurrency control.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterIntake'
        '401':
          description: The requested resource requires authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Access is denied:
                  value:
                    error:
                      code: Unauthorized
                      message: The requested resource requires authentication.
        '403':
          description: The web service account has insufficient permissions to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with that identifier could be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
      - Token: []
    servers:
    - url: https://api.thomsonreuters.com/legal-tracker/matters-api/v1
    - url: https://api.thomsonreuters.co.uk/legal-tracker/matters-api/v1
    - url: https://api.thomsonreuters.ca/legal-tracker/matters-api/v1
    - url: https://api.thomsonreuters.com.au/legal-tracker/matters-api/v1
    - url: https://api.thomsonreuters.de/legal-tracker/matters-api/v1
    - url: https://api.thomsonreuters.ae/legal-tracker/matters-api/v1
  /intake-requests:
    post:
      tags:
      - MatterIntakes
      summary: Create a new matterIntake record
      description: Create a new matterIntake record.
      operationId: MatterIntake_PostMatterIntake
      parameters:
      - name: Prefer
        in: header
        description: '* return=representation: This is the default. The server includes an entity representing the current state of the resource. In response to a successful request a status of 201 would be returned.

          * return=minimal: The response will not include the entity in the response. A successful request would result in a status of 204 to be returned.

          '
        schema:
          type: string
          example: return=representation
      requestBody:
        x-name: matterIntake
        description: Creation model.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatterIntake'
        x-position: 1
      responses:
        '201':
          description: The matter intake was successfully created and the entity will be returned in the response.
          headers:
            ETag:
              description: The ETag response-header field provides the current value of the entity tag for the requested variant. Used with If-Match, If-None-Match and If-Range to implement optimistic concurrency control.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterIntake'
        '204':
          description: The matter intake was successfully created and the entity will not be returned in the response.
          headers:
            ETag:
              description: The ETag response-header field provides the current value of the entity tag for the requested variant. Used with If-Match, If-None-Match and If-Range to implement optimistic concurrency control.
              schema:
                type: string
        '400':
          description: One or more validation errors in the request were encountered while processing the initial request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The requested resource requires authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Access is denied:
                  value:
                    error:
                      code: Unauthorized
                      message: The requested resource requires authentication.
        '403':
          description: The web service account has insufficient permissions to access this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
      - Token: []
