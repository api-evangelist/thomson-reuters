info:
  title: Thomson Reuters Matter Intakes API
  version: '1.9'
  description: 'Operations tagged MatterIntakes across 2 of this provider''s published API definitions: thomson-reuters-matters-api-1-9-openapi.json, thomson-reuters-matters-api-1-9-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
