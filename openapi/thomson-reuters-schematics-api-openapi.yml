openapi: 3.2.0
info:
  title: Thomson Reuters Schematics API
  version: '1.0'
  description: 'Operations tagged Schematics across 2 of this provider''s published API definitions: thomson-reuters-schematic-service-openapi.json, thomson-reuters-schematic-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onesourcetax.com/data-hub/v1
security:
- bearerAuth: []
tags:
- name: Schematics
paths:
  /templates:
    get:
      tags:
      - Schematics
      summary: Get a paginated list of available schematics
      description: Returns a list of Templates with their metadata
      operationId: getTemplates
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Number of records in a collection to skip before starting the response set
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of records to return in the result set
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionTemplateMeta'
      security:
      - bearerAuth: []
    post:
      tags:
      - Schematics
      summary: Create a new Schematic
      description: Adds Schematic with required minimum criteria of ID & name and can have additional information around Blueprint (ID, version) & pipeline (validation, enrichment)
      operationId: createTemplate
      requestBody:
        description: A template object that includes a pipeline. A pipeline is a list of operators that will be applied sequentially to each record in the ingested set
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePipeline'
        required: true
      responses:
        '201':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PostTemplatesResponse'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /templates/{id}:
    get:
      tags:
      - Schematics
      summary: Get Schematic by ID
      description: Returns Template metadata for the specified Template ID
      operationId: getTemplate
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Template
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Template'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Schematics
      summary: Update Schematic by ID
      description: Updates Template metadata for the specified Schematic ID. This endpoint also allows for a Schematic to be renamed.
      operationId: updateTemplate
      parameters:
      - name: id
        in: path
        description: Unique identifier of the Template
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTemplateRequest'
      responses:
        '204':
          description: default response
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /templates/{templateId}/revisions:
    get:
      tags:
      - Schematics
      summary: Get a paginated list of available Schematic Revisions
      description: Returns a list of Schematic Revisions with their metadata
      operationId: getTemplateRevisions
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Number of records in a collection to skip before starting the response set
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: Maximum number of records to return in the result set
        required: false
        schema:
          type: integer
          format: int32
      - name: templateId
        in: path
        description: Unique identifier of the Template
        required: true
        schema:
          type: string
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiCollectionTemplateMeta'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
  /templates/{templateId}/revisions/{revisionId}:
    get:
      tags:
      - Schematics
      summary: Get Schematic Revision by Schematic ID and Revision ID
      description: Returns Schematic metadata for the specified Schematic ID and Revision ID
      operationId: getTemplateRevision
      parameters:
      - name: templateId
        in: path
        description: Unique identifier of the Template
        required: true
        schema:
          type: string
      - name: revisionId
        in: path
        description: Unique identifier of the Template Revision
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: default response
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Template'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.onesourcetax.com/data-hub/v1
components:
  schemas:
    BlueprintId:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the Blueprint
          format: int32
          example: 46
        version:
          type: integer
          description: Version of the Blueprint
          format: int32
          example: 5
        type_id:
          type: integer
          description: Unique identifier of the Blueprint type
          format: int32
          example: 2
    Template:
      required:
      - name
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Template
          example: 5ec57f677456242950884996
        name:
          type: string
          description: Label of the Template
          example: My Template Name
        blueprint:
          $ref: '#/components/schemas/BlueprintId'
        source:
          $ref: '#/components/schemas/Source'
        pipeline:
          type: array
          description: A pipeline is a list of operators that will be executed in sequential order against each record in the ingested record set
          example:
          - offset: 1
          - identify:
            - name: account
              type: string
              ontology_id: 4
              blueprint_pos: 0
              parameters:
              - chart_of_accounts_id: 7b624759-9e17-4c7b-b17c-4fd9a926c777
              - format: -###,###.##
          - validate:
            - 0
          - enrich:
            - in: 0
              out:
                name: account
                type: string
                ontology_id: 4
                blueprint_pos: 0
          items:
            type: object
        is_hidden:
          type: boolean
          description: Visibility of the Template
          example: false
        created_by:
          type: string
          example: UserA
        mapped_column_count:
          type: integer
          description: Total number of mapped columns in the template
          format: int32
          example: 5
        enrich_column_count:
          type: integer
          description: Total number of enrich columns in the template
          format: int32
          example: 5
        created_date:
          type: string
          description: File created at time
          format: date-time
          example: '2020-06-19T21:06:22.453Z'
        revision_id:
          type: integer
          description: Template revision id
          format: int64
    TemplatePipeline:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: Label of the Template
          example: My Template Name
        blueprint:
          $ref: '#/components/schemas/BlueprintId'
        pipeline:
          type: array
          description: A pipeline is a list of operators that will be executed in sequential order against each record in the ingested record set
          example:
          - offset: 1
          - identify:
            - name: account
              type: string
              ontology_id: 4
              blueprint_pos: 0
              parameters:
              - chart_of_accounts_id: 7b624759-9e17-4c7b-b17c-4fd9a926c777
              - format: -###,###.##
          - validate:
            - 0
          - enrich:
            - in: 0
              out:
                name: account
                type: string
                ontology_id: 4
                blueprint_pos: 0
          items:
            type: object
        source:
          $ref: '#/components/schemas/Source'
    PostTemplatesResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Template
          example: 5ec57f677456242950884996
    ApiCollectionTemplateMeta:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateMeta'
        _meta:
          $ref: '#/components/schemas/ApiMeta'
    TemplateMeta:
      required:
      - name
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the Template
          example: 5ec57f677456242950884996
        name:
          type: string
          description: Label of the Template
          example: My Template Name
        blueprint:
          $ref: '#/components/schemas/BlueprintId'
        source:
          $ref: '#/components/schemas/Source'
        is_hidden:
          type: boolean
          description: Visibility of the Template
          example: false
        created_by:
          type: string
          example: UserA
        mapped_column_count:
          type: integer
          description: Total number of mapped columns in the template
          format: int32
          example: 5
        enrich_column_count:
          type: integer
          description: Total number of enrich columns in the template
          format: int32
          example: 5
        created_date:
          type: string
          description: Template Created Date & time
          format: date-time
          example: '2020-06-19T21:06:22.453Z'
        revision_id:
          type: integer
          description: Template revision id
          format: int64
    PatchTemplateRequest:
      type: object
      properties:
        pipeline:
          type: array
          description: A pipeline is a list of operators that will be executed in sequential order against each record in the ingested record set
          example:
          - offset: 1
          - identify:
            - name: account
              type: string
              ontology_id: 4
              blueprint_pos: 0
              parameters:
              - chart_of_accounts_id: 7b624759-9e17-4c7b-b17c-4fd9a926c777
              - format: -###,###.##
          - validate:
            - 0
          - enrich:
            - in: 0
              out:
                name: account
                type: string
                ontology_id: 4
                blueprint_pos: 0
          items:
            type: object
        source:
          $ref: '#/components/schemas/Source'
        is_hidden:
          type: boolean
          description: Visibility of the Template
          example: false
        name:
          type: string
          description: A new name for the Template
    ApiMeta:
      type: object
      properties:
        count:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        sort:
          type: string
        filter:
          type: string
        extra:
          type: object
          additionalProperties:
            type: object
          writeOnly: true
    Source:
      type: object
      properties:
        type:
          type: string
          description: Type of the file
          example: XLSX/DELIMITED
        delimiter:
          type: string
          description: delimiter of the file
          example: ','
        named_range:
          type: string
          description: Range in the Worksheet
          example: Named Range
        worksheet_name:
          type: string
          description: Name of the Worksheet
          example: Sheet1
        worksheet_index:
          type: integer
          description: Work Sheet index in the Excel file
          format: int32
          example: 0
        cell_range:
          type: string
          description: cell Range in the Excel file
          example: A10:C10
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
