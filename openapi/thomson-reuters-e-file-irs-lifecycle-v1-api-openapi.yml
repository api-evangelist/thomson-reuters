openapi: 3.2.0
info:
  version: v1/v2
  title: GoSystem E-file E-file IRS Lifecycle V1 API
  description: A RESTful API to provide access to the GoSystem E-file functionality.
servers:
- url: https://api.thomsonreuters.com/gosystem/e-files
security:
- Authorization: []
tags:
- name: E-file IRS Lifecycle V1
paths:
  /v1/e-file-submissions:
    post:
      tags:
      - E-file IRS Lifecycle V1
      summary: Submit e-file
      description: This endpoint submits e-file for a tax return across jurisdictions.
      operationId: SubmitsE-file
      parameters:
      - name: Account
        in: header
        required: true
        description: A 4-digit alphanumeric identifier representing the client account. This must match the Account value provided in the request headers.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EFileRequest'
            examples:
              Returns-Example:
                $ref: '#/components/examples/returns-Example'
              Estimates-Example:
                $ref: '#/components/examples/estimates-Example'
              Extensions-Example:
                $ref: '#/components/examples/extensions-Example'
        required: true
      responses:
        '200':
          description: Success. The e-file is submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileJurisdictionsSubmissionResponse'
              examples:
                efile-submission-success-example:
                  $ref: '#/components/examples/efile-submission-success-example'
                efile-submission-failed-example:
                  $ref: '#/components/examples/efile-submission-failed-example'
        '400':
          description: 'Types of error in message:

            - Missing account header: Message: "Please specify account information in header."

            - Account doesn''t belong to firm: Message: "Account doesn''t belong to firm."

            - User doesn''t have ELFADMIN rights: Message: "User doesn''t have the permission."

            - Invalid tax type: Message: "Invalid Tax Return Type."

            - Invalid jurisdiction: Message: "Invalid Jurisdiction(s) {wrongJurisdictions}."

            - Locator doesn''t exist: Message: "{TaxReturnID} Locator not found."

            - Locator is super locked: Message: "{TaxReturnID} User doesn''t have the permission."

            - Exception during processing: Message: "Invalid Input {exception message}."'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
        '404':
          description: Not found.
        '500':
          description: Unexpected error encountered. Contact GoSystem Technical Support.
      x-operation-id-source: normalized
      x-operation-id-original: Submits e-file
  /v1/years/{year}/e-file-statuses:
    post:
      tags:
      - E-file IRS Lifecycle V1
      summary: Get e-file status
      description: This endpoint retrieves e-file status by Tax Return or Taxpayer or Submitter or Account. Based on the query parameters, the e-file status can be returned.
      operationId: ListsTheE-fileStatuses
      parameters:
      - name: year
        in: path
        required: true
        description: Enter a valid 4-digit tax year (e.g., 2024) to view statuses for existing e-files.
        schema:
          type: integer
          format: int32
      - name: Account
        in: header
        required: false
        description: A 4-digit alphanumeric identifier representing the client account. This must match the Account value provided in the request headers.
        schema:
          type: string
      - name: EFileJurisdictionID
        in: header
        required: false
        description: Add Jurisdiction ID if required.
        schema:
          type: string
      - name: EfileType
        in: header
        required: false
        description: Add Efile type if required.
        schema:
          type: string
      - name: TotalRowsCount
        in: header
        required: false
        description: Add Total rows count if filter is needed.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EFileStatusQuery'
            examples:
              EFile-Status-Query-Example:
                $ref: '#/components/examples/EFile-Status-Query-Taxreturn-Example'
        description: Query by Tax Return or Taxpayer or Submitter or Account. The queries are mutually exclusive. Pass the valid values for the query for which you need to fetch the status. For other queries, pass null values. Queries will be executed from top to bottom, and result will be fetched for the first query with not null values.
        required: true
      responses:
        '200':
          description: Success. The e-file status is retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileStatusQuery'
              examples:
                efile-status-response-tax-return-example:
                  $ref: '#/components/examples/efile-status-response-tax-return-example'
        '400':
          description: 'Types of error in message:

            - Year is greater than the current year: Message: "Invalid Year."

            - Tax return type is invalid: Message: "Invalid Tax Return Type."

            - Account header is missing when querying by account: Message: "Please specify account information in header."

            - Account doesn''t belong to the firm: Message: "Account doesn''t belong to firm."

            - Not enough input parameters: Message: "Not enough input parameters to process the request. Please pass either TaxReturn Or TaxPayer Or Submitter Or Account information."

            - Any exception occurs during processing: Message: "Error fetching status - {exception message}."'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
        '404':
          description: Not found.
        '500':
          description: Unexpected error encountered. Contact GoSystem Technical Support.
      x-operation-id-source: normalized
      x-operation-id-original: Lists the e-file statuses
  /v1/years/{year}/tax-return-types/{taxReturnType}/tax-returns/{taxReturnId}/e-file-status-details:
    get:
      tags:
      - E-file IRS Lifecycle V1
      summary: Get e-file status details
      description: This endpoint retrieves e-file status details for a tax return.
      operationId: ListTheE-fileStatusDetails
      parameters:
      - name: year
        in: path
        required: true
        description: Enter a valid 4-digit tax year (e.g., 2024) to view statuses for existing e-files.
        schema:
          type: integer
          format: int32
      - name: taxReturnType
        in: path
        required: true
        description: Uses values e.g. 1120, 1065, 1040, 990, 5500.
        schema:
          type:
          - string
          - 'null'
      - name: taxReturnId
        in: path
        required: true
        description: A 6-digit unique alphanumeric identifier for the specific tax return. This is also referred to as the Locator ID.
        schema:
          type: string
      responses:
        '200':
          description: Success. The e-file status details are retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EfileStatusByTaxReturn'
              examples:
                efile-status-details-tax-return-response-example:
                  $ref: '#/components/examples/efile-status-details-tax-return-response-example'
        '400':
          description: 'Types of error in message:

            - Invalid tax return type: Message: "Invalid Tax Return Type."

            - Exception during processing: Message: "Invalid Input: {exception message}."'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
        '404':
          description: Not found.
        '500':
          description: Unexpected error encountered. Contact GoSystem Technical Support.
      x-operation-id-source: normalized
      x-operation-id-original: List the e-file status details
  /v1/e-file-submission-statuses:
    get:
      tags:
      - E-file IRS Lifecycle V1
      summary: Get e-file submission status
      description: 'This endpoint retrieves e-file status for a submitted tax return. Valid E-file statuses are as follows: 0 = Not requested, 1 = Not qualified, 2 = Qualified, 3 = Requested, 4 = Electronic filing process started, 5 = Awaiting acknowledgment, 6 = Conditional Accepted, 7 = Accepted, 8 = Rejected, 9 = Federal rejected State not processed, 11 = Diagnostics Exist, 50 = Error - Not Submitted.'
      operationId: ListTheE-fileStatusBySubmittedTaxReturn
      parameters:
      - name: jobId
        in: query
        required: true
        description: System-generated identifier for the e-file job.
        schema:
          type: string
      responses:
        '200':
          description: Success. The e-file submission status is retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileStatusWrapper'
              examples:
                efile-submission-status-not-requested:
                  $ref: '#/components/examples/efile-submission-status-not-requested-example'
                efile-submission-status-not-qualified:
                  $ref: '#/components/examples/efile-submission-status-not-qualified-example'
                efile-submission-status-qualified:
                  $ref: '#/components/examples/efile-submission-status-qualified-example'
                efile-submission-status-requested:
                  $ref: '#/components/examples/efile-submission-status-requested-example'
                efile-submission-status-running:
                  $ref: '#/components/examples/efile-submission-status-running-example'
                efile-submission-status-awaiting-acknowledgement:
                  $ref: '#/components/examples/efile-submission-status-awaiting-acknowledgement-example'
                efile-submission-status-conditional-accepted:
                  $ref: '#/components/examples/efile-submission-status-conditional-accepted-example'
                efile-submission-status-accepted:
                  $ref: '#/components/examples/efile-submission-status-accepted-example'
                efile-submission-status-rejected:
                  $ref: '#/components/examples/efile-submission-status-rejected-example'
                efile-submission-status-federal-rejected:
                  $ref: '#/components/examples/efile-submission-status-federal-rejected-example'
                efile-submission-status-diagnostics-exist:
                  $ref: '#/components/examples/efile-submission-status-diagnostics-exist-example'
                efile-submission-status-not-submitted:
                  $ref: '#/components/examples/efile-submission-status-not-submitted-example'
        '400':
          description: 'Exception during processing: Message: "Invalid Input."'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
        '404':
          description: Not found.
        '500':
          description: Unexpected error encountered. Contact GoSystem Technical Support.
      x-operation-id-source: normalized
      x-operation-id-original: List the e-file status by submitted tax return
  ? /v1/years/{year}/tax-return-types/{taxReturnType}/tax-returns/{taxReturnId}/jurisdictions/{jurisdiction}/e-file-request-types/{eFileRequestType}/e-file-rejection-messages
  : get:
      tags:
      - E-file IRS Lifecycle V1
      summary: Get rejection messages
      description: This endpoint returns the detail for rejected message for a submitted tax return.
      operationId: RetrievesTheRejectedMessage
      parameters:
      - name: year
        in: path
        required: true
        description: The tax year for which the e-file is being processed. Must be a valid 4-digit year (e.g., 2024).
        schema:
          type: integer
          format: int32
      - name: taxReturnType
        in: path
        required: true
        description: Specifies the type of tax return being filed. 1040, 1041, 1065, 1120, 990, 5500, 709.
        schema:
          type:
          - string
          - 'null'
      - name: taxReturnId
        in: path
        required: true
        description: A 6-digit unique alphanumeric identifier for the specific tax return. This is also referred to as the Locator ID.
        schema:
          type: string
      - name: jurisdiction
        in: path
        required: true
        description: 'The state or local jurisdiction code where the tax is being filed. Example: AL for Alabama. Use the /v1/e-file-jurisdictions endpoint to retrieve valid codes.'
        schema:
          type: string
      - name: eFileRequestType
        in: path
        required: true
        description: 'Indicates the type of e-file request. This value is predefined for each jurisdiction. Example: Return. Use the /v1/e-file-jurisdictions endpoint to retrieve valid request types for each jurisdiction.'
        schema:
          type: string
          enum:
          - Return
          - Return2
          - Return3
          - Return4
          - Extension1
          - Extension2
          - Extension3
          - Extension4
          - Estimate
          - Estimate2
          - Estimate3
          - EXT_NY_IT204LL
          - RET_NY_IT204LL
          - Composite
          - Other
          - OtherExt
          - Withholding
      - name: Account
        in: header
        required: true
        description: A 4-digit alphanumeric identifier representing the client account. This must match the Account value provided in the request headers.
        schema:
          type: string
      responses:
        '200':
          description: Success. The rejection messages are retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileRejectedMessagesWrapper'
              examples:
                efile-rejection-messages-invalid-ein-ssn:
                  $ref: '#/components/examples/efile-rejection-messages-invalid-ein-ssn-example'
                efile-rejection-messages-generic-reject:
                  $ref: '#/components/examples/efile-rejection-messages-generic-reject-example'
                efile-rejection-messages-missing-irs-file:
                  $ref: '#/components/examples/efile-rejection-messages-missing-irs-file-example'
                efile-rejection-messages-ein-ssn-already-in-use:
                  $ref: '#/components/examples/efile-rejection-messages-ein-ssn-already-in-use-example'
                efile-rejection-messages-client-efin-account-not-associated:
                  $ref: '#/components/examples/efile-rejection-messages-client-efin-account-not-associated-example'
        '400':
          description: 'Types of error in message:

            - Missing account header: Message: "Please specify account information in header."

            - Invalid tax type: Message: "Invalid Tax Return Type."

            - Invalid jurisdiction: Message: "Invalid Jurisdiction(s)."

            - Invalid EFile Request Type: Message: "Invalid EFile Request Type."

            - Account doesn''t belong to firm: Message: "Account doesn''t belong to firm."

            - Locator doesn''t exist: Message: "Locator not found."

            - Exception during processing: Message: "Invalid Input."'
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
        '404':
          description: Not found.
        '500':
          description: Unexpected error encountered. Contact GoSystem Technical Support.
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves the rejected message
