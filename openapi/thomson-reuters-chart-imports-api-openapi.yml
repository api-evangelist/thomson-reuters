components:
  schemas:
    ProblemRepresentation:
      type: object
      properties:
        type:
          type: object
          format: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        fieldName:
          type: string
        messages:
          type: array
          items:
            type: string
        errorCode:
          type: integer
          format: int32
    federalAdjustmentRepresentation:
      type: object
      properties:
        adjustmentNumber:
          type: string
        adjustmentDescription:
          type: string
        debitTaxRepresentation:
          type: object
          $ref: '#/components/schemas/taxRepresentation'
        creditTaxRepresentation:
          type: object
          $ref: '#/components/schemas/taxRepresentation'
        internationalDebitTaxReturnPresentation:
          type: object
          $ref: '#/components/schemas/taxRepresentation'
        internationalCreditTaxReturnPresentation:
          type: object
          $ref: '#/components/schemas/taxRepresentation'
        permanentTemporary:
          type: boolean
        federalAdjustmentAccounts:
          type: array
          items:
            $ref: '#/components/schemas/federalAdjustmentAccount'
    resultListRepresentation:
      type: array
      items:
        $ref: '#/components/schemas/resultRepresentation'
    resultRepresentation:
      type: object
      properties:
        adjustmentNumber:
          type: string
        statusCode:
          type: integer
        errorDetails:
          type: array
          items:
            $ref: '#/components/schemas/ProblemRepresentation'
    federalAdjustmentListRepresentation:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/federalAdjustmentRepresentation'
    taxRepresentation:
      type: object
      properties:
        trcCategoryId:
          type: integer
        trcNumber:
          type: integer
        tccNumber:
          type: integer
    ChartImportProcessResponse:
      type: object
      properties:
        status:
          type: string
        statusMessage:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/resultListRepresentation'
    federalAdjustmentAccount:
      type: object
      properties:
        accountCode:
          type: string
          description: Account code
        defaultProvision:
          type: boolean
          description: Default provision
