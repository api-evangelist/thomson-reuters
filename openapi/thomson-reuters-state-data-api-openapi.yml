openapi: 3.2.0
info:
  title: OSA OData Query Service State Data API
  description: OData API for querying OSA collections including effective rates, reconciliation data, numerator/denominator data, state data, and everywhere data
  version: 1.0.0
  contact:
    name: OSA Team
    email: support@thomsonreuters.com
servers:
- url: https://api.onesourcetax.com/data-query-reporting/state-apportionment/odata/v1/
  description: AMERS endpoints
security:
- basicAuth: []
tags:
- name: State Data
  description: State Data - shows state data for the entities, jurisdictions, and groups selected.
paths:
  /odata/v1/state-data:
    get:
      summary: Query State Data
      description: Retrieve state data with OData query options
      operationId: getStateData
      parameters:
      - $ref: '#/components/parameters/FilterParam'
      - $ref: '#/components/parameters/SelectParam'
      - $ref: '#/components/parameters/OrderByParam'
      - $ref: '#/components/parameters/TopParam'
      - $ref: '#/components/parameters/SkipParam'
      - $ref: '#/components/parameters/CountParam'
      responses:
        '200':
          description: State data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateDataCollection'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
      security:
      - basicAuth: []
      tags:
      - State Data
components:
  parameters:
    OrderByParam:
      name: $orderby
      in: query
      description: OData orderby expression
      required: false
      schema:
        type: string
      example: year desc,jurisdiction asc
    TopParam:
      name: $top
      in: query
      description: OData top expression - maximum number of records to return
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
      example: 100
    FilterParam:
      name: $filter
      in: query
      description: OData filter expression
      required: false
      schema:
        type: string
      example: year eq '2025' and jurisdiction eq 'CA'
    CountParam:
      name: $count
      in: query
      description: OData count expression - include total count in response
      required: false
      schema:
        type: boolean
      example: true
    SelectParam:
      name: $select
      in: query
      description: OData select expression - comma-separated list of properties
      required: false
      schema:
        type: string
      example: ID,name,jurisdiction,year
    SkipParam:
      name: $skip
      in: query
      description: OData skip expression - number of records to skip
      required: false
      schema:
        type: integer
        minimum: 0
      example: 50
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Authentication failed
        message:
          type: string
          example: Username or password incorrect.
    StateData:
      type: object
      properties:
        ID:
          type: string
          description: Entity ID
        jurisdiction:
          type: string
          description: Tax jurisdiction
        parent:
          type: string
          description: Parent entity
        line:
          type: string
          description: Line item
        category:
          type: string
          description: Category
        source:
          type: string
          description: Data source
        amount:
          type: number
          format: double
          description: Amount
        path:
          type: string
          description: Entity path
        ultimateOwnershipPercentage:
          type: number
          format: double
          description: Ultimate ownership percentage
        isBlocked:
          type: string
          description: Is blocked flag
        blockingEntity:
          type: string
          description: Blocking entity
        blockingReason:
          type: string
          description: Blocking reason
        filing:
          type: string
          description: Filing information
        totalType:
          type: string
          description: Total type
        year:
          type: string
          description: Tax year
        scenario:
          type: string
          description: Scenario name
    StateDataCollection:
      type: object
      properties:
        '@odata.context':
          type: string
          example: $metadata#state-data
        '@odata.count':
          type: integer
        value:
          type: array
          items:
            $ref: '#/components/schemas/StateData'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic Authentication using username and password
