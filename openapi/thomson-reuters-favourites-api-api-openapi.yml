openapi: 3.2.0
info:
  title: Thomson Reuters Favourites API
  version: monumentuat 5.3.1.1 uatapp2a.sg2 t335 uatdb2I1
  description: 'Operations tagged Favourites API across 2 of this provider''s published API definitions: thomson-reuters-monument-collaborate-uat-openapi.json, thomson-reuters-monument-collaborate-uat-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /monumentuat/api
tags:
- name: Favourites API
paths:
  /{version}/favourites:
    get:
      tags:
      - Favourites API
      summary: Get Favourites List
      description: 'Method to obtain favourite items.


        This method is supported in version 4 of the API and above'
      operationId: getAllFavourites
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: contenttype
        in: query
        description: "Content type<br>e.g. /api/3/favourites?contenttype=files\n- Microblogs\n- Files\n- Wiki\n- Blog\n- Tasks\n- Events\n- Site\n- iSheet\n- Folder\n- SiteHome \n- Sitetemplate"
        required: true
        schema:
          type: string
      - name: groupsupport
        in: query
        description: groupsupport flag for share with group
        required: false
        schema:
          type: string
          default: '0'
      - name: offset
        in: query
        description: The integer value of the last Favorite item fetched.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: No of Favorite items to return in one request. Default is 20  and the maximum value is 100 <br><br>If a value of 0 or less is provided in the request then 20 Favorite items will be returned. <br><br>If a value of more than 100 is provided then 100 Favorite items are returned.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Favorite items returned successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/FavoriteContents'
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteContents'
            text/xml:
              schema:
                $ref: '#/components/schemas/FavoriteContents'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while returning Favorite items
      security:
      - OAuth: []
    put:
      tags:
      - Favourites API
      summary: Favourite Items - Add to favourites / Remove from favourites
      description: 'Add to favourites / Remove from favourites API


        Note: For Q&A foldertype user will get access denied as they can not update Q&A file favourite.'
      operationId: updateFavourite
      parameters:
      - name: version
        in: path
        description: version of api
        required: true
        schema:
          type: string
          default: '4'
      - name: contenttype
        in: query
        description: 'Content type<br>e.g. /api/3/favourites?contenttype=files

          - Microblogs

          - Files

          - Wiki

          - Blog

          - Tasks

          - Events

          - Site

          - iSheet

          - Folder

          - SiteHome

          - Sitetemplate'
        required: true
        schema:
          type: string
      - name: contentid
        in: query
        description: "This the content id of the required content. \n<br>e.g. blogid for contenttype=blog, taskid for contenttype=tasks"
        required: true
        schema:
          type: integer
          format: int32
      - name: favourite
        in: query
        description: '0 : Remove from favourites

          <br>1 : Add to favourites'
        required: true
        schema:
          type: integer
          format: int32
      - name: foldertype
        in: query
        description: the foldertype=qa for Q&A file support from version 5
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Favourite operation performed successfully
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ConversationsDBO'
        '400':
          description: Problem with parameters
        '401':
          description: Unauthorised
        '403':
          description: Validation failed | Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
            text/xml:
              schema:
                $ref: '#/components/schemas/ErrorDBO'
        '500':
          description: Internal error occurred while performing favourite operation
      security:
      - OAuth: []
    servers:
    - url: /monumentuat/api
