openapi: 3.2.0
info:
  title: ONESOURCE Income Tax Charts International Chart of Accounts…
  description: 'Charts are used to identify Tax Return Code (TRC) and Tax Combination Code (TCC) accounts and adjustments for multiple entities and binders. Use REST APIs to automatically manipulate basic chart functions.


    The charts are related by using elements from other charts to create a set of charts. Each set of charts is then assigned to an entity to use for TRC/TCCs, accounts, and adjustments. Chart assignments are either Common or Separate.'
  termsOfService: ''
  version: v1
servers:
- url: https://api.onesourcetax.com/income-tax/charts
security:
- Authorization: []
tags:
- name: International Chart of Accounts Cross Reference (2018+)
paths:
  /v1/fcoa/{fcoaChartId}/international-summary-chart/{chartId}/mapped-accounts:
    get:
      tags:
      - International Chart of Accounts Cross Reference (2018+)
      summary: Returns the list of accounts mapped to the International Summary Chart for the…
      parameters:
      - name: fcoaChartId
        in: path
        description: 16-character chart ID, system-generated unique identifier for a chart
        required: true
        schema:
          type: string
      - name: chartId
        in: path
        description: 16-character chart ID, system-generated unique identifier for a chart
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: Indicates the response content media type to return. application/json is currently the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalXrefMappedAccounts'
              examples:
                success:
                  $ref: '#/components/examples/international-xref-charts-mapped-accounts'
        '400':
          description: Request failed due to validation errors.
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      operationId: getV1FcoaByFcoaChartIdInternationalSummaryChartByChartIdMappedAccounts
      x-operation-id-source: derived
    patch:
      tags:
      - International Chart of Accounts Cross Reference (2018+)
      summary: Adds and removes accounts mapped to the International Summary Chart for the…
      parameters:
      - name: fcoaChartId
        in: path
        description: 16-character chart ID, system-generated unique identifier for a chart
        required: true
        schema:
          type: string
      - name: chartId
        in: path
        description: 16-character chart ID, system-generated unique identifier for a chart
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Indicates the response content media type to return
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternationalXrefRequests'
            examples:
              international-cross-reference-charts-patch-request:
                $ref: '#/components/examples/international-cross-reference-charts-patch-request'
      responses:
        '200':
          description: All operations executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalXrefChartMultipleResponses'
              examples:
                international-cross-reference-charts-patch-success-response:
                  $ref: '#/components/examples/international-cross-reference-charts-patch-success-response'
        '207':
          description: One or more operations failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternationalXrefChartMultipleResponses'
              examples:
                international-cross-reference-charts-patch-multiple-responses:
                  $ref: '#/components/examples/international-cross-reference-charts-patch-multiple-responses'
        '400':
          description: Request failed due to validation errors.
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      operationId: patchV1FcoaByFcoaChartIdInternationalSummaryChartByChartIdMappedAccounts
      x-operation-id-source: derived
  /v1/fcoa/{fcoaChartId}/international-summary-chart/{chartId}/unmapped-accounts:
    get:
      tags:
      - International Chart of Accounts Cross Reference (2018+)
      summary: Returns the list of accounts NOT mapped to the International Summary Chart for…
      parameters:
      - name: fcoaChartId
        in: path
        description: 16-character chart ID, system-generated unique identifier for a chart
        required: true
        schema:
          type: string
      - name: chartId
        in: path
        description: 16-character chart ID, system-generated unique identifier for a chart
        required: true
        schema:
          type: string
      - name: incomeStatement
        in: query
        description: Income statement filter
        schema:
          type: boolean
      - name: Accept
        in: header
        description: Indicates the response content media type to return. application/json is currently the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederalAccounts'
              examples:
                success:
                  $ref: '#/components/examples/international-xref-charts-unmapped-accounts'
        '400':
          description: Request failed due to validation errors.
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      operationId: getV1FcoaByFcoaChartIdInternationalSummaryChartByChartIdUnmappedAccounts
      x-operation-id-source: derived
