          type: string
      - name: $select
        in: query
        description: Specifies a subset of properties to return. Use a comma separated list.
        required: false
        schema:
          type: string
      - name: $orderby
        in: query
        description: Determines what values are used to order a collection of records.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the list of tax provisions.
          content:
            application/json;odata.metadata=minimal;odata.streaming=true:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxProvision'
        '401':
