              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getDatalistsByIdEntries
      x-operation-id-source: derived
    put:
      tags:
      - Company
      summary: Replace a datalist's entries
      parameters:
