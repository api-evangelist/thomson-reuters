        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getDatalists
      x-operation-id-source: derived
    servers:
    - url: https://api-emea.onesourcetax.com/einvoicing/document/v1
    - url: https://api-emea.onesourcetax.com/einvoicing/company/v1
  /datalists/{id}/entries:
    get:
      tags:
      - Company
      summary: Get all entries of a datalist
      parameters:
      - name: id
        in: path
        description: Id of the datalist
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatalistEntry'
        '401':
          description: Authentication failure
          content:
