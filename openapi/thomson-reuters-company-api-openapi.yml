            schema:
              required:
              - payload
              type: object
              properties:
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/DatalistEntry'
        required: true
      responses:
        '200':
          description: Datalist entries successfully updated
          content: {}
        '400':
