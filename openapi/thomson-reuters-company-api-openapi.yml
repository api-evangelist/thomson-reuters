tags:
- name: Company
  description: Get Companies.
paths:
  /companies:
    get:
      tags:
      - Company
      summary: Get companies
      description: Get all companies the calling user has access to. The companies are sorted in alphabetic order by company name.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalServerErrorCompany'
      operationId: getCompanies
      x-operation-id-source: derived
    servers:
    - url: https://api-emea.onesourcetax.com/einvoicing/document/v1
    - url: https://api-emea.onesourcetax.com/einvoicing/company/v1
  /datalists:
    get:
      tags:
      - Company
      summary: Get all datalists
      description: Get all datalists for all companies the user has access to
      parameters:
      - name: companyId
        in: query
        required: true
        description: The id of the sending company. An external company id can also be used if a previous setup has been made where the external id has been connected to the company.
        example: 8839abe6-5277-4145-a44f-dcca99ac13e5
        schema:
          type: string
      responses:
        '200':
          description: Successful response. If matching datalists found, return the list of datalists. Otherwise return an empty result list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
