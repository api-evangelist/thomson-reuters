      tags:
      - State AA Logic Charts
      summary: Returns the list of state AA Logic chart's apportionment types based on year…
      parameters:
      - name: year
        in: path
        required: true
        description: Tax year.
        schema:
          type: integer
          format: int32
      - name: logicChartId
        in: path
        required: true
        description: Logic chart ID.
        schema:
          type: string
      - name: jurisdictionCode
        in: query
        required: false
        description: Jurisdiction code.
        schema:
          type: string
      - name: categoryId
        in: query
        required: false
        description: Category ID.
        schema:
          type: integer
          format: int32
      - name: Accept
        in: header
        description: Indicates the response content media type to return. Currently, application/json is the only option.
        required: true
        schema:
          type: string
          default: application/json
          enum:
          - application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateAALogicChartApportionmentTypeRepresentation'
              examples:
                state-aa-categories-groups-representation:
                  $ref: '#/components/examples/state-aa-logicchart-apportionmenttypes-get-representation'
        '400':
          description: Request failed. This is usually due to validation errors.
        '401':
          description: Indicates a lack of authorization to perform this action on this resource. Check credentials and rights.
          content: {}
        '404':
          description: Not found.
          content: {}
        '500':
          description: Unexpected error occurred. Contact ONESOURCE Technical Support.
          content: {}
      deprecated: false
      operationId: getV2YearsByYearLogicChartsByLogicChartIdApportionmentTypes
      x-operation-id-source: derived
    patch:
      tags:
      - State AA Logic Charts
      summary: Replaces multiple State AA Logic Chart's Apportionment Types for a year and…
      parameters:
      - name: year
        in: path
        description: Tax year.
        required: true
        schema:
          type: integer
          format: int32
      - name: logicChartId
        in: path
