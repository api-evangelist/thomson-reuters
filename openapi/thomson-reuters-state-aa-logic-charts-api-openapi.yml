        chartName:
          type: string
          description: User-defined unique chart name.
    StateAALogicChartCreateRequestRepresentation:
      type: object
      properties:
        year:
          type: integer
          description: Tax year.
          format: int32
        chartName:
          type: string
          description: User-defined unique chart name.
        applyDefaultLogic:
          type: boolean
          description: Indicates whether default logic is applied for the chart.
    StateAALogicChartRepresentations:
      type: array
      items:
        $ref: '#/components/schemas/StateAALogicChartRepresentation'
    StateAALogicChartRepresentation:
      type: object
      properties:
        year:
          type: integer
          description: Tax year.
          format: int32
        chartId:
          type: string
          description: System-generated unique identifier for a chart.
        chartName:
          type: string
          description: User-defined unique chart name.
        isReadOnly:
          type: boolean
          description: Indicates whether the chart can be edited.
        isDefault:
          type: boolean
        isAvailableForRollover:
          type: boolean
          description: Indicates whether the chart is available for rollover.
        priorYearChartId:
          type: string
          description: Chart ID that the existing chart was rolled from.
        priorYearChartName:
          type: string
          description: Chart name from the prior year.
    InternationalSummaryChartRenameRepresentation:
      type: object
      properties:
        chartName:
          type: string
          description: User-defined unique chart name.
    StateAALogicChartThrowbackResponseRepresentation:
      type: object
      properties:
        year:
          type: integer
          description: Tax year.
          format: int32
        isEnableThrowback:
          type: boolean
          description: Indicates whether the throwback option is enabled for the charts of the specified year.
    StateAALogicChartApportionmentTypeRepresentation:
      type: object
      properties:
        categoryId:
          type: integer
          format: int32
          description: Category ID.
        isIncomeTax:
          type: boolean
        isFranchiseTax:
          type: boolean
        jurisdictionCode:
          type: string
          format: string
          description: Jurisdiction code.
        apportionmentType:
          type: string
          format: string
          enum:
          - None
          - X
          - N
          - D
          - B
          description: 'Apportionment type: `None` - Factor excluded by state. `X` - Not applicable. `N` - Numerator only. `D` - Denominator only. `B` - Both numerator and denominator.

            '
    FieldError:
      type: object
      properties:
        fieldName:
          type: string
        messages:
          type: array
          items:
            type: string
        errorCode:
          type: integer
          format: int32
    InternationalSummaryChartReadOnlyStatusRepresentation:
      type: object
      properties:
        isReadOnly:
          type: boolean
          description: Indicates whether the chart can be edited.
    JsonPatchDocumentStateAALogicApportionmentTypeRepresentation:
