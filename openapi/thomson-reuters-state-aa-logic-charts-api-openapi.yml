            schema:
              $ref: '#/components/schemas/JsonPatchDocumentStateAALogicApportionmentTypeRepresentation'
            examples:
              state-aa-logicchart-apportionmenttype-replace-operation:
                $ref: '#/components/examples/state-aa-logicchart-apportionmenttype-replace-operation'
              state-aa-logicchart-apportionmenttype-multiple-operations:
                $ref: '#/components/examples/state-aa-logicchart-apportionmenttype-multiple-operations'
      responses:
        '200':
          description: Success
          content:
