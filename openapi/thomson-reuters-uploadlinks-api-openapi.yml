components:
  schemas:
    EFileUploadLink:
      type: object
      properties:
        link:
          type:
          - string
          - 'null'
          description: The session URI to upload eFile content. The session is valid for 15 minutes.
        key:
          type:
          - string
          - 'null'
          description: The eFile upload key.
      additionalProperties: false
      description: A link and key to upload eFile content.
    Error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
