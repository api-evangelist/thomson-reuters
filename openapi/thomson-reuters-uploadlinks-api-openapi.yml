tags:
- name: UploadLinks
  description: Use the UploadLinks endpoint to get a link to upload eFile content.
paths:
  /upload-links:
    post:
      tags:
      - UploadLinks
      summary: Post a model with a file name to retrieve a link to upload the eFile's content
      operationId: UploadLinks_GetOne
      requestBody:
        description: The model containing the file name
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadLinksPostModel'
      responses:
        '200':
          description: Returns a link to upload eFile content and an eFile key for use with other Tracker APIs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EFileUploadLink'
        '400':
          description: If an identifier is not an allowed value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
