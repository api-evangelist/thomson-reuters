            - message
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              target:
                type: string
        innerError:
          required:
          - code
          - message
          type: object
          properties:
            code:
              type: string
            message:
              type: string
      additionalProperties: false
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
    UploadLinksPostModel:
      required:
      - fileName
      type: object
      properties:
        fileName:
          type: string
          description: The name of the file to be uploaded.
      additionalProperties: false
  securitySchemes:
