  /matters/{id}/budgets:
    get:
      tags:
      - Budgets
      summary: Find a matter budget by the matter ID, source, firmID, and firmType
      description: Retrieves information about a matter budget by the matter ID, source, firmID, and firmType.
      operationId: Budgets_GetBudgets
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the associated matter
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: source
        in: query
        description: The source of the budget (firm, company)
        schema:
          default: 'null'
          allOf:
          - $ref: '#/components/schemas/BudgetSourceType'
        x-position: 2
      - name: firmId
        in: query
        description: The ID of the firm involved, applicable only if FirmType is firm.
        schema:
          type: integer
          format: int32
          default: 0
        x-position: 3
      - name: firmType
        in: query
        description: The type of the firm. (firm, otherVendor, all)
        schema:
          default: 'null'
          allOf:
          - $ref: '#/components/schemas/BudgetFirmType'
        x-position: 4
      - name: year
        in: query
        description: The fiscal year of the budget.
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 5
      responses:
        '200':
          description: BudgetsModel
          content:
            application/json:
              schema:
